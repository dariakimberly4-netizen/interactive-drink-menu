<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#130f0c">
<title>Wedding Time Capsule</title>
<style>
:root{--cream:#f6efe5;--paper:#fffaf2;--ink:#281e19;--gold:#c7a46d;--wine:#6d3438;--deep:#130f0c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--deep);color:var(--cream);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit}.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 20% 15%,rgba(199,164,109,.22),transparent 30%),radial-gradient(circle at 82% 78%,rgba(109,52,56,.28),transparent 34%),linear-gradient(145deg,#100d0b,#261b17 55%,#120f0d)}.grain{position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.18;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E")}
main{min-height:100svh;display:grid;place-items:center;padding:18px}.app{width:min(900px,100%);text-align:center}.kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#d9c2a0;margin-bottom:7px}.title{font-family:Georgia,'Times New Roman',serif;font-size:clamp(34px,6vw,66px);font-weight:500;line-height:1;margin:0 0 8px}.intro{max-width:650px;margin:0 auto 18px;color:#d9cec5;font-size:14px;line-height:1.5}
.scene{perspective:1500px;width:min(760px,96vw);margin:0 auto}.box-wrap{position:relative;aspect-ratio:1.35/1;transform-style:preserve-3d}.lid{position:absolute;left:4%;right:4%;top:2%;height:31%;z-index:8;transform-origin:50% 100%;transform:rotateX(-16deg) translateZ(18px);transition:transform 1.1s cubic-bezier(.2,.8,.2,1);background:linear-gradient(145deg,#724b31,#4a2d20);border:1px solid rgba(255,255,255,.15);border-radius:22px 22px 12px 12px;box-shadow:0 18px 35px rgba(0,0,0,.35),inset 0 2px rgba(255,255,255,.08)}.lid:before{content:"Wedding Time Capsule";position:absolute;inset:0;display:grid;place-items:center;font-family:Georgia,serif;font-size:clamp(20px,4vw,34px);color:#f1dec0;text-shadow:0 2px 8px #26150d}.lid:after{content:"♡";position:absolute;bottom:18%;left:50%;transform:translateX(-50%);font-size:25px;color:#d7b682}.box-wrap.open .lid{transform:rotateX(-74deg) translateZ(28px) translateY(-8px)}
.box{position:absolute;left:2%;right:2%;bottom:0;top:25%;background:linear-gradient(155deg,#8a6042,#5b3827 62%,#3c241a);border-radius:14px 14px 28px 28px;border:1px solid rgba(255,255,255,.12);box-shadow:0 35px 70px rgba(0,0,0,.55),inset 0 8px 24px rgba(0,0,0,.22);overflow:hidden}.lining{position:absolute;inset:14px;border-radius:12px 12px 22px 22px;background:linear-gradient(180deg,#cdb897,#b29a79);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),inset 0 10px 20px rgba(255,255,255,.12)}.compartments{position:absolute;inset:26px;display:grid;grid-template-columns:1.2fr .8fr;grid-template-rows:1fr 1fr;gap:10px}.slot{border:0;position:relative;border-radius:14px;background:rgba(54,34,25,.56);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 5px 15px rgba(0,0,0,.18);color:#fff;overflow:hidden;cursor:pointer;text-align:left;padding:12px;transition:transform .2s,background .2s}.slot:active{transform:scale(.985)}.slot.photos{grid-row:1/3;background:#2c211b}.photo-stack{position:absolute;inset:12px 12px 54px;display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.mini{border-radius:7px;background-image:url('assets/memories.webp');background-repeat:no-repeat;background-size:600% 500%;background-position:var(--x) var(--y);box-shadow:0 2px 8px rgba(0,0,0,.28)}.slot-label{position:absolute;left:12px;right:12px;bottom:10px}.slot-label strong{display:block;font-family:Georgia,serif;font-size:18px}.slot-label span{display:block;font-size:11px;color:#e0d0ba;margin-top:2px}.icon{font-size:25px;margin-bottom:6px}.slot:not(.photos){display:flex;flex-direction:column;justify-content:center}.slot:not(.photos) strong{font-family:Georgia,serif;font-size:18px}.slot:not(.photos) span{font-size:11px;color:#e0d0ba;margin-top:3px;line-height:1.35}
.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:17px}.action{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:11px 17px;font-weight:700;cursor:pointer;backdrop-filter:blur(8px)}.action.primary{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.overlay{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:18px;background:rgba(10,7,6,.86);backdrop-filter:blur(12px)}.overlay.show{display:grid}.panel{position:relative;width:min(760px,96vw);max-height:86dvh;overflow:auto;border-radius:24px;padding:22px;background:linear-gradient(160deg,#fffaf1,#eadbc6);color:var(--ink);box-shadow:0 30px 100px rgba(0,0,0,.6)}.close{position:sticky;float:right;top:0;border:0;background:#2b211c;color:white;width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer}.panel h2{font-family:Georgia,serif;font-size:32px;margin:4px 50px 6px 0}.panel p{color:#66564a;line-height:1.55;margin-top:0}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.memory{aspect-ratio:4/3;border-radius:10px;background-image:url('assets/memories.webp');background-size:600% 500%;background-repeat:no-repeat;background-position:var(--x) var(--y);box-shadow:0 6px 18px rgba(70,45,30,.18)}.paper-card{margin-top:14px;border:1px solid #d5c2a6;background:rgba(255,255,255,.7);padding:18px;border-radius:14px;text-align:left;min-height:130px;display:flex;align-items:center;justify-content:center;color:#7a695c;font-family:Georgia,serif;font-size:18px;line-height:1.45}.video-card{margin-top:14px;aspect-ratio:16/9;border-radius:14px;background:linear-gradient(135deg,#302621,#171310);display:grid;place-items:center;color:white}.video-card .play{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);font-size:26px}.hint{font-size:12px;color:#7c6859;margin-top:10px}
.final{position:fixed;inset:0;z-index:40;display:none;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at center,rgba(109,52,56,.35),transparent 35%),linear-gradient(150deg,#120e0c,#251a16 60%,#0e0b0a)}.final.show{display:grid}.final-card{max-width:620px}.seal{width:92px;height:92px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(145deg,#8d3e45,#5c2429);border:7px solid rgba(255,255,255,.08);box-shadow:0 14px 40px rgba(0,0,0,.4);font-family:Georgia,serif;font-size:42px}.final h2{font-family:Georgia,serif;font-size:clamp(40px,8vw,74px);font-weight:500;line-height:.98;margin:0 0 14px}.final p{color:#d9cabe;line-height:1.6;max-width:520px;margin:0 auto 20px}.final .action{min-width:145px}
@media(max-width:650px){main{min-height:100dvh;padding:10px 10px 14px}.app{height:100%;display:flex;flex-direction:column;justify-content:center}.kicker{margin-bottom:4px}.title{font-size:clamp(31px,10vw,47px)}.intro{font-size:12px;margin-bottom:10px}.scene{width:100%}.box-wrap{aspect-ratio:1.02/1}.lid{left:2%;right:2%;height:27%;border-radius:17px 17px 10px 10px}.lid:before{font-size:23px}.box{left:0;right:0;top:22%;border-radius:12px 12px 22px 22px}.lining{inset:9px}.compartments{inset:16px;grid-template-columns:1.08fr .92fr;gap:7px}.slot{padding:9px;border-radius:11px}.photo-stack{inset:8px 8px 46px;gap:4px}.slot-label{left:9px;right:9px;bottom:8px}.slot-label strong,.slot:not(.photos) strong{font-size:16px}.slot-label span,.slot:not(.photos) span{font-size:10px}.icon{font-size:21px}.actions{margin-top:10px;gap:6px}.action{padding:10px 14px;font-size:12px}.panel{max-height:90dvh;padding:17px;border-radius:18px}.panel h2{font-size:28px}.gallery{grid-template-columns:repeat(2,1fr);gap:6px}.paper-card{min-height:145px;font-size:16px}.final h2{font-size:clamp(39px,12vw,60px)}}
@media(max-height:680px) and (max-width:650px){.kicker,.intro{display:none}.title{font-size:31px;margin-bottom:6px}.box-wrap{aspect-ratio:1.25/1}.actions{margin-top:6px}.action{padding:8px 12px}}
</style>
</head>
<body>
<div class="bg"></div><div class="grain"></div>
<main><section class="app">
<div class="kicker">A box of moments worth keeping</div>
<h1 class="title">Wedding Time Capsule</h1>
<p class="intro">Open the box, revisit the memories, then seal everything for the next chapter.</p>
<div class="scene"><div class="box-wrap" id="boxWrap">
  <div class="lid"></div>
  <div class="box"><div class="lining"></div><div class="compartments">
    <button class="slot photos" data-open="photos" aria-label="Open selected wedding photos">
      <div class="photo-stack">
        <div class="mini" style="--x:0%;--y:0%"></div><div class="mini" style="--x:40%;--y:0%"></div>
        <div class="mini" style="--x:80%;--y:25%"></div><div class="mini" style="--x:20%;--y:50%"></div>
        <div class="mini" style="--x:60%;--y:75%"></div><div class="mini" style="--x:20%;--y:100%"></div>
      </div><div class="slot-label"><strong>Selected Photos</strong><span>Tap to revisit the day</span></div>
    </button>
    <button class="slot" data-open="letters"><div class="icon">✉</div><strong>Letters</strong><span>A place for words to your future selves</span></button>
    <button class="slot" data-open="vows"><div class="icon">♡</div><strong>Vows</strong><span>Keep your promises close</span></button>
    <button class="slot" data-open="videos"><div class="icon">▶</div><strong>Videos</strong><span>Wedding clips can live here</span></button>
  </div></div>
</div></div>
<div class="actions"><button class="action primary" id="openBox">Open the Capsule</button><button class="action" id="sealBox">Seal for Anniversary</button></div>
</section></main>

<div class="overlay" id="overlay"><section class="panel"><button class="close" id="close" aria-label="Close">×</button><div id="panelContent"></div></section></div>
<div class="final" id="final"><div class="final-card"><div class="seal">♡</div><h2>Open again on our first anniversary.</h2><p>The photos are tucked away, and there is room for your letters, vows, and videos whenever you are ready to add them.</p><button class="action primary" id="reopen">Reopen Capsule</button></div></div>
<script>
const box=document.getElementById('boxWrap'),openBtn=document.getElementById('openBox'),sealBtn=document.getElementById('sealBox'),overlay=document.getElementById('overlay'),panelContent=document.getElementById('panelContent'),final=document.getElementById('final');
const positions=[[0,0],[20,0],[40,0],[60,0],[80,0],[100,0],[0,25],[20,25],[40,25],[60,25],[80,25],[100,25],[0,50],[20,50],[40,50],[60,50],[80,50],[100,50],[0,75],[20,75],[40,75],[60,75],[80,75],[100,75]];
function openBox(){box.classList.add('open');openBtn.textContent='Capsule Open'}
openBtn.onclick=openBox;setTimeout(openBox,550);
function galleryHTML(){return `<h2>Selected Photos</h2><p>A small collection of moments from the wedding day.</p><div class="gallery">${positions.slice(0,12).map(([x,y])=>`<div class="memory" style="--x:${x}%;--y:${y}%"></div>`).join('')}</div><div class="hint">These photos are already inside the capsule.</div>`}
function lettersHTML(){return `<h2>Letters</h2><p>This compartment is reserved for personal letters to each other.</p><div class="paper-card">Your letters can be placed here when you are ready.</div><div class="hint">No letter text has been invented or added.</div>`}
function vowsHTML(){return `<h2>Vows</h2><p>Keep the exact words you promised each other on your wedding day.</p><div class="paper-card">Your real wedding vows can be added here.</div><div class="hint">This space is waiting for the original vows.</div>`}
function videosHTML(){return `<h2>Videos</h2><p>Add wedding clips, greetings, or a private message for your future selves.</p><div class="video-card"><div class="play">▶</div></div><div class="hint">A video file has not been added yet.</div>`}
document.querySelectorAll('[data-open]').forEach(btn=>btn.addEventListener('click',()=>{openBox();const type=btn.dataset.open;panelContent.innerHTML=type==='photos'?galleryHTML():type==='letters'?lettersHTML():type==='vows'?vowsHTML():videosHTML();overlay.classList.add('show')}));
document.getElementById('close').onclick=()=>overlay.classList.remove('show');overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('show')});
sealBtn.onclick=()=>{overlay.classList.remove('show');box.classList.remove('open');setTimeout(()=>final.classList.add('show'),850)};
document.getElementById('reopen').onclick=()=>{final.classList.remove('show');setTimeout(openBox,180)};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){overlay.classList.remove('show');final.classList.remove('show')}});
</script>
</body></html>
