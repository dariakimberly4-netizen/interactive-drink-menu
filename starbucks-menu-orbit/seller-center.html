<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071c14">
<title>Menu Orbit — Staff Operations Center</title>
<style>
:root{--g:#00754a;--g2:#00a862;--bg:#03130d;--panel:#08251b;--cream:#f4efe6;--gold:#d4ad62;--line:rgba(255,255,255,.14);--muted:#adc6b9;--bad:#de6f6f;--warn:#f4c86f;--ok:#6ee0a8;--shadow:0 18px 55px rgba(0,0,0,.32)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#145d42,#061a13 42%,#020907);color:#fff;font:15px Inter,system-ui,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--warn);outline-offset:3px}.wrap{width:min(1320px,calc(100% - 18px));margin:auto;padding:12px 0 60px}.top{position:sticky;top:0;z-index:30;display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:10px 0;background:rgba(3,19,13,.94);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08)}.brand{display:flex;gap:10px;align-items:center}.logo{width:49px;height:49px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff;background:var(--g);font:900 21px Georgia}.brand h1{margin:0;font-size:clamp(20px,3vw,30px)}.brand p{margin:2px 0 0;color:var(--muted);font-size:11px}.space{flex:1}.btn{min-height:48px;border:1px solid var(--line);border-radius:13px;padding:0 13px;background:rgba(255,255,255,.07);color:#fff;font-weight:850}.btn.primary{border:0;background:linear-gradient(135deg,var(--g2),var(--g))}.btn.cream{background:var(--cream);color:#073421}.btn.danger{color:#ffd0d0;border-color:rgba(222,111,111,.48)}.nav{display:flex;gap:8px;overflow:auto;padding:11px 0;scrollbar-width:none}.nav button{white-space:nowrap;min-height:48px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:0 13px;font-weight:850}.nav button.active{background:var(--cream);color:#073421}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:rgba(8,37,27,.95);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}.stat strong{display:block;color:#f4cf8b;font-size:29px}.stat span,.muted{color:var(--muted);font-size:11px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.title{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-bottom:10px}.title h2{margin:0;font-size:20px}.title h3{margin:0;font-size:16px}.row{display:grid;grid-template-columns:1.35fr .8fr .8fr auto;gap:9px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04);margin-top:8px}.row small{display:block;color:var(--muted);margin-top:3px}.tag{display:inline-flex;padding:5px 8px;border-radius:999px;background:rgba(0,168,98,.16);font-weight:850;font-size:10px}.tag.warn{background:rgba(244,200,111,.14);color:#ffe4a9}.tag.bad{background:rgba(222,111,111,.15);color:#ffd0d0}.form{display:grid;gap:9px}.form label{font-size:12px;font-weight:800}.form input,.form textarea,.form select{width:100%;min-height:47px;border:1px solid var(--line);border-radius:12px;background:#0d3628;color:#fff;padding:10px;margin-top:4px}.form textarea{min-height:78px}.progress{height:12px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:9px 0}.progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--g2),var(--warn))}.bars{height:160px;display:flex;align-items:end;gap:9px;padding:10px 0}.bar{flex:1;display:grid;align-items:end;gap:5px;text-align:center;font-size:10px;color:var(--muted)}.bar i{display:block;background:linear-gradient(180deg,var(--warn),var(--g2));border-radius:8px 8px 2px 2px}.toast{position:fixed;z-index:90;left:50%;bottom:20px;transform:translate(-50%,16px);opacity:0;background:var(--cream);color:#073421;padding:12px 17px;border-radius:999px;font-weight:900;transition:.2s}.toast.show{transform:translate(-50%,0);opacity:1}.modal{display:none;position:fixed;z-index:80;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(7px);padding:15px;align-items:center;justify-content:center}.modal.open{display:flex}.modal .card{width:min(620px,100%);max-height:90vh;overflow:auto}.notice{margin-top:12px;padding:11px;border:1px solid rgba(244,200,111,.42);background:rgba(244,200,111,.1);border-radius:13px;color:#ffe5ac;font-size:12px;line-height:1.45}.reduce *{animation:none!important;transition:none!important}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}}@media(max-width:560px){.wrap{width:min(100% - 12px,1320px)}.grid,.row{grid-template-columns:1fr}.top .space{display:none}.top .btn{flex:1;min-height:54px}.row .btn{width:100%}}
</style></head>
<body><div class="wrap"><header class="top"><div class="brand"><div class="logo">S</div><div><h1>Staff Operations Center</h1><p>Menu Orbit • Manager and Administrator tools</p></div></div><div class="space"></div><button class="btn" id="roleBtn">Manager View</button><button class="btn" id="motionBtn">◌ Reduce Motion</button><button class="btn" onclick="location.href='staff-portal.html'">← Staff Portal</button></header><nav class="nav" id="nav"></nav><main id="app"></main></div><div class="modal" id="modal"><section class="card" id="modalCard"></section></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),store='menuOrbitStaffOperationsDemoV1';
const seed={role:'manager',tab:'dashboard',menu:[{id:1,name:'Caramel Macchiato',cat:'Espresso',price:210,qty:18,low:8,active:true,desc:'Vanilla, espresso and caramel.',allergen:'Milk'},{id:2,name:'Pure Matcha Latte',cat:'Matcha',price:190,qty:8,low:8,active:true,desc:'Smooth matcha with milk.',allergen:'Milk'},{id:3,name:'Ham and Cheese Croffle',cat:'Bakery',price:205,qty:3,low:6,active:true,desc:'Warm savory croffle.',allergen:'Gluten, milk'}],promos:[{id:1,title:'Morning Pair',type:'Bundle Deal',value:20,min:400,status:'Active',limit:35},{id:2,title:'Birthday Treat',type:'Birthday Reward',value:30,min:0,status:'Scheduled',limit:80}],notes:[{id:1,type:'New order',text:'MO-1052 needs oat milk confirmation',read:false},{id:2,type:'Low stock',text:'Ham and Cheese Croffle is below threshold',read:false},{id:3,type:'Review',text:'New 5-star drink review received',read:true}],care:[{id:1,type:'Review',name:'Jamie S.',text:'The latte was perfect and ready quickly.',status:'Open'},{id:2,type:'Question',name:'Mika P.',text:'Is almond milk available for the matcha?',status:'Open'},{id:3,type:'Refund',name:'Alex R.',text:'I received the wrong drink.',status:'Open'}],audit:[{action:'Promotion activated',by:'Alex Reyes',time:'Today 09:10'},{action:'Stock count adjusted',by:'Alex Reyes',time:'Today 08:42'}],branch:{name:'Demo Bacoor Branch',hours:'7:00 AM – 10:00 PM',prep:12,pickup:true,delivery:true,official:true}};
let state=JSON.parse(localStorage.getItem(store)||'null')||structuredClone(seed);const save=()=>localStorage.setItem(store,JSON.stringify(state));const money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{maximumFractionDigits:0});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2400)}function audit(action){state.audit.unshift({action,by:state.role==='admin'?'System Administrator':'Branch Manager',time:'Just now'});save()}function modal(html){$('#modalCard').innerHTML=html;$('#modal').classList.add('open');$('#modalCard').querySelector('[data-close]')?.addEventListener('click',()=>$('#modal').classList.remove('open'))}$('#modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')};
const tabs=[['dashboard','Dashboard'],['menu','Menu & Inventory'],['promos','Promo Center'],['care','Customer Care'],['reports','Reports'],['settings','Shop Settings'],['notifications','Notifications'],['audit','Activity Log']];function nav(){const n=$('#nav');n.innerHTML=tabs.map(([id,label])=>`<button class="${state.tab===id?'active':''}" data-tab="${id}">${label}</button>`).join('');n.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;save();render()})}
function shell(){return `<div class="notice"><b>DEMO ONLY.</b> Orders, payments, inventory, promos, customer data, reports, and notifications are stored only in this browser. No real business action is sent.</div>`}
function dashboard(){const low=state.menu.filter(x=>x.qty<=x.low).length,active=state.promos.filter(x=>x.status==='Active').length;return `${shell()}<section class="grid" style="margin-top:12px">${[['₱12,480','Today’s sales'],['38','Orders today'],['₱328','Average order'],[low,'Low-stock items']].map(x=>`<div class="card stat"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</section><section class="two"><div class="card"><div class="title"><h2>Branch pulse</h2><button class="btn primary" data-go="menu">Manage menu</button></div><div class="row"><div><b>Barista queue</b><small>3 preparing • 2 ready • 1 overdue</small></div><span class="tag warn">6 active</span><button class="btn" data-alert="Order queue opened">Open queue</button></div><div class="row"><div><b>Low stock</b><small>${low?state.menu.filter(x=>x.qty<=x.low).map(x=>esc(x.name)).join(', '):'All products above threshold'}</small></div><span class="tag ${low?'bad':''}">${low?'Action needed':'Healthy'}</span><button class="btn" data-go="menu">Adjust</button></div><div class="row"><div><b>Active promotions</b><small>${active} active campaign${active===1?'':'s'}</small></div><span class="tag">Live</span><button class="btn" data-go="promos">Open promos</button></div></div><div class="card"><div class="title"><h2>Peak hours</h2><span class="muted">Demo sales</span></div><div class="bars">${[38,54,80,62,94,72,45].map((h,i)=>`<div class="bar"><i style="height:${h}%"></i>${['9a','11a','1p','3p','5p','7p','9p'][i]}</div>`).join('')}</div><button class="btn" data-go="reports">Open full reports</button></div></section>`}
function menu(){return `${shell()}<section class="card" style="margin-top:12px"><div class="title"><h2>Menu & Inventory</h2><div><button class="btn" id="bulk">Bulk availability</button> <button class="btn primary" id="addProduct">+ Add product</button></div></div>${state.menu.map(p=>{const st=!p.active?'Archived':p.qty===0?'Sold out':p.qty<=p.low?'Low stock':'Available';return `<div class="row"><div><b>${esc(p.name)}</b><small>${esc(p.cat)} • ${money(p.price)} • ${esc(p.allergen)}</small></div><div><b>${p.qty}</b><small>Low at ${p.low}</small></div><span class="tag ${st==='Low stock'?'warn':st==='Sold out'||st==='Archived'?'bad':''}">${st}</span><div><button class="btn" data-edit="${p.id}">Edit</button> <button class="btn" data-stock="${p.id}">Stock</button> <button class="btn" data-copy="${p.id}">Duplicate</button></div></div>`}).join('')}</section>`}
function productForm(p={name:'',cat:'Espresso',price:0,qty:0,low:5,active:true,desc:'',allergen:''}){return `<div class="title"><h2>${p.id?'Edit':'Add'} product</h2><button class="btn" data-close>×</button></div><div class="form"><label>Name<input id="pn" value="${esc(p.name)}"></label><label>Category<select id="pc">${['Espresso','Frappuccino','Matcha','Tea','Bakery','Food'].map(x=>`<option ${p.cat===x?'selected':''}>${x}</option>`).join('')}</select></label><div class="three"><label>Price<input id="pp" type="number" value="${p.price}"></label><label>Stock<input id="pq" type="number" value="${p.qty}"></label><label>Low-stock level<input id="pl" type="number" value="${p.low}"></label></div><label>Description<textarea id="pd">${esc(p.desc)}</textarea></label><label>Calorie / allergen note<input id="pa" value="${esc(p.allergen)}"></label><label><input id="pactive" type="checkbox" ${p.active?'checked':''}> Available to customers</label><button class="btn primary" id="saveProduct">Save demo product</button></div>`}
function promos(){return `${shell()}<section class="card" style="margin-top:12px"><div class="title"><h2>Promo Center</h2><button class="btn primary" id="addPromo">+ Create promotion</button></div>${state.promos.map(p=>`<div class="row"><div><b>${esc(p.title)}</b><small>${esc(p.type)} • ${p.type==='Free Pickup Threshold'?'':money(p.value)+' off'} • minimum ${money(p.min)}</small></div><span>Limit: ${p.limit}</span><span class="tag ${p.status==='Active'?'':p.status==='Paused'?'bad':'warn'}">${p.status}</span><div><button class="btn" data-pause="${p.id}">${p.status==='Active'?'Pause':'Activate'}</button> <button class="btn" data-end="${p.id}">End</button></div></div>`).join('')}</section>`}
function promoForm(){return `<div class="title"><h2>Create promotion</h2><button class="btn" data-close>×</button></div><div class="form"><label>Title<input id="pt" placeholder="Weekend Matcha"></label><label>Promotion type<select id="pk">${['Flash Deal','Voucher','Bundle Deal','Add-on Deal','Birthday Reward','Free Pickup Threshold'].map(x=>`<option>${x}</option>`).join('')}</select></label><div class="three"><label>Discount value<input id="pv" type="number" value="20"></label><label>Minimum spend<input id="pm" type="number" value="400"></label><label>Quantity limit<input id="px" type="number" value="30"></label></div><label>Branch<select id="pb"><option>${esc(state.branch.name)}</option><option>Molino Demo Branch</option><option>All demo branches</option></select></label><button class="btn primary" id="savePromo">Create demo promo</button></div>`}
function care(){return `${shell()}<section class="two" style="margin-top:12px"><div class="card"><div class="title"><h2>Customer care inbox</h2><button class="btn" id="newChat">Saved reply</button></div>${state.care.map(x=>`<div class="row"><div><b>${esc(x.name)} • ${esc(x.type)}</b><small>${esc(x.text)}</small></div><span class="tag ${x.type==='Refund'?'bad':''}">${x.status}</span><button class="btn" data-reply="${x.id}">Reply</button><button class="btn" data-resolve="${x.id}">Resolve</button></div>`).join('')}</div><div class="card"><h2>Customer profile preview</h2><p><b>Jamie Santos</b><br><span class="muted">Gold Brew • 160 Beans • 8 demo orders</span></p><div class="row"><div><b>Favorites</b><small>Caramel Macchiato, Matcha Latte</small></div><span class="tag">Returning</span><button class="btn" data-alert="Customer note saved">Add note</button></div><div class="notice">Customer records are demo-only until a secure authorized CRM is connected.</div></div></section>`}
function reports(){return `${shell()}<section class="grid" style="margin-top:12px">${[['₱12,480','Gross sales'],['₱520','Discounts'],['₱260','Demo refunds'],['₱11,700','Net sales']].map(x=>`<div class="card stat"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</section><section class="two"><div class="card"><div class="title"><h2>Product performance</h2><button class="btn" id="exportBtn">Export CSV</button></div>${state.menu.map((p,i)=>`<div class="row"><div><b>${esc(p.name)}</b><small>${112-i*14} views • ${18-i*2} add to carts</small></div><b>${Math.max(4,16-i*3)}%</b><span class="tag">Conversion</span><button class="btn" data-alert="Product report opened">View</button></div>`).join('')}</div><div class="card"><h2>Operations performance</h2><div class="row"><div><b>Average prep time</b><small>Target: ${state.branch.prep} min</small></div><b>9 min</b><span class="tag">On target</span><span></span></div><div class="row"><div><b>Cash reconciliation</b><small>Demo register balance</small></div><b>₱3,420</b><span class="tag">Matched</span><span></span></div><div class="row"><div><b>Barista workload</b><small>Orders handled today</small></div><b>38</b><span class="tag">Healthy</span><span></span></div></div></section>`}
function settings(){const b=state.branch;return `${shell()}<section class="two" style="margin-top:12px"><div class="card"><div class="title"><h2>Shop & branch settings</h2><button class="btn primary" id="saveBranch">Save</button></div><div class="form"><label>Branch name<input id="bn" value="${esc(b.name)}"></label><label>Hours<input id="bh" value="${esc(b.hours)}"></label><label>Preparation time (minutes)<input id="bp" type="number" value="${b.prep}"></label><label><input id="bo" type="checkbox" ${b.official?'checked':''}> Official Branch badge</label><label><input id="bpu" type="checkbox" ${b.pickup?'checked':''}> Pickup enabled</label><label><input id="bde" type="checkbox" ${b.delivery?'checked':''}> Delivery enabled</label></div></div><div class="card"><div class="title"><h2>Roles & permissions</h2><button class="btn" id="switchRole">Switch demo role</button></div>${[['Cashier','Orders and receipts only'],['Barista','Kitchen queue only'],['Manager','Menu, inventory, promos, care, reports'],['Administrator','All branches, roles, audit, settings']].map(x=>`<div class="row"><b>${x[0]}</b><small>${x[1]}</small><span class="tag">${state.role==='admin'||x[0].toLowerCase()===state.role?'Active view':'Configured'}</span><span></span></div>`).join('')}</div></section>`}
function notifications(){return `${shell()}<section class="card" style="margin-top:12px"><div class="title"><h2>Notifications</h2><button class="btn" id="readAll">Mark all read</button></div>${state.notes.map(n=>`<div class="row"><div><b>${esc(n.type)}</b><small>${esc(n.text)}</small></div><span class="tag ${n.read?'':'warn'}">${n.read?'Read':'New'}</span><button class="btn" data-read="${n.id}">Mark read</button><span></span></div>`).join('')}</section>`}
function auditView(){return `${shell()}<section class="card" style="margin-top:12px"><div class="title"><h2>Activity log</h2><button class="btn" id="clearAudit">Clear demo log</button></div>${state.audit.map(a=>`<div class="row"><div><b>${esc(a.action)}</b><small>${esc(a.by)}</small></div><span>${esc(a.time)}</span><span class="tag">Logged</span><span></span></div>`).join('')}</section>`}
function render(){nav();const v={dashboard,menu,promos,care,reports,settings,notifications,audit:auditView}[state.tab]||dashboard;$('#app').innerHTML=v();wire()}
function wire(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.go;save();render()});
  document.querySelectorAll('[data-alert]').forEach(b=>b.onclick=()=>toast(b.dataset.alert));
  if(state.tab==='menu'){
    addProduct.onclick=()=>{modal(productForm());saveProduct.onclick=()=>{state.menu.push({id:Date.now(),name:pn.value||'Untitled product',cat:pc.value,price:+pp.value||0,qty:+pq.value||0,low:+pl.value||5,active:pactive.checked,desc:pd.value,allergen:pa.value});audit('Product created');save();$('#modal').classList.remove('open');render()}};
    document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const p=state.menu.find(x=>x.id==b.dataset.edit);modal(productForm(p));saveProduct.onclick=()=>{Object.assign(p,{name:pn.value,cat:pc.value,price:+pp.value,qty:+pq.value,low:+pl.value,active:pactive.checked,desc:pd.value,allergen:pa.value});audit('Product updated: '+p.name);save();$('#modal').classList.remove('open');render()}});
    document.querySelectorAll('[data-stock]').forEach(b=>b.onclick=()=>{const p=state.menu.find(x=>x.id==b.dataset.stock),q=prompt('New stock for '+p.name,p.qty);if(q===null)return;p.qty=Math.max(0,+q||0);audit('Stock adjusted: '+p.name);save();render()});
    document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const p=state.menu.find(x=>x.id==b.dataset.copy);state.menu.push({...p,id:Date.now(),name:p.name+' Copy'});audit('Product duplicated: '+p.name);save();render()});
    bulk.onclick=()=>{state.menu.forEach(p=>p.active=confirm('Keep '+p.name+' available?'));audit('Bulk availability update');save();render()};
  }
  if(state.tab==='promos'){
    addPromo.onclick=()=>{modal(promoForm());savePromo.onclick=()=>{state.promos.push({id:Date.now(),title:pt.value||'Untitled promo',type:pk.value,value:+pv.value||0,min:+pm.value||0,limit:+px.value||0,status:'Scheduled'});audit('Promotion created');save();$('#modal').classList.remove('open');render()}};
    document.querySelectorAll('[data-pause]').forEach(b=>b.onclick=()=>{const p=state.promos.find(x=>x.id==b.dataset.pause);p.status=p.status==='Active'?'Paused':'Active';audit('Promotion '+p.status.toLowerCase());save();render()});
    document.querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>{state.promos.find(x=>x.id==b.dataset.end).status='Ended';audit('Promotion ended');save();render()});
  }
  if(state.tab==='care'){
    document.querySelectorAll('[data-reply]').forEach(b=>b.onclick=()=>{modal(`<div class="title"><h2>Demo reply</h2><button class="btn" data-close>×</button></div><div class="form"><label>Reply<textarea id="replyText">Thank you—we are checking this with the branch.</textarea></label><button class="btn primary" id="sendReply">Send demo reply</button></div>`);$('#sendReply').onclick=()=>{audit('Demo customer reply sent');save();$('#modal').classList.remove('open');toast('Demo reply saved.')}});
    document.querySelectorAll('[data-resolve]').forEach(b=>b.onclick=()=>{state.care.find(x=>x.id==b.dataset.resolve).status='Resolved';audit('Customer care request resolved');save();render()});newChat.onclick=()=>toast('Saved reply copied to demo chat.');
  }
  if(state.tab==='reports')exportBtn.onclick=()=>{const csv='Product,Price,Stock\n'+state.menu.map(p=>`"${p.name}",${p.price},${p.qty}`).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='menu-orbit-demo-report.csv';a.click();toast('Demo report exported.')};
  if(state.tab==='settings'){saveBranch.onclick=()=>{Object.assign(state.branch,{name:bn.value,hours:bh.value,prep:+bp.value||12,official:bo.checked,pickup:bpu.checked,delivery:bde.checked});audit('Branch settings updated');save();toast('Demo branch settings saved.');render()};switchRole.onclick=()=>{state.role=state.role==='admin'?'manager':'admin';save();render()}}
  if(state.tab==='notifications'){readAll.onclick=()=>{state.notes.forEach(n=>n.read=true);save();render()};document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{state.notes.find(n=>n.id==b.dataset.read).read=true;save();render()})}
  if(state.tab==='audit')clearAudit.onclick=()=>{state.audit=[];save();render()}
}
$('#roleBtn').onclick=()=>{state.role=state.role==='admin'?'manager':'admin';save();$('#roleBtn').textContent=state.role==='admin'?'Administrator View':'Manager View';render()};$('#motionBtn').onclick=()=>{document.body.classList.toggle('reduce');$('#motionBtn').textContent=document.body.classList.contains('reduce')?'● Motion Reduced':'◌ Reduce Motion'};$('#roleBtn').textContent=state.role==='admin'?'Administrator View':'Manager View';render();
</script></body></html>
