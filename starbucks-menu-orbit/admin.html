<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="theme-color" content="#071c14">
<title>Menu Orbit — System Administrator</title>
<style>
:root{--g:#00754a;--g2:#00a862;--bg:#03130d;--panel:#08251b;--cream:#f4efe6;--gold:#d4ad62;--line:rgba(255,255,255,.14);--muted:#aac0b5;--danger:#d66060;--warn:#f0c36a;--ok:#59cf91;--shadow:0 20px 55px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#145d42,#061a13 42%,#020907);color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f4c86f;outline-offset:3px}.wrap{width:min(1320px,calc(100% - 18px));margin:auto;padding:12px 0 60px}.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;background:rgba(3,19,13,.96);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.07)}.brand{display:flex;align-items:center;gap:10px}.logo{width:48px;height:48px;border-radius:50%;border:2px solid #fff;background:var(--g);display:grid;place-items:center;font:900 20px Georgia,serif}.brand h1{margin:0;font-size:clamp(20px,3vw,30px)}.brand p{margin:2px 0 0;color:var(--muted);font-size:11px}.spacer{flex:1}.btn{min-height:50px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:rgba(255,255,255,.07);color:#fff;font-weight:900}.btn.primary{border:0;background:linear-gradient(135deg,var(--g2),var(--g))}.btn.cream{background:var(--cream);color:#073421}.btn.danger{border-color:rgba(255,120,120,.35);color:#ffd1d1}.btn.warn{border-color:rgba(240,195,106,.45);color:#ffe5a9}.card{background:rgba(8,37,27,.95);border:1px solid var(--line);border-radius:22px;padding:17px;margin-top:12px;box-shadow:var(--shadow)}.login{width:min(600px,100%);margin:5vh auto}.login input{width:100%;height:56px;border:1px solid var(--line);border-radius:14px;background:#0d3628;color:#fff;padding:0 14px;margin:7px 0}.demo{margin:13px 0;padding:13px;border:1px solid rgba(244,200,111,.38);border-radius:15px;background:rgba(244,200,111,.09);color:#ffe6a8}.cred{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:8px;padding:10px;border-radius:12px;background:rgba(255,255,255,.06)}.cred code{font-weight:900;overflow-wrap:anywhere}.copy{min-height:42px;border:0;border-radius:10px;background:var(--cream);color:#073421;font-weight:900;padding:0 12px}.login-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.notice{color:var(--muted);font-size:12px;line-height:1.5}.error{color:#ffb2b2}.adminbar{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:9px;margin:12px 0}.adminbox{background:rgba(8,37,27,.95);border:1px solid var(--line);border-radius:16px;padding:12px}.adminbox b{display:block;font-size:15px}.adminbox span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}.nav{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:12px 0}.nav button{min-height:58px}.nav button.active{background:var(--cream);color:#073421}.morebar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0}.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}.stat{padding:15px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.05)}.stat strong{display:block;font-size:27px;color:#f2cf8b}.stat span{font-size:11px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.section-title h2{margin:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.search,.field{height:50px;border:1px solid var(--line);border-radius:13px;background:#0d3628;color:#fff;padding:0 12px}.search{flex:1;min-width:220px}.table{display:grid;gap:8px}.row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr auto;gap:9px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04)}.row small{color:var(--muted)}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:rgba(0,168,98,.16);font-size:10px;font-weight:900;text-transform:uppercase}.tag.warn{background:rgba(240,195,106,.16);color:#ffe0a0}.tag.danger{background:rgba(214,96,96,.16);color:#ffc1c1}.statusline{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04);margin:8px 0}.form{display:grid;gap:10px}.form label{font-size:12px;font-weight:900}.form input,.form select,.form textarea{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:12px;background:#0d3628;color:#fff;padding:10px}.form input,.form select{min-height:48px}.form textarea{min-height:80px}.switches{display:grid;grid-template-columns:1fr 1fr;gap:10px}.switch{padding:13px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04);display:flex;justify-content:space-between;align-items:center;gap:10px}.empty{text-align:center;padding:40px;color:var(--muted)}.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:15px;background:rgba(0,0,0,.7);backdrop-filter:blur(8px)}.modal.open{display:flex}.modal-card{width:min(650px,100%);max-height:90vh;overflow:auto;background:#08251b;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}.reduce-motion *{animation:none!important;transition:none!important;scroll-behavior:auto!important}@media(max-width:1100px){.nav{grid-template-columns:repeat(4,1fr)}.stats{grid-template-columns:repeat(4,1fr)}.adminbar{grid-template-columns:1fr 1fr}.grid2,.grid3{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}}@media(max-width:650px){.wrap{width:min(100% - 12px,1320px)}.nav,.stats,.adminbar,.row,.login-actions,.switches{grid-template-columns:1fr}.top .spacer{display:none}.top .btn{flex:1}.cred{grid-template-columns:1fr}.copy{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">A</div><div><h1>System Administrator</h1><p>Menu Orbit Staff Portal • System Control Center</p></div></div><div class="spacer"></div><button class="btn" id="motionBtn">◌ Reduce Motion</button><button class="btn" id="managerBtn">🏪 Manager</button><button class="btn" id="cashierBtn">🧾 Cashier</button><button class="btn" id="baristaBtn">☕ Barista</button><button class="btn danger" id="signOutBtn" hidden>Sign Out</button></header>
<main id="app"></main>
</div>
<div class="modal" id="branchModal"><div class="modal-card"><div class="section-title"><h2>Add Branch</h2><button class="btn" data-close="branchModal">✕</button></div><div class="form"><label>Branch name<input id="branchName" placeholder="Bacoor Central"></label><label>Address<input id="branchAddress" placeholder="Full branch address"></label><div class="grid2"><label>City / Area<input id="branchCity" value="Bacoor"></label><label>Contact number<input id="branchContact" placeholder="0917..."></label></div><label>Operating hours<input id="branchHours" value="7:00 AM – 10:00 PM"></label><label>Estimated prep time<input id="branchPrep" type="number" min="1" value="12"></label><button class="btn primary" id="saveBranch">SAVE BRANCH — DEMO ONLY</button></div></div></div>
<div class="modal" id="userModal"><div class="modal-card"><div class="section-title"><h2>Create Staff Account</h2><button class="btn" data-close="userModal">✕</button></div><div class="form"><label>Name<input id="userName"></label><label>Email<input id="userEmail" type="email"></label><label>Role<select id="userRole"><option>Cashier</option><option>Barista / Service Crew</option><option>Branch Manager</option><option>System Administrator</option></select></label><label>Assigned branch<select id="userBranch"><option>Demo Bacoor Branch</option><option>Molino Demo Branch</option><option>All Branches</option></select></label><button class="btn primary" id="saveUser">CREATE ACCOUNT — DEMO ONLY</button></div></div></div>
<div class="modal" id="promoModal"><div class="modal-card"><div class="section-title"><h2>Global Promotion</h2><button class="btn" data-close="promoModal">✕</button></div><div class="form"><label>Title<input id="promoTitle" placeholder="Weekend Bonus"></label><label>Description<textarea id="promoDesc"></textarea></label><div class="grid2"><label>Start<input id="promoStart" type="date"></label><label>End<input id="promoEnd" type="date"></label></div><label>Branch coverage<select id="promoCoverage"><option>All branches</option><option>Selected branches</option></select></label><button class="btn primary" id="savePromo">SAVE GLOBAL PROMO — DEMO ONLY</button></div></div></div>
<div class="modal" id="confirmModal"><div class="modal-card"><h2>Confirm High-Risk Action</h2><p id="confirmText" class="notice"></p><div class="login-actions"><button class="btn danger" id="confirmYes">CONFIRM</button><button class="btn" data-close="confirmModal">CANCEL</button></div></div></div>
<script src="config.js"></script>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/+esm';
const cfg=window.MENU_ORBIT_CONFIG||{},app=document.querySelector('#app'),signOut=document.querySelector('#signOutBtn');
const db=cfg.supabaseUrl&&cfg.supabasePublishableKey?createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;
const DEMO_EMAIL='admin.demo@menuorbit.test',DEMO_PASSWORD='AdminOrbit2026!';
let demo=false,tab='dashboard',pendingConfirm=null;
let admin={name:'Kim Demo Admin',role:'SYSTEM ADMINISTRATOR',connection:db?'CONNECTED CONFIG':'DEMO MODE',lastLogin:'Today 2:30 PM'};
let branches=[{name:'Demo Bacoor Branch',city:'Bacoor',status:'ACTIVE',pickup:true,prep:12},{name:'Molino Demo Branch',city:'Bacoor',status:'ACTIVE',pickup:true,prep:14},{name:'Imus Demo Branch',city:'Imus',status:'INACTIVE',pickup:false,prep:15}];
let users=[{name:'Jamie Cruz',email:'cashier.demo@menuorbit.test',role:'Cashier',branch:'Demo Bacoor Branch',status:'ACTIVE'},{name:'Mika Santos',email:'barista.demo@menuorbit.test',role:'Barista / Service Crew',branch:'Demo Bacoor Branch',status:'ACTIVE'},{name:'Alex Reyes',email:'manager.demo@menuorbit.test',role:'Branch Manager',branch:'Demo Bacoor Branch',status:'ACTIVE'}];
let orders=[{ref:'MO-240118',branch:'Demo Bacoor Branch',status:'NEW',total:430},{ref:'MO-240119',branch:'Molino Demo Branch',status:'PREPARING',total:280},{ref:'MO-240120',branch:'Demo Bacoor Branch',status:'PROBLEM',total:520},{ref:'MO-240121',branch:'Imus Demo Branch',status:'CANCELLED',total:195}];
let promos=[{title:'Morning Pair',coverage:'Demo Bacoor Branch',status:'ACTIVE'},{title:'Weekend Bonus',coverage:'All branches',status:'DRAFT'}];
let escalations=[{issue:'Payment dispute',branch:'Demo Bacoor Branch',staff:'Alex Reyes',status:'OPEN'},{issue:'Inventory discrepancy',branch:'Molino Demo Branch',staff:'Branch Manager',status:'OPEN'}];
let audits=[{action:'Branch activated',user:'System Admin',role:'Administrator',branch:'Demo Bacoor Branch',time:'Today 09:15',ref:'AUD-001'},{action:'Role changed',user:'System Admin',role:'Administrator',branch:'Molino Demo Branch',time:'Yesterday 16:30',ref:'AUD-002'}];
const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{maximumFractionDigits:0});
document.querySelector('#managerBtn').onclick=()=>location.href='manager.html';document.querySelector('#cashierBtn').onclick=()=>location.href='cashier.html';document.querySelector('#baristaBtn').onclick=()=>location.href='staff.html';document.querySelector('#motionBtn').onclick=()=>{document.body.classList.toggle('reduce-motion');document.querySelector('#motionBtn').textContent=document.body.classList.contains('reduce-motion')?'● Motion Reduced':'◌ Reduce Motion'};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).classList.remove('open'));
function copy(v,label){navigator.clipboard?.writeText(v).then(()=>alert(label+' copied')).catch(()=>alert(v))}
function login(){signOut.hidden=true;app.innerHTML=`<section class="card login"><h2>System Administrator Sign In</h2><p class="notice">Authorized administrators only. Demo access is isolated from live data.</p><div class="demo"><b>DEMO LOGIN — CLICK TO COPY</b><div class="cred"><code>${DEMO_EMAIL}</code><button class="copy" id="copyEmail">Copy Email</button></div><div class="cred"><code>${DEMO_PASSWORD}</code><button class="copy" id="copyPass">Copy Password</button></div><button class="btn" id="fillDemo" style="width:100%;margin-top:9px">Fill Demo Login</button></div><form id="loginForm"><input id="email" type="email" required placeholder="Administrator email"><input id="pass" type="password" required placeholder="Password"><div class="login-actions"><button class="btn primary" type="submit">Sign In</button><button class="btn" type="button" id="demoBtn">Enter Demo Dashboard</button></div></form><p id="msg" class="notice"></p></section>`;copyEmail.onclick=()=>copy(DEMO_EMAIL,'Email');copyPass.onclick=()=>copy(DEMO_PASSWORD,'Password');fillDemo.onclick=()=>{email.value=DEMO_EMAIL;pass.value=DEMO_PASSWORD};demoBtn.onclick=enterDemo;loginForm.onsubmit=async e=>{e.preventDefault();const em=email.value.trim(),pw=pass.value,msg=document.querySelector('#msg');if(em===DEMO_EMAIL&&pw===DEMO_PASSWORD)return enterDemo();if(!db){msg.textContent='Live backend is not connected. Use the demo login.';return}msg.textContent='Signing in…';const {error}=await db.auth.signInWithPassword({email:em,password:pw});if(error){msg.textContent=error.message;msg.className='notice error';return}demo=false;admin={name:em,role:'SYSTEM ADMINISTRATOR',connection:'AUTHENTICATED',lastLogin:'Available when backend profile is connected'};renderShell()}}
function enterDemo(){demo=true;admin.connection='DEMO ONLY';renderShell()}
function nav(){return `<nav class="nav">${[['dashboard','DASHBOARD'],['branches','BRANCHES'],['users','USERS'],['orders','ORDERS'],['promos','PROMOTIONS'],['security','SECURITY'],['reports','REPORTS']].map(([k,l])=>`<button class="btn ${tab===k?'active':''}" data-tab="${k}">${l}</button>`).join('')}</nav><div class="morebar"><button class="btn" data-tab="escalations">Escalations</button><button class="btn" data-tab="inventory">Inventory Oversight</button><button class="btn" data-tab="audit">Audit Log</button><button class="btn" data-tab="settings">System Settings</button><button class="btn" data-tab="health">System Health</button></div>`}
function shell(){return `<section class="adminbar"><div class="adminbox"><b>${esc(admin.name)}</b><span>Administrator</span></div><div class="adminbox"><b>${admin.role}</b><span>Role</span></div><div class="adminbox"><b>${esc(admin.connection)}</b><span>Connection</span></div><div class="adminbox"><b>${esc(admin.lastLogin)}</b><span>Last Login</span></div></section>${nav()}<div id="view"></div>`}
function renderShell(){signOut.hidden=false;app.innerHTML=shell();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderShell()});renderView();signOut.onclick=async()=>{if(db&&!demo)await db.auth.signOut();demo=false;login()}}
function stats(){return `<div class="stats"><div class="stat"><strong>${branches.filter(x=>x.status==='ACTIVE').length}</strong><span>Active Branches</span></div><div class="stat"><strong>${users.filter(x=>x.status==='ACTIVE').length}</strong><span>Active Staff</span></div><div class="stat"><strong>${orders.length}</strong><span>Orders Today</span></div><div class="stat"><strong>${orders.filter(x=>x.status==='PROBLEM').length}</strong><span>Problem Orders</span></div><div class="stat"><strong>1</strong><span>Low Stock Branches</span></div><div class="stat"><strong>${promos.filter(x=>x.status==='ACTIVE').length}</strong><span>Active Promotions</span></div><div class="stat"><strong>${escalations.filter(x=>x.status==='OPEN').length}</strong><span>System Alerts</span></div></div>`}
function renderView(){const v=document.querySelector('#view');if(tab==='dashboard')v.innerHTML=`${stats()}<div class="grid2"><section class="card"><h2>System Status</h2>${status('Supabase','WARNING','Configured, but live system checks are limited in this demo.')}${status('Realtime','NOT CONFIGURED','No verified live realtime health check.')}${status('Notifications','NOT CONFIGURED','No delivery provider verified.')}${status('Payments / POS','NOT CONFIGURED','NO LIVE PAYMENT PROVIDER CONNECTED')}</section><section class="card"><h2>Attention Needed</h2><p>${escalations.length} open escalation(s)</p><p>1 low-stock branch</p><p class="notice">Demo data only. Live counts appear after backend tables and permissions are connected.</p></section></div>`;else if(tab==='branches')branchesView(v);else if(tab==='users')usersView(v);else if(tab==='orders')ordersView(v);else if(tab==='promos')promosView(v);else if(tab==='security')securityView(v);else if(tab==='reports')reportsView(v);else if(tab==='escalations')escalationsView(v);else if(tab==='inventory')inventoryView(v);else if(tab==='audit')auditView(v);else if(tab==='settings')settingsView(v);else if(tab==='health')healthView(v)}
function status(name,state,note){const cls=state==='ONLINE'||state==='CONNECTED'?'':state==='WARNING'?'warn':'danger';return `<div class="statusline"><div><b>${name}</b><div class="notice">${note}</div></div><span class="tag ${cls}">${state}</span></div>`}
function branchesView(v){v.innerHTML=`<section class="card"><div class="section-title"><h2>Branch Management</h2><button class="btn primary" id="addBranch">+ ADD BRANCH</button></div><div class="table">${branches.map((b,i)=>`<div class="row"><div><b>${esc(b.name)}</b><br><small>${esc(b.city)}</small></div><span class="tag ${b.status==='ACTIVE'?'':'danger'}">${b.status}</span><span>${b.pickup?'Pickup On':'Pickup Off'}</span><span>${b.prep} min</span><div><button class="btn" data-editbranch="${i}">VIEW</button> <button class="btn ${b.status==='ACTIVE'?'danger':'primary'}" data-togglebranch="${i}">${b.status==='ACTIVE'?'DEACTIVATE':'ACTIVATE'}</button></div></div>`).join('')}</div></section>`;addBranch.onclick=()=>branchModal.classList.add('open');document.querySelectorAll('[data-editbranch]').forEach(b=>b.onclick=()=>alert('Demo branch details: '+branches[+b.dataset.editbranch].name));document.querySelectorAll('[data-togglebranch]').forEach(b=>b.onclick=()=>confirmRisk(`${branches[+b.dataset.togglebranch].status==='ACTIVE'?'Deactivate':'Activate'} ${branches[+b.dataset.togglebranch].name}?`,()=>{const x=branches[+b.dataset.togglebranch];x.status=x.status==='ACTIVE'?'INACTIVE':'ACTIVE';audit('Branch '+x.status.toLowerCase(),x.name);renderView()}))}
function usersView(v){v.innerHTML=`<section class="card"><div class="section-title"><h2>User & Role Management</h2><button class="btn primary" id="addUser">+ CREATE STAFF ACCOUNT</button></div><div class="table">${users.map((u,i)=>`<div class="row"><div><b>${esc(u.name)}</b><br><small>${esc(u.email)}</small></div><span>${esc(u.role)}</span><span>${esc(u.branch)}</span><span class="tag ${u.status==='ACTIVE'?'':'danger'}">${u.status}</span><div><button class="btn" data-role="${i}">EDIT ROLE</button> <button class="btn ${u.status==='ACTIVE'?'danger':'primary'}" data-userstatus="${i}">${u.status==='ACTIVE'?'DEACTIVATE':'ACTIVATE'}</button></div></div>`).join('')}</div></section>`;addUser.onclick=()=>userModal.classList.add('open');document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>confirmRisk(`Change role for ${users[+b.dataset.role].name}? This is a high-risk permission change.`,()=>alert('Demo role editor only.')));document.querySelectorAll('[data-userstatus]').forEach(b=>b.onclick=()=>confirmRisk(`${users[+b.dataset.userstatus].status==='ACTIVE'?'Disable':'Activate'} ${users[+b.dataset.userstatus].name}?`,()=>{const u=users[+b.dataset.userstatus];u.status=u.status==='ACTIVE'?'DISABLED':'ACTIVE';audit('User status changed',u.branch);renderView()}))}
function ordersView(v){v.innerHTML=`<section class="card"><div class="section-title"><h2>System-Wide Orders</h2></div><div class="toolbar"><input class="search" id="orderSearch" placeholder="Search order number or branch"><select class="field" id="orderStatus"><option>ALL</option><option>NEW</option><option>PREPARING</option><option>READY</option><option>RELEASED</option><option>CANCELLED</option><option>PROBLEM</option></select></div><div class="table" id="orderRows"></div></section>`;const draw=()=>{const q=orderSearch.value.toLowerCase(),s=orderStatus.value;orderRows.innerHTML=orders.filter(o=>(s==='ALL'||o.status===s)&&(o.ref.toLowerCase().includes(q)||o.branch.toLowerCase().includes(q))).map(o=>`<div class="row"><b>${o.ref}</b><span>${esc(o.branch)}</span><span class="tag ${o.status==='PROBLEM'?'danger':''}">${o.status}</span><span>${money(o.total)}</span><button class="btn">VIEW</button></div>`).join('')||'<div class="empty">No matching orders.</div>'};draw();orderSearch.oninput=draw;orderStatus.onchange=draw}
function promosView(v){v.innerHTML=`<section class="card"><div class="section-title"><h2>System-Wide Promotions</h2><button class="btn primary" id="addPromo">+ GLOBAL PROMOTION</button></div><div class="table">${promos.map((p,i)=>`<div class="row"><b>${esc(p.title)}</b><span>${esc(p.coverage)}</span><span class="tag ${p.status==='ACTIVE'?'':'warn'}">${p.status}</span><span>System Promo</span><div><button class="btn">EDIT</button> <button class="btn" data-promotoggle="${i}">${p.status==='ACTIVE'?'DEACTIVATE':'ACTIVATE'}</button></div></div>`).join('')}</div></section>`;addPromo.onclick=()=>promoModal.classList.add('open');document.querySelectorAll('[data-promotoggle]').forEach(b=>b.onclick=()=>{const p=promos[+b.dataset.promotoggle];p.status=p.status==='ACTIVE'?'INACTIVE':'ACTIVE';audit('Global promotion '+p.status.toLowerCase(),'All branches');renderView()})}
function securityView(v){v.innerHTML=`<section class="card"><h2>Security & Permissions</h2>${status('Role-based access','WARNING','Frontend role views exist; live authorization must be enforced by Supabase RLS.')}${status('Branch access rules','WARNING','Requires verified backend role/branch policies.')}${status('Disabled accounts',users.some(x=>x.status!=='ACTIVE')?'WARNING':'ONLINE',users.filter(x=>x.status!=='ACTIVE').length+' disabled account(s) in demo.')}${status('Suspicious login events','NOT CONFIGURED','No verified auth event feed connected.') }<p class="notice">Passwords are not displayed or stored here. Never place service-role credentials in browser code.</p></section>`}
function reportsView(v){v.innerHTML=`${stats()}<section class="card"><h2>Reports</h2><div class="grid3"><div class="stat"><strong>${orders.filter(x=>x.status==='CANCELLED').length}</strong><span>Cancelled</span></div><div class="stat"><strong>${orders.filter(x=>x.status==='PROBLEM').length}</strong><span>Problem Orders</span></div><div class="stat"><strong>${money(orders.reduce((s,o)=>s+o.total,0))}</strong><span>Demo Gross Order Value</span></div></div><p class="notice">DEMO ONLY. Live sales and branch performance must come from real order data. Do not use demo totals as financial reporting.</p></section>`}
function escalationsView(v){v.innerHTML=`<section class="card"><h2>Escalation Center</h2><div class="table">${escalations.map((e,i)=>`<div class="row"><b>${esc(e.issue)}</b><span>${esc(e.branch)}</span><span>${esc(e.staff)}</span><span class="tag ${e.status==='OPEN'?'danger':''}">${e.status}</span><div><button class="btn" data-resolve="${i}">RESOLVE</button><button class="btn">RETURN TO MANAGER</button></div></div>`).join('')}</div></section>`;document.querySelectorAll('[data-resolve]').forEach(b=>b.onclick=()=>{escalations[+b.dataset.resolve].status='RESOLVED';audit('Escalation resolved',escalations[+b.dataset.resolve].branch);renderView()})}
function inventoryView(v){v.innerHTML=`<section class="card"><h2>Inventory Oversight</h2><div class="grid3"><div class="stat"><strong>1</strong><span>Low-Stock Branch</span></div><div class="stat"><strong>2</strong><span>Out-of-Stock Products</span></div><div class="stat"><strong>3</strong><span>Large Adjustments for Review</span></div></div><p class="notice">Administrator oversight only. Daily stock counting and routine inventory encoding remain with branch operations.</p></section>`}
function auditView(v){v.innerHTML=`<section class="card"><h2>Read-Only Audit Log</h2><div class="table">${audits.map(a=>`<div class="row"><b>${esc(a.action)}</b><span>${esc(a.user)}<br><small>${esc(a.role)}</small></span><span>${esc(a.branch)}</span><span>${esc(a.time)}</span><span class="tag">${esc(a.ref)}</span></div>`).join('')}</div></section>`}
function settingsView(v){v.innerHTML=`<section class="card"><h2>System Settings</h2><div class="switches"><div class="switch"><span>Order Availability</span><button class="btn" data-global="Order availability">CHANGE</button></div><div class="switch"><span>Pickup Feature</span><button class="btn" data-global="Pickup feature">CHANGE</button></div><div class="switch"><span>Maintenance Mode</span><button class="btn warn" data-global="Maintenance mode">CHANGE</button></div><div class="switch"><span>System Announcement</span><button class="btn" data-global="System announcement">EDIT</button></div></div><p class="notice">Major system-wide changes require confirmation and must be persisted by the live backend when activated.</p></section>`;document.querySelectorAll('[data-global]').forEach(b=>b.onclick=()=>confirmRisk(`Change global setting: ${b.dataset.global}?`,()=>{audit('System setting changed','All branches');alert('DEMO ONLY — no live setting changed.')}))}
function healthView(v){v.innerHTML=`<section class="card"><h2>System Health</h2>${status('Supabase Configuration',db?'WARNING':'NOT CONFIGURED',db?'Client configuration exists. A full live health probe is not performed from this page.':'No client configuration detected.')}${status('Authentication',db?'WARNING':'NOT CONFIGURED',db?'Auth client available; live role enforcement still depends on backend policies.':'Not connected.')}${status('Realtime','NOT CONFIGURED','No verified realtime health check.')}${status('Database','WARNING','Schema activation must be verified separately.')}${status('Notifications','NOT CONFIGURED','No provider verified.')}${status('Payment / POS','NOT CONFIGURED','NO LIVE PAYMENT PROVIDER CONNECTED')}${status('Pending Backend Features','WARNING','Admin tables/actions may require additional migrations and RLS policies.')}</section>`}
function audit(action,branch){audits.unshift({action,user:admin.name,role:'Administrator',branch,time:'Just now',ref:'AUD-'+String(Date.now()).slice(-5)})}
function confirmRisk(text,fn){confirmText.textContent=text;pendingConfirm=fn;confirmModal.classList.add('open')}
confirmYes.onclick=()=>{confirmModal.classList.remove('open');const fn=pendingConfirm;pendingConfirm=null;fn?.()};
saveBranch.onclick=()=>{const name=branchName.value.trim();if(!name)return alert('Enter a branch name.');branches.push({name,city:branchCity.value||'—',status:'ACTIVE',pickup:true,prep:+branchPrep.value||12});branchModal.classList.remove('open');audit('Branch created',name);renderView()};
saveUser.onclick=()=>{const name=userName.value.trim(),email=userEmail.value.trim(),role=userRole.value;if(!name||!email)return alert('Name and email are required.');const go=()=>{users.push({name,email,role,branch:userBranch.value,status:'ACTIVE'});userModal.classList.remove('open');audit('Staff account created',userBranch.value);renderView()};if(role==='System Administrator')confirmRisk('Create another System Administrator account? This is a high-risk role change.',go);else go()};
savePromo.onclick=()=>{if(!promoTitle.value.trim())return alert('Enter a promo title.');promos.push({title:promoTitle.value.trim(),coverage:promoCoverage.value,status:'DRAFT'});promoModal.classList.remove('open');audit('Global promotion created',promoCoverage.value);renderView()};
if(!db)login();else login();
</script>
</body>
</html>
