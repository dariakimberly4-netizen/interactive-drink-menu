<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restaurant Reservations</title>
<style>
:root{--bg:#031811;--panel:#0b3024;--green:#00a862;--gold:#e8c878;--cream:#f4efe6;--muted:#a8bdb3}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 25%,#0b3a2b,#031811 55%,#020d09);color:white;font-family:Arial,sans-serif;user-select:none}
button,input,select{font:inherit}input,select{user-select:text}.top{height:68px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18}.brand{font-weight:950}.brand small{display:block;color:var(--gold);font-size:9px;letter-spacing:.13em;margin-top:3px}.ghost{min-height:44px;border:1px solid #ffffff25;background:#ffffff09;color:white;border-radius:12px;padding:0 14px;font-weight:900}
.wrap{max-width:900px;margin:auto;padding:24px 16px}.head{text-align:center}.eyebrow{color:var(--gold);font-size:10px;font-weight:950;letter-spacing:.15em}.head h1{font:700 clamp(38px,7vw,68px)/1 Georgia,serif;margin:10px}.head p{color:var(--muted)}
.orbit{position:relative;width:min(650px,94vw);height:min(650px,94vw);margin:18px auto}.orbit:before{content:"";position:absolute;inset:15%;border:2px solid #e8c87866;border-radius:50%}.center,.node{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:3px solid var(--gold);background:#0b392b;color:#fff;font-weight:950;text-align:center;cursor:pointer;touch-action:manipulation}.center{left:50%;top:50%;width:190px;height:190px;background:radial-gradient(circle,#078153,#04281e);border-width:5px}.center small,.node small{display:block;color:#efd99b;font-size:9px;margin-top:5px}.node{width:120px;height:120px;font-size:10px}.node span{display:block;font-size:25px;margin-bottom:4px}
.panel{display:none;position:fixed;inset:0;background:#061f17;z-index:30;overflow:auto;padding:18px}.panel.open{display:block}.inside{max-width:760px;margin:auto}.panel h2{font:700 40px Georgia,serif;margin:20px 0 8px}.panel p{color:var(--muted)}.form,.card{background:var(--panel);border:1px solid #ffffff1b;border-radius:17px;padding:16px;margin-top:14px}.form{display:grid;gap:10px}.form input,.form select{height:48px;border:0;border-radius:10px;padding:0 12px;font-size:16px}.primary{min-height:48px;border:0;border-radius:10px;background:var(--green);color:white;font-weight:950;padding:0 15px}.list{display:grid;gap:10px;margin-top:14px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{font-size:9px;font-weight:950;color:#082b1e;background:var(--gold);padding:6px 8px;border-radius:999px}
@media(max-width:650px){.orbit{height:470px}.center{width:125px;height:125px;font-size:10px}.node{width:88px;height:88px;font-size:7.5px}.node span{font-size:18px}}
</style></head><body>
<header class="top"><div class="brand">RESERVATION ORBIT<small>SEPARATE RESTAURANT PORTAL</small></div><button class="ghost" onclick="location.href='browse-clean.html'">Customer Portal</button></header>
<main class="wrap"><div class="head"><div class="eyebrow">TABLE RESERVATIONS</div><h1>Reservations</h1><p>A separate reservation workspace. Your existing customer portal remains unchanged.</p></div><div class="orbit" id="orbit"></div></main>
<section class="panel" id="panel"><div class="inside"><button class="ghost" onclick="closePanel()">← Back to Orbit</button><h2 id="title"></h2><p id="desc"></p><div id="body"></div></div></section>
<script>
const KEY='restaurant_reservations_v1';
const modules=[['New Reservation','＋'],['Today','◷'],['Upcoming','▤'],['Walk-In','♙'],['Waitlist','⌛'],['Table Status','◎'],['Guests','♥'],['History','↶']];
const orbit=document.getElementById('orbit');
const center=document.createElement('button');center.className='center';center.innerHTML='RESERVE TABLE<small>Create a booking</small>';center.onclick=()=>openModule('New Reservation');orbit.appendChild(center);
modules.forEach((m,i)=>{const a=Math.PI*2*i/modules.length-Math.PI/2,b=document.createElement('button');b.className='node';b.style.left=(50+43*Math.cos(a))+'%';b.style.top=(50+43*Math.sin(a))+'%';b.innerHTML='<span>'+m[1]+'</span>'+m[0];b.onclick=()=>openModule(m[0]);orbit.appendChild(b)});
function get(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}function save(a){localStorage.setItem(KEY,JSON.stringify(a))}
function createBooking(){const name=document.getElementById('gname').value.trim(),date=document.getElementById('gdate').value,time=document.getElementById('gtime').value,party=document.getElementById('party').value;if(!name||!date||!time){alert('Please complete guest, date and time.');return}const a=get();a.unshift({id:'RSV-'+String(Date.now()).slice(-5),name,date,time,party,status:'CONFIRMED'});save(a);openModule('Today')}
function list(filter){let a=get();if(filter==='Today'){const d=new Date().toISOString().slice(0,10);a=a.filter(x=>x.date===d)}if(filter==='Upcoming'){const d=new Date().toISOString().slice(0,10);a=a.filter(x=>x.date>=d)}return a.length?'<div class="list">'+a.map(x=>'<div class="card row"><div><b>'+x.name+'</b><small style="display:block;color:#a8bdb3">'+x.date+' • '+x.time+' • '+x.party+' guest(s) • '+x.id+'</small></div><span class="badge">'+x.status+'</span></div>').join('')+'</div>':'<div class="card"><b>No reservations here yet.</b></div>'}
function openModule(name){document.getElementById('title').textContent=name;document.getElementById('desc').textContent=name==='New Reservation'?'Create a table reservation. Saving it adds it to this reservation portal.':'Reservation workspace for '+name+'.';const body=document.getElementById('body');if(name==='New Reservation'||name==='Walk-In'){const d=new Date().toISOString().slice(0,10);body.innerHTML='<div class="form"><input id="gname" placeholder="Guest name"><input id="gdate" type="date" value="'+d+'"><input id="gtime" type="time"><select id="party"><option value="1">1 guest</option><option value="2" selected>2 guests</option><option value="3">3 guests</option><option value="4">4 guests</option><option value="5">5 guests</option><option value="6">6 guests</option><option value="8">8 guests</option><option value="10">10 guests</option></select><button class="primary" onclick="createBooking()">SAVE RESERVATION</button></div>'}else if(['Today','Upcoming','History','Guests'].includes(name)){body.innerHTML=list(name)}else{body.innerHTML='<div class="card"><b>'+name+' is ready.</b><p>This remains separate from your existing customer portal.</p></div>'}document.getElementById('panel').classList.add('open')}
function closePanel(){document.getElementById('panel').classList.remove('open')}
</script></body></html>
