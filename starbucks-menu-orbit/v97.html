<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06271d"><title>Starbucks Menu Orbit</title><style>:root{--g:#00754a;--d:#041a13;--c:#f7f2e8;--gold:#d8b66a}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 50% 35%,#0a5139 0,#06271d 34%,#020d09 100%);color:#fff}button{font:inherit}.top{height:68px;display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid rgba(216,182,106,.25);background:rgba(2,20,14,.82);backdrop-filter:blur(15px);position:relative;z-index:20}.logo{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#00a862,#006241);border:2px solid #fff;box-shadow:0 0 0 4px rgba(216,182,106,.14);font:900 24px Georgia}.title{font-weight:900;font-size:18px}.sub{font-size:9px;color:#b9ccc2;letter-spacing:.12em}.actions{margin-left:auto;display:flex;gap:7px}.pill{height:42px;padding:0 12px;border-radius:999px;border:1px solid rgba(216,182,106,.35);background:rgba(255,255,255,.06);color:#fff;font-weight:800;font-size:12px}.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:var(--gold);color:#18281f;margin-left:5px;font-size:11px}.stage{position:absolute;inset:68px 0 0;touch-action:pan-y}.ring{position:absolute;left:50%;top:47%;width:min(90vw,700px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:1px solid rgba(216,182,106,.55);box-shadow:0 0 60px rgba(0,168,98,.16),inset 0 0 80px rgba(255,255,255,.03)}.ring:before,.ring:after{content:"";position:absolute;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.ring:before{width:72%;height:72%;border:1px dashed rgba(216,182,106,.28)}.ring:after{width:48%;height:48%;border:1px solid rgba(216,182,106,.16)}.hero{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:min(35vw,260px);aspect-ratio:1;border-radius:50%;border:2px solid #fff;background:radial-gradient(circle at 35% 25%,#12a66b,#00754a 48%,#05452f 72%,#06271d);box-shadow:0 0 0 9px rgba(216,182,106,.11),0 0 65px rgba(0,168,98,.34),0 25px 70px rgba(0,0,0,.48);z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px}.hero:after{content:"";position:absolute;inset:8%;border-radius:50%;border:1px dashed rgba(216,182,106,.45)}.emoji{font-size:clamp(38px,8vw,68px);line-height:1;position:relative;z-index:2}.hero h1{font:700 clamp(16px,2.7vw,24px) Georgia;margin:7px 0 2px;position:relative;z-index:2}.hero p{margin:0;max-width:190px;font-size:11px;line-height:1.35;color:#e2eee8;position:relative;z-index:2}.price{margin-top:5px;color:#f0d18a;font-weight:900;font-size:14px;position:relative;z-index:2}.add{margin-top:9px;border:1px solid #fff3d5;border-radius:999px;background:var(--c);color:#073a28;min-height:40px;padding:0 15px;font-weight:900;position:relative;z-index:2}.node{position:absolute;left:50%;top:47%;width:clamp(76px,18vw,112px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:2px solid rgba(216,182,106,.8);background:linear-gradient(160deg,#0d4935,#062a20);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 12px 30px rgba(0,0,0,.4);z-index:4;padding:7px;transition:.2s}.node span{font-size:clamp(25px,5vw,38px)}.node b{font-size:clamp(8px,2.1vw,11px);text-align:center}.node.active{background:linear-gradient(160deg,#0f6949,#07523a);box-shadow:0 0 28px rgba(216,182,106,.22),0 12px 30px rgba(0,0,0,.42)}.n0{transform:translate(-50%,-50%) translateY(-41vw)}.n1{transform:translate(-50%,-50%) translate(35.5vw,-21vw)}.n2{transform:translate(-50%,-50%) translate(35.5vw,21vw)}.n3{transform:translate(-50%,-50%) translateY(41vw)}.n4{transform:translate(-50%,-50%) translate(-35.5vw,21vw)}.n5{transform:translate(-50%,-50%) translate(-35.5vw,-21vw)}.hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;color:#c8d8d0;background:rgba(3,22,16,.72);border:1px solid rgba(216,182,106,.25);border-radius:999px;padding:8px 12px;z-index:8}.panel{position:fixed;inset:0;display:none;align-items:flex-end;background:rgba(0,0,0,.66);backdrop-filter:blur(8px);z-index:50}.panel.open{display:flex}.sheet{width:100%;height:88vh;background:#06271d;border-radius:25px 25px 0 0;overflow:hidden;border-top:1px solid rgba(216,182,106,.35)}.sheethead{height:58px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid rgba(216,182,106,.22);font-weight:900}.close{margin-left:auto;width:40px;height:40px;border-radius:50%;border:1px solid rgba(216,182,106,.3);background:rgba(255,255,255,.06);color:#fff;font-size:20px}.frame{width:100%;height:calc(88vh - 58px);border:0;background:#04140e}@media(min-width:700px){.n0{transform:translate(-50%,-50%) translateY(-280px)}.n1{transform:translate(-50%,-50%) translate(240px,-140px)}.n2{transform:translate(-50%,-50%) translate(240px,140px)}.n3{transform:translate(-50%,-50%) translateY(280px)}.n4{transform:translate(-50%,-50%) translate(-240px,140px)}.n5{transform:translate(-50%,-50%) translate(-240px,-140px)}}@media(max-height:700px){.stage{transform:scale(.88);transform-origin:50% 45%}.hint{display:none}}</style></head><body><header class="top"><div class="logo">S</div><div><div class="title">Menu Orbit</div><div class="sub">STARBUCKS PHILIPPINES • PROTOTYPE</div></div><div class="actions"><button class="pill" id="hub">Customer Hub</button><button class="pill">My Order <span class="badge" id="count">0</span></button></div></header><main class="stage" id="orbit"><div class="ring"></div><button class="node n0 active" data-k="espresso"><span>☕</span><b>ESPRESSO</b></button><button class="node n1" data-k="frappuccino"><span>🥤</span><b>FRAPPUCCINO®</b></button><button class="node n2" data-k="refreshers"><span>🍓</span><b>REFRESHERS®</b></button><button class="node n3" data-k="teavana"><span>🍵</span><b>TEAVANA™</b></button><button class="node n4" data-k="food"><span>🥐</span><b>FOOD</b></button><button class="node n5" data-k="featured"><span>★</span><b>FEATURED</b></button><section class="hero"><div class="emoji" id="e">☕</div><h1 id="t">Caramel Macchiato</h1><p id="d">Espresso, vanilla and steamed milk with caramel drizzle.</p><div class="price" id="p">₱180 – ₱205</div><button class="add" id="add">Add to Order +</button></section></main><div class="hint">Tap a category • Swipe left/right • Customer Hub keeps your previous orbit</div><div class="panel" id="panel"><div class="sheet"><div class="sheethead">Previous Orbit — Customer Hub<button class="close" id="x">×</button></div><iframe class="frame" id="f" title="Previous Menu Orbit"></iframe></div></div><script>const C={espresso:['☕','Caramel Macchiato','Espresso, vanilla and steamed milk with caramel drizzle.','₱180 – ₱205'],frappuccino:['🥤','Caramel Frappuccino®','Blended coffee, milk, ice and caramel with whipped cream.','₱185 – ₱215'],refreshers:['🍓','Strawberry Refresher','Bright fruit flavor served chilled over ice.','₱160 – ₱190'],teavana:['🍵','Green Tea Latte','Smooth green tea with milk, served hot or iced.','₱170 – ₱200'],food:['🥐','Butter Croissant','Flaky, buttery pastry for pairing with your favorite drink.','₱125'],featured:['★','Featured Seasonal Drink','A rotating seasonal highlight.','₱190 – ₱220']};let key='espresso',cart=0;const nodes=[...document.querySelectorAll('.node')];function select(k){key=k;nodes.forEach(n=>n.classList.toggle('active',n.dataset.k===k));const v=C[k];e.textContent=v[0];t.textContent=v[1];d.textContent=v[2];p.textContent=v[3]}nodes.forEach(n=>n.onclick=()=>select(n.dataset.k));add.onclick=()=>{cart++;count.textContent=cart;add.textContent='Added ✓';setTimeout(()=>add.textContent='Add to Order +',800)};hub.onclick=()=>{if(!f.src)f.src='./v89.html?legacy=1#orbit';panel.classList.add('open')};x.onclick=()=>panel.classList.remove('open');panel.onclick=a=>{if(a.target===panel)panel.classList.remove('open')};let sx=0;orbit.addEventListener('touchstart',a=>sx=a.touches[0].clientX,{passive:true});orbit.addEventListener('touchend',a=>{let dx=a.changedTouches[0].clientX-sx;if(Math.abs(dx)<45)return;let i=nodes.findIndex(n=>n.dataset.k===key);i=(i+(dx<0?1:-1)+nodes.length)%nodes.length;select(nodes[i].dataset.k)},{passive:true});</script></body></html>
