<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="theme-color" content="#071c14">
<title>Study Seat Bookings — Menu Orbit</title>
<style>
:root{--g:#00754a;--g2:#00a862;--bg:#03130d;--panel:#08251b;--cream:#f4efe6;--gold:#d4ad62;--line:rgba(255,255,255,.15);--muted:#b8cbc1;--danger:#d66060;--shadow:0 18px 50px rgba(0,0,0,.28)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#145d42,#061a13 42%,#020907);color:#fff;font:16px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(1120px,calc(100% - 24px));margin:auto;padding:18px 0 60px}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.logo{width:54px;height:54px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;background:var(--g);font:900 22px Georgia}.spacer{flex:1}h1{font-size:clamp(24px,4vw,38px);margin:0}h2{margin:0 0 12px;font-size:20px}p{color:var(--muted);line-height:1.5}.btn,.filter{min-height:50px;padding:0 15px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.08);color:#fff;font-weight:850;cursor:pointer}.btn.primary{border:0;background:linear-gradient(135deg,var(--g2),var(--g))}.btn.cream{background:var(--cream);color:#073421}.btn.danger{border-color:rgba(214,96,96,.4);color:#ffc1c1}.card{padding:18px;border:1px solid var(--line);border-radius:22px;background:rgba(8,37,27,.96);box-shadow:var(--shadow);margin-bottom:14px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:15px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.05)}.stat b{display:block;font-size:27px;color:#f4d992}.stat small{color:var(--muted);font-weight:800}.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:12px}.search{min-height:52px;border:1px solid var(--line);border-radius:14px;background:#0d3628;color:#fff;padding:0 14px;font:inherit}.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;min-height:46px}.filter.active{background:var(--cream);color:#073421;border-color:var(--cream)}.floor-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.field{display:grid;gap:6px;color:#cbd9d2;font-size:12px;font-weight:800}.field input,.field select{min-height:52px;border-radius:13px;border:1px solid var(--line);background:#0d3628;color:#fff;padding:0 12px;font:inherit}.floor{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.seat{min-height:130px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.055);color:#fff;padding:14px;text-align:left;cursor:pointer}.seat b{font-size:17px}.seat small{display:block;color:var(--muted);margin-top:4px}.seat-status{display:inline-block;margin-top:14px;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.04em}.seat.available .seat-status{background:rgba(0,168,98,.18);color:#aaf0cb}.seat.booked{border-color:rgba(244,200,111,.38)}.seat.booked .seat-status{background:rgba(244,200,111,.14);color:#ffe2a0}.seat.checked{border-color:rgba(0,168,98,.55);box-shadow:0 0 0 2px rgba(0,168,98,.08)}.seat.checked .seat-status{background:rgba(0,168,98,.24);color:#bff6d9}.booking{border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;background:rgba(255,255,255,.045)}.booking.highlight{border-color:#f4c86f;box-shadow:0 0 0 2px rgba(244,200,111,.12)}.booking-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}.booking h3{margin:0 0 5px;font-size:18px}.meta{color:#b8cbc1;font-size:13px;line-height:1.55}.tag{display:inline-block;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.04em}.tag.booked{background:rgba(244,200,111,.14);color:#ffe2a0}.tag.checked-in{background:rgba(0,168,98,.2);color:#aaf0cb}.tag.completed{background:rgba(120,160,255,.14);color:#cbd8ff}.tag.cancelled,.tag.no-show{background:rgba(214,96,96,.15);color:#ffc4c4}.booking-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.booking-actions .btn{min-height:48px;flex:1 1 135px}.secondary-row{display:flex;justify-content:flex-end;margin-top:8px}.remove{min-height:42px;border:0;background:transparent;color:#e8a4a4;font-weight:800;cursor:pointer}.empty{text-align:center;padding:34px;color:var(--muted)}.notice{padding:11px 13px;border-radius:13px;background:rgba(244,200,111,.08);border:1px solid rgba(244,200,111,.23);color:#dce8e1;font-size:12px;line-height:1.45}.reduce-motion *{animation:none!important;transition:none!important;scroll-behavior:auto!important}@media(max-width:760px){.summary{grid-template-columns:1fr 1fr}.floor{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.floor-controls{grid-template-columns:1fr}.spacer{display:none}header .btn{flex:1}.wrap{width:min(100% - 14px,1120px)}.card{padding:14px}.booking-actions{display:grid;grid-template-columns:1fr 1fr}.booking-actions .btn{width:100%}}@media(max-width:430px){.summary,.floor,.booking-actions{grid-template-columns:1fr}.seat{min-height:106px}}
</style>
</head>
<body>
<main class="wrap">
<header>
<div class="logo">S</div><div><h1>Study Seat Bookings</h1><p style="margin:3px 0 0">Café Floor / Study Seats • device-local demo</p></div><div class="spacer"></div>
<a class="btn" href="staff-portal.html" style="text-decoration:none;display:grid;place-items:center">← Staff Portal</a>
<button class="btn" id="motionBtn">◌ Reduce Motion</button>
<button class="btn primary" id="refresh">Refresh</button>
</header>

<section class="card"><div class="summary" id="summary"></div></section>

<section class="card">
<h2>Café Study Floor</h2>
<div class="floor-controls">
<label class="field">Date<input type="date" id="floorDate"></label>
<label class="field">Time slot<select id="floorTime"></select></label>
</div>
<div class="floor" id="floor"></div>
<p class="notice" style="margin-bottom:0">Tap a BOOKED or CHECKED IN seat to jump directly to its reservation.</p>
</section>

<section class="card">
<h2>Study-Seat Bookings</h2>
<div class="toolbar"><input class="search" id="search" type="search" placeholder="Search booking code or name" aria-label="Search booking code or name"><button class="btn" id="clearSearch">Clear</button></div>
<div class="filters" id="filters"></div>
<div id="list"></div>
</section>
</main>
<script>
const KEY='menuOrbitSeatBookings';
const TIME_SLOTS=['8:00 AM – 10:00 AM','10:30 AM – 12:30 PM','1:00 PM – 3:00 PM','3:30 PM – 5:30 PM'];
const SEATS=[{id:'SEAT 01',name:'Window Seat',note:'Power outlet'},{id:'SEAT 02',name:'Window Seat',note:'Power outlet'},{id:'SEAT 03',name:'Quiet Zone',note:'Library Seat'},{id:'SEAT 04',name:'Community Table',note:'Shared Seat'}];
const FILTERS=['ALL','TODAY','UPCOMING','CHECKED IN','COMPLETED','CANCELLED','NO SHOW'];
const ACTIVE=new Set(['BOOKED','CHECKED IN']);
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
let activeFilter='ALL';
let highlightCode='';

function normalizeSeat(raw){const s=String(raw||'').toUpperCase();if(s.includes('SEAT 01')||s.includes('WINDOW 01'))return'SEAT 01';if(s.includes('SEAT 02')||s.includes('WINDOW 02'))return'SEAT 02';if(s.includes('SEAT 03')||s.includes('LIBRARY 03'))return'SEAT 03';if(s.includes('SEAT 04')||s.includes('COMMUNITY 04'))return'SEAT 04';return String(raw||'SEAT 01')}
function normalizeBooking(b={}){const code=b.code||('SEAT-'+String(Date.now()).slice(-6));return{id:b.id||code,code,name:b.name||'Guest',seat:normalizeSeat(b.seat),date:b.date||today(),time:b.time||TIME_SLOTS[0],hours:Number(b.hours||2),status:String(b.status||'BOOKED').toUpperCase(),createdAt:b.createdAt||new Date().toISOString(),checkedInAt:b.checkedInAt||null,completedAt:b.completedAt||null}}
function getBookings(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(raw)?raw.map(normalizeBooking):[]}catch{return[]}}
function saveBookings(list){localStorage.setItem(KEY,JSON.stringify(list.map(normalizeBooking)))}
function updateBookingStatus(code,status){const all=getBookings(),b=all.find(x=>x.code===code);if(!b)return;b.status=status;if(status==='CHECKED IN')b.checkedInAt=b.checkedInAt||new Date().toISOString();if(status==='COMPLETED')b.completedAt=b.completedAt||new Date().toISOString();saveBookings(all)}
function getSeatAvailability(date,time){const all=getBookings();return SEATS.map(seat=>{const booking=all.find(b=>b.date===date&&b.time===time&&normalizeSeat(b.seat)===seat.id&&ACTIVE.has(b.status));return{...seat,booking:booking||null,status:booking?booking.status:'AVAILABLE'}})}
function statusClass(s){return String(s).toLowerCase().replace(/\s+/g,'-')}

function renderSummary(){const all=getBookings(),t=today(),todayRows=all.filter(b=>b.date===t&&!['CANCELLED','NO SHOW'].includes(b.status)),upcoming=all.filter(b=>b.date>t&&!['CANCELLED','NO SHOW','COMPLETED'].includes(b.status)),occupied=new Set(all.filter(b=>b.status==='CHECKED IN').map(b=>b.seat)).size,available=Math.max(0,4-occupied);$('#summary').innerHTML=`<div class="stat"><b>${todayRows.length}</b><small>TODAY</small></div><div class="stat"><b>${upcoming.length}</b><small>UPCOMING</small></div><div class="stat"><b>${occupied}</b><small>OCCUPIED</small></div><div class="stat"><b>${available}</b><small>AVAILABLE</small></div>`}
function renderFloor(){const date=$('#floorDate').value,time=$('#floorTime').value;$('#floor').innerHTML=getSeatAvailability(date,time).map(s=>`<button class="seat ${s.status==='AVAILABLE'?'available':s.status==='CHECKED IN'?'checked':'booked'}" data-floor-code="${s.booking?esc(s.booking.code):''}" ${s.booking?'':'disabled'}><b>${s.id}</b><small>${esc(s.name)}</small><small>${esc(s.note)}</small><span class="seat-status">${esc(s.status)}</span>${s.booking?`<small style="margin-top:8px">${esc(s.booking.name)} • ${esc(s.booking.code)}</small>`:''}</button>`).join('');document.querySelectorAll('[data-floor-code]').forEach(b=>{if(!b.dataset.floorCode)return;b.onclick=()=>openBooking(b.dataset.floorCode)})}
function matchFilter(b){const t=today();if(activeFilter==='TODAY')return b.date===t;if(activeFilter==='UPCOMING')return b.date>t&&!['CANCELLED','NO SHOW','COMPLETED'].includes(b.status);if(activeFilter==='ALL')return true;return b.status===activeFilter}
function renderFilters(){$('#filters').innerHTML=FILTERS.map(f=>`<button class="filter ${f===activeFilter?'active':''}" data-filter="${f}">${f}</button>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;highlightCode='';renderAll()})}
function actionButtons(b){if(b.status==='BOOKED')return `<button class="btn primary" data-action="CHECKED IN" data-code="${esc(b.code)}">CHECK IN</button><button class="btn danger" data-action="CANCELLED" data-code="${esc(b.code)}">CANCEL</button><button class="btn danger" data-action="NO SHOW" data-code="${esc(b.code)}">NO SHOW</button>`;if(b.status==='CHECKED IN')return `<button class="btn primary" data-action="COMPLETED" data-code="${esc(b.code)}">COMPLETE</button><button class="btn danger" data-action="CANCELLED" data-code="${esc(b.code)}">CANCEL</button>`;return ''}
function renderList(){const q=$('#search').value.trim().toLowerCase();const rows=getBookings().filter(matchFilter).filter(b=>!q||b.code.toLowerCase().includes(q)||b.name.toLowerCase().includes(q)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));$('#list').innerHTML=rows.length?rows.map(b=>`<article class="booking ${highlightCode===b.code?'highlight':''}" data-booking-code="${esc(b.code)}"><div class="booking-top"><div><h3>${esc(b.name)}</h3><div class="meta"><b>${esc(b.code)}</b><br>${esc(b.seat)} • ${esc(b.date)}<br>${esc(b.time)} • ${b.hours} hour${b.hours===1?'':'s'}</div></div><span class="tag ${statusClass(b.status)}">${esc(b.status)}</span></div><div class="booking-actions">${actionButtons(b)}</div><div class="secondary-row"><button class="remove" data-remove="${esc(b.code)}">REMOVE RECORD</button></div></article>`).join(''):'<div class="empty">No bookings match this view.</div>';document.querySelectorAll('[data-action]').forEach(btn=>btn.onclick=()=>{updateBookingStatus(btn.dataset.code,btn.dataset.action);highlightCode=btn.dataset.code;renderAll()});document.querySelectorAll('[data-remove]').forEach(btn=>btn.onclick=()=>{if(!confirm('Remove this demo booking record?'))return;saveBookings(getBookings().filter(b=>b.code!==btn.dataset.remove));highlightCode='';renderAll()});if(highlightCode){setTimeout(()=>document.querySelector(`[data-booking-code="${CSS.escape(highlightCode)}"]`)?.scrollIntoView({behavior:document.body.classList.contains('reduce-motion')?'auto':'smooth',block:'center'}),30)}}
function openBooking(code){highlightCode=code;activeFilter='ALL';$('#search').value=code;renderAll()}
function renderAll(){renderSummary();renderFilters();renderFloor();renderList()}

$('#floorDate').value=today();$('#floorTime').innerHTML=TIME_SLOTS.map(t=>`<option>${t}</option>`).join('');
$('#floorDate').onchange=renderFloor;$('#floorTime').onchange=renderFloor;
$('#search').oninput=()=>{highlightCode='';renderList()};$('#clearSearch').onclick=()=>{$('#search').value='';highlightCode='';renderList()};
$('#refresh').onclick=renderAll;$('#motionBtn').onclick=()=>{document.body.classList.toggle('reduce-motion');$('#motionBtn').textContent=document.body.classList.contains('reduce-motion')?'● Motion Reduced':'◌ Reduce Motion'};
window.addEventListener('storage',e=>{if(e.key===KEY)renderAll()});
renderAll();
</script>
</body>
</html>
