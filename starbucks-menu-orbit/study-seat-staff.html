<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Seat Bookings — Menu Orbit</title><style>
:root{--g:#00754a;--g2:#00a862;--bg:#03130d;--panel:#08251b;--cream:#f4efe6;--line:rgba(255,255,255,.15);--muted:#b8cbc1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#145d42,#061a13 42%,#020907);color:#fff;font:16px Inter,system-ui,sans-serif}.wrap{width:min(980px,calc(100% - 24px));margin:auto;padding:22px 0 56px}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.logo{width:52px;height:52px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;background:var(--g);font:900 22px Georgia}.spacer{flex:1}h1{font-size:clamp(24px,4vw,38px);margin:0}p{color:var(--muted);line-height:1.5}.btn{min-height:48px;padding:0 15px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.08);color:#fff;font-weight:800;cursor:pointer}.btn.primary{border:0;background:linear-gradient(135deg,var(--g2),var(--g))}.card{padding:20px;border:1px solid var(--line);border-radius:22px;background:rgba(8,37,27,.96);box-shadow:0 18px 50px rgba(0,0,0,.28)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{padding:16px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.05)}.stat b{display:block;font-size:26px;color:#f4d992}.stat small{color:var(--muted)}.row{display:grid;grid-template-columns:1.1fr 1fr 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.tag{display:inline-block;padding:6px 9px;border-radius:99px;background:rgba(0,168,98,.2);color:#aaf0cb;font-size:12px;font-weight:800}.empty{text-align:center;padding:38px;color:var(--muted)}@media(max-width:650px){.summary{grid-template-columns:1fr}.row{grid-template-columns:1fr;gap:5px}.spacer{display:none}header .btn{flex:1}}
</style></head><body><main class="wrap"><header><div class="logo">S</div><div><h1>Study Seat Bookings</h1><p style="margin:3px 0 0">Staff view • device-local demo data</p></div><div class="spacer"></div><a class="btn" href="staff-portal.html" style="text-decoration:none;display:grid;place-items:center">← Staff Portal</a><button class="btn primary" id="refresh">Refresh</button></header><section class="card"><div class="summary" id="summary"></div><div id="list"></div></section></main><script>
const key='menuOrbitSeatBookings';const $=s=>document.querySelector(s);function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const all=JSON.parse(localStorage.getItem(key)||'[]').sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));const today=new Date().toISOString().slice(0,10),todayRows=all.filter(x=>x.date===today),seats=new Set(all.map(x=>x.seat));$('#summary').innerHTML=`<div class="stat"><b>${all.length}</b><small>Saved bookings</small></div><div class="stat"><b>${todayRows.length}</b><small>Today</small></div><div class="stat"><b>${seats.size}</b><small>Seats in use</small></div>`;$('#list').innerHTML=all.length?`<h2 style="margin:4px 0 10px">Reservations</h2>${all.map(x=>`<article class="row"><div><b>${esc(x.name||'Guest')}</b><br><small>${esc(x.code)}</small></div><div>${esc(x.seat)}<br><small>${esc(x.date)} • ${esc(x.time)}</small></div><div><span class="tag">${esc(x.status||'BOOKED')}</span><br><small>${x.hours||2} hours</small></div><button class="btn" data-remove="${esc(x.code)}">Remove</button></article>`).join('')}`:'<div class="empty">No study-seat bookings on this device yet.</div>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const updated=JSON.parse(localStorage.getItem(key)||'[]').filter(x=>x.code!==b.dataset.remove);localStorage.setItem(key,JSON.stringify(updated));render()})}$('#refresh').onclick=render;render();
</script></body></html>
