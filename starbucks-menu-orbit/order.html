<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071c14">
<title>Menu Orbit — Pickup Ordering</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#04140e;color:#fff}iframe{border:0;width:100%;height:100%;display:block}.bar{position:fixed;z-index:20;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:center}.btn{min-height:54px;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:0 18px;background:#00754a;color:#fff;font-weight:900;box-shadow:0 14px 40px rgba(0,0,0,.35)}.staff{background:#08251b}.count{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:99px;background:#f4efe6;color:#06331f;margin-left:6px}.modal{display:none;position:fixed;z-index:50;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);padding:14px;align-items:center;justify-content:center}.modal.open{display:flex}.card{width:min(620px,100%);max-height:92vh;overflow:auto;background:#08251b;border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.45)}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.head h1{font-size:24px;margin:0}.close{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;font-size:24px}.item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.1)}.item small{display:block;color:#aec1b8;margin-top:4px}.total{display:flex;justify-content:space-between;font-size:22px;font-weight:900;padding:18px 0;color:#f2cf8b}.form{display:grid;gap:11px}.form label{font-weight:800;font-size:13px}.form input,.form select{width:100%;height:54px;margin-top:6px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:#0d3628;color:#fff;padding:0 13px;font-size:16px}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.times button{min-height:48px;border:1px solid rgba(255,255,255,.14);border-radius:13px;background:rgba(255,255,255,.06);color:#fff;font-weight:800}.times button.active{background:#f4efe6;color:#073421}.submit{width:100%;min-height:58px;border:0;border-radius:16px;background:linear-gradient(135deg,#00a862,#00754a);color:#fff;font-size:17px;font-weight:950}.note{font-size:12px;line-height:1.5;color:#b7c9c0}.success{text-align:center;padding:12px 4px}.ref{font-size:30px;font-weight:950;letter-spacing:.08em;color:#f2cf8b;margin:12px 0}.empty{text-align:center;color:#abc0b6;padding:38px 8px}@media(max-width:560px){.bar{width:calc(100% - 18px)}.btn{flex:1;padding:0 12px}.times{grid-template-columns:1fr}.card{padding:15px}}
</style>
</head>
<body>
<iframe id="orbit" src="index.html" title="Menu Orbit"></iframe>
<div class="bar"><button class="btn" id="checkoutBtn">🛒 Pickup Checkout <span class="count" id="count">0</span></button><button class="btn staff" id="staffBtn">Staff</button></div>
<div class="modal" id="modal"><div class="card" id="content"></div></div>
<script src="config.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/+esm";
const cfg=window.MENU_ORBIT_CONFIG||{},db=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),$=s=>document.querySelector(s),money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{maximumFractionDigits:0});
let pickupMinutes=20;
const cart=()=>{try{return JSON.parse(localStorage.getItem('menuOrbitCart')||'[]')}catch{return[]}};
function refresh(){const items=cart();$('#count').textContent=items.reduce((a,x)=>a+Number(x.qty||1),0)}
setInterval(refresh,900);refresh();
$('#staffBtn').onclick=()=>location.href='staff.html';$('#checkoutBtn').onclick=openCheckout;$('#modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')};
function openCheckout(){const items=cart(),total=items.reduce((a,x)=>a+Number(x.price||0)*Number(x.qty||1),0),branches=cfg.branches?.length?cfg.branches:['Demo Pickup Branch'];$('#content').innerHTML=`<div class="head"><h1>Pickup Order</h1><button class="close" id="close">×</button></div>${items.length?items.map(x=>`<div class="item"><div><b>${x.qty||1}× ${x.name}</b><small>${[x.size,x.style,x.milk].filter(Boolean).join(' • ')}</small></div><b>${money(Number(x.price||0)*Number(x.qty||1))}</b></div>`).join(''):'<div class="empty">Add products inside Menu Orbit first.</div>'}<div class="total"><span>Total</span><span>${money(total)}</span></div>${items.length?`<form class="form" id="form"><label>Name<input id="name" autocomplete="name" required placeholder="Your name"></label><label>Mobile number<input id="phone" autocomplete="tel" inputmode="tel" required placeholder="09XX XXX XXXX"></label><label>Pickup branch<select id="branch">${branches.map(b=>`<option>${b}</option>`).join('')}</select></label><label>Pickup time<div class="times"><button type="button" class="active" data-min="20">ASAP • 20 min</button><button type="button" data-min="30">30 min</button><button type="button" data-min="45">45 min</button></div></label><p class="note">Pay at Store. This is an unofficial Menu Orbit prototype; the demo branch does not submit an order to Starbucks.</p><button class="submit" id="submit" type="submit">Place Pickup Order</button></form>`:''}`;$('#modal').classList.add('open');$('#close').onclick=()=>$('#modal').classList.remove('open');document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{pickupMinutes=Number(b.dataset.min);document.querySelectorAll('[data-min]').forEach(x=>x.classList.toggle('active',x===b))});if($('#form'))$('#form').onsubmit=placeOrder}
async function placeOrder(e){e.preventDefault();const button=$('#submit'),items=cart();button.disabled=true;button.textContent='Sending…';const payload={customer_name:$('#name').value.trim(),customer_phone:$('#phone').value.trim(),branch:$('#branch').value,pickup_minutes:pickupMinutes,items:items.map(x=>({product_id:String(x.id),quantity:Number(x.qty||1),size:x.size,style:x.style,milk:x.milk||'',shots:x.shots||'',whip:!!x.whip,drizzle:!!x.drizzle,client_unit_price:Number(x.price||0)}))};try{const {data,error}=await db.functions.invoke('place-order',{body:payload});if(error)throw error;if(data?.error)throw new Error(data.error);localStorage.removeItem('menuOrbitCart');$('#orbit').contentWindow.location.reload();refresh();$('#content').innerHTML=`<div class="head"><h1>Order Sent</h1><button class="close" id="close">×</button></div><div class="success"><div style="font-size:52px">✓</div><p>Your test pickup order is now in the Menu Orbit database.</p><div class="ref">${data.order_ref}</div><p><b>${data.branch}</b><br>${money(data.total_amount)} • Pay at Store</p><p class="note">Keep this order number for pickup testing.</p></div>`;$('#close').onclick=()=>$('#modal').classList.remove('open')}catch(err){console.error(err);alert('Order could not be sent. Please check the details and try again.');button.disabled=false;button.textContent='Place Pickup Order'}}
</script>
</body></html>
