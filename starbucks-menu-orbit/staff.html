 input{width:100%;height:56px;border:1px solid var(--line);border-radius:14px;background:#0d3628;color:#fff;padding:0 14px;margin:7px 0}.demo{margin:13px 0;padding:13px;border:1px solid rgba(244,200,111,.38);border-radius:15px;background:rgba(244,200,111,.09);color:#ffe6a8}.cred{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:8px;padding:10px;border-radius:12px;background:rgba(255,255,255,.06)}.cred code{font-weight:900;overflow-wrap:anywhere}.copy{min-height:42px;border:0;border-radius:10px;background:var(--cream);color:#073421;font-weight:900;padding:0 12px}.login-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.notice{color:#adc5b9;font-size:12px;line-height:1.5}.error{color:#ffb2b2}.staffbar{display:grid;grid-template-columns:1.25fr .8fr .8fr auto;gap:9px;margin:12px 0}.staffbox{background:rgba(8,37,27,.95);border:1px solid var(--line);border-radius:16px;padding:12px}.staffbox b{display:block;font-size:15px}.staffbox span{display:block;margin-top:2px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:10px 0}.stat{background:rgba(8,37,27,.95);border:1px solid var(--line);border-radius:17px;padding:13px}.stat b{display:block;font-size:26px;color:#f2cf8b}.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:10px 0}.nav button{min-height:74px;border:1px solid var(--line);border-radius:18px;background:rgba(8,37,27,.95);color:#fff;font-weight:950;padding:8px}.nav button small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.nav button.active{background:var(--cream);color:#073421}.nav button.active small{color:#46685a}.secondary{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 13px}.secondary button{min-height:45px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.0 <body>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">S</div><div><h1>Barista / Service Crew</h1><p class="sub">Menu Orbit Branch Operations</p></div></div><div class="spacer"></div><div class="connection reconnecting" id="conn"><span class="dot"></span><span id="connText">RECONNECTING</span></div><button class="btn" id="muteBtn">🔔 Sound On</button><button class="btn" id="motionBtn">◌ Reduce Motion</button><button class="btn" id="menuBtn">← Customer Menu</button><button class="btn danger" id="signOutBtn" hidden>Sign Out</button></header>
<main id="app"></main>
</div>
<div class="undo" id="undoBar"><span id="undoText">Action completed</span><button id="undoBtn">UNDO</button></div>
<div class="modal" id="problemModal"><div class="modal-card"><div class="modal-head"><h2>Problem / Cancel Order</h2><button class="close" data-close>×</button></div><div class="form"><label>Reason<select id="problemReason"><option>Product sold out</option><option>Ingredient unavailable</option><option>Machine issue</option><option>Customer requested change</option><option>Duplicate order</option><option>Customer no-show</option><option>Payment issue</option><option>Other</option></select></label><label>Note<textarea id="problemNote" placeholder="Add details. Required for Other."></textarea></label><button class="btn primary" id="saveProblem">Save Problem Order</button><button class="btn danger" id="cancelOrderBtn">Cancel Order</button><button class="btn" id="managerBtn">Escalate to Manager</button></div></div></div>
<div class="modal" id="subModal"><div class="modal-card"><div class="modal-head"><h2>Suggest Substitute</h2><button class="close" data-close>×</button></div><div class="form"><label>Unavailable item<input id="subFrom" readonly></label><label>Suggested replacement<select id="subTo"><option>Whole Milk</option><option>Soy Milk</option><option>Almond Milk</option><option>Oat Milk</option><option>Similar available product</option></select></label><p class="notice">This suggestion does not change the customer order automatically. Customer confirmation is required.</p><button class="btn primary" id="saveSub">Save Suggestion</button></div></div></div>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/+esm';
const cfg=window.MENU_ORBIT_CONFIG||{},app=document.querySelector('#app'),signOut=document.querySelector('#signOutBtn');

function renderOrders(area){let list=orders.filter(o=>view==='new'?['new','confirmed'].includes(o.status):o.status===view);if(search)list=list.filter(o=>(o.order_ref+' '+(o.customer_name||'')).toLowerCase().includes(search.toLowerCase()));area.innerHTML=`<div class="toolbar"><input class="search" id="search" placeholder="Search order number or customer" value="${esc(search)}"><button class="btn" id="clear">Clear</button></div>${list.length?list.map(orderCard).join(''):'<div class="empty">No orders in this section.</div>'}`;document.querySelector('#search').oninput=e=>{search=e.target.value;renderOrders(area)};document.querySelector('#clear').onclick=()=>{search='';renderOrders(area)};wireOrders()}
function priorityBadge(o){const p=o.priority|| (delayed(o)?'delayed':'normal');if(p==='accessibility')return '<span class="badge access">♿ Accessibility Assistance</span>';if(p==='urgent')return '<span class="badge priority">⚡ Urgent</span>';if(p==='delayed'||delayed(o))return '<span class="badge delay">Delayed</span>';return '<span class="badge priority">Normal</span>'}
function orderCard(o){const total=(o.order_items||[]).length,done=doneCount(o),wait=age(o.created_at),prepStart=(o.order_items||[]).find(i=>i.started_at)?.started_at,prepMins=prepStart?age(prepStart):0;let main='';if(view==='new')main=`<button class="go" data-order-status="preparing" data-id="${o.id}">☕ Start Preparing</button>`;if(view==='preparing')main=`<button class="ready" data-order-status="ready" data-id="${o.id}" ${allDone(o)?'':'disabled'}>✓ Mark Order Ready</button>`;if(view==='ready')main=`<div class="verifybox"><b>VERIFY CUSTOMER</b><p class="notice">Use order number or 4-digit pickup PIN. QR verification can be connected when scanner support is available.</p><input data-verify-input="${o.id}" placeholder="Order # or PIN"><button class="btn primary" data-verify="${o.id}">Verify Customer</button><span id="verify-${o.id}"></span></div><button class="ready" data-release="${o.id}" disabled id="release-${o.id}">✓ Release Order</button>`;return `<article class="card order"><div class="order-top"><div><div class="ref">${esc(o.order_ref)}</div><div class="meta"><b>${esc(o.customer_name||'Customer')}</b> • ${esc(o.customer_phone||'')}<br>${esc(o.branch||profile.branch_name)} • Estimated pickup ${time(o.pickup_time)}</div><div class="badges"><span class="badge status">${esc(o.status)}</span>${priorityBadge(o)}<span class="badge ${delayed(o)?'delay':''}">⏱ Waiting ${wait} min${delayed(o)?' — DELAYED':''}</span>${o.status==='preparing'?`<span class="badge">Prep ${prepMins} min</span>`:''}</div></div><div><b style="font-size:21px;color:#f2cf8b">${money(o.total_amount)}</b></div></div><div class="progress"><span>Preparation progress</span><b>${done} of ${total} items completed</b></div><div class="tickets">${(o.order_items||[]).map(i=>ticket(o,i)).join('')}</div><div class="actions">${main}<button class="problem" data-problem="${o.id}">Problem / Cancel</button><button data-manager="${o.id}">Escalate to Manager</button></div></article>`}
function ticket(o,i){const status=i.prep_status||'pending',details=[i.size,i.style,i.milk,i.sugar_level&&'Sugar: '+i.sugar_level,i.ice_level&&'Ice: '+i.ice_level,i.addons&&'Add-ons: '+i.addons].filter(Boolean).map(esc).join(' • ');return `<div class="ticket ${status==='done'?'done':status==='started'?'started':''}"><h3>${i.quantity||1}× ${esc(i.product_name)}</h3><div class="details">${details||'Standard preparation'}</div>${i.note?`<div class="special"><b>Special request:</b> ${esc(i.note)}</div>`:''}${i.allergy_note?`<div class="special"><b>Allergy / dietary note:</b> ${esc(i.allergy_note)}</div>`:''}<div class="ticket-actions">${status==='pending'?`<button class="start" data-item-start="${i.id}" data-order="${o.id}">START ITEM</button>`:''}${status==='started'?`<button class="donebtn" data-item-done="${i.id}" data-order="${o.id}">MARK ITEM DONE</button>`:''}${status==='done'?'<button disabled>✓ ITEM DONE</button>':''}<button data-substitute="${i.id}" data-order="${o.id}">Suggest Substitute</button></div></div>`}
function wireOrders(){document.querySelectorAll('[data-order-status]').forEach(b=>b.onclick=()=>changeOrderStatus(b.dataset.id,b.dataset.orderStatus));document.querySelectorAll('[data-item-start]').forEach(b=>b.onclick=()=>changeItem(b.dataset.order,b.dataset.itemStart,'started'));document.querySelectorAll('[data-item-done]').forEach(b=>b.onclick=()=>changeItem(b.dataset.order,b.dataset.itemDone,'done'));document.querySelectorAll('[data-problem]').forEach(b=>b.onclick=()=>openProblem(b.dataset.problem));document.querySelectorAll('[data-manager]').forEach(b=>b.onclick=()=>escalate(b.dataset.manager));document.querySelectorAll('[data-substitute]').forEach(b=>b.onclick=()=>openSub(b.dataset.order,b.dataset.substitute));document.querySelectorAll('[data-verify]').forEach(b=>b.onclick=()=>verifyOrder(b.dataset.verify));document.querySelectorAll('[data-release]').forEach(b=>b.onclick=()=>changeOrderStatus(b.dataset.release,'released'))}
async function changeItem(orderId,itemId,status){const o=orders.find(x=>String(x.id)===String(orderId)),i=o?.order_items?.find(x=>String(x.id)===String(itemId));if(!i)return;const prev=i.prep_status||'pending',oldStarted=i.started_at,oldDone=i.completed_at;i.prep_status=status;if(status==='started')i.started_at=nowISO();if(status==='done')i.completed_at=nowISO();if(o.status==='new'||o.status==='confirmed')o.status='preparing';render();await auditWrite(status==='started'?'START ITEM':'COMPLETE ITEM',o,prev,status,i.product_name);if(!demo&&db){const payload={prep_status:status};if(status==='started')payload.started_at=i.started_at;if(status==='done')payload.completed_at=i.completed_at;const {error}=await db.from('order_items').update(payload).eq('id',itemId);if(error){i.prep_status=prev;i.started_at=oldStarted;i.completed_at=oldDone;alert('Item status could not be saved: '+error.message);render();return}if(status==='done')decrementInventoryForItem(i)}showUndo(`${i.product_name}: ${status}`,async()=>{i.prep_status=prev;i.started_at=oldStarted;i.completed_at=oldDone;if(!demo&&db)await db.from('order_items').update({prep_status:prev,started_at:oldStarted,completed_at:oldDone}).eq('id',itemId);render()})}
async function decrementInventoryForItem(i){if(demo||!db)return;/* Real ingredient deduction should use authorized recipe/inventory tables or a transaction/RPC. Never guess consumption quantities here. */}
async function changeOrderStatus(id,status){const o=orders.find(x=>String(x.id)===String(id));if(!o)return;if(status==='ready'&&!allDone(o))return alert('All order items must be completed before marking this order READY.');if(status==='released'&&!o._verified)return alert('Verify the customer before releasing this order.');const prev=o.status;o.status=status;render();await auditWrite('ORDER STATUS',o,prev,status);if(!demo&&db){const {error}=await db.from('orders').update({status,updated_at:nowISO()}).eq('id',o.id);if(error){o.status=prev;alert(error.message);render();return}}showUndo(`${o.order_ref}: ${status}`,async()=>{o.status=prev;if(!demo&&db)await db.from('orders').update({status:prev,updated_at:nowISO()}).eq('id',o.id);await auditWrite('UNDO ORDER STATUS',o,status,prev);render()})}
function verifyOrder(id){const o=orders.find(x=>String(x.id)===String(id)),v=document.querySelector(`[data-verify-input="${id}"]`)?.value.trim();if(!o||!v)return;const ok=v.toLowerCase()===String(o.order_ref).toLowerCase()||v===String(o.pickup_pin||'');const msg=document.querySelector('#verify-'+id);if(ok){o._verified=true;msg.innerHTML='<span class="badge status">✓ VERIFIED</span>';document.querySelector('#release-'+id).disabled=false;auditWrite('VERIFY CUSTOMER',o,o.status,o.status)}else msg.innerHTML='<span class="badge delay">Verification failed</span>'}
function openProblem(id){currentProblem=orders.find(x=>String(x.id)===String(id));document.querySelector('#problemModal').classList.add('open');document.querySelector('#problemNote').value=''}
document.querySelector('#saveProblem').onclick=async()=>{if(!currentProblem)return;const reason=document.querySelector('#problemReason').value,note=document.querySelector('#problemNote').value.trim();if(reason==='Other'&&!note)return alert('Please add a note for Other.');const prev=currentProblem.status;currentProblem.status='problem';problems.unshift({order_ref:currentProblem.order_ref,reason,note,created_at:nowISO()});document.querySelector('#problemModal').classList.remove('open');await auditWrite('PROBLEM ORDER',currentProblem,prev,'problem',reason+(note?' — '+note:''));if(!demo&&db){const {error}=await db.from('orders').update({status:'problem',problem_reason:reason,problem_note:note,updated_at:nowISO()}).eq('id',currentProblem.id);if(error)alert('Problem reason was not saved to the live order schema: '+error.message)}render()};
document.querySelector('#cancelOrderBtn').onclick=async()=>{if(!currentProblem)return;const reason=document.querySelector('#problemReason').value,note=document.querySelector('#problemNote').value.trim();if(!confirm('Cancel this order?'))return;document.querySelector('#problemModal').classList.remove('open');await changeOrderStatus(currentProblem.id,'cancelled');problems.unshift({order_ref:currentProblem.order_ref,reason,note,created_at:nowISO()})};
document.querySelector('#managerBtn').onclick=()=>{if(currentProblem){escalate(currentProblem.id);document.querySelector('#problemModal').classList.remove('open')}};
function escalate(id){const o=orders.find(x=>String(x.id)===String(id));if(!o)return;auditWrite('ESCALATE TO MANAGER',o,o.status,o.status,'Manager review requested');alert(`Manager escalation recorded for ${o.order_ref}. In live mode this should route to an authorized manager workflow.`);render()}
function openSub(orderId,itemId){const o=orders.find(x=>String(x.id)===String(orderId)),i=o?.order_items?.find(x=>String(x.id)===String(itemId));if(!i)return;currentSub={o,i};document.querySelector('#subFrom').value=i.milk||i.product_name;document.querySelector('#subModal').classList.add('open')}
document.querySelector('#saveSub').onclick=()=>{if(!currentSub)return;const to=document.querySelector('#subTo').value;currentSub.i.substitution_suggestion=to;auditWrite('SUGGEST SUBSTITUTE',currentSub.o,currentSub.o.status,currentSub.o.status,`${currentSub.i.product_name} → ${to}; customer confirmation required`);document.querySelector('#subModal').classList.remove('open');alert('Substitution suggestion saved. Customer confirmation is still required.');render()};
function renderInventory(area){const filtered=inventory.filter(x=>x.category===inventoryTab);area.innerHTML=`<div class="inventory-tabs">${['products','ingredients','packaging'].map(x=>`<button class="${inventoryTab===x?'active':''}" data-invtab="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><div class="inventory">${filtered.length?filtered.map(stockCard).join(''):'<div class="empty">No inventory in this category.</div>'}</div>`;document.querySelectorAll('[data-invtab]').forEach(b=>b.onclick=()=>{inventoryTab=b.dataset.invtab;render()});document.querySelectorAll('[data-stock]').forEach(b=>b.onclick=()=>updateStock(b.dataset.id,b.dataset.stock));document.querySelectorAll('[data-threshold]').forEach(i=>i.onchange=()=>updateThreshold(i.dataset.threshold,Number(i.value)))}
function stockCard(x){return `<article class="stock"><h3>${esc(x.product_name)}</h3><div class="stock-meta">Quantity: <b>${Number.isFinite(x.quantity)?x.quantity:'—'}</b><br>Status: <b>${esc(x.availability.replace('_',' '))}</b></div><div class="threshold"><span>Low-stock threshold</span><input type="number" min="0" value="${x.threshold||0}" data-threshold="${x.id}"></div><div class="stock-actions">${['available','low','sold_out'].map(s=>`<button class="${x.availability===s?'on':''}" data-id="${x.id}" data-stock="${s}">${s.replace('_',' ')}</button>`).join('')}</div></article>`}
async function updateStock(id,status){const x=inventory.find(y=>String(y.id)===String(id));if(!x)return;const prev=x.availability;if(status==='sold_out'&&!confirm(`Mark ${x.product_name} SOLD OUT?`))return;x.availability=status;render();await auditWrite('INVENTORY STATUS',{id:null,order_ref:x.product_name},prev,status);if(!demo&&db){const {error}=await db.from('branch_inventory').update({availability:status}).eq('id',id);if(error){x.availability=prev;alert(error.message);render();return}}showUndo(`${x.product_name}: ${status}`,async()=>{x.availability=prev;if(!demo&&db)await db.from('branch_inventory').update({availability:prev}).eq('id',id);render()})}
async function updateThreshold(id,val){const x=inventory.find(y=>String(y.id)===String(id));if(!x)return;const prev=x.threshold;x.threshold=Math.max(0,val||0);if(!demo&&db){const {error}=await db.from('branch_inventory').update({low_stock_threshold:x.threshold}).eq('id',id);if(error){x.threshold=prev;alert('Threshold could not be saved: '+error.message);render()}}}
function renderKitchen(area){const list=orders.filter(o=>['new','confirmed','preparing','ready'].includes(o.status));area.innerHTML=`<div class="kitchen">${list.map(o=>`<article class="card"><div class="ref">${esc(o.order_ref)}</div><div class="badges"><span class="badge status">${esc(o.status)}</span><span class="badge ${delayed(o)?'delay':''}">⏱ ${age(o.created_at)} min</span></div>${(o.order_items||[]).map(i=>`<div class="itemline">${i.quantity||1}× ${esc(i.product_name)} ${i.note?`<div class="note">${esc(i.note)}</div>`:''}</div>`).join('')}</article>`).join('')||'<div class="empty">No active tickets.</div>'}</div>`}
function renderHandover(area){const pending=orders.filter(o=>['new','confirmed','preparing'].includes(o.status)),ready=orders.filter(o=>o.status==='ready'),low=inventory.filter(x=>x.availability==='low'),sold=inventory.filter(x=>x.availability==='sold_out');area.innerHTML=`<div class="panel-grid"><section class="card"><h2>Pending Orders</h2><div class="list">${pending.map(o=>`<div class="row"><b>${esc(o.order_ref)}</b><small>${esc(o.status)} • ${age(o.created_at)} min</small></div>`).join('')||'<div class="empty">None</div>'}</div></section><section class="card"><h2>Delayed Orders</h2><div class="list">${orders.filter(delayed).map(o=>`<div class="row"><b>${esc(o.order_ref)}</b><small>${age(o.created_at)} min waiting</small></div>`).join('')||'<div class="empty">None</div>'}</div></section><section class="card"><h2>Ready but Unclaimed</h2><div class="list">${ready.map(o=>`<div class="row"><b>${esc(o.order_ref)}</b><small>Ready for verification</small></div>`).join('')||'<div class="empty">None</div>'}</div></section><section class="card"><h2>Stock Issues</h2><div class="list">${[...low,...sold].map(x=>`<div class="row"><b>${esc(x.product_name)}</b><small>${esc(x.availability.replace('_',' '))}</small></div>`).join('')||'<div class="empty">None</div>'}</div></section><section class="card"><h2>Open Problem Orders</h2><div class="list">${problems.map(p=>`<div class="row"><b>${esc(p.order_ref)}</b><small>${esc(p.reason)}</small></div>`).join('')||'<div class="empty">None</div>'}</div></section></div>`}
function renderSummary(area){const released=orders.filter(o=>['released','completed'].includes(o.status)),cancelled=orders.filter(o=>o.status==='cancelled'),prepDurations=[];orders.forEach(o=>(o.order_items||[]).forEach(i=>{if(i.started_at&&i.completed_at)prepDurations.push((new Date(i.completed_at)-new Date(i.started_at))/60000)}));const avg=prepDurations.length?(prepDurations.reduce((a,b)=>a+b,0)/prepDurations.length).toFixed(1):'—';area.innerHTML=`<section class="stats"><div class="stat"><b>${orders.filter(o=>['preparing','ready','released','completed'].includes(o.status)).length}</b><span>Orders Prepared</span></div><div class="stat"><b>${released.length}</b><span>Released</span></div><div class="stat"><b>${avg}</b><span>Avg Prep Min</span></div><div class="stat"><b>${orders.filter(delayed).length}</b><span>Delayed</span></div><div class="stat"><b>${cancelled.length}</b><span>Cancelled</span></div></section><p class="notice">Live analytics are calculated only from data actually loaded for this authorized branch. Missing timestamps are not fabricated.</p>`}
function renderAudit(area){area.innerHTML=`<section class="card"><h2>Audit Log</h2><div class="list">${audit.map(a=>`<div class="row"><b>${esc(a.staff)} — ${esc(a.action)}</b><small>${esc(a.order_ref)} • ${esc(a.previous_status||'')} → ${esc(a.new_status||'')} • ${new Date(a.created_at).toLocaleString('en-PH')} • ${esc(a.branch)}${a.note?' • '+esc(a.note):''}</small></div>`).join('')||'<div class="empty">No actions recorded in this session.</div>'}</div></section>`}
if(!db)loginScreen();else init();
</script>
</body>
</html>
