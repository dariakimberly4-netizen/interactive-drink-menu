<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071c14">
  <title>Menu Orbit — Staff Orders</title>
  <style>
    :root{--green:#00754a;--green2:#00a862;--ink:#04140e;--cream:#f4efe6;--gold:#d4ad62;--line:rgba(255,255,255,.14);--panel:#08251b}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#145d42,#061a13 42%,#020907);color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.wrap{width:min(1100px,calc(100% - 24px));margin:auto;padding:18px 0 50px}header{display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:4;padding:12px 0;background:rgba(4,20,14,.92);backdrop-filter:blur(14px)}header h1{font-size:clamp(22px,4vw,34px);margin:0}header p{margin:2px 0 0;color:#abc0b6}.spacer{flex:1}.btn{min-height:50px;border:1px solid var(--line);border-radius:14px;padding:0 16px;background:rgba(255,255,255,.08);color:#fff;font-weight:850}.btn.primary{background:linear-gradient(135deg,var(--green2),var(--green));border:0}.card{background:rgba(8,37,27,.94);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 18px 50px rgba(0,0,0,.25)}.login{width:min(520px,100%);margin:10vh auto 0}.login input{width:100%;height:56px;border:1px solid var(--line);border-radius:14px;background:#0d3628;color:#fff;padding:0 14px;font-size:16px;margin:10px 0}.notice{color:#adc5b9;font-size:13px;line-height:1.5}.error{color:#ffb2b2}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.chip{min-height:46px;border:1px solid var(--line);border-radius:999px;padding:0 15px;background:rgba(255,255,255,.06);color:#fff;font-weight:800}.chip.active{background:var(--cream);color:#073421}.order{display:grid;grid-template-columns:1fr auto;gap:14px}.order h2{margin:0;font-size:22px}.meta{color:#b8cdc3;font-size:13px;line-height:1.55;margin-top:6px}.amount{font-size:22px;color:#f2cf8b;font-weight:950;text-align:right}.status{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:999px;background:rgba(0,168,98,.14);border:1px solid rgba(0,168,98,.32);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.items{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}.item{display:flex;justify-content:space-between;gap:12px;padding:8px 0;color:#e8f0ec}.item small{display:block;color:#9fb4aa;margin-top:3px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.actions button{min-height:46px;border-radius:12px;border:1px solid var(--line);padding:0 12px;background:rgba(255,255,255,.06);color:#fff;font-weight:850}.actions button.selected{background:var(--cream);color:#06331f}.empty{text-align:center;color:#a8bbb2;padding:54px 10px}.backend{border-color:rgba(242,207,139,.4);color:#f7dfab}@media(max-width:640px){.wrap{width:min(100% - 16px,1100px)}header{align-items:flex-start;flex-wrap:wrap}.order{grid-template-columns:1fr}.amount{text-align:left}.btn{min-height:54px}.chip{min-height:50px}.actions button{flex:1 1 45%}}
  </style>
</head>
<body>
  <div class="wrap">
    <header><div><h1>Menu Orbit Staff</h1><p>Pickup order dashboard</p></div><div class="spacer"></div><button class="btn" id="backBtn">← Menu</button><button class="btn" id="signOutBtn" hidden>Sign out</button></header>
    <main id="app"></main>
  </div>
  <script src="config.js"></script>
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/+esm";
    const cfg=window.MENU_ORBIT_CONFIG||{},app=document.querySelector('#app'),signOut=document.querySelector('#signOutBtn');
    const db=(cfg.supabaseUrl&&cfg.supabasePublishableKey)?createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;
    const money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{maximumFractionDigits:0});
    const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    let filter='active';
    document.querySelector('#backBtn').onclick=()=>location.href='index.html';
    if(!db){app.innerHTML='<section class="card login backend"><h2>Backend not connected</h2><p>The staff dashboard is installed, but it needs the Menu Orbit Supabase project URL and publishable key in <b>config.js</b>.</p></section>';}
    else init();
    async function init(){const {data:{session}}=await db.auth.getSession();if(!session)return renderLogin();signOut.hidden=false;signOut.onclick=async()=>{await db.auth.signOut();location.reload()};renderDashboard();}
    function renderLogin(){signOut.hidden=true;app.innerHTML=`<section class="card login"><h2>Staff sign in</h2><p class="notice">Use your approved staff email and password.</p><form id="loginForm"><input id="staffEmail" type="email" autocomplete="username" required placeholder="staff@example.com"><input id="staffPassword" type="password" autocomplete="current-password" required placeholder="Password"><button class="btn primary" style="width:100%" type="submit">Sign In</button></form><p class="notice" id="loginMsg"></p></section>`;document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();const email=document.querySelector('#staffEmail').value.trim(),password=document.querySelector('#staffPassword').value,msg=document.querySelector('#loginMsg');msg.textContent='Signing in…';const {error}=await db.auth.signInWithPassword({email,password});if(error){msg.textContent=error.message;msg.className='notice error';return}location.reload()}}
    async function renderDashboard(){app.innerHTML=`<div class="toolbar"><button class="chip active" data-filter="active">Active</button><button class="chip" data-filter="new">New</button><button class="chip" data-filter="preparing">Preparing</button><button class="chip" data-filter="ready">Ready</button><button class="chip" data-filter="completed">Completed</button><button class="chip" id="refreshBtn">↻ Refresh</button></div><div id="orders"><div class="empty">Loading orders…</div></div>`;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));loadOrders()});document.querySelector('#refreshBtn').onclick=loadOrders;await loadOrders();db.channel('menu-orbit-orders').on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>loadOrders()).subscribe();}
    async function loadOrders(){const out=document.querySelector('#orders');let q=db.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}).limit(100);if(filter==='active')q=q.in('status',['new','confirmed','preparing','ready']);else q=q.eq('status',filter);const {data,error}=await q;if(error){out.innerHTML=`<section class="card"><p class="error">${esc(error.message)}</p><p class="notice">Make sure this signed-in account is listed in staff_users.</p></section>`;return}out.innerHTML=data?.length?data.map(orderCard).join(''):'<div class="empty">No orders in this view.</div>';document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>updateStatus(b.dataset.order,b.dataset.status));}
    function orderCard(o){const when=o.pickup_time?new Date(o.pickup_time).toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'}):'ASAP',items=(o.order_items||[]).map(i=>`<div class="item"><div><b>${i.quantity}× ${esc(i.product_name)}</b><small>${[i.size,i.style,i.milk].filter(Boolean).map(esc).join(' • ')}</small></div><b>${money(i.unit_price*i.quantity)}</b></div>`).join('');return `<section class="card"><div class="order"><div><h2>${esc(o.order_ref)}</h2><div class="meta"><b>${esc(o.customer_name)}</b> • ${esc(o.customer_phone)}<br>${esc(o.branch)} • Pickup ${when}</div><span class="status">${esc(o.status)}</span></div><div class="amount">${money(o.total_amount)}<div class="meta">Pay at Store</div></div></div><div class="items">${items||'<span class="notice">No item details.</span>'}</div><div class="actions">${['confirmed','preparing','ready','completed','cancelled'].map(s=>`<button class="${o.status===s?'selected':''}" data-order="${o.id}" data-status="${s}">${s[0].toUpperCase()+s.slice(1)}</button>`).join('')}</div></section>`}
    async function updateStatus(id,status){const {error}=await db.from('orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else loadOrders();}
  </script>
</body>
</html>
