<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071c14">
<title>Menu Orbit — Barista & Service Crew</title>
<style>
:root{--g:#00754a;--g2:#00a862;--d:#03130d;--p:#08251b;--c:#f4efe6;--gold:#d4ad62;--line:rgba(255,255,255,.14);--muted:#aac0b5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#145d42,#061a13 42%,#020907);color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.wrap{width:min(1200px,calc(100% - 20px));margin:auto;padding:14px 0 50px}.top{display:flex;align-items:center;gap:10px;padding:12px 0}.logo{width:48px;height:48px;border-radius:50%;border:2px solid #fff;background:var(--g);display:grid;place-items:center;font:900 20px Georgia}.brand h1{margin:0;font-size:clamp(20px,3vw,30px)}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.spacer{flex:1}.btn{min-height:50px;border:1px solid var(--line);border-radius:14px;padding:0 15px;background:rgba(255,255,255,.07);color:#fff;font-weight:900}.primary{border:0;background:linear-gradient(135deg,var(--g2),var(--g))}.card{background:rgba(8,37,27,.95);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:12px;box-shadow:0 18px 50px rgba(0,0,0,.28)}.login{width:min(560px,100%);margin:6vh auto}.login input{width:100%;height:56px;border:1px solid var(--line);border-radius:14px;background:#0d3628;color:#fff;padding:0 14px;margin:7px 0}.demo{margin:14px 0;padding:14px;border:1px solid rgba(244,200,111,.38);border-radius:16px;background:rgba(244,200,111,.09);color:#ffe6a8}.cred{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:8px;padding:10px;border-radius:12px;background:rgba(255,255,255,.06)}.cred code{font-weight:900;overflow-wrap:anywhere}.copy{min-height:40px;border:0;border-radius:10px;background:var(--c);color:#073421;font-weight:900;padding:0 12px}.login-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.notice{color:#adc5b9;font-size:13px;line-height:1.5}.error{color:#ffb2b2}.stats,.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.stat,.nav button{background:rgba(8,37,27,.95);border:1px solid var(--line);border-radius:18px;padding:14px;color:#fff}.stat b{display:block;font-size:27px;color:#f2cf8b}.stat span{font-size:11px;color:var(--muted);text-transform:uppercase}.nav button{min-height:72px;font-weight:950}.nav button.active{background:var(--c);color:#073421}.toolbar{display:flex;gap:8px;margin:12px 0}.search{flex:1;min-height:50px;border-radius:14px;border:1px solid var(--line);padding:0 14px}.order-top{display:grid;grid-template-columns:1fr auto;gap:12px}.ref{font-size:22px;font-weight:950}.meta{font-size:13px;line-height:1.55;color:#b8cdc3}.status{display:inline-block;margin-top:7px;padding:5px 9px;border-radius:999px;background:rgba(0,168,98,.15);font-size:11px;font-weight:900;text-transform:uppercase}.timer{display:inline-block;margin-top:7px;margin-left:5px;padding:5px 9px;border-radius:999px;background:rgba(212,169,79,.13);color:#f3d18b;font-size:11px;font-weight:900}.items{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}.item{display:flex;justify-content:space-between;gap:10px;padding:8px 0}.item small{display:block;color:#9fb4aa}.note{margin-top:5px;color:#ffe3a2;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions button{min-height:48px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.06);color:#fff;padding:0 13px;font-weight:900}.actions .go{background:linear-gradient(135deg,var(--g2),var(--g));border:0}.actions .ready{background:var(--c);color:#073421}.inventory{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stock{background:rgba(8,37,27,.95);border:1px solid var(--line);border-radius:18px;padding:15px}.stock h3{margin:0 0 7px}.stock-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.stock-actions button{min-height:42px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.06);color:#fff;font-size:11px;font-weight:900}.stock-actions button.on{background:var(--c);color:#073421}.empty{text-align:center;padding:48px;color:var(--muted)}
@media(max-width:720px){.stats,.nav{grid-template-columns:repeat(2,1fr)}.inventory{grid-template-columns:1fr 1fr}.top{flex-wrap:wrap}.top .spacer{display:none}.top .btn{flex:1}.login-actions{grid-template-columns:1fr}.order-top{grid-template-columns:1fr}}
@media(max-width:460px){.inventory{grid-template-columns:1fr}.cred{grid-template-columns:1fr}.copy{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="logo">S</div><div class="brand"><h1>Barista / Service Crew</h1><p>Menu Orbit Branch Operations</p></div><div class="spacer"></div><button class="btn" id="menuBtn">← Customer Menu</button><button class="btn" id="signOutBtn" hidden>Sign Out</button></header>
<main id="app"></main>
</div>
<script src="config.js"></script>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/+esm';
const cfg=window.MENU_ORBIT_CONFIG||{},app=document.querySelector('#app'),signOut=document.querySelector('#signOutBtn');
const db=cfg.supabaseUrl&&cfg.supabasePublishableKey?createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;
const DEMO_EMAIL='barista.demo@menuorbit.test',DEMO_PASSWORD='BaristaOrbit2026!';
let demo=false,view='new',orders=[],inventory=[];
const demoOrders=[{id:'d1',order_ref:'MO-1048',customer_name:'Alex R.',customer_phone:'•••• 2145',created_at:new Date(Date.now()-7*60000).toISOString(),pickup_time:new Date(Date.now()+12*60000).toISOString(),status:'new',total_amount:410,order_items:[{quantity:1,product_name:'Caramel Macchiato',size:'Grande',style:'Iced',milk:'Oat milk',unit_price:240,note:'Less ice'},{quantity:1,product_name:'Ham and Cheese Croffle',size:'Regular',style:'Warm',unit_price:170}]},{id:'d2',order_ref:'MO-1047',customer_name:'Jamie S.',customer_phone:'•••• 8891',created_at:new Date(Date.now()-14*60000).toISOString(),status:'preparing',total_amount:205,order_items:[{quantity:1,product_name:'Vanilla Sweet Cream Cold Brew',size:'Grande',style:'Iced',unit_price:205,note:'No straw'}]},{id:'d3',order_ref:'MO-1046',customer_name:'Mika P.',customer_phone:'•••• 1050',created_at:new Date(Date.now()-18*60000).toISOString(),status:'ready',total_amount:390,order_items:[{quantity:2,product_name:'Caffè Latte',size:'Tall',style:'Hot',milk:'Whole milk',unit_price:195}]}];
const demoInv=[{id:'i1',product_name:'Caffè Latte',availability:'available'},{id:'i2',product_name:'Caramel Macchiato',availability:'available'},{id:'i3',product_name:'Cold Brew',availability:'low'},{id:'i4',product_name:'Oat Milk',availability:'available'},{id:'i5',product_name:'Ham and Cheese Croffle',availability:'low'},{id:'i6',product_name:'Matcha Latte',availability:'sold_out'}];
const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{maximumFractionDigits:0});
const age=d=>Math.max(0,Math.round((Date.now()-new Date(d))/60000));
document.querySelector('#menuBtn').onclick=()=>location.href='index.html';
function copy(v){navigator.clipboard?.writeText(v).then(()=>alert('Copied!')).catch(()=>alert(v))}
function loginScreen(){signOut.hidden=true;app.innerHTML=`<section class="card login"><h2>Staff Sign In</h2><p class="notice">Use an authorized staff account, or use the demo credentials below.</p><div class="demo"><b>DEMO LOGIN — CLICK TO COPY</b><div class="cred"><code>${DEMO_EMAIL}</code><button class="copy" id="copyEmail">Copy Email</button></div><div class="cred"><code>${DEMO_PASSWORD}</code><button class="copy" id="copyPassword">Copy Password</button></div><button class="btn" id="fillDemo" style="width:100%;margin-top:9px">Fill Demo Login</button></div><form id="loginForm"><input id="email" type="email" required placeholder="Staff email"><input id="password" type="password" required placeholder="Password"><div class="login-actions"><button class="btn primary" type="submit">Sign In</button><button class="btn" type="button" id="demoBtn">Enter Demo Dashboard</button></div></form><p id="msg" class="notice"></p></section>`;document.querySelector('#copyEmail').onclick=()=>copy(DEMO_EMAIL);document.querySelector('#copyPassword').onclick=()=>copy(DEMO_PASSWORD);document.querySelector('#fillDemo').onclick=()=>{document.querySelector('#email').value=DEMO_EMAIL;document.querySelector('#password').value=DEMO_PASSWORD};document.querySelector('#demoBtn').onclick=enterDemo;document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();const email=document.querySelector('#email').value.trim(),pass=document.querySelector('#password').value;if(email===DEMO_EMAIL&&pass===DEMO_PASSWORD)return enterDemo();if(!db){document.querySelector('#msg').textContent='Use the demo login because the live backend is not connected.';return}document.querySelector('#msg').textContent='Signing in…';const {error}=await db.auth.signInWithPassword({email,password:pass});if(error){document.querySelector('#msg').textContent=error.message;document.querySelector('#msg').className='notice error'}else init()}}
function enterDemo(){demo=true;orders=structuredClone(demoOrders);inventory=structuredClone(demoInv);signOut.hidden=false;signOut.onclick=()=>{demo=false;loginScreen()};render()}
async function init(){if(!db)return loginScreen();const {data:{session}}=await db.auth.getSession();if(!session)return loginScreen();signOut.hidden=false;signOut.onclick=async()=>{await db.auth.signOut();loginScreen()};await load()}
async function load(){const [o,i]=await Promise.all([db.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}).limit(100),db.from('branch_inventory').select('*').limit(100)]);if(o.error){app.innerHTML=`<section class="card"><p class="error">${esc(o.error.message)}</p></section>`;return}orders=o.data||[];inventory=(i.data||[]).map(x=>({id:x.id,product_name:x.product_name||x.product_id||'Inventory item',availability:x.availability||'available'}));render()}
function render(){app.innerHTML=`${demo?'<div class="demo">Demo dashboard only — no live orders or stock are changed.</div>':''}<section class="stats"><div class="stat"><b>${orders.filter(x=>x.status==='new'||x.status==='confirmed').length}</b><span>New Orders</span></div><div class="stat"><b>${orders.filter(x=>x.status==='preparing').length}</b><span>Preparing</span></div><div class="stat"><b>${orders.filter(x=>x.status==='ready').length}</b><span>Ready</span></div><div class="stat"><b>${inventory.filter(x=>x.availability!=='available').length}</b><span>Stock Alerts</span></div></section><nav class="nav">${[['new','🧾 New Orders'],['preparing','☕ Preparing'],['ready','✅ Ready for Pickup'],['inventory','📦 Inventory']].map(x=>`<button class="${view===x[0]?'active':''}" data-view="${x[0]}">${x[1]}</button>`).join('')}</nav><section id="area"></section>`;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});renderArea()}
function renderArea(){const area=document.querySelector('#area');if(view==='inventory'){area.innerHTML=`<div class="inventory">${inventory.map(x=>`<article class="stock"><h3>${esc(x.product_name)}</h3><div class="meta">${x.availability.replace('_',' ')}</div><div class="stock-actions">${['available','low','sold_out'].map(s=>`<button class="${x.availability===s?'on':''}" data-stock="${s}" data-id="${x.id}">${s.replace('_',' ')}</button>`).join('')}</div></article>`).join('')}</div>`;document.querySelectorAll('[data-stock]').forEach(b=>b.onclick=()=>stock(b.dataset.id,b.dataset.stock));return}const list=orders.filter(o=>view==='new'?['new','confirmed'].includes(o.status):o.status===view);area.innerHTML=list.length?list.map(card).join(''):'<div class="empty">No orders in this section.</div>';document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>move(b.dataset.id,b.dataset.status))}
function card(o){const items=(o.order_items||[]).map(i=>`<div class="item"><div><b>${i.quantity}× ${esc(i.product_name)}</b><small>${[i.size,i.style,i.milk].filter(Boolean).join(' • ')}</small>${i.note?`<div class="note">Special request: ${esc(i.note)}</div>`:''}</div><b>${money(i.unit_price*i.quantity)}</b></div>`).join('');const acts=o.status==='ready'?`<button class="ready" data-id="${o.id}" data-status="completed">✓ Release Order</button><button data-id="${o.id}" data-status="preparing">Back to Preparing</button>`:o.status==='preparing'?`<button class="go" data-id="${o.id}" data-status="ready">✓ Mark Ready</button><button data-id="${o.id}" data-status="new">Back to New</button>`:`<button class="go" data-id="${o.id}" data-status="preparing">☕ Start Preparing</button>`;return `<article class="card"><div class="order-top"><div><div class="ref">${esc(o.order_ref)}</div><div class="meta"><b>${esc(o.customer_name||'Customer')}</b> • ${esc(o.customer_phone||'')}<br>Pickup: ${o.pickup_time?new Date(o.pickup_time).toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'}):'ASAP'}</div><span class="status">${esc(o.status)}</span><span class="timer">⏱ ${age(o.created_at)} min</span></div><b style="font-size:21px;color:#f2cf8b">${money(o.total_amount)}</b></div><div class="items">${items}</div><div class="actions">${acts}<button data-id="${o.id}" data-status="cancelled">Problem / Cancel</button></div></article>`}
async function move(id,status){if(demo){const o=orders.find(x=>x.id===id);if(o)o.status=status;render();return}const {error}=await db.from('orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else load()}
async function stock(id,availability){if(demo){const x=inventory.find(x=>x.id===id);if(x)x.availability=availability;render();return}const {error}=await db.from('branch_inventory').update({availability}).eq('id',id);if(error)alert(error.message);else load()}
loginScreen();
</script>
</body>
</html>
