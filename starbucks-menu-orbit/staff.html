<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071c14">
<title>Menu Orbit — Barista & Service Crew</title>
<style>
:root{--green:#00754a;--green2:#00a862;--dark:#03130d;--panel:#08251b;--cream:#f4efe6;--gold:#d4ad62;--line:rgba(255,255,255,.14);--muted:#aac0b5;--danger:#b94a4a;--warning:#d4a94f;--shadow:0 20px 55px rgba(0,0,0,.30)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#145d42,#061a13 42%,#020907);color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #f2cf8b;outline-offset:3px}.wrap{width:min(1280px,calc(100% - 22px));margin:auto;padding:14px 0 60px}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 0;background:rgba(3,19,13,.94);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.06)}.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:48px;height:48px;border-radius:50%;border:2px solid #fff;background:var(--green);display:grid;place-items:center;font:900 20px Georgia,serif;box-shadow:0 0 0 5px rgba(0,117,74,.22)}h1{font-size:clamp(20px,3.2vw,31px);margin:0}.sub{margin:2px 0 0;color:var(--muted);font-size:12px}.spacer{flex:1}.btn{min-height:50px;border:1px solid var(--line);border-radius:14px;padding:0 15px;background:rgba(255,255,255,.07);color:#fff;font-weight:900}.btn.primary{border:0;background:linear-gradient(135deg,var(--green2),var(--green))}.btn.danger{border-color:rgba(255,120,120,.35);color:#ffd2d2}.statusbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{background:rgba(8,37,27,.95);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow)}.stat strong{display:block;font-size:29px;color:#f3d18b}.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#b8ccc2}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 18px}.nav button{min-height:76px;border-radius:20px;border:1px solid var(--line);background:rgba(8,37,27,.92);color:#fff;font-weight:950;font-size:15px;padding:8px}.nav button small{display:block;margin-top:3px;color:#9fb4aa;font-size:10px;font-weight:700}.nav button.active{background:var(--cream);color:#073421;border-color:var(--cream)}.nav button.active small{color:#44685a}.section-head{display:flex;align-items:center;gap:10px;margin:14px 2px 8px}.section-head h2{margin:0;font-size:23px}.section-head p{margin:0;color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.search{flex:1;min-width:220px;height:50px;border-radius:14px;border:1px solid var(--line);background:#f4efe6;color:#123125;padding:0 14px}.card{background:rgba(8,37,27,.95);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:12px;box-shadow:var(--shadow)}.order-top{display:grid;grid-template-columns:1fr auto;gap:14px}.order-ref{font-size:22px;font-weight:950}.meta{color:#b8cdc3;font-size:13px;line-height:1.6;margin-top:5px}.timer{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 10px;border-radius:999px;background:rgba(212,169,79,.12);border:1px solid rgba(212,169,79,.30);color:#f2d694;font-size:12px;font-weight:900}.timer.late{background:rgba(185,74,74,.18);border-color:rgba(255,130,130,.35);color:#ffc6c6}.status{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:999px;background:rgba(0,168,98,.14);border:1px solid rgba(0,168,98,.32);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.items{border-top:1px solid var(--line);margin-top:13px;padding-top:10px}.item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0}.item b{font-size:15px}.item small{display:block;color:#9fb4aa;margin-top:3px;line-height:1.45}.note{margin-top:8px;padding:10px 12px;border-radius:12px;background:rgba(244,200,111,.08);border:1px solid rgba(244,200,111,.2);color:#f8e5b2;font-size:12px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.actions button{min-height:52px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font-weight:900}.actions button.primary{background:linear-gradient(135deg,var(--green2),var(--green));border:0}.actions button.ready{background:#f4efe6;color:#073421}.actions button.problem{border-color:rgba(255,130,130,.35);color:#ffd0d0}.empty{text-align:center;color:#a8bbb2;padding:54px 10px}.login{width:min(520px,100%);margin:9vh auto 0}.login input{width:100%;height:56px;border:1px solid var(--line);border-radius:14px;background:#0d3628;color:#fff;padding:0 14px;font-size:16px;margin:8px 0}.notice{color:#adc5b9;font-size:13px;line-height:1.5}.error{color:#ffb2b2}.inventory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stock-card{background:rgba(8,37,27,.95);border:1px solid var(--line);border-radius:18px;padding:15px}.stock-card h3{margin:0 0 5px;font-size:16px}.stock-meta{font-size:12px;color:var(--muted);margin-bottom:10px}.stock-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stock-actions button{min-height:44px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font-size:11px;font-weight:900}.stock-actions button.selected{background:var(--cream);color:#073421}.demo-banner{margin:12px 0;padding:11px 13px;border-radius:14px;border:1px solid rgba(244,200,111,.35);background:rgba(244,200,111,.09);color:#ffe6a8;font-size:12px;line-height:1.5}.toast{position:fixed;z-index:50;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#f4efe6;color:#073421;border-radius:999px;padding:11px 17px;font-weight:900;box-shadow:0 12px 35px rgba(0,0,0,.4);transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){.statusbar,.nav{grid-template-columns:repeat(2,1fr)}.inventory-grid{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr 1fr}.topbar{flex-wrap:wrap}.topbar .spacer{display:none}.topbar .btn{flex:1}.wrap{width:min(100% - 14px,1280px)}}
@media(max-width:520px){.logo{width:43px;height:43px}.statusbar{grid-template-columns:1fr 1fr}.stat{padding:12px}.stat strong{font-size:24px}.nav button{min-height:70px}.inventory-grid{grid-template-columns:1fr}.order-top{grid-template-columns:1fr}.actions button{min-height:56px}.section-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
<header class="topbar">
  <div class="brand"><div class="logo">S</div><div><h1>Barista / Service Crew</h1><p class="sub">Menu Orbit Branch Operations</p></div></div>
  <div class="spacer"></div>
  <button class="btn" id="refreshBtn">↻ Refresh</button>
  <button class="btn" id="menuBtn">← Customer Menu</button>
  <button class="btn danger" id="signOutBtn" hidden>Sign Out</button>
</header>
<main id="app"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="config.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/+esm";
const cfg=window.MENU_ORBIT_CONFIG||{},app=document.querySelector('#app'),signOut=document.querySelector('#signOutBtn'),toast=document.querySelector('#toast');
const db=(cfg.supabaseUrl&&cfg.supabasePublishableKey)?createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{maximumFractionDigits:0});
let view='new',search='',ordersCache=[],inventoryCache=[];
const demoOrders=[
 {id:'demo-1',order_ref:'MO-1048',customer_name:'Alex R.',customer_phone:'•••• 2145',branch:'Demo Bacoor Branch',pickup_time:new Date(Date.now()+12*60000).toISOString(),created_at:new Date(Date.now()-7*60000).toISOString(),status:'new',total_amount:410,order_items:[{quantity:1,product_name:'Caramel Macchiato',size:'Grande',style:'Iced',milk:'Oat milk',unit_price:240,note:'Less ice'},{quantity:1,product_name:'Ham and Cheese Croffle',size:'Regular',style:'Warm',milk:'',unit_price:170,note:''}]},
 {id:'demo-2',order_ref:'MO-1047',customer_name:'Jamie S.',customer_phone:'•••• 8891',branch:'Demo Bacoor Branch',pickup_time:new Date(Date.now()+6*60000).toISOString(),created_at:new Date(Date.now()-14*60000).toISOString(),status:'preparing',total_amount:205,order_items:[{quantity:1,product_name:'Vanilla Sweet Cream Cold Brew',size:'Grande',style:'Iced',milk:'',unit_price:205,note:'No straw'}]},
 {id:'demo-3',order_ref:'MO-1046',customer_name:'Mika P.',customer_phone:'•••• 1050',branch:'Demo Bacoor Branch',pickup_time:new Date(Date.now()+2*60000).toISOString(),created_at:new Date(Date.now()-18*60000).toISOString(),status:'ready',total_amount:390,order_items:[{quantity:2,product_name:'Caffè Latte',size:'Tall',style:'Hot',milk:'Whole milk',unit_price:195,note:''}]}
];
const demoInventory=[
 {id:'inv-1',product_name:'Caffè Latte',availability:'available'},
 {id:'inv-2',product_name:'Caramel Macchiato',availability:'available'},
 {id:'inv-3',product_name:'Cold Brew',availability:'low'},
 {id:'inv-4',product_name:'Oat Milk',availability:'available'},
 {id:'inv-5',product_name:'Ham and Cheese Croffle',availability:'low'},
 {id:'inv-6',product_name:'Matcha Latte',availability:'sold_out'}
];
function flash(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(()=>toast.classList.remove('show'),1800)}
function minsAgo(date){return Math.max(0,Math.round((Date.now()-new Date(date).getTime())/60000))}
function count(status){return ordersCache.filter(o=>o.status===status).length}
document.querySelector('#menuBtn').onclick=()=>location.href='index.html';document.querySelector('#refreshBtn').onclick=()=>loadAll();
if(!db){renderDemo()}else init();
async function init(){const {data:{session}}=await db.auth.getSession();if(!session)return renderLogin();signOut.hidden=false;signOut.onclick=async()=>{await db.auth.signOut();location.reload()};await renderDashboard();}
function renderLogin(){signOut.hidden=true;app.innerHTML=`<section class="card login"><h2>Staff Sign In</h2><p class="notice">Use your approved branch staff account.</p><form id="loginForm"><input id="staffEmail" type="email" autocomplete="username" required placeholder="Staff email"><input id="staffPassword" type="password" autocomplete="current-password" required placeholder="Password"><button class="btn primary" style="width:100%" type="submit">Sign In</button></form><p class="notice" id="loginMsg"></p></section>`;document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();const msg=document.querySelector('#loginMsg');msg.textContent='Signing in…';const {error}=await db.auth.signInWithPassword({email:document.querySelector('#staffEmail').value.trim(),password:document.querySelector('#staffPassword').value});if(error){msg.textContent=error.message;msg.className='notice error'}else location.reload()}}
function renderDemo(){ordersCache=demoOrders;inventoryCache=demoInventory;app.innerHTML=`<div class="demo-banner"><b>Demo mode:</b> Supabase is not connected on this page, so sample branch orders are shown for interface testing. Changes remain in this browser session only.</div><div id="dashboard"></div>`;renderShell();}
async function renderDashboard(){app.innerHTML='<div id="dashboard"><div class="empty">Loading branch operations…</div></div>';await loadAll();if(db)db.channel('barista-orders').on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>loadAll()).subscribe();}
async function loadAll(){if(!db){renderShell();return}const [ordersRes,invRes]=await Promise.all([db.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}).limit(100),db.from('branch_inventory').select('*').limit(100)]);if(ordersRes.error){app.innerHTML=`<section class="card"><p class="error">${esc(ordersRes.error.message)}</p><p class="notice">Make sure this signed-in account is listed as authorized branch staff.</p></section>`;return}ordersCache=ordersRes.data||[];inventoryCache=(invRes.data||[]).map(x=>({id:x.id,product_name:x.product_name||x.product_id||'Inventory item',availability:x.availability||'available'}));renderShell();}
function renderShell(){const root=document.querySelector('#dashboard')||app;root.innerHTML=`<section class="statusbar"><div class="stat"><strong>${count('new')}</strong><span>New Orders</span></div><div class="stat"><strong>${count('preparing')}</strong><span>Preparing</span></div><div class="stat"><strong>${count('ready')}</strong><span>Ready</span></div><div class="stat"><strong>${inventoryCache.filter(x=>x.availability==='low'||x.availability==='sold_out').length}</strong><span>Stock Alerts</span></div></section><nav class="nav"><button data-view="new"><span>🧾 New Orders</span><small>Accept and start</small></button><button data-view="preparing"><span>☕ Preparing</span><small>Work in progress</small></button><button data-view="ready"><span>✅ Ready for Pickup</span><small>Release orders</small></button><button data-view="inventory"><span>📦 Inventory</span><small>Availability controls</small></button></nav><section id="viewArea"></section>`;document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.onclick=()=>{view=b.dataset.view;renderShell()}});renderView();}
function renderView(){const out=document.querySelector('#viewArea');if(view==='inventory'){renderInventory(out);return}const title={new:'New Orders',preparing:'Preparing',ready:'Ready for Pickup'}[view],desc={new:'Review new tickets and start preparation.',preparing:'Track drinks and food currently being prepared.',ready:'Verify customer pickup and release completed orders.'}[view];let list=ordersCache.filter(o=>o.status===view||view==='new'&&['new','confirmed'].includes(o.status));if(search)list=list.filter(o=>(o.order_ref+' '+o.customer_name).toLowerCase().includes(search.toLowerCase()));out.innerHTML=`<div class="section-head"><div><h2>${title}</h2><p>${desc}</p></div></div><div class="toolbar"><input class="search" id="orderSearch" placeholder="Search order number or customer" value="${esc(search)}"><button class="btn" id="clearSearch">Clear</button></div><div id="ordersList">${list.length?list.map(orderCard).join(''):'<div class="empty">No orders in this section.</div>'}</div>`;document.querySelector('#orderSearch').oninput=e=>{search=e.target.value;renderView()};document.querySelector('#clearSearch').onclick=()=>{search='';renderView()};document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>updateStatus(b.dataset.order,b.dataset.status));}
function orderCard(o){const age=minsAgo(o.created_at),late=age>=12,when=o.pickup_time?new Date(o.pickup_time).toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'}):'ASAP';const items=(o.order_items||[]).map(i=>`<div class="item"><div><b>${i.quantity}× ${esc(i.product_name)}</b><small>${[i.size,i.style,i.milk].filter(Boolean).map(esc).join(' • ')}</small>${i.note?`<div class="note">Special request: ${esc(i.note)}</div>`:''}</div><b>${money(i.unit_price*i.quantity)}</b></div>`).join('');const actions=o.status==='ready'?`<button class="ready" data-order="${o.id}" data-status="completed">✓ Release Order</button><button data-order="${o.id}" data-status="preparing">↶ Back to Preparing</button><button class="problem" data-order="${o.id}" data-status="cancelled">Problem / Cancel</button>`:o.status==='preparing'?`<button class="primary" data-order="${o.id}" data-status="ready">✓ Mark Ready</button><button data-order="${o.id}" data-status="new">↶ Back to New</button><button class="problem" data-order="${o.id}" data-status="cancelled">Problem / Cancel</button>`:`<button class="primary" data-order="${o.id}" data-status="preparing">☕ Start Preparing</button><button class="problem" data-order="${o.id}" data-status="cancelled">Problem / Cancel</button>`;return `<article class="card"><div class="order-top"><div><div class="order-ref">${esc(o.order_ref)}</div><div class="meta"><b>${esc(o.customer_name||'Customer')}</b> • ${esc(o.customer_phone||'No phone')}<br>${esc(o.branch||'Assigned branch')} • Pickup ${esc(when)}</div><span class="status">${esc(o.status)}</span><span class="timer ${late?'late':''}">⏱ ${age} min waiting</span></div><div style="text-align:right"><b style="font-size:21px;color:#f2cf8b">${money(o.total_amount)}</b><div class="meta">${o.pickup_type||'Pickup'}</div></div></div><div class="items">${items||'<span class="notice">No item details available.</span>'}</div><div class="actions">${actions}</div></article>`}
async function updateStatus(id,status){if(!db){const o=ordersCache.find(x=>x.id===id);if(o)o.status=status;flash('Demo order moved to '+status);renderShell();return}const {error}=await db.from('orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else{flash('Order updated: '+status);await loadAll()}}
function renderInventory(out){out.innerHTML=`<div class="section-head"><div><h2>Inventory</h2><p>Quick availability controls for the branch.</p></div></div><div class="inventory-grid">${inventoryCache.length?inventoryCache.map(stockCard).join(''):'<div class="empty">No inventory records available.</div>'}</div>`;document.querySelectorAll('[data-stock]').forEach(b=>b.onclick=()=>updateStock(b.dataset.id,b.dataset.stock));}
function stockCard(x){const label=x.availability==='sold_out'?'Sold Out':x.availability==='low'?'Low Stock':'Available';return `<article class="stock-card"><h3>${esc(x.product_name)}</h3><div class="stock-meta">Current status: <b>${label}</b></div><div class="stock-actions"><button class="${x.availability==='available'?'selected':''}" data-id="${x.id}" data-stock="available">Available</button><button class="${x.availability==='low'?'selected':''}" data-id="${x.id}" data-stock="low">Low</button><button class="${x.availability==='sold_out'?'selected':''}" data-id="${x.id}" data-stock="sold_out">Sold Out</button></div></article>`}
async function updateStock(id,availability){if(!db){const x=inventoryCache.find(x=>x.id===id);if(x)x.availability=availability;flash('Demo stock updated');renderShell();return}const {error}=await db.from('branch_inventory').update({availability}).eq('id',id);if(error)alert(error.message);else{flash('Inventory updated');await loadAll()}}
</script>
</body>
</html>
