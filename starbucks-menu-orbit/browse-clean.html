<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Browse Menu</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#003b2f;color:#fff;font-family:Arial,sans-serif}button,a{font:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#002d24ee;backdrop-filter:blur(10px)}
.back{min-height:46px;padding:0 18px;border:2px solid #d8b45b;border-radius:999px;color:#fff;text-decoration:none;display:flex;align-items:center;font-weight:800}
.hero{width:100%;display:block;max-height:760px;object-fit:cover;object-position:top center}
.wrap{max-width:1400px;margin:auto;padding:20px}.cats{display:flex;gap:12px;overflow-x:auto;padding:4px 0 20px;scrollbar-width:none}.cat{flex:0 0 auto;min-height:52px;padding:0 22px;border:1px solid #d8b45b;border-radius:999px;background:#f7f1e5;color:#073b2e;font-weight:800}.cat.active{background:#d8b45b}
.panel{background:#f7f1e5;color:#073b2e;border-radius:28px;padding:26px}.panel h1{font-family:Georgia,serif;font-size:42px;margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}.card{background:#fffaf1;border-radius:20px;padding:22px;min-height:220px;display:flex;flex-direction:column;box-shadow:0 8px 20px #0001}.card small{opacity:.7}.card h2{font-size:20px;margin:10px 0}.card p{line-height:1.5;flex:1}.view{min-height:46px;border:1px solid #b58a31;border-radius:999px;background:transparent;color:#073b2e;font-weight:800;cursor:pointer}
.dialog{position:fixed;inset:0;z-index:50;background:#001f19dd;display:none;align-items:center;justify-content:center;padding:20px}.dialog.open{display:flex}.box{width:min(620px,100%);background:#fffaf1;color:#073b2e;border-radius:26px;padding:28px}.close{float:right;border:0;background:none;font-size:30px}.box h2{font-family:Georgia,serif;font-size:34px}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{min-height:48px;padding:0 18px;border-radius:999px;border:1px solid #b58a31;background:#073b2e;color:#fff;font-weight:800}
@media(max-width:800px){.top{padding-top:max(12px,env(safe-area-inset-top))}.hero{height:auto;max-height:none}.wrap{padding:12px}.panel{padding:18px;border-radius:22px}.panel h1{font-size:34px}.grid{grid-template-columns:1fr}.card{min-height:190px}}
</style><style id="v149-mobile-width-fix">
html,body{width:100%;max-width:100%;overflow-x:hidden!important}
.top{width:100%!important}
.hero{width:100%!important;max-width:100%!important;height:auto!important;object-fit:contain!important;object-position:center top!important}
.wrap{width:100%!important;max-width:100%!important;overflow:hidden!important}
.cats{width:100%!important;max-width:100%!important;overflow-x:auto!important}
.panel{width:100%!important;max-width:100%!important;overflow:hidden!important}
.grid{width:100%!important;max-width:100%!important}
@media(max-width:800px){
 .top{padding:10px 12px!important}.top strong{font-size:12px!important}.back{min-height:40px!important;padding:0 12px!important;font-size:11px!important}
 .hero{display:block!important;width:100vw!important;height:auto!important;max-height:none!important}
 .wrap{padding:10px!important}
 .cats{gap:8px!important;padding-bottom:12px!important}
 .cat{min-height:44px!important;padding:0 16px!important;font-size:13px!important}
 .panel{padding:16px!important;border-radius:18px!important}
 .panel h1{font-size:30px!important}
 .grid{grid-template-columns:1fr!important;gap:12px!important}
 .card{width:100%!important;min-width:0!important;padding:18px!important}
}
</style><style id="v150-deduplicate">
.v150hide{display:none!important}
/* uploaded artwork is visual hero only; crop before its embedded Featured Drinks cards */
.hero{width:100%!important;height:auto!important;max-height:500px!important;object-fit:cover!important;object-position:top center!important}
@media(max-width:800px){
 .hero{height:390px!important;max-height:390px!important;object-fit:cover!important;object-position:top center!important}
 .wrap{margin-top:0!important}
}
/* keep one real interactive category/product area */
.wrap{padding-top:14px!important}
</style></head><body>
<header class="top v150hide"><a class="back" href="./index.html?v=150#orbit">← BACK TO ORBIT</a><strong>BROWSE MENU</strong></header>
<img class="hero" src="./images/file_0000000058f08209ae65e1d68e23ca4a.png?v=148" alt="Browse Menu design">
<main class="wrap"><nav class="cats" id="cats"></nav><section class="panel"><h1 id="heading">Featured Drinks</h1><p>Choose a category, then select a product to view details.</p><div class="grid" id="grid"></div></section></main>
<div class="dialog" id="dialog"><div class="box"><button class="close" id="close">×</button><small id="dcat"></small><h2 id="dname"></h2><p id="ddesc"></p><div class="actions"><button>Customize</button><button>Make It Lighter</button><button>Nutrition</button><button id="add">Add to Cart</button></div></div></div>
<script>
const data={
"Featured Drinks":["Roasted Macadamia Oatmilk Frappuccino®","Roasted Macadamia Oatmilk Iced Shaken Espresso","Pumpkin Spice Latte"],
"Brewed Coffee":["Hot Brewed Coffee","Salted Caramel Cold Brew","Nitro Cold Brew","Vanilla Sweet Cream Cold Brew"],
"Espresso":["Flat White","Espresso","Iced Caramel Macchiato","Iced Caffe Latte","Iced Americano"],
"Blended Beverage":["Caramel Frappuccino®","Coffee Frappuccino®","Java Chip Frappuccino®","Dark Mocha Frappuccino®"],
"Teavana Tea":["Chai Tea","Pure Matcha Tea","Iced Shaken Tea"],
"Starbucks Refreshers":["Starbucks Refreshers Beverage","Pink Drink"],
"Chocolate & More":["Signature Hot Chocolate","Chocolate Beverage"],
"Starbucks Reserve®":["Starbucks Reserve® Coffee"],
"Coffee Traveler":["Coffee Traveler"]
};
const cats=document.getElementById('cats'),grid=document.getElementById('grid'),heading=document.getElementById('heading'),dialog=document.getElementById('dialog');
function desc(n){if(/Frappuccino/i.test(n))return"A smooth, creamy blended beverage crafted for a refreshing treat.";if(/Cold Brew|Nitro/i.test(n))return"Slow-steeped coffee with a smooth, rich finish.";if(/Espresso|Americano|Latte|Macchiato|Flat White/i.test(n))return"Espresso-forward flavor crafted for a balanced coffee experience.";return"A Starbucks menu favorite crafted for an enjoyable café experience."}
function render(cat){heading.textContent=cat;document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('active',b.textContent===cat));grid.innerHTML=data[cat].map(n=>'<article class="card"><small>'+cat+'</small><h2>'+n+'</h2><p>'+desc(n)+'</p><button class="view" data-name="'+n.replace(/"/g,'&quot;')+'" data-cat="'+cat+'">View Details →</button></article>').join('')}
Object.keys(data).forEach((c,i)=>{let b=document.createElement('button');b.className='cat'+(i?'':' active');b.textContent=c;b.onclick=()=>render(c);cats.appendChild(b)});render("Featured Drinks");
grid.onclick=e=>{let b=e.target.closest('.view');if(!b)return;document.getElementById('dcat').textContent=b.dataset.cat;document.getElementById('dname').textContent=b.dataset.name;document.getElementById('ddesc').textContent=desc(b.dataset.name);dialog.classList.add('open')};
document.getElementById('close').onclick=()=>dialog.classList.remove('open');dialog.onclick=e=>{if(e.target===dialog)dialog.classList.remove('open')};document.getElementById('add').onclick=e=>{e.target.textContent='✓ Added to Cart';setTimeout(()=>e.target.textContent='Add to Cart',900)}
</script></body></html>
