const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch(e){return f}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let filter='all',sort='featured',query='';
const money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{maximumFractionDigits:0});
const savedKey='mo_saved_for_later_v1',compareKey='mo_browse_compare_v47',cartKey='menuOrbitCart',favKey='menuOrbitFavorites';
const toast=t=>{const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1000)};
const product=id=>products.find(p=>p.id===id);
function list(){let a=[...products],q=query.trim().toLowerCase();if(q)a=a.filter(p=>(p.name+' '+p.cat+' '+p.id).toLowerCase().replace(/[-_]/g,' ').includes(q.replace(/[-_]/g,' ')));const fav=read(favKey,[]);if(filter==='drinks')a=a.filter(p=>p.kind!=='food');else if(filter==='food')a=a.filter(p=>p.kind==='food');else if(filter==='hot')a=a.filter(p=>p.kind!=='food'&&(p.temps||[]).some(t=>/hot/i.test(t)));else if(filter==='iced')a=a.filter(p=>p.kind!=='food'&&(p.temps||[]).some(t=>/iced|cold/i.test(t)));else if(filter==='favorites')a=a.filter(p=>fav.includes(p.id));if(sort==='price-low')a.sort((x,y)=>x.price-y.price);else if(sort==='price-high')a.sort((x,y)=>y.price-x.price);else if(sort==='name')a.sort((x,y)=>x.name.localeCompare(y.name));return a}
function render(){const a=list(),saved=read(savedKey,[]),comp=read(compareKey,[]);$('#title').textContent=query?'Search Results':'Browse Menu';$('#count').textContent=a.length+' item'+(a.length===1?'':'s')+(query?' matching “'+query+'”':'');$('#savedCount').textContent=saved.length;$('#cartCount').textContent=read(cartKey,[]).reduce((n,x)=>n+(x.qty||1),0);$('#grid').innerHTML=a.length?a.map(p=>`<article class="card"><div class="photo"><img src="${p.img}" alt="${p.name}"><span class="available">Available</span></div><div class="body"><div class="meta">${p.cat}</div><h3>${p.name}</h3><div class="price"><strong>${money(p.price)}</strong><span>Starting price</span></div><div class="card-actions"><button data-view="${p.id}">View</button><button class="quick" data-quick="${p.id}">＋ Quick Add</button><button class="${saved.some(x=>x.id===p.id)?'active':''}" data-save="${p.id}">${saved.some(x=>x.id===p.id)?'✓ Saved':'♡ Save for Later'}</button><button class="${comp.includes(p.id)?'active':''}" data-compare="${p.id}">${comp.includes(p.id)?'✓ Selected':'⚖ Compare'}</button></div></div></article>`).join(''):'<div class="empty" style="grid-column:1/-1"><b>No products found.</b><span>Try another filter or search term.</span></div>';renderCompareBar()}
function quick(id){const p=product(id);if(!p)return;const cart=read(cartKey,[]);cart.push({key:Date.now()+Math.random(),id:p.id,name:p.name,img:p.img,size:p.kind==='food'?'Regular':'Tall',style:p.kind==='food'?'':((p.temps||[])[0]||''),milk:p.kind==='food'?'':'Whole milk',note:'',price:p.price,qty:1});write(cartKey,cart);toast(p.name+' added to cart');render()}
function toggleSave(id){const p=product(id);let a=read(savedKey,[]);a=a.some(x=>x.id===id)?a.filter(x=>x.id!==id):[{id:p.id,name:p.name,img:p.img,price:p.price,cat:p.cat},...a];write(savedKey,a);render()}
function toggleCompare(id){let a=read(compareKey,[]);a=a.includes(id)?a.filter(x=>x!==id):(a.length<3?[...a,id]:a);write(compareKey,a);render()}
function renderCompareBar(){const ids=read(compareKey,[]),bar=$('#comparebar');bar.classList.toggle('show',ids.length>0);$('#compareCount').textContent=ids.length+' selected';$('#thumbs').innerHTML=ids.map(id=>{const p=product(id);return p?`<button class="thumb" data-uncompare="${id}"><img src="${p.img}"><span>×</span></button>`:''}).join('');$('#openCompare').disabled=ids.length<2}
function openDetail(id){const p=product(id);if(!p)return;$('#detailTitle').textContent=p.name;$('#detailMeta').textContent=p.cat+' • '+money(p.price);$('#detailBody').innerHTML=`<img src="${p.img}" alt="${p.name}" style="width:min(360px,100%);border-radius:18px;display:block;margin:16px auto"><p>${p.desc||''}</p><p><b>Temperature:</b> ${(p.temps||[]).join(' / ')}</p><p><b>Calories:</b> ${p.cal??'See store'}</p>`;$('#detailModal').classList.add('open')}
function openSaved(){const a=read(savedKey,[]);$('#savedList').innerHTML=a.length?a.map(p=>`<div class="saved-row"><img src="${p.img}"><div><b>${p.name}</b><small style="display:block;color:#9eb5aa;margin-top:4px">${p.cat} • ${money(p.price)}</small></div><div class="row-actions"><button data-sview="${p.id}">View</button><button class="green" data-scart="${p.id}">Move to Cart</button><button data-sremove="${p.id}">Remove</button></div></div>`).join(''):'<div class="empty"><b>No saved products yet.</b></div>';$('#savedModal').classList.add('open')}
function openCompare(){const a=read(compareKey,[]).map(product).filter(Boolean);$('#compareGrid').innerHTML=a.map(p=>`<article><img src="${p.img}"><h3>${p.name}</h3><p><b>${money(p.price)}</b></p><p>${p.cat}</p><p>${(p.temps||[]).join(' / ')}</p></article>`).join('');$('#compareModal').classList.add('open')}
function openCart(){const a=read(cartKey,[]);$('#cartList').innerHTML=a.length?a.map(x=>`<div class="saved-row"><img src="${x.img}"><div><b>${x.name}</b><small style="display:block;color:#9eb5aa">${x.size||''} ${x.style||''}</small></div><b>${money(x.price*(x.qty||1))}</b></div>`).join(''):'<div class="empty"><b>Your cart is empty.</b></div>';$('#cartModal').classList.add('open')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view)return openDetail(b.dataset.view);if(b.dataset.quick)return quick(b.dataset.quick);if(b.dataset.save)return toggleSave(b.dataset.save);if(b.dataset.compare)return toggleCompare(b.dataset.compare);if(b.dataset.uncompare)return toggleCompare(b.dataset.uncompare);if(b.dataset.sview){$('#savedModal').classList.remove('open');return openDetail(b.dataset.sview)}if(b.dataset.scart){quick(b.dataset.scart);write(savedKey,read(savedKey,[]).filter(x=>x.id!==b.dataset.scart));openSaved();return render()}if(b.dataset.sremove){write(savedKey,read(savedKey,[]).filter(x=>x.id!==b.dataset.sremove));openSaved();return render()}if(b.dataset.close)return $('#'+b.dataset.close).classList.remove('open')});
$('#search').addEventListener('input',e=>{query=e.target.value;render()});$$('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$$('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});$('#sort').onchange=e=>{sort=e.target.value;render()};$('#savedBtn').onclick=openSaved;$('#cartBtn').onclick=openCart;$('#clearCompare').onclick=()=>{write(compareKey,[]);render()};$('#openCompare').onclick=openCompare;$('#backBtn').onclick=()=>{document.querySelector('#customerWorkspaceV63').style.display='none';document.querySelector('#customerOrbitWrapV63').style.display='block';scrollTo(0,0)};

const customerOrbitWrapV63=document.querySelector('#customerOrbitWrapV63');
const customerWorkspaceV63=document.querySelector('#customerWorkspaceV63');
function openCustomerV63(id){
 localStorage.setItem('customer_orbit_seen_v63_'+id,'1');
 document.querySelector('[data-customer-v63="'+id+'"]')?.classList.remove('new-customer-v63');
 customerOrbitWrapV63.style.display='none';customerWorkspaceV63.style.display='block';
 if(id==='saved'){openSaved()}
 else if(id==='cart'){openCart()}
 else if(id==='compare'){const ids=read(compareKey,[]);if(ids.length>=2)openCompare();else toast('Select 2 products to compare')}
 else if(id==='favorites'){filter='favorites';$('[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter==='favorites'));render()}
 else if(id==='search'){setTimeout(()=>$('#search')?.focus(),50)}
 else {filter='all';$('[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter==='all'));render()}
 scrollTo(0,0);
}
document.querySelectorAll('[data-customer-v63]').forEach(b=>{const id=b.dataset.customerV63;if(localStorage.getItem('customer_orbit_seen_v63_'+id))b.classList.remove('new-customer-v63');b.addEventListener('click',()=>openCustomerV63(id))});

const NEW_KEY_V62='mo_clean_browse_seen_v62';
const newSeenV62=()=>read(NEW_KEY_V62,{});
function markSeenV62(key){
  const s=newSeenV62();s[key]=true;write(NEW_KEY_V62,s);applyNewV62();
}
function applyNewV62(){
  const s=newSeenV62();
  const saved=$('#savedBtn'),cart=$('#cartBtn');
  saved?.classList.toggle('feature-new-v62',!s.saved);
  cart?.classList.toggle('feature-new-v62',!s.cart);
}
$('#savedBtn')?.addEventListener('click',()=>markSeenV62('saved'));
$('#cartBtn')?.addEventListener('click',()=>markSeenV62('cart'));

$('#search')?.addEventListener('input',syncSearchClearV62);

  query='';$('#search').value='';syncSearchClearV62();render();$('#search').focus();
});

const originalOpenCartV62=openCart;
openCart=function(){
  const a=read(cartKey,[]);
  const total=a.reduce((sum,x)=>sum+(Number(x.price)||0)*(Number(x.qty)||1),0);
  $('#cartList').innerHTML=a.length
    ? a.map(x=>`<div class="saved-row">
        <img src="${x.img}">
        <div><b>${x.name}</b><small style="display:block;color:#9eb5aa">${x.size||''} ${x.style||''}</small></div>
        <div style="text-align:right">
          <b>${money((Number(x.price)||0)*(Number(x.qty)||1))}</b>
          <div class="cart-row-actions">
            <button data-cart-minus="${x.key}">−</button>
            <span>${x.qty||1}</span>
            <button data-cart-plus="${x.key}">+</button>
            <button class="cart-remove" data-cart-remove="${x.key}">Remove</button>
          </div>
        </div>
      </div>`).join('')+`<div class="cart-total"><b>Total</b><strong>${money(total)}</strong></div>`
    : '<div class="empty"><b>Your cart is empty.</b></div>';
  $('#cartModal').classList.add('open');
};

document.addEventListener('click',e=>{
  const minus=e.target.closest?.('[data-cart-minus]');
  const plus=e.target.closest?.('[data-cart-plus]');
  const remove=e.target.closest?.('[data-cart-remove]');
  if(!minus&&!plus&&!remove)return;
  let cart=read(cartKey,[]);
  const key=String((minus||plus||remove).getAttribute(minus?'data-cart-minus':plus?'data-cart-plus':'data-cart-remove'));
  const idx=cart.findIndex(x=>String(x.key)===key);
  if(idx<0)return;
  if(remove)cart.splice(idx,1);
  else if(minus)cart[idx].qty=Math.max(1,(Number(cart[idx].qty)||1)-1);
  else cart[idx].qty=(Number(cart[idx].qty)||1)+1;
  write(cartKey,cart);render();openCart();
});
