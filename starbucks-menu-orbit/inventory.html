<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071c14">
<title>Menu Orbit — Inventory Center</title>
<style>
:root{--g:#00754a;--g2:#00a862;--bg:#03130d;--panel:#08251b;--cream:#f4efe6;--gold:#d4ad62;--line:rgba(255,255,255,.14);--muted:#aac0b5;--danger:#d66060;--warn:#f0c36a;--ok:#59cf91;--shadow:0 22px 60px rgba(0,0,0,.32)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#145d42,#061a13 42%,#020907);color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.wrap{width:min(1280px,calc(100% - 16px));margin:auto;padding:12px 0 60px}.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:10px 0;background:rgba(3,19,13,.96);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08)}.brand{display:flex;align-items:center;gap:10px}.logo{width:50px;height:50px;border-radius:50%;border:2px solid #fff;background:var(--g);display:grid;place-items:center;font:900 20px Georgia,serif}.brand h1{margin:0;font-size:clamp(21px,4vw,32px)}.brand p{margin:2px 0 0;color:var(--muted);font-size:11px}.spacer{flex:1}.btn{min-height:48px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:rgba(255,255,255,.07);color:#fff;font-weight:900}.btn.primary{border:0;background:linear-gradient(135deg,var(--g2),var(--g))}.btn.cream{background:var(--cream);color:#073421}.btn.danger{border-color:rgba(214,96,96,.45);color:#ffd0d0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.stat,.card{background:rgba(8,37,27,.95);border:1px solid var(--line);box-shadow:var(--shadow)}.stat{padding:15px;border-radius:17px}.stat strong{display:block;font-size:30px;color:#f2cf8b}.stat span{font-size:11px;color:var(--muted)}.card{border-radius:22px;padding:16px;margin-top:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.field{min-height:50px;border:1px solid var(--line);border-radius:13px;background:#0d3628;color:#fff;padding:0 12px}.search{flex:1;min-width:220px}.grid{display:grid;gap:9px;margin-top:12px}.row{display:grid;grid-template-columns:1.5fr .8fr .9fr .8fr 1fr auto;gap:8px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.04)}.row b{display:block}.row small{color:var(--muted)}.tag{display:inline-block;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900}.ok{background:rgba(89,207,145,.15);color:#a9f0c7}.warn{background:rgba(240,195,106,.16);color:#ffe0a0}.danger{background:rgba(214,96,96,.16);color:#ffc1c1}.actions{display:flex;gap:6px;flex-wrap:wrap}.mini{min-height:38px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.07);color:#fff;font-weight:800;padding:0 10px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.section-title h2{margin:0}.history{display:grid;gap:8px;margin-top:10px}.history article{padding:11px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.04);display:grid;grid-template-columns:1fr auto;gap:8px}.history small{color:var(--muted)}.modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:14px;background:rgba(0,0,0,.72);backdrop-filter:blur(8px)}.modal.open{display:grid}.modal-card{width:min(520px,100%);background:#08251b;border:1px solid var(--line);border-radius:22px;padding:18px}.form{display:grid;gap:10px}.form label{font-size:12px;font-weight:900}.form input,.form select{width:100%;margin-top:5px}.empty{text-align:center;padding:32px;color:var(--muted)}.reduce-motion *{animation:none!important;transition:none!important;scroll-behavior:auto!important}@media(max-width:960px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr 1fr}.actions{grid-column:1/-1}}@media(max-width:620px){.stats,.row{grid-template-columns:1fr}.top .spacer{display:none}.top .btn{flex:1}.toolbar>*{width:100%}.history article{grid-template-columns:1fr}.actions{grid-column:auto}.btn,.mini{min-height:52px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">I</div><div><h1>Inventory Center</h1><p>Menu Orbit • Stock, suppliers and reorder control</p></div></div><div class="spacer"></div><button class="btn" id="motionBtn">◌ Reduce Motion</button><button class="btn cream" onclick="location.href='staff-portal.html'">← Staff Portal</button></header>
<section class="stats"><div class="stat"><strong id="totalCount">0</strong><span>ITEMS TRACKED</span></div><div class="stat"><strong id="lowCount">0</strong><span>LOW STOCK</span></div><div class="stat"><strong id="outCount">0</strong><span>OUT OF STOCK</span></div><div class="stat"><strong id="supplierCount">0</strong><span>SUPPLIERS</span></div></section>
<section class="card"><div class="section-title"><h2>Live Inventory</h2><button class="btn primary" id="addBtn">＋ ADD ITEM</button></div><div class="toolbar"><input id="search" class="field search" placeholder="Search ingredient, packaging or supplier"><select id="category" class="field"><option value="all">All categories</option><option>Ingredients</option><option>Milk</option><option>Syrups</option><option>Tea & Refreshers</option><option>Packaging</option></select><select id="stockFilter" class="field"><option value="all">All stock levels</option><option value="low">Low stock</option><option value="out">Out of stock</option></select></div><div id="inventory" class="grid"></div></section>
<section class="card"><div class="section-title"><h2>Inventory History</h2><button class="btn" id="clearHistory">Clear History</button></div><div id="history" class="history"></div></section>
</div>
<div id="modal" class="modal"><div class="modal-card"><div class="section-title"><h2 id="modalTitle">Adjust Stock</h2><button class="btn" id="closeModal">✕</button></div><div class="form" id="modalForm"></div></div></div>
<script>
const seed=[
{id:1,cat:'Ingredients',name:'Espresso Beans',qty:14,unit:'kg',low:6,supplier:'Premium Coffee Supply',last:'2026-09-10'},
{id:2,cat:'Milk',name:'Fresh Milk',qty:22,unit:'cartons',low:10,supplier:'Metro Dairy',last:'2026-09-11'},
{id:3,cat:'Milk',name:'Oat Milk',qty:5,unit:'cartons',low:6,supplier:'Plant Pantry PH',last:'2026-09-09'},
{id:4,cat:'Syrups',name:'Vanilla Syrup',qty:8,unit:'bottles',low:4,supplier:'Cafe Essentials',last:'2026-09-08'},
{id:5,cat:'Syrups',name:'Caramel Syrup',qty:3,unit:'bottles',low:4,supplier:'Cafe Essentials',last:'2026-09-08'},
{id:6,cat:'Tea & Refreshers',name:'Matcha Powder',qty:7,unit:'packs',low:3,supplier:'Tea House PH',last:'2026-09-07'},
{id:7,cat:'Packaging',name:'Tall Cups',qty:120,unit:'pcs',low:50,supplier:'CupWorks',last:'2026-09-10'},
{id:8,cat:'Packaging',name:'Grande Cups',qty:42,unit:'pcs',low:50,supplier:'CupWorks',last:'2026-09-10'},
{id:9,cat:'Packaging',name:'Venti Lids',qty:0,unit:'pcs',low:30,supplier:'CupWorks',last:'2026-09-06'}
];
let items=JSON.parse(localStorage.getItem('mo_inventory_v2')||'null')||seed;
let history=JSON.parse(localStorage.getItem('mo_inventory_history')||'null')||[];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('mo_inventory_v2',JSON.stringify(items));localStorage.setItem('mo_inventory_history',JSON.stringify(history))}
function status(i){return i.qty<=0?['OUT OF STOCK','danger']:i.qty<=i.low?['LOW STOCK','warn']:['IN STOCK','ok']}
function stats(){ $('#totalCount').textContent=items.length;$('#lowCount').textContent=items.filter(i=>i.qty>0&&i.qty<=i.low).length;$('#outCount').textContent=items.filter(i=>i.qty<=0).length;$('#supplierCount').textContent=new Set(items.map(i=>i.supplier).filter(Boolean)).size }
function render(){const q=$('#search').value.toLowerCase(),cat=$('#category').value,f=$('#stockFilter').value;const list=items.filter(i=>(!q||[i.name,i.cat,i.supplier].join(' ').toLowerCase().includes(q))&&(cat==='all'||i.cat===cat)&&(f==='all'||(f==='low'&&i.qty>0&&i.qty<=i.low)||(f==='out'&&i.qty<=0)));$('#inventory').innerHTML=list.length?list.map(i=>{const [label,cls]=status(i);return `<article class="row"><div><b>${esc(i.name)}</b><small>${esc(i.cat)} • ${esc(i.supplier)}</small></div><div><b>${i.qty} ${esc(i.unit)}</b><small>Current stock</small></div><div><b>${i.low} ${esc(i.unit)}</b><small>Reorder level</small></div><div><span class="tag ${cls}">${label}</span></div><div><b>${esc(i.last||'—')}</b><small>Last restocked</small></div><div class="actions"><button class="mini" onclick="adjust(${i.id},'restock')">RESTOCK</button><button class="mini" onclick="adjust(${i.id},'adjust')">ADJUST</button></div></article>`}).join(''):'<div class="empty">No inventory items match this filter.</div>';stats();renderHistory()}
function log(text){history.unshift({text,time:new Date().toLocaleString('en-PH')});history=history.slice(0,60);save()}
function renderHistory(){$('#history').innerHTML=history.length?history.map(h=>`<article><b>${esc(h.text)}</b><small>${esc(h.time)}</small></article>`).join(''):'<div class="empty">No inventory changes yet.</div>'}
function openModal(title,html){$('#modalTitle').textContent=title;$('#modalForm').innerHTML=html;$('#modal').classList.add('open')}
window.adjust=(id,mode)=>{const i=items.find(x=>x.id===id);openModal(mode==='restock'?'Restock '+i.name:'Adjust '+i.name,`<label>${mode==='restock'?'Quantity to add':'New stock quantity'}<input class="field" id="qtyInput" type="number" min="0" value="${mode==='restock'?1:i.qty}"></label><label>Supplier<input class="field" id="supplierInput" value="${esc(i.supplier)}"></label><button class="btn primary" id="saveAdjust">SAVE CHANGE</button>`);$('#saveAdjust').onclick=()=>{const n=Math.max(0,Number($('#qtyInput').value)||0),before=i.qty;i.qty=mode==='restock'?i.qty+n:n;i.supplier=$('#supplierInput').value.trim()||i.supplier;if(mode==='restock')i.last=new Date().toISOString().slice(0,10);log(`${i.name}: ${before} → ${i.qty} ${i.unit}${mode==='restock'?' (restocked)':' (adjusted)'}`);save();$('#modal').classList.remove('open');render()}}
$('#addBtn').onclick=()=>openModal('Add Inventory Item',`<label>Item name<input class="field" id="newName" placeholder="e.g. Hazelnut Syrup"></label><label>Category<select class="field" id="newCat"><option>Ingredients</option><option>Milk</option><option>Syrups</option><option>Tea & Refreshers</option><option>Packaging</option></select></label><label>Current quantity<input class="field" id="newQty" type="number" min="0" value="0"></label><label>Unit<input class="field" id="newUnit" placeholder="pcs, cartons, bottles"></label><label>Reorder level<input class="field" id="newLow" type="number" min="0" value="5"></label><label>Supplier<input class="field" id="newSupplier" placeholder="Supplier name"></label><button class="btn primary" id="saveNew">ADD TO INVENTORY</button>`);
document.addEventListener('click',e=>{if(e.target?.id==='saveNew'){const name=$('#newName').value.trim();if(!name)return alert('Enter an item name.');const item={id:Date.now(),name,cat:$('#newCat').value,qty:Math.max(0,Number($('#newQty').value)||0),unit:$('#newUnit').value.trim()||'pcs',low:Math.max(0,Number($('#newLow').value)||0),supplier:$('#newSupplier').value.trim()||'Unassigned',last:'—'};items.push(item);log(`${item.name} added to inventory`);save();$('#modal').classList.remove('open');render()}});
$('#closeModal').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('open')};['search','category','stockFilter'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));$('#clearHistory').onclick=()=>{if(confirm('Clear inventory history?')){history=[];save();render()}};$('#motionBtn').onclick=()=>{document.body.classList.toggle('reduce-motion');$('#motionBtn').textContent=document.body.classList.contains('reduce-motion')?'● Motion Reduced':'◌ Reduce Motion'};render();
</script>
</body>
</html>
