<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071c14">
  <title>Menu Orbit — Activation Dashboard</title>
  <style>
    :root{--green:#00754a;--green2:#00a862;--ink:#04140e;--cream:#f4efe6;--gold:#f2cf8b;--line:rgba(255,255,255,.15);--panel:#08251b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#145d42,#061a13 42%,#020907);color:#fff;font:16px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(1120px,calc(100% - 24px));margin:auto;padding-bottom:48px}header{display:flex;gap:12px;align-items:center;padding:16px 0;position:sticky;top:0;z-index:4;background:rgba(4,20,14,.92);backdrop-filter:blur(14px)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(22px,4vw,34px)}.sub,.notice{color:#b8cdc3;line-height:1.5}.spacer{flex:1}.btn{min-height:50px;border:1px solid var(--line);border-radius:14px;padding:0 15px;background:rgba(255,255,255,.07);color:#fff;font-weight:850;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--green2),var(--green));border:0}.btn:disabled{opacity:.48;cursor:not-allowed}.card{background:rgba(8,37,27,.95);border:1px solid var(--line);border-radius:21px;padding:18px;margin-top:14px;box-shadow:0 18px 48px rgba(0,0,0,.25)}.login{width:min(520px,100%);margin:10vh auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.full{grid-column:1/-1}.form{display:grid;gap:10px}.form label{font-size:13px;font-weight:800}.form input,.form select,.form textarea{display:block;width:100%;min-height:50px;margin-top:5px;border:1px solid var(--line);border-radius:12px;background:#0d3628;color:#fff;padding:10px;font:inherit}.form textarea{min-height:90px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.tab{min-height:46px;border:1px solid var(--line);border-radius:999px;padding:0 14px;background:rgba(255,255,255,.05);color:#fff;font-weight:800;cursor:pointer}.tab.active{background:var(--cream);color:#06331f}.check{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:13px;margin:9px 0;background:rgba(255,255,255,.035)}.check input[type=checkbox]{width:23px;height:23px;accent-color:var(--green2)}.check small{display:block;color:#b8cdc3;margin-top:3px}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:rgba(242,207,139,.13);color:#ffe2a4;border:1px solid rgba(242,207,139,.35);font-size:12px;font-weight:850}.tag.live{background:rgba(0,168,98,.2);color:#bdf0d3;border-color:rgba(0,168,98,.48)}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;border-top:1px solid var(--line);padding:13px 0}.row:first-child{border-top:0}.row small{display:block;color:#b8cdc3;line-height:1.45;margin-top:4px}.error{color:#ffb5b5}.empty{text-align:center;padding:38px 8px;color:#b8cdc3}@media(max-width:650px){.wrap{width:min(100% - 16px,1120px)}header{flex-wrap:wrap;align-items:flex-start}.grid{grid-template-columns:1fr}.full{grid-column:auto}.btn{min-height:54px}.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <header><div><h1>Menu Orbit Activation</h1><p class="sub">Secure staff controls • authorization-gated</p></div><div class="spacer"></div><button class="btn" id="menuBtn">← Menu</button><button class="btn" id="signOutBtn" hidden>Sign out</button></header>
    <main id="app"></main>
  </div>
  <script src="config.js"></script>
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/+esm";
    const cfg=window.MENU_ORBIT_CONFIG||{},app=document.querySelector('#app'),signOut=document.querySelector('#signOutBtn'),db=cfg.supabaseUrl&&cfg.supabasePublishableKey?createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;
    const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    let role='';
    $('#menuBtn').onclick=()=>location.href='index.html';
    if(!db)app.innerHTML='<section class="card login"><h2>Backend unavailable</h2><p class="notice">Add the secure Supabase project configuration before activation controls can be used.</p></section>';else init();
    async function init(){const {data:{user}}=await db.auth.getUser();if(!user)return login();const [{data:staff},{data:roles}]=await Promise.all([db.from('staff_users').select('user_id').eq('user_id',user.id).maybeSingle(),db.from('orbit_user_roles').select('role').eq('user_id',user.id).maybeSingle()]);role=roles?.role||(staff?'branch_staff':'');if(!role)return denied();signOut.hidden=false;signOut.onclick=async()=>{await db.auth.signOut();location.reload()};dashboard()}
    function login(){app.innerHTML=`<section class="card login"><h2>Staff sign in</h2><p class="notice">Use an approved staff, manager, or administrator account.</p><form id="login" class="form"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary" type="submit">Sign in securely</button></form><p class="notice" id="msg"></p></section>`;$('#login').onsubmit=async e=>{e.preventDefault();const email=$('#email').value.trim().toLowerCase(),password=$('#password').value;if(email==='demo@menuorbit.test'&&password==='OrbitDemo2026!'){demoDashboard();return}const {error}=await db.auth.signInWithPassword({email,password});if(error){$('#msg').textContent=error.message;$('#msg').className='notice error'}else location.reload()}}
    function denied(){app.innerHTML='<section class="card login"><h2>Access not approved</h2><p class="notice">This account is not assigned to Menu Orbit staff, manager, or administrator access. An authorized administrator must assign your role first.</p></section>'}
    function demoDashboard(){signOut.hidden=true;app.innerHTML=`<section class="card"><span class="tag">read-only demo</span><h2 style="margin-top:12px">Menu Orbit Activation Preview</h2><p class="notice">You are viewing the dashboard layout only. No branch, inventory, customer, order, payment, or account data is loaded or changed.</p><div class="check"><input type="checkbox" disabled><span><b>Brand authorization received</b><small>Demo preview — no approval is recorded.</small></span></div><div class="check"><input type="checkbox" disabled><span><b>Live inventory connected</b><small>Demo preview — no inventory is connected.</small></span></div><div class="check"><input type="checkbox" disabled><span><b>POS integration connected</b><small>Demo preview — order updates remain locked.</small></span></div><button class="btn" id="demoBack">Back to sign in</button></section>`;$('#demoBack').onclick=login}
    function dashboard(){app.innerHTML=`<section class="card"><span class="tag">${esc(role.replace('_',' '))}</span><h2 style="margin-top:12px">Go Live Checklist</h2><p class="notice">Turning on a checkbox records readiness only. Checkout remains unavailable until authorized business integrations are completed.</p><div id="checklist" class="empty">Loading activation status…</div><button class="btn primary" id="saveReadiness">Save checklist</button></section><div class="tabs"><button class="tab active" data-tab="branches">Branches</button><button class="tab" data-tab="inventory">Inventory</button><button class="tab" data-tab="promotions">Promotions</button><button class="tab" data-tab="orders">Orders</button></div><section class="card" id="workspace"></section>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));({branches,inventory,promotions,orders})[b.dataset.tab]()});loadReadiness();branches()}
    const items=[['brand_authorized','Brand authorization received','Written brand approval is recorded.'],['branch_data_verified','Verified branch data uploaded','Addresses, hours, maps, phone, and fulfillment are confirmed.'],['inventory_connected','Live inventory connected','Per-branch availability is being updated by an authorized source.'],['pos_connected','POS integration connected','Only then can order statuses be updated.'],['payments_connected','Payment merchant accounts connected','GCash, Maya, or card processing is approved and server-side.'],['rewards_connected','Rewards integration connected','Official rewards and redemptions are authorized.'],['delivery_connected','Delivery provider connected','Zones, fees, and tracking are verified.'],['privacy_policy_url','Privacy Policy published','Use the URL field below.'],['terms_url','Terms and Refund Policy published','Use the URL field below.'],['support_contact_active','Customer support contact activated','An official support contact and response process are active.']];
    async function loadReadiness(){const {data,error}=await db.from('platform_readiness').select('*').eq('id',true).single();if(error){$('#checklist').innerHTML=`<p class="error">${esc(error.message)}</p>`;return}$('#checklist').innerHTML=items.map(([key,title,desc])=>key.endsWith('_url')?`<label class="check"><input type="checkbox" data-ready="${key}" ${data[key]?'checked':''}><span><b>${title}</b><small>${desc}</small><input data-url="${key}" value="${esc(data[key]||'')}" placeholder="https://…"></span></label>`:`<label class="check"><input type="checkbox" data-ready="${key}" ${data[key]?'checked':''}><span><b>${title}</b><small>${desc}</small></span></label>`).join('');$('#saveReadiness').onclick=async()=>{const values={};document.querySelectorAll('[data-ready]').forEach(x=>values[x.dataset.ready]=x.checked);document.querySelectorAll('[data-url]').forEach(x=>{values[x.dataset.url]=x.value.trim()||null});const {error}=await db.from('platform_readiness').update({...values,updated_at:new Date().toISOString()}).eq('id',true);alert(error?error.message:'Checklist saved. Real checkout is still protected until all authorized integrations are enabled.')}}
    async function branches(){const ws=$('#workspace');ws.innerHTML=`<h2>Verified Branches</h2><p class="notice">Do not mark a branch active or verified until an authorized business source confirms every detail.</p><div class="grid"><form class="form full" id="branchForm"><label>Branch name<input id="branchName" required maxlength="120"></label><label>Address<input id="branchAddress" required maxlength="300"></label><label>City<input id="branchCity" required maxlength="100"></label><label>Phone<input id="branchPhone" maxlength="30"></label><label>Map latitude<input id="branchLat" inputmode="decimal"></label><label>Map longitude<input id="branchLng" inputmode="decimal"></label><label>Preparation minutes<input id="branchPrep" type="number" min="1" max="180"></label><label>Queue status<select id="branchQueue"><option value="not_published">Not published</option><option value="closed">Closed</option><option value="limited">Limited</option><option value="open">Open</option></select></label><label>Authorization status<select id="branchAuth"><option value="pending">Pending</option><option value="verified">Verified</option><option value="suspended">Suspended</option></select></label><label><input id="branchPickup" type="checkbox"> Pickup enabled</label><label><input id="branchCurbside" type="checkbox"> Curbside enabled</label><label><input id="branchActive" type="checkbox"> Active for customers</label><button class="btn primary" type="submit">Save branch</button></form></div><div id="branchList" class="empty">Loading branches…</div>`;$('#branchForm').onsubmit=saveBranch;const {data,error}=await db.from('branches').select('*').order('name');$('#branchList').innerHTML=error?`<p class="error">${esc(error.message)}</p>`:data?.length?data.map(b=>`<div class="row"><div><b>${esc(b.name)}</b> <span class="tag ${b.is_active&&b.authorization_status==='verified'?'live':''}">${esc(b.authorization_status)}</span><small>${esc(b.address)}, ${esc(b.city)}<br>Pickup: ${b.pickup_enabled?'enabled':'off'} • Queue: ${esc(b.queue_status)}</small></div><button class="btn" data-edit-branch="${b.id}">Edit</button></div>`).join(''):'<div class="empty">No branch data yet.</div>';document.querySelectorAll('[data-edit-branch]').forEach(x=>x.onclick=()=>editBranch(x.dataset.editBranch,data))}
    async function saveBranch(e){e.preventDefault();const values={name:$('#branchName').value.trim(),address:$('#branchAddress').value.trim(),city:$('#branchCity').value.trim(),phone:$('#branchPhone').value.trim()||null,latitude:$('#branchLat').value||null,longitude:$('#branchLng').value||null,prep_minutes:$('#branchPrep').value||null,queue_status:$('#branchQueue').value,authorization_status:$('#branchAuth').value,pickup_enabled:$('#branchPickup').checked,curbside_enabled:$('#branchCurbside').checked,is_active:$('#branchActive').checked,updated_at:new Date().toISOString()},id=e.currentTarget.dataset.id;const res=id?await db.from('branches').update(values).eq('id',id):await db.from('branches').insert(values);if(res.error)return alert(res.error.message);branches()}
    function editBranch(id,list){const b=list.find(x=>x.id===id),f=$('#branchForm');f.dataset.id=id;$('#branchName').value=b.name;$('#branchAddress').value=b.address;$('#branchCity').value=b.city;$('#branchPhone').value=b.phone||'';$('#branchLat').value=b.latitude||'';$('#branchLng').value=b.longitude||'';$('#branchPrep').value=b.prep_minutes||'';$('#branchQueue').value=b.queue_status;$('#branchAuth').value=b.authorization_status;$('#branchPickup').checked=b.pickup_enabled;$('#branchCurbside').checked=b.curbside_enabled;$('#branchActive').checked=b.is_active;f.querySelector('button').textContent='Update branch';window.scrollTo({top:0,behavior:'smooth'})}
    async function inventory(){const ws=$('#workspace'),{data:branchData}=await db.from('branches').select('id,name').order('name');ws.innerHTML=`<h2>Branch Inventory</h2><p class="notice">Availability is visible to customers only for active, verified branches.</p>${branchData?.length?`<form class="form" id="inventoryForm"><label>Branch<select id="invBranch">${branchData.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></label><label>Product ID<input id="invProduct" required placeholder="Example: latte"></label><label>Availability<select id="invStatus"><option value="unavailable">Unavailable</option><option value="available">Available</option><option value="low_stock">Low Stock</option><option value="sold_out">Sold Out</option><option value="temporarily_unavailable">Temporarily Unavailable</option></select></label><label>Verified price<input id="invPrice" type="number" min="0" step="0.01"></label><button class="btn primary" type="submit">Save inventory</button></form>`:'<div class="empty">Create a branch first.</div>'}<div id="inventoryList" class="empty">Loading inventory…</div>`;$('#inventoryForm')?.addEventListener('submit',async e=>{e.preventDefault();const {error}=await db.from('branch_inventory').upsert({branch_id:$('#invBranch').value,product_id:$('#invProduct').value.trim(),availability:$('#invStatus').value,current_price:$('#invPrice').value||null,verified_at:new Date().toISOString(),updated_at:new Date().toISOString()});if(error)alert(error.message);else inventory()});const {data,error}=await db.from('branch_inventory').select('product_id,availability,current_price,branches(name)').order('updated_at',{ascending:false}).limit(100);$('#inventoryList').innerHTML=error?`<p class="error">${esc(error.message)}</p>`:data?.length?data.map(x=>`<div class="row"><div><b>${esc(x.product_id)}</b> <span class="tag">${esc(x.availability)}</span><small>${esc(x.branches?.name||'')} • ${x.current_price==null?'No verified price':'₱'+x.current_price}</small></div></div>`).join(''):'<div class="empty">No inventory records yet.</div>'}
    async function promotions(){const ws=$('#workspace');ws.innerHTML=`<h2>Promotions & Rewards</h2><p class="notice">A promotion stays hidden from customers unless it is both verified and active.</p><form class="form" id="promoForm"><label>Promo code<input id="promoCode" required maxlength="40" style="text-transform:uppercase"></label><label>Title<input id="promoTitle" required maxlength="160"></label><label>Start date/time<input id="promoStart" type="datetime-local" required></label><label>End date/time<input id="promoEnd" type="datetime-local" required></label><label>Minimum amount<input id="promoMinimum" type="number" min="0" step="0.01" value="0"></label><label>Authorization<select id="promoAuth"><option value="pending">Pending</option><option value="verified">Verified</option><option value="suspended">Suspended</option></select></label><label><input id="promoActive" type="checkbox"> Active</label><button class="btn primary" type="submit">Save promotion</button></form><div id="promoList" class="empty">Loading promotions…</div>`;$('#promoForm').onsubmit=async e=>{e.preventDefault();const {error}=await db.from('promotions').insert({code:$('#promoCode').value.trim().toUpperCase(),title:$('#promoTitle').value.trim(),start_at:new Date($('#promoStart').value).toISOString(),end_at:new Date($('#promoEnd').value).toISOString(),minimum_amount:$('#promoMinimum').value||0,authorization_status:$('#promoAuth').value,active:$('#promoActive').checked});if(error)alert(error.message);else promotions()};const {data,error}=await db.from('promotions').select('*').order('created_at',{ascending:false});$('#promoList').innerHTML=error?`<p class="error">${esc(error.message)}</p>`:data?.length?data.map(x=>`<div class="row"><div><b>${esc(x.code)} — ${esc(x.title)}</b><small>${esc(x.authorization_status)} • ${x.active?'active':'not active'}</small></div></div>`).join(''):'<div class="empty">No promotions yet.</div>'}
    async function orders(){const ws=$('#workspace'),{data:ready}=await db.from('platform_readiness').select('pos_connected').eq('id',true).single();ws.innerHTML=`<h2>Order Status</h2><p class="notice">${ready?.pos_connected?'POS is marked connected. Status updates are allowed for authorized operators.':'Order-status controls remain locked until POS integration is marked connected by an authorized manager.'}</p><a class="btn ${ready?.pos_connected?'primary':''}" href="staff.html" style="display:inline-grid;place-items:center;text-decoration:none">Open staff order dashboard</a>`}
  </script>
</body>
</html>
