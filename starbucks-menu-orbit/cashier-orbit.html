<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Menu Orbit — Cashier Workspace</title><style>:root{--g:#063b2b;--gold:#d4ad62;--cream:#f7f1e6}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 50% 15%,#176348,#03251b 68%);color:#fff;min-height:100vh}header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #ffffff24}header b{color:#f1d38e}.back{background:transparent;color:#fff;border:1px solid #ffffff55;border-radius:10px;padding:9px 12px}.title{text-align:center;margin:26px 0 8px}.title h1{margin:0;font-size:clamp(28px,5vw,44px)}.title p{color:#c8d7d0}.orbit{position:relative;width:min(680px,94vw);height:min(680px,94vw);min-height:390px;margin:10px auto 45px}.orbit:before{content:"";position:absolute;left:14%;top:14%;width:72%;height:72%;border:1px solid #d4ad6280;border-radius:50%}.center,.node{position:absolute;border-radius:50%;color:#fff;font-weight:950;text-align:center}.center{left:50%;top:50%;transform:translate(-50%,-50%);width:170px;height:170px;background:radial-gradient(circle,#187552,#042b20);border:5px solid var(--gold);z-index:3}.center small{display:block;color:#f1d38e;margin-top:7px}.node{transform:translate(-50%,-50%);width:112px;height:112px;background:#0a3527;border:2px solid var(--gold);font-size:10px;z-index:4}.node span{display:block;font-size:22px;margin-bottom:4px}.panel{display:none;width:min(760px,94vw);margin:20px auto 50px;background:#fff;color:#10251d;border-radius:20px;padding:20px}.panel button{border:0;border-radius:10px;padding:10px 13px;font-weight:850}.row{padding:12px 0;border-bottom:1px solid #e4e9e6}.primary{background:var(--g);color:#fff}@media(max-width:650px){.center{width:122px;height:122px;font-size:11px}.node{width:84px;height:84px;font-size:8px}.node span{font-size:17px}}</style></head><body><header><div><b>CASHIER</b><br><small>Unified Staff System</small></div><button class="back" onclick="location.href='staff-portal.html'">Staff Portal</button></header><section id="home"><div class="title"><h1>Cashier Orbit</h1><p>Orders and payments</p></div><div class="orbit"><button class="center" id="center">CASHIER<small>LIVE POS</small></button><div id="nodes"></div></div></section><section class="panel" id="panel"><button onclick="closePanel()">← Back to Cashier Orbit</button><div id="content"></div></section><script>if(sessionStorage.getItem('menuorbit_role')!=='cashier')location.replace('staff-portal.html');const tools=[['new','＋','NEW ORDER'],['queue','≡','ORDER QUEUE'],['pay','₱','PAYMENTS'],['hold','Ⅱ','HOLD ORDER'],['receipt','▤','RECEIPTS'],['promo','%','PROMOS'],['refund','↶','REFUND'],['close','✓','SHIFT CLOSE']];const pts=[[50,7],[79,17],[93,50],[79,83],[50,93],[21,83],[7,50],[21,17]];nodes.innerHTML=tools.map((x,i)=>`<button class="node" data-id="${x[0]}" style="left:${pts[i][0]}%;top:${pts[i][1]}%"><span>${x[1]}</span>${x[2]}</button>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openTool(b.dataset.id));center.onclick=()=>openTool('queue');function openTool(id){home.style.display='none';panel.style.display='block';const map={new:['New Order','Start a new customer order and add menu items.'],queue:['Order Queue','MO-1201 • Waiting\nMO-1202 • Preparing\nMO-1203 • Ready'],pay:['Payments','Cash • Card • E-wallet'],hold:['Hold Order','No held orders in this demo workspace.'],receipt:['Receipts','Search and reprint recent receipts.'],promo:['Promotions','Apply approved promotions and discounts.'],refund:['Refund / Void','Manager approval required for protected actions.'],close:['Shift Close','Review sales, cash drawer, unresolved orders, and handover notes.']};let [t,b]=map[id];content.innerHTML=`<h2>${t}</h2>`+b.split('\n').map(x=>`<div class="row">${x}</div>`).join('')+(id==='new'?'<p><button class="primary">START ORDER</button></p>':'')}function closePanel(){panel.style.display='none';home.style.display='block'}</script></body></html>
