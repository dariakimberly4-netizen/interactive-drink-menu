<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#041a13">
<title>Starbucks Menu Orbit</title>
<style>html,body{margin:0;width:100%;height:100%;background:#041a13;color:#fff;font-family:system-ui,sans-serif}#boot{position:fixed;inset:0;display:grid;place-items:center;font-weight:800;letter-spacing:.06em;background:#041a13}</style>
</head>
<body>
<div id="boot">OPENING MENU ORBIT…</div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const reg of regs) await reg.unregister();
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}

  const insideFrame = window.top !== window.self;
  if(insideFrame){
    location.replace('./index.html?legacyHub='+Date.now()+'#orbit');
  }else{
    location.replace('./v97.html?live=20261006-0310#orbit');
  }
})();
</script>
</body>
</html>
