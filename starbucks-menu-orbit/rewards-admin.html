<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Rewards Admin</title><style>:root{--g:#00754a;--gold:#d4ad62}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#061b13;color:#fff;font:16px Inter,system-ui,sans-serif}.shell{max-width:1050px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font:700 28px Georgia,serif;color:#ffe2a0}.card{margin-top:15px;padding:18px;border:1px solid rgba(255,255,255,.13);border-radius:20px;background:linear-gradient(135deg,rgba(0,117,74,.32),rgba(255,255,255,.04))}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{padding:15px;border-radius:15px;background:rgba(0,0,0,.22)}.stat b{display:block;color:#ffe2a0;font-size:26px}.stat small{color:#bfd4c8}button,a{min-height:46px;border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:0 14px;background:#00754a;color:#fff;font:800 15px Inter,sans-serif;text-decoration:none;cursor:pointer}input{min-height:46px;border-radius:12px;border:0;padding:0 12px;font:inherit;width:100%}.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}.log{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.12)}.log small{display:block;color:#b9cdc2;margin-top:3px}.note{font-size:13px;color:#b9cdc2;line-height:1.45}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.shell{padding:15px}}</style></head><body><main class="shell"><div class="top"><div class="brand">STAR REWARDS ADMIN</div><a href="index.html">Back to Menu</a></div><section class="card"><div class="stats" id="stats"></div></section><section class="card"><h2>Member database</h2><div id="member"></div></section><section class="card"><h2>Promotion controls</h2><div class="row"><input id="promo" placeholder="New promotion, e.g. Double Stars Friday"><button id="addPromo">Create promotion</button></div><div id="promos" class="note" style="margin-top:12px"></div></section><section class="card"><h2>Reward settings</h2><div class="row"><input id="needed" type="number" min="1" value="5"><button id="saveSetting">Set Stars Needed</button><button id="birthday">Create Birthday Voucher</button></div><p class="note">This prototype uses a fixed five-star earning cycle in the customer menu. The setting is saved for the admin record and ready to connect to a server rule.</p></section><section class="card"><h2>Redemption and reward history</h2><div id="logs"></div></section></main><script>const K='starRewardsMember',A='starRewardsAudit',S='starRewardsSettings';const $=s=>document.querySelector(s);let r=JSON.parse(localStorage.getItem(K)||'null'),a=JSON.parse(localStorage.getItem(A)||'[]'),s=Object.assign({starsNeeded:5},JSON.parse(localStorage.getItem(S)||'{}'));function render(){const redeemed=a.filter(x=>x.action==='REWARD REDEEMED').length,earned=a.filter(x=>x.action==='STARS EARNED'||x.action==='STAR ADDED').length;$('#stats').innerHTML=[['Total members',r?1:0],['Active rewards',r?.rewards||0],['Rewards redeemed',redeemed],['Returning customers',r?.orders?.length>1?1:0],['Birthday rewards sent',r?.birthday?1:0]].map(x=>'<div class="stat"><b>'+x[1]+'</b><small>'+x[0]+'</small></div>').join('');$('#member').innerHTML=r?'<div class="log"><b>'+r.name+'</b><small>'+r.code+' • '+r.stars+' Stars • '+r.rewards+' active reward(s)<br>Most ordered drinks: '+(r.orders?.length?'Coffee beverages ('+r.orders.reduce((n,x)=>n+x.drinks,0)+' eligible drinks)':'No completed orders yet')+'</small></div>':'<p class="note">No local member wallet has been created yet.</p>';$('#promos').innerHTML=r?.promotions?.length?r.promotions.map(x=>'• '+x).join('<br>'):'No promotions created.';$('#logs').innerHTML=a.length?a.slice(0,30).map(x=>'<div class="log"><b>'+x.action+'</b><small>'+x.name+' • '+x.detail+'<br>'+new Date(x.at).toLocaleString('en-PH')+'</small></div>').join(''):'<p class="note">No history yet.</p>';$('#needed').value=s.starsNeeded}$('#addPromo').onclick=()=>{const v=$('#promo').value.trim();if(!v)return;if(!r)r={name:'Kimmy Daria',code:'STAR-ADMIN-DEMO',stars:0,rewards:0,orders:[],promotions:[]};r.promotions=[...(r.promotions||[]),v];localStorage.setItem(K,JSON.stringify(r));$('#promo').value='';render()};$('#saveSetting').onclick=()=>{s.starsNeeded=Math.max(1,Number($('#needed').value)||5);localStorage.setItem(S,JSON.stringify(s));render()};$('#birthday').onclick=()=>{if(!r)return alert('Create a member wallet first.');r.birthday=true;localStorage.setItem(K,JSON.stringify(r));a.unshift({id:'SR-'+Date.now(),at:new Date().toISOString(),action:'BIRTHDAY VOUCHER CREATED',detail:'Admin-created birthday voucher',member:r.code,name:r.name});localStorage.setItem(A,JSON.stringify(a));render()};render()</script></body></html>
