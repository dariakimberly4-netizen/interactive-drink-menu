<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071c14"><title>Menu Orbit — Supplier Reorders</title><style>:root{--g:#00754a;--g2:#00a862;--cream:#f4efe6;--line:rgba(255,255,255,.14);--muted:#aac0b5;--warn:#f0c36a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#145d42,#061a13 42%,#020907);color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{width:min(1100px,calc(100% - 16px));margin:auto;padding:14px 0 50px}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.logo{width:50px;height:50px;border-radius:50%;border:2px solid #fff;background:var(--g);display:grid;place-items:center;font-weight:900}.top h1{margin:0}.top p{margin:2px 0;color:var(--muted);font-size:12px}.spacer{flex:1}.btn{min-height:48px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.07);color:#fff;font-weight:900;padding:0 14px}.btn.cream{background:var(--cream);color:#073421}.card{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:20px;background:rgba(8,37,27,.95)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.stat{padding:14px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.04)}.stat b{display:block;font-size:26px;color:#f2cf8b}.stat span{font-size:10px;color:var(--muted)}.list{display:grid;gap:9px}.row{display:grid;grid-template-columns:1.4fr 1fr .8fr .9fr auto;gap:9px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04)}small{color:var(--muted)}.tag{display:inline-block;padding:6px 8px;border-radius:999px;background:rgba(240,195,106,.16);color:#ffe0a0;font-size:10px;font-weight:900}.actions{display:flex;gap:6px;flex-wrap:wrap}.mini{min-height:40px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.07);color:#fff;font-weight:850}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.spacer{display:none}.top .btn{flex:1}}@media(max-width:460px){.stats{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="top"><div class="logo">R</div><div><h1>Supplier Reorders</h1><p>Menu Orbit • Auto-generated low-stock requests</p></div><div class="spacer"></div><button class="btn" onclick="location.href='inventory.html'">Inventory</button><button class="btn cream" onclick="location.href='staff-portal.html'">Staff Portal</button></header><section class="stats"><div class="stat"><b id="pending">0</b><span>PENDING APPROVAL</span></div><div class="stat"><b id="approved">0</b><span>APPROVED</span></div><div class="stat"><b id="sent">0</b><span>SENT</span></div><div class="stat"><b id="received">0</b><span>RECEIVED</span></div></section><section class="card"><h2>Reorder Queue</h2><p style="color:var(--muted)">Demo requests are generated automatically when completed demo orders push inventory to the reorder threshold. Live requests are stored securely in Supabase.</p><div id="list" class="list"></div></section></div><script>const K='mo_supplier_reorders',I='mo_inventory_v2',H='mo_inventory_history';const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??d}catch{return d}},put=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let rows=get(K,[]);function render(){for(const s of ['pending','approved','sent','received'])document.getElementById(s).textContent=rows.filter(r=>r.status===s.toUpperCase().replace(' ','_')||r.status===s.toUpperCase()+' APPROVAL').length;document.getElementById('pending').textContent=rows.filter(r=>r.status==='PENDING APPROVAL').length;document.getElementById('list').innerHTML=rows.length?rows.map((r,i)=>`<article class="row"><div><b>${r.item}</b><small>${r.id} • Source ${r.sourceOrder||'manual'}</small></div><div><b>${r.supplier}</b><small>Supplier</small></div><div><b>${r.qty} ${r.unit}</b><small>Reorder qty</small></div><div><span class="tag">${r.status}</span></div><div class="actions">${r.status==='PENDING APPROVAL'?`<button class="mini" onclick="setStatus(${i},'APPROVED')">Approve</button>`:''}${r.status==='APPROVED'?`<button class="mini" onclick="setStatus(${i},'SENT')">Mark Sent</button>`:''}${r.status==='SENT'?`<button class="mini" onclick="receive(${i})">Receive</button>`:''}</div></article>`).join(''):'<div class="empty">No supplier reorder requests yet.</div>'}window.setStatus=(i,s)=>{rows[i].status=s;put(K,rows);let h=get(H,[]);h.unshift({text:`REORDER • ${rows[i].item}: ${s}`,time:new Date().toLocaleString('en-PH')});put(H,h.slice(0,100));render()};window.receive=i=>{const r=rows[i],inv=get(I,[]),item=inv.find(x=>x.id===r.itemId);if(item){item.qty=Math.round(((+item.qty||0)+(+r.qty||0))*1000)/1000;item.last=new Date().toISOString().slice(0,10);put(I,inv)}setStatus(i,'RECEIVED')};render();</script></body></html>
