<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Menu Orbit — Staff Portal</title>
<style>
:root{--green:#063b2b;--cream:#f7f3ea;--line:#d8dedb;--ink:#17352a;--muted:#708078}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--cream);color:var(--ink)}
button,input{font:inherit}
header{background:var(--green);color:#fff;text-align:center;padding:18px 16px}
header strong{display:block;font-size:18px;letter-spacing:.04em}
header span{display:block;font-size:12px;opacity:.82;margin-top:2px}
main{width:min(520px,100%);margin:0 auto;padding:28px 16px 40px}
.hero{text-align:center;margin-bottom:22px}.hero h1{margin:0 0 6px;font-size:32px}.hero p{margin:0;color:var(--muted)}
.roles{display:grid;gap:12px}
.role{width:100%;min-height:64px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);padding:0 18px;display:flex;align-items:center;justify-content:space-between;text-align:left;font-weight:850;font-size:18px;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.role .left{display:flex;align-items:center;gap:13px}.role .icon{font-size:24px}.role .arrow{color:#8c9993;font-size:20px}.role:active{transform:scale(.99)}
.login{display:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 8px 24px rgba(0,0,0,.05)}
.login.show{display:block}.hide{display:none!important}
.login h2{margin:0 0 4px;text-align:center;font-size:26px}.login p{margin:0 0 20px;text-align:center;color:var(--muted)}
label{display:block;font-size:12px;font-weight:850;margin:14px 0 6px}input{width:100%;min-height:50px;border:1px solid #cbd4cf;border-radius:10px;padding:0 13px;background:#fff;color:var(--ink)}
.actions{display:grid;gap:9px;margin-top:18px}.primary,.back{min-height:50px;border-radius:10px;border:0;font-weight:900}.primary{background:var(--green);color:#fff}.demo{background:#efe2b7;color:#4a3d10}.back{background:#e9eeeb;color:var(--ink)}
@media(max-width:480px){main{padding-top:22px}.hero h1{font-size:28px}.role{min-height:60px;font-size:17px}}
</style>
</head>
<body>
<header><strong>MENU ORBIT</strong><span>Unified Staff System</span></header>
<main>
<section class="hero" id="hero"><h1>Staff Portal</h1><p>Select your role.</p></section>
<section class="roles" id="roles">
<button class="role" data-role="cashier"><span class="left"><span class="icon">₱</span><span>Cashier</span></span><span class="arrow">›</span></button>
<button class="role" data-role="barista"><span class="left"><span class="icon">☕</span><span>Barista</span></span><span class="arrow">›</span></button>
<button class="role" data-role="inventory"><span class="left"><span class="icon">▣</span><span>Inventory</span></span><span class="arrow">›</span></button>
<button class="role" data-role="manager"><span class="left"><span class="icon">◆</span><span>Manager</span></span><span class="arrow">›</span></button>
</section>
<section class="login" id="login">
<h2 id="roleTitle">Role Login</h2>
<p>One login only for this role.</p>
<label for="email">STAFF EMAIL</label><input id="email" autocomplete="username">
<label for="pass">PASSWORD</label><input id="pass" type="password" autocomplete="current-password">
<div class="actions">
<button class="primary" id="signIn">SIGN IN</button>
<button class="primary demo" id="demo">ONE-TAP DEMO</button>
<button class="back" id="back">← Back</button>
</div>
</section>
</main>
<script>
const roleData={
 cashier:{name:'Cashier',url:'cashier-orbit.html'},
 barista:{name:'Barista',url:'barista-orbit.html'},
 inventory:{name:'Inventory',url:'inventory-orbit.html'},
 manager:{name:'Manager',url:'manager-orbit.html'}
};
let selected='';
const hero=document.getElementById('hero'),roles=document.getElementById('roles'),login=document.getElementById('login'),roleTitle=document.getElementById('roleTitle'),email=document.getElementById('email'),pass=document.getElementById('pass');
document.querySelectorAll('[data-role]').forEach(btn=>btn.addEventListener('click',()=>{
 selected=btn.dataset.role;
 roleTitle.textContent=roleData[selected].name+' Login';
 email.value='';pass.value='';
 hero.classList.add('hide');roles.classList.add('hide');login.classList.add('show');
}));
function openRole(){if(!selected)return;sessionStorage.setItem('menuorbit_role',selected);location.href=roleData[selected].url}
document.getElementById('signIn').onclick=()=>{if(email.value.trim()&&pass.value)openRole()};
document.getElementById('demo').onclick=openRole;
document.getElementById('back').onclick=()=>{selected='';login.classList.remove('show');hero.classList.remove('hide');roles.classList.remove('hide')};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&login.classList.contains('show'))document.getElementById('signIn').click()});
</script>
</body>
</html>
