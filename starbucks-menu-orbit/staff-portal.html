<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Menu Orbit — Staff Portal</title>
<style>
:root{--green:#063b2b;--green2:#0b5b43;--gold:#d4ad62;--cream:#f7f1e6;--ink:#17352a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:radial-gradient(circle at 50% 12%,#17684a 0,#063b2b 48%,#021b14 100%);color:#fff;display:flex;flex-direction:column}
button,input{font:inherit}
header{padding:16px 20px;border-bottom:1px solid #ffffff22;background:#031f17aa;backdrop-filter:blur(14px)}
header b{display:block;color:#f2d493;letter-spacing:.08em;font-size:14px}header small{color:#c9d8d1}
main{width:min(760px,100%);margin:auto;padding:24px 16px 38px}
.hero{text-align:center;margin-bottom:22px}.hero h1{font-size:clamp(30px,7vw,48px);margin:0 0 6px}.hero p{margin:0;color:#c9d8d1}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.role{min-height:150px;border:1px solid #ffffff26;border-radius:22px;background:linear-gradient(145deg,#0c4c39,#073326);color:#fff;padding:20px;text-align:left;box-shadow:0 16px 34px #0004;transition:.18s transform,.18s border-color}
.role:active{transform:scale(.98)}.role:hover{border-color:var(--gold)}
.icon{font-size:34px;display:block;margin-bottom:14px}.role strong{font-size:21px;display:block}.role small{display:block;margin-top:5px;color:#c8d8d1}
.login{display:none;background:#fff;color:var(--ink);border-radius:24px;padding:24px;box-shadow:0 24px 70px #0007}
.login.show{display:block}.roles.hide,.hero.hide{display:none}
.login h2{text-align:center;margin:0 0 5px}.login .sub{text-align:center;color:#6e7a74;margin-bottom:20px}
.field{margin:14px 0}.field label{display:block;font-size:11px;font-weight:900;letter-spacing:.05em;margin-bottom:6px}.field input{width:100%;padding:14px;border:1px solid #cbd5cf;border-radius:12px;background:#fff;color:#17352a}
.actions{display:grid;gap:10px;margin-top:18px}.primary,.back{min-height:52px;border:0;border-radius:13px;font-weight:900}.primary{background:var(--green);color:#fff}.demo{background:#f6e4a8;color:#4d3d00}.back{background:#e9eeeb;color:#17352a}
.note{margin-top:14px;font-size:12px;color:#718078;text-align:center;line-height:1.5}
@media(max-width:560px){.roles{grid-template-columns:1fr}.role{min-height:118px}.hero{margin-bottom:18px}}
</style>
</head>
<body>
<header><b>MENU ORBIT</b><small>Unified Staff System</small></header>
<main>
<section class="hero" id="hero"><h1>Staff Portal</h1><p>Select your role. One login per role.</p></section>
<section class="roles" id="roles">
<button class="role" data-role="cashier"><span class="icon">₱</span><strong>Cashier</strong><small>Orders and payments</small></button>
<button class="role" data-role="barista"><span class="icon">☕</span><strong>Barista</strong><small>Drink preparation and queue</small></button>
<button class="role" data-role="inventory"><span class="icon">▣</span><strong>Inventory</strong><small>Stock and supply control</small></button>
<button class="role" data-role="manager"><span class="icon">◆</span><strong>Manager</strong><small>Shift and operations overview</small></button>
</section>
<section class="login" id="login">
<h2 id="roleTitle">Role Login</h2>
<div class="sub">Sign in once to open your role workspace.</div>
<div class="field"><label>STAFF EMAIL</label><input id="email" autocomplete="username"></div>
<div class="field"><label>PASSWORD</label><input id="pass" type="password" autocomplete="current-password"></div>
<div class="actions">
<button class="primary" id="signIn">SIGN IN</button>
<button class="primary demo" id="demo">ONE-TAP DEMO LOGIN</button>
<button class="back" id="back">← Back to Roles</button>
</div>
<div class="note">Each role has only one login screen. No second login is shown after this step.</div>
</section>
</main>
<script>
const roleData={
 cashier:{name:'Cashier',email:'cashier.demo@menuorbit.test',pass:'CashierOrbit2026!',url:'cashier.html'},
 barista:{name:'Barista',email:'barista.demo@menuorbit.test',pass:'BaristaOrbit2026!',url:'staff.html'},
 inventory:{name:'Inventory',email:'inventory.demo@menuorbit.test',pass:'StockOrbit2026!',url:'inventory-staff.html'},
 manager:{name:'Manager',email:'manager.demo@menuorbit.test',pass:'ManagerOrbit2026!',url:'manager.html'}
};
let selected='';
const roles=document.getElementById('roles'),hero=document.getElementById('hero'),login=document.getElementById('login'),roleTitle=document.getElementById('roleTitle'),email=document.getElementById('email'),pass=document.getElementById('pass');
document.querySelectorAll('[data-role]').forEach(btn=>btn.addEventListener('click',()=>{
 selected=btn.dataset.role;
 const r=roleData[selected];
 roleTitle.textContent=r.name+' Login';
 email.value=r.email;pass.value=r.pass;
 roles.classList.add('hide');hero.classList.add('hide');login.classList.add('show');
 setTimeout(()=>email.focus(),50);
}));
function openRole(){if(!selected)return;sessionStorage.setItem('menuorbit_role',selected);location.href=roleData[selected].url}
document.getElementById('signIn').addEventListener('click',()=>{if(email.value.trim()&&pass.value)openRole()});
document.getElementById('demo').addEventListener('click',openRole);
document.getElementById('back').addEventListener('click',()=>{login.classList.remove('show');roles.classList.remove('hide');hero.classList.remove('hide');selected=''});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&login.classList.contains('show'))document.getElementById('signIn').click()});
</script>
</body>
</html>
