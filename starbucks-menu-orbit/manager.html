<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="theme-color" content="#071c14">
<title>Menu Orbit — Branch Manager</title>
<style>
:root{--g:#00754a;--g2:#00a862;--bg:#03130d;--panel:#08251b;--cream:#f4efe6;--gold:#d4ad62;--line:rgba(255,255,255,.14);--muted:#aac0b5;--danger:#d66060;--warn:#f0c36a;--ok:#59cf91;--shadow:0 20px 55px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#145d42,#061a13 42%,#020907);color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f4c86f;outline-offset:3px}.wrap{width:min(1280px,calc(100% - 18px));margin:auto;padding:12px 0 60px}.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;background:rgba(3,19,13,.96);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.07)}.brand{display:flex;align-items:center;gap:10px}.logo{width:48px;height:48px;border-radius:50%;border:2px solid #fff;background:var(--g);display:grid;place-items:center;font:900 20px Georgia,serif}.brand h1{margin:0;font-size:clamp(20px,3vw,30px)}.brand p{margin:2px 0 0;color:var(--muted);font-size:11px}.spacer{flex:1}.btn{min-height:50px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:rgba(255,255,255,.07);color:#fff;font-weight:900}.btn.primary{border:0;background:linear-gradient(135deg,var(--g2),var(--g))}.btn.cream{background:var(--cream);color:#073421}.btn.danger{border-color:rgba(255,120,120,.35);color:#ffd1d1}.btn.warn{border-color:rgba(240,195,106,.45);color:#ffe5a9}.card{background:rgba(8,37,27,.95);border:1px solid var(--line);border-radius:22px;padding:17px;margin-top:12px;box-shadow:var(--shadow)}.login{width:min(590px,100%);margin:5vh auto}.login input{width:100%;height:56px;border:1px solid var(--line);border-radius:14px;background:#0d3628;color:#fff;padding:0 14px;margin:7px 0}.demo{margin:13px 0;padding:13px;border:1px solid rgba(244,200,111,.38);border-radius:15px;background:rgba(244,200,111,.09);color:#ffe6a8}.cred{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:8px;padding:10px;border-radius:12px;background:rgba(255,255,255,.06)}.cred code{font-weight:900;overflow-wrap:anywhere}.copy{min-height:42px;border:0;border-radius:10px;background:var(--cream);color:#073421;font-weight:900;padding:0 12px}.login-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.notice{color:var(--muted);font-size:12px;line-height:1.5}.error{color:#ffb2b2}.staffbar{display:grid;grid-template-columns:1.2fr 1fr .8fr .8fr;gap:9px;margin:12px 0}.staffbox{background:rgba(8,37,27,.95);border:1px solid var(--line);border-radius:16px;padding:12px}.staffbox b{display:block;font-size:15px}.staffbox span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}.nav button{min-height:58px}.nav button.active{background:var(--cream);color:#073421}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.stat{padding:15px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.05)}.stat strong{display:block;font-size:27px;color:#f2cf8b}.stat span{font-size:11px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.section-title h2{margin:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.search,.field{height:50px;border:1px solid var(--line);border-radius:13px;background:#0d3628;color:#fff;padding:0 12px}.search{flex:1;min-width:220px}.table{display:grid;gap:8px}.row{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:9px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04)}.row small{color:var(--muted)}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:rgba(0,168,98,.16);font-size:10px;font-weight:900;text-transform:uppercase}.tag.warn{background:rgba(240,195,106,.16);color:#ffe0a0}.tag.danger{background:rgba(214,96,96,.16);color:#ffc1c1}.form{display:grid;gap:10px}.form label{font-size:12px;font-weight:900}.form input,.form select,.form textarea{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:12px;background:#0d3628;color:#fff;padding:10px}.form input,.form select{min-height:48px}.form textarea{min-height:80px}.switches{display:grid;grid-template-columns:1fr 1fr;gap:10px}.switch{padding:13px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04);display:flex;justify-content:space-between;align-items:center;gap:10px}.empty{text-align:center;padding:40px;color:var(--muted)}.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:15px;background:rgba(0,0,0,.7);backdrop-filter:blur(8px)}.modal.open{display:flex}.modal-card{width:min(620px,100%);max-height:90vh;overflow:auto;background:#08251b;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}.reduce-motion *{animation:none!important;transition:none!important;scroll-behavior:auto!important}@media(max-width:950px){.nav{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(3,1fr)}.staffbar{grid-template-columns:1fr 1fr}.grid2,.grid3{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}}@media(max-width:620px){.wrap{width:min(100% - 12px,1280px)}.nav,.stats,.staffbar,.row,.login-actions,.switches{grid-template-columns:1fr}.top .spacer{display:none}.top .btn{flex:1}.cred{grid-template-columns:1fr}.copy{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">M</div><div><h1>Branch Manager</h1><p>Menu Orbit Staff Portal • Branch Command Center</p></div></div><div class="spacer"></div><button class="btn" id="motionBtn">◌ Reduce Motion</button><button class="btn" id="cashierBtn">🧾 Cashier</button><button class="btn" id="baristaBtn">☕ Barista</button><button class="btn danger" id="signOutBtn" hidden>Sign Out</button></header>
<main id="app"></main>
</div>
<div class="modal" id="promoModal"><div class="modal-card"><div class="section-title"><h2>Create Promotion</h2><button class="btn" id="closePromo">✕</button></div><div class="form"><label>Promo title<input id="promoTitle" placeholder="Morning Pair"></label><label>Description<textarea id="promoDesc" placeholder="Describe the offer"></textarea></label><div class="grid2"><label>Discount type<select id="promoType"><option>Amount</option><option>Percentage</option></select></label><label>Discount value<input id="promoValue" type="number" min="0" value="20"></label></div><label>Minimum purchase<input id="promoMin" type="number" min="0" value="400"></label><label>Eligible products<input id="promoProducts" placeholder="All products or selected items"></label><div class="grid2"><label>Start date<input id="promoStart" type="date"></label><label>End date<input id="promoEnd" type="date"></label></div><label>Terms<textarea id="promoTerms" placeholder="Terms and conditions"></textarea></label><button class="btn primary" id="savePromo">SAVE PROMO</button></div></div></div>
<script src="config.js"></script>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/+esm';
const cfg=window.MENU_ORBIT_CONFIG||{},app=document.querySelector('#app'),signOut=document.querySelector('#signOutBtn');
const db=cfg.supabaseUrl&&cfg.supabasePublishableKey?createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;
const DEMO_EMAIL='manager.demo@menuorbit.test',DEMO_PASSWORD='ManagerOrbit2026!';
let demo=false,tab='dashboard';
let manager={name:'Alex Reyes',branch:'Demo Bacoor Branch',role:'BRANCH MANAGER',shift:'ON SHIFT'};
let orders=[{ref:'MO-240118',status:'NEW',total:430,issue:''},{ref:'MO-240119',status:'PREPARING',total:280,issue:'Customer changed order'},{ref:'MO-240120',status:'READY',total:520,issue:''},{ref:'MO-240121',status:'PROBLEM',total:195,issue:'Payment issue'}];
let staff=[{name:'Jamie Cruz',role:'Cashier',station:'Cashier',shift:'On Shift',active:true},{name:'Mika Santos',role:'Barista',station:'Espresso Bar',shift:'On Shift',active:true},{name:'Paolo Lim',role:'Barista',station:'Cold Bar',shift:'On Shift',active:true}];
let promos=[{title:'Morning Pair',desc:'₱20 off ₱400+',start:'2026-09-01',end:'2026-09-30',active:true}];
let inventory=[{cat:'Products',name:'Caramel Macchiato',qty:18,unit:'servings',low:8},{cat:'Ingredients',name:'Oat Milk',qty:5,unit:'cartons',low:6},{cat:'Packaging',name:'Grande Cups',qty:42,unit:'pcs',low:30}];
let equipment=[{name:'Espresso Machine',status:'OPERATIONAL'},{name:'Grinder',status:'OPERATIONAL'},{name:'Blender',status:'ISSUE'},{name:'Refrigerator',status:'OPERATIONAL'},{name:'POS Terminal',status:'OPERATIONAL'}];
let audits=[{action:'Promotion activated',by:'Alex Reyes',time:'Today 09:10',ref:'PR-001'},{action:'Staff station changed',by:'Alex Reyes',time:'Today 08:45',ref:'ST-003'}];
let settings={open:true,pickup:true,dinein:true,takeout:true,prep:12,announcement:'Welcome to Menu Orbit.'};
const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{maximumFractionDigits:0});
document.querySelector('#cashierBtn').onclick=()=>location.href='cashier.html';document.querySelector('#baristaBtn').onclick=()=>location.href='staff.html';document.querySelector('#motionBtn').onclick=()=>{document.body.classList.toggle('reduce-motion');document.querySelector('#motionBtn').textContent=document.body.classList.contains('reduce-motion')?'● Motion Reduced':'◌ Reduce Motion'};
function copy(v,label){navigator.clipboard?.writeText(v).then(()=>alert(label+' copied')).catch(()=>alert(v))}
function login(){signOut.hidden=true;app.innerHTML=`<section class="card login"><h2>Branch Manager Sign In</h2><p class="notice">Use an authorized Branch Manager account or the demo credentials below.</p><div class="demo"><b>DEMO LOGIN — CLICK TO COPY</b><div class="cred"><code>${DEMO_EMAIL}</code><button class="copy" id="copyEmail">Copy Email</button></div><div class="cred"><code>${DEMO_PASSWORD}</code><button class="copy" id="copyPass">Copy Password</button></div><button class="btn" id="fillDemo" style="width:100%;margin-top:9px">Fill Demo Login</button></div><form id="loginForm"><input id="email" type="email" required placeholder="Manager email"><input id="pass" type="password" required placeholder="Password"><div class="login-actions"><button class="btn primary" type="submit">Sign In</button><button class="btn" type="button" id="demoBtn">Enter Demo Dashboard</button></div></form><p id="msg" class="notice"></p></section>`;document.querySelector('#copyEmail').onclick=()=>copy(DEMO_EMAIL,'Email');document.querySelector('#copyPass').onclick=()=>copy(DEMO_PASSWORD,'Password');document.querySelector('#fillDemo').onclick=()=>{email.value=DEMO_EMAIL;pass.value=DEMO_PASSWORD};document.querySelector('#demoBtn').onclick=enterDemo;document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();const em=email.value.trim(),pw=pass.value,msg=document.querySelector('#msg');if(em===DEMO_EMAIL&&pw===DEMO_PASSWORD)return enterDemo();if(!db){msg.textContent='Live backend is not connected. Use the demo login.';return}msg.textContent='Signing in…';const {error}=await db.auth.signInWithPassword({email:em,password:pw});if(error){msg.textContent=error.message;msg.className='notice error';return}demo=false;manager={name:em,branch:'Assigned branch',role:'BRANCH MANAGER',shift:'BACKEND ACTIVATION REQUIRED'};renderShell()}}
function enterDemo(){demo=true;renderShell()}
function shell(){return `<section class="staffbar"><div class="staffbox"><b>${esc(manager.name)}</b><span>Manager</span></div><div class="staffbox"><b>${esc(manager.branch)}</b><span>Assigned Branch</span></div><div class="staffbox"><b>${manager.role}</b><span>Role</span></div><div class="staffbox"><b>${manager.shift}</b><span>Shift</span></div></section><nav class="nav">${[['dashboard','DASHBOARD'],['orders','ORDERS'],['staff','STAFF'],['promos','PROMOTIONS'],['inventory','INVENTORY'],['settings','SETTINGS']].map(([k,l])=>`<button class="btn ${tab===k?'active':''}" data-tab="${k}">${l}</button>`).join('')}</nav><div id="view"></div>`}
function renderShell(){signOut.hidden=false;app.innerHTML=shell();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderShell()});renderView();signOut.onclick=async()=>{if(db&&!demo)await db.auth.signOut();demo=false;login()}}
function renderView(){const v=document.querySelector('#view');if(tab==='dashboard')dashboard(v);if(tab==='orders')ordersView(v);if(tab==='staff')staffView(v);if(tab==='promos')promosView(v);if(tab==='inventory')inventoryView(v);if(tab==='settings')settingsView(v)}
function dashboard(v){const count=s=>orders.filter(o=>o.status===s).length,low=inventory.filter(i=>i.qty<=i.low).length,active=staff.filter(s=>s.active).length;v.innerHTML=`<section class="stats">${[['New Orders',count('NEW')],['Preparing',count('PREPARING')],['Ready',count('READY')],['Problem / Delayed',count('PROBLEM')],['Low Stock',low],['Staff Active',active]].map(([l,n])=>`<div class="stat"><strong>${n}</strong><span>${l}</span></div>`).join('')}</section><div class="grid2"><section class="card"><div class="section-title"><h2>Escalations</h2><button class="btn" id="goOrders">Open Orders</button></div>${orders.filter(o=>o.issue).map(o=>`<div class="row"><div><b>${o.ref}</b><br><small>${esc(o.issue)}</small></div><span class="tag danger">${o.status}</span><span>${money(o.total)}</span><button class="btn" data-resolve="${o.ref}">REVIEW</button></div>`).join('')||'<div class="empty">No escalations.</div>'}</section><section class="card"><h2>More</h2><div class="grid2"><button class="btn" id="equipmentBtn">EQUIPMENT</button><button class="btn" id="reportsBtn">REPORTS</button><button class="btn" id="auditBtn">AUDIT HISTORY</button><button class="btn" id="paymentBtn">PAYMENT / REFUND</button></div><div id="moreBox" style="margin-top:10px"></div></section></div>`;document.querySelector('#goOrders').onclick=()=>{tab='orders';renderShell()};document.querySelectorAll('[data-resolve]').forEach(b=>b.onclick=()=>alert('Manager review opened for '+b.dataset.resolve));document.querySelector('#equipmentBtn').onclick=()=>moreBox.innerHTML=equipment.map(e=>`<div class="row"><b>${e.name}</b><span class="tag ${e.status==='ISSUE'?'warn':''}">${e.status}</span><select class="field" data-eq="${e.name}"><option>OPERATIONAL</option><option>ISSUE</option><option>OUT OF SERVICE</option></select><button class="btn">Update</button></div>`).join('');document.querySelector('#reportsBtn').onclick=()=>moreBox.innerHTML=`<div class="grid3"><div class="stat"><strong>${orders.length}</strong><span>Orders Today</span></div><div class="stat"><strong>${orders.filter(o=>o.status==='READY').length}</strong><span>Completed / Ready</span></div><div class="stat"><strong>${money(orders.reduce((s,o)=>s+o.total,0))}</strong><span>Demo Order Total</span></div></div><p class="notice">Demo values only. Live reports require real backend data.</p>`;document.querySelector('#auditBtn').onclick=()=>moreBox.innerHTML=audits.map(a=>`<div class="row"><div><b>${esc(a.action)}</b><br><small>${esc(a.by)} • ${esc(a.time)}</small></div><span>${esc(manager.branch)}</span><span>${a.ref}</span><span class="tag">LOGGED</span></div>`).join('');document.querySelector('#paymentBtn').onclick=()=>moreBox.innerHTML=`<div class="card" style="margin:0"><h3>Payment / Refund Review</h3><p>Review payment issues and refund requests.</p><button class="btn">APPROVE</button> <button class="btn">REJECT</button> <button class="btn warn">ESCALATE TO ADMIN</button><p class="notice">PAYMENT ACTION REQUIRES CONNECTED POS / PAYMENT PROVIDER</p></div>`}
function ordersView(v){v.innerHTML=`<section class="card"><div class="section-title"><h2>Branch Orders</h2></div><div class="toolbar"><input class="search" id="orderSearch" placeholder="Search order number"><select class="field" id="statusFilter"><option>ALL</option><option>NEW</option><option>PREPARING</option><option>READY</option><option>RELEASED</option><option>CANCELLED</option><option>PROBLEM</option></select></div><div id="ordersList" class="table" style="margin-top:10px"></div></section>`;const draw=()=>{const q=orderSearch.value.toLowerCase(),s=statusFilter.value;const list=orders.filter(o=>o.ref.toLowerCase().includes(q)&&(s==='ALL'||o.status===s));ordersList.innerHTML=list.map(o=>`<div class="row"><div><b>${o.ref}</b><br><small>${o.issue||'No issue reported'}</small></div><span class="tag ${o.status==='PROBLEM'?'danger':''}">${o.status}</span><b>${money(o.total)}</b><div><button class="btn" data-view="${o.ref}">VIEW</button> <button class="btn warn" data-fix="${o.ref}">MANAGER ACTION</button></div></div>`).join('')||'<div class="empty">No matching orders.</div>';document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>alert('Order details: '+b.dataset.view));document.querySelectorAll('[data-fix]').forEach(b=>b.onclick=()=>{audits.unshift({action:'Manager reviewed order '+b.dataset.fix,by:manager.name,time:'Just now',ref:b.dataset.fix});alert('Manager action recorded in audit history.')})};orderSearch.oninput=draw;statusFilter.onchange=draw;draw()}
function staffView(v){v.innerHTML=`<section class="card"><div class="section-title"><h2>Branch Staff</h2><span class="notice">Manager can assign stations, not create administrators.</span></div><div class="table">${staff.map((s,i)=>`<div class="row"><div><b>${esc(s.name)}</b><br><small>${esc(s.role)}</small></div><select class="field" data-station="${i}">${['Cashier','Espresso Bar','Cold Bar','Food Station','Handoff','Float / Support'].map(x=>`<option ${s.station===x?'selected':''}>${x}</option>`).join('')}</select><span class="tag">${s.shift}</span><button class="btn" data-save-staff="${i}">SAVE</button></div>`).join('')}</div></section>`;document.querySelectorAll('[data-save-staff]').forEach(b=>b.onclick=()=>{const i=+b.dataset.saveStaff,sel=document.querySelector(`[data-station="${i}"]`);staff[i].station=sel.value;audits.unshift({action:'Staff station changed',by:manager.name,time:'Just now',ref:'ST-'+(i+1)});alert('Station updated in demo.')})}
function promosView(v){v.innerHTML=`<section class="card"><div class="section-title"><h2>Promotions</h2><button class="btn primary" id="newPromo">+ CREATE PROMOTION</button></div><div class="table">${promos.map((p,i)=>`<div class="row"><div><b>${esc(p.title)}</b><br><small>${esc(p.desc)}</small></div><span>${p.start}<br><small>to ${p.end}</small></span><span class="tag ${p.active?'':'warn'}">${p.active?'ACTIVE':'INACTIVE'}</span><div><button class="btn" data-toggle-promo="${i}">${p.active?'DEACTIVATE':'ACTIVATE'}</button> <button class="btn" data-edit-promo="${i}">EDIT</button></div></div>`).join('')}</div></section>`;document.querySelector('#newPromo').onclick=()=>promoModal.classList.add('open');document.querySelectorAll('[data-toggle-promo]').forEach(b=>b.onclick=()=>{const i=+b.dataset.togglePromo;promos[i].active=!promos[i].active;audits.unshift({action:'Promotion '+(promos[i].active?'activated':'deactivated'),by:manager.name,time:'Just now',ref:'PR-'+(i+1)});promosView(v)});document.querySelectorAll('[data-edit-promo]').forEach(b=>b.onclick=()=>alert('Edit promo: '+promos[+b.dataset.editPromo].title))}
function inventoryView(v){v.innerHTML=`<section class="card"><div class="section-title"><h2>Inventory</h2><span class="notice">Products • Ingredients • Packaging</span></div><div class="table">${inventory.map((i,n)=>{const st=i.qty===0?'OUT OF STOCK':i.qty<=i.low?'LOW STOCK':'IN STOCK';return `<div class="row"><div><b>${esc(i.name)}</b><br><small>${i.cat}</small></div><span>${i.qty} ${i.unit}<br><small>Low: ${i.low}</small></span><span class="tag ${st==='LOW STOCK'?'warn':st==='OUT OF STOCK'?'danger':''}">${st}</span><button class="btn" data-stock="${n}">ADJUST</button></div>`}).join('')}</div><hr style="border-color:var(--line);margin:18px 0"><h3>Product Availability</h3><div class="grid3">${['Caramel Macchiato','Caffè Latte','Cold Brew'].map(x=>`<div class="staffbox"><b>${x}</b><select class="field" style="width:100%;margin-top:8px"><option>Available</option><option>Unavailable</option><option>Sold Out</option></select></div>`).join('')}</div></section>`;document.querySelectorAll('[data-stock]').forEach(b=>b.onclick=()=>{const i=+b.dataset.stock,n=prompt('New quantity for '+inventory[i].name,inventory[i].qty),reason=n!==null?prompt('Reason for adjustment','Stock count correction'):null;if(n===null||reason===null)return;inventory[i].qty=Math.max(0,Number(n)||0);audits.unshift({action:'Inventory adjusted: '+inventory[i].name,by:manager.name,time:'Just now',ref:'INV-'+(i+1)});inventoryView(v)})}
function settingsView(v){v.innerHTML=`<section class="card"><div class="section-title"><h2>Branch Settings</h2><span class="notice">Only ${esc(manager.branch)}</span></div><div class="switches">${[['open','Branch Open'],['pickup','Pickup Enabled'],['dinein','Dine-In Enabled'],['takeout','Takeout Enabled']].map(([k,l])=>`<div class="switch"><b>${l}</b><button class="btn ${settings[k]?'cream':''}" data-setting="${k}">${settings[k]?'ON':'OFF'}</button></div>`).join('')}</div><div class="form" style="margin-top:12px"><label>Estimated preparation time (minutes)<input id="prepTime" type="number" min="1" value="${settings.prep}"></label><label>Temporary announcement<textarea id="announcement">${esc(settings.announcement)}</textarea></label><button class="btn primary" id="saveSettings">SAVE BRANCH SETTINGS</button></div></section>`;document.querySelectorAll('[data-setting]').forEach(b=>b.onclick=()=>{settings[b.dataset.setting]=!settings[b.dataset.setting];settingsView(v)});document.querySelector('#saveSettings').onclick=()=>{settings.prep=Number(prepTime.value)||12;settings.announcement=announcement.value.trim();audits.unshift({action:'Branch settings updated',by:manager.name,time:'Just now',ref:'BR-SET'});alert('Branch settings saved in demo.')}}
closePromo.onclick=()=>promoModal.classList.remove('open');savePromo.onclick=()=>{const t=promoTitle.value.trim();if(!t)return alert('Promo title is required.');promos.unshift({title:t,desc:promoDesc.value.trim()||'Branch promotion',start:promoStart.value||'Not set',end:promoEnd.value||'Not set',active:false});audits.unshift({action:'Promotion created',by:manager.name,time:'Just now',ref:'PR-'+promos.length});promoModal.classList.remove('open');promoTitle.value='';tab='promos';renderShell()};
if(!db)login();else login();
</script>
</body>
</html>
