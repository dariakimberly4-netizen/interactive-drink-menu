<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu Orbit — Shift Supervisor</title>
<style>
:root{--green:#063b2b;--gold:#d4ad62;--cream:#f7f1e6;--ink:#10251d}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 50% 15%,#176348,#03251b 68%);color:#fff;min-height:100vh}button,input{font:inherit}
.login{min-height:100vh;display:grid;place-items:center;padding:22px}.loginbox{width:min(440px,94vw);background:#fff;color:var(--ink);padding:28px;border-radius:26px;box-shadow:0 25px 75px #0008}.seal{width:88px;height:88px;border-radius:50%;background:var(--green);border:5px solid var(--gold);display:grid;place-items:center;margin:auto;font-size:34px}.loginbox h1{text-align:center;margin:13px 0 2px}.muted{text-align:center;color:#6b7772}.field{margin:14px 0}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:6px}.field input{width:100%;padding:14px;border:1px solid #ccd4cf;border-radius:12px}.primary{width:100%;padding:14px;border:0;border-radius:13px;background:var(--green);color:#fff;font-weight:950}.demo{margin-top:10px;background:#fff3a6;color:#423600;border:2px solid #e4bc00}.portal{display:none}.top{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff24}.top b{color:#f1d38e}.top button{background:transparent;color:#fff;border:1px solid #ffffff55;border-radius:10px;padding:9px 12px}.heading{text-align:center;margin-top:22px}.heading h2{font-size:clamp(27px,5vw,42px);margin:0}.heading p{color:#c8d7d0;margin:6px}
.orbit{position:relative;width:min(680px,94vw);height:min(680px,94vw);min-height:370px;margin:12px auto 45px}.orbit:before{content:"";position:absolute;left:14%;top:14%;width:72%;height:72%;border:1px solid #d4ad6280;border-radius:50%;pointer-events:none}.center,.node{position:absolute;border-radius:50%;font-weight:950;color:#fff;text-align:center;touch-action:manipulation}.center{left:50%;top:50%;transform:translate(-50%,-50%);width:174px;height:174px;background:radial-gradient(circle,#187552,#042b20);border:5px solid var(--gold);z-index:3}.center small{display:block;color:#f1d38e;margin-top:7px;font-size:9px}.node{transform:translate(-50%,-50%);width:112px;height:112px;background:#0a3527;border:2px solid var(--gold);font-size:9px;z-index:4}.node span{display:block;font-size:21px;margin-bottom:4px}.node.new{outline:7px solid #fff200;box-shadow:0 0 0 13px #fff20055,0 0 58px #fff200dd}.node.new:after{content:"★ NEW ★";position:absolute;top:-25px;left:50%;transform:translateX(-50%);background:#fff200;color:#073421;border:3px solid #fff;border-radius:999px;padding:5px 7px;font-size:8px;white-space:nowrap;pointer-events:none}
.module{display:none;width:min(780px,94vw);margin:20px auto 50px}.back{padding:11px 14px;border:0;border-radius:11px;background:var(--cream);color:#17352a;font-weight:900}.panel{background:#fff;color:var(--ink);padding:20px;border-radius:20px;margin-top:15px}.row{padding:13px 0;border-bottom:1px solid #e5e9e7}.badge{float:right;padding:4px 8px;border-radius:999px;background:#f3e4bf;font-size:10px;font-weight:900}.alert{background:#ffd2cf}.action{margin-top:12px}
@media(max-width:650px){.orbit{width:94vw;height:94vw;max-height:440px}.center{width:120px;height:120px;font-size:11px}.node{width:82px;height:82px;font-size:7.3px}.node span{font-size:16px}.top{font-size:12px}}
</style><style>
/* V2 MANAGER — TRUE ORBIT FIRST */
.manager-orbit-v2{width:min(720px,96vw)!important;height:min(720px,96vw)!important;margin:34px auto 55px!important}
.manager-orbit-v2:before{width:74%!important;height:74%!important;left:13%!important;top:13%!important;border:2px solid rgba(212,173,98,.55)!important;box-shadow:0 0 45px rgba(212,173,98,.08)}
.manager-orbit-v2 .center{width:185px!important;height:185px!important;font-size:16px!important}
@media(max-width:650px){.manager-orbit-v2{width:94vw!important;height:94vw!important;min-height:365px!important;max-height:450px!important;margin:30px auto 60px!important}.manager-orbit-v2 .center{width:124px!important;height:124px!important;font-size:11px!important}}
</style><style>
/* V3 MANAGER STAFF & SHIFT NESTED ORBIT */
.shiftTitleV3{text-align:center}.shiftTitleV3 h2{margin:0}.shiftTitleV3 p{color:#66756e}
.shiftOrbitV3{position:relative;width:min(590px,86vw);height:min(590px,86vw);min-height:365px;margin:18px auto}
.shiftOrbitV3:before{content:"";position:absolute;left:14%;top:14%;width:72%;height:72%;border:1px solid #d4ad6280;border-radius:50%;pointer-events:none}
.shiftCenterV3,.shiftNodeV3{position:absolute;border-radius:50%;color:#fff;font-weight:950;text-align:center;touch-action:manipulation}
.shiftCenterV3{left:50%;top:50%;transform:translate(-50%,-50%);width:155px;height:155px;background:radial-gradient(circle,#187552,#042b20);border:5px solid var(--gold);z-index:3}.shiftCenterV3 small{display:block;color:#f1d38e;font-size:9px;margin-top:6px}
.shiftNodeV3{transform:translate(-50%,-50%);width:102px;height:102px;background:#0a3527;border:2px solid var(--gold);font-size:8px;z-index:4}.shiftNodeV3 span{display:block;font-size:19px;margin-bottom:3px}
.shiftNodeV3.newShiftV3{outline:7px solid #fff200;box-shadow:0 0 0 12px #fff20055,0 0 55px #fff200dd}
.shiftNodeV3.newShiftV3:after{content:"★ NEW ★";position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:#fff200;color:#073421;border:3px solid #fff;border-radius:999px;padding:5px 7px;font-size:8px;white-space:nowrap;pointer-events:none}
@media(max-width:650px){.shiftOrbitV3{width:86vw;height:86vw;max-height:410px}.shiftCenterV3{width:112px;height:112px;font-size:10px}.shiftNodeV3{width:76px;height:76px;font-size:6.8px}.shiftNodeV3 span{font-size:14px}}
</style></head><body>
<section class="login" id="login"><div class="loginbox"><div class="seal">◆</div><h1>Shift Supervisor / Manager</h1><div class="muted">Independent operations portal</div><div class="field"><label>MANAGER EMAIL</label><input id="email" value="manager.demo@menuorbit.test"></div><div class="field"><label>PASSWORD</label><input id="pass" type="password" value="ManagerOrbit2026!"></div><button class="primary" id="signIn">SIGN IN</button><button class="primary demo" id="oneTap">ONE-TAP DEMO LOGIN</button></div></section>
<section class="portal" id="portal"><header class="top"><div><b>SHIFT SUPERVISOR / MANAGER</b><br><small>Demo Bacoor Branch • Shift Control</small></div><button id="logout">Sign Out</button></header><section id="home"><div class="orbit manager-orbit-v2"><button class="center" id="center">SHIFT CONTROL<small>3 WAIT • 2 PREP • 1 READY • 2 ALERTS</small></button><div id="nodes"></div></div></section><section class="module" id="module"><button class="back" id="back">← Back to Manager Orbit</button><div class="panel" id="panel"></div></section></section>
<script>
const features=[['alerts','🔔','ALERT CENTER'],['staff','👤','STAFF & SHIFT'],['escalate','!','ORDER ESCALATIONS'],['approve','✓','REFUND / VOID'],['stock','▣','STOCK ALERTS'],['equipment','⚙','EQUIPMENT ISSUES'],['handover','⇄','SHIFT HANDOVER'],['report','▥','MANAGER REPORT']];
const pts=[[50,7],[79,17],[93,50],[79,83],[50,93],[21,83],[7,50],[21,17]];
const rows=(a)=>a.map(x=>'<div class="row"><b>'+x[0]+'</b><span class="badge '+(x[2]?'alert':'')+'">'+x[1]+'</span><br><small>'+x[3]+'</small></div>').join('');
function enter(){login.style.display='none';portal.style.display='block';render()}
function render(){nodes.innerHTML=features.map((x,i)=>'<button class="node '+(x[0]==='alerts'&&!localStorage.getItem('manager_alert_parent_v4')?'new':'')+'" data-f="'+x[0]+'" style="left:'+pts[i][0]+'%;top:'+pts[i][1]+'%"><span>'+x[1]+'</span>'+x[2]+'</button>').join('');document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{if(b.dataset.f==='alerts')localStorage.setItem('manager_alert_parent_v4','1');b.classList.remove('new');openFeature(b.dataset.f)})}

const shiftToolsV3=[['clock','●','CLOCKED-IN'],['assign','◎','ASSIGN STATION'],['move','⇄','MOVE STATION'],['break','Ⅱ','BREAK STATUS'],['attendance','!','LATE / ABSENT'],['replace','↻','REPLACE STAFF'],['schedule','▦','SHIFT SCHEDULE'],['close','✓','CLOSE SHIFT']];
const shiftPtsV3=[[50,7],[79,17],[93,50],[79,83],[50,93],[21,83],[7,50],[21,17]];
function openStaffShiftOrbitV3(){
 home.style.display='none';module.style.display='block';
 panel.innerHTML='<div class="shiftTitleV3"><h2>Staff & Shift Control</h2><p>Manager-only workforce control</p></div><section class="shiftOrbitV3"><button class="shiftCenterV3" id="shiftCenterV3">STAFF CONTROL<small>3 ACTIVE • 0 BREAK</small></button>'+shiftToolsV3.map((x,i)=>'<button class="shiftNodeV3 '+(localStorage.getItem('manager_shift_v3_'+x[0])?'':'newShiftV3')+'" data-shift="'+x[0]+'" style="left:'+shiftPtsV3[i][0]+'%;top:'+shiftPtsV3[i][1]+'%"><span>'+x[1]+'</span>'+x[2]+'</button>').join('')+'</section>';
 document.querySelectorAll('[data-shift]').forEach(b=>b.onclick=()=>{localStorage.setItem('manager_shift_v3_'+b.dataset.shift,'1');b.classList.remove('newShiftV3');openShiftToolV3(b.dataset.shift)});
 document.querySelector('#shiftCenterV3').onclick=()=>openShiftToolV3('clock');
}
function openShiftToolV3(id){
 let t='',b='';const staff=[['Jamie Cruz','BARISTA','', 'Espresso Bar • Active'],['Cashier Demo','CASHIER','', 'POS 1 • Active'],['Inventory Demo','INVENTORY','', 'Stock Room • Active']];
 if(id==='clock'){t='Clocked-In Staff';b=rows(staff)}
 if(id==='assign'){t='Assign Station';b=rows(staff)+'<button class="primary action">ASSIGN SELECTED STAFF</button>'}
 if(id==='move'){t='Move Station';b=rows(staff)+'<button class="primary action">MOVE STAFF STATION</button>'}
 if(id==='break'){t='Break Status';b=rows(staff)+'<button class="primary action">START / END BREAK</button>'}
 if(id==='attendance'){t='Late / Absent';b='<p>No late or absent staff in the current demo shift.</p>'}
 if(id==='replace'){t='Replace Staff';b=rows(staff)+'<button class="primary action">ASSIGN REPLACEMENT</button>'}
 if(id==='schedule'){t='Shift Schedule';b=rows([['Morning Shift','08:00–17:00','', '3 staff assigned'],['Closing Shift','13:00–22:00','', '2 staff assigned']])}
 if(id==='close'){t='Close Shift';b='<p>Confirm unresolved orders, breaks, equipment issues, stock alerts, and handover notes before closing.</p><button class="primary action">REVIEW & CLOSE SHIFT</button>'}
 panel.innerHTML='<button class="back" id="backShiftV3">← Back to Staff & Shift Orbit</button><h2>'+t+'</h2>'+b;
 document.querySelector('#backShiftV3').onclick=openStaffShiftOrbitV3;
}

const alertToolsV4=[['live','◉','LIVE FLOOR'],['orders','!','ORDER ALERTS'],['staff','👤','STAFF ALERTS'],['stock','▣','STOCK ALERTS'],['equipment','⚙','EQUIPMENT'],['payment','₱','PAYMENT ALERTS'],['incident','◆','INCIDENTS'],['ack','✓','ACKNOWLEDGED']];
const alertPtsV4=[[50,7],[79,17],[93,50],[79,83],[50,93],[21,83],[7,50],[21,17]];
function openAlertOrbitV4(){
 home.style.display='none';module.style.display='block';
 panel.innerHTML='<div class="shiftTitleV3"><h2>Manager Alert Center</h2><p>Live operational notifications</p></div><section class="shiftOrbitV3"><button class="shiftCenterV3" id="alertCenterV4">ALERT CENTER<small>4 ACTIVE • 1 URGENT</small></button>'+alertToolsV4.map((x,i)=>'<button class="shiftNodeV3 '+(localStorage.getItem('manager_alert_v4_'+x[0])?'':'newShiftV3')+'" data-alert="'+x[0]+'" style="left:'+alertPtsV4[i][0]+'%;top:'+alertPtsV4[i][1]+'%"><span>'+x[1]+'</span>'+x[2]+'</button>').join('')+'</section>';
 document.querySelectorAll('[data-alert]').forEach(b=>b.onclick=()=>{localStorage.setItem('manager_alert_v4_'+b.dataset.alert,'1');b.classList.remove('newShiftV3');openAlertToolV4(b.dataset.alert)});
 document.querySelector('#alertCenterV4').onclick=()=>openAlertToolV4('live');
}
function openAlertToolV4(id){
 let t='',b='';
 if(id==='live'){t='Live Floor';b=rows([['New Orders','3','', 'Waiting for barista claim'],['Preparing','2','', 'Active at espresso bar'],['Ready','1','', 'Waiting for pickup'],['Delayed','1',1,'Needs attention']])}
 if(id==='orders'){t='Order Alerts';b=rows([['MO-1047','DELAY',1,'Preparation exceeded target'],['MO-1048','ESCALATED',1,'Customer assistance requested']])}
 if(id==='staff'){t='Staff Alerts';b='<p>No unresolved staff attendance alerts.</p>'}
 if(id==='stock'){t='Stock Alerts';b=rows([['Whole Milk','LOW',1,'4 cartons remaining'],['Oat Milk','OUT',1,'Inventory staff notified']])}
 if(id==='equipment'){t='Equipment Alerts';b=rows([['Espresso Station 1','CHECK',1,'Barista reported an issue']])}
 if(id==='payment'){t='Payment Alerts';b=rows([['POS 1','REVIEW',1,'One cashier approval request']])}
 if(id==='incident'){t='Incident Log';b='<p>Record customer, staff, safety, service, or equipment incidents for manager follow-up.</p><button class="primary action">CREATE INCIDENT</button>'}
 if(id==='ack'){t='Acknowledged Alerts';b='<p>Resolved and acknowledged manager notifications will appear here for the shift audit trail.</p>'}
 panel.innerHTML='<button class="back" id="backAlertV4">← Back to Alert Center Orbit</button><h2>'+t+'</h2>'+b;
 document.querySelector('#backAlertV4').onclick=openAlertOrbitV4;
}
function openFeature(id){home.style.display='none';module.style.display='block';let t='',b='';
if(id==='alerts'){openAlertOrbitV4();return}
if(id==='staff'){openStaffShiftOrbitV3();return}
if(id==='escalate'){t='Order Escalations';b=rows([['MO-1048','CUSTOMER ISSUE',1,'Awaiting manager decision'],['MO-1047','DELAY',1,'Preparation exceeded target']])+'<button class="primary action">REVIEW NEXT ESCALATION</button>'}
if(id==='approve'){t='Refund / Void Approval';b='<p>Manager-only approval queue for cashier refund, void, and protected payment actions.</p><button class="primary action">OPEN APPROVAL QUEUE</button>'}
if(id==='stock'){t='Stock Alerts';b=rows([['Whole Milk','LOW',1,'4 cartons remaining'],['Oat Milk','OUT',1,'Inventory staff notified']])}
if(id==='equipment'){t='Equipment Issues';b=rows([['Espresso Station 1','CHECK',1,'Reported by barista'],['Receipt Printer','OK','', 'Online']])}
if(id==='handover'){t='Shift Handover';b='<p>Review unresolved orders, stock alerts, equipment issues, cash exceptions, and staff notes before handing the shift over.</p><button class="primary action">START HANDOVER</button>'}
if(id==='report'){t='Manager Report';b=rows([['Orders','42','', 'Current demo shift'],['Escalations','2','', '1 unresolved'],['Stock Alerts','2','', '1 sold out'],['Equipment Alerts','1','', 'Needs review']])}
panel.innerHTML='<h2>'+t+'</h2>'+b}
signIn.onclick=()=>{if(email.value&&pass.value)enter()};oneTap.onclick=enter;logout.onclick=()=>location.reload();back.onclick=()=>{module.style.display='none';home.style.display='block'};center.onclick=()=>openFeature('floor');
</script></body></html>
