<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#071c14" />
<title>Starbucks Menu Orbit — Promotional Offers</title>
<style>
:root{--green:#00754a;--green2:#00a862;--dark:#03130d;--dark2:#08251b;--cream:#f4efe6;--gold:#d7b46a;--text:#fff;--muted:#b8cbc1;--line:rgba(255,255,255,.14);--shadow:0 22px 70px rgba(0,0,0,.45)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#03130d;color:#fff}body{overflow:hidden;background:radial-gradient(circle at 50% 30%,#146246 0,#082b1f 28%,#03130d 67%,#010704 100%)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #f5d27c;outline-offset:3px}
.bg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 15%,rgba(0,168,98,.18),transparent 30%),radial-gradient(circle at 85% 80%,rgba(215,180,106,.10),transparent 28%)}
header{height:76px;display:flex;align-items:center;gap:12px;padding:10px clamp(14px,3vw,32px);position:relative;z-index:20;border-bottom:1px solid var(--line);background:rgba(1,12,8,.72);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;margin-right:auto}.logo{width:48px;height:48px;border-radius:50%;border:2px solid #fff;background:var(--green);display:grid;place-items:center;font:900 19px Georgia,serif;box-shadow:0 0 0 5px rgba(0,117,74,.22)}.brand strong{display:block;font-size:clamp(15px,2vw,21px)}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}.demo{border:1px solid rgba(215,180,106,.5);background:rgba(215,180,106,.12);color:#f6d993;border-radius:999px;padding:9px 12px;font-size:11px;font-weight:900;letter-spacing:.07em;white-space:nowrap}
.filters{height:52px;position:relative;z-index:15;display:flex;gap:8px;align-items:center;padding:6px clamp(12px,3vw,28px);overflow:auto;scrollbar-width:none;background:linear-gradient(180deg,rgba(1,12,8,.72),transparent)}.filters::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#d8e5de;border-radius:999px;padding:9px 13px;font-weight:800;font-size:12px}.chip.active{background:var(--cream);color:#063421;border-color:var(--cream)}
.stage{position:absolute;inset:128px 0 72px;overflow:hidden;touch-action:none}.stage:before{content:"";position:absolute;left:50%;top:49%;width:min(72vw,730px);height:min(72vw,730px);border-radius:50%;border:1px solid rgba(215,180,106,.22);transform:translate(-50%,-50%);box-shadow:0 0 100px rgba(0,168,98,.12),inset 0 0 110px rgba(255,255,255,.03)}.orbit-line{position:absolute;left:50%;top:49%;width:min(62vw,660px);height:min(32vw,350px);border:1px dashed rgba(255,255,255,.17);border-radius:50%;transform:translate(-50%,-50%) rotateX(65deg);pointer-events:none}
.core{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);z-index:8;width:clamp(150px,19vw,215px);aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.94);background:radial-gradient(circle at 35% 25%,#27aa73,#00754a 55%,#00472f);color:#fff;text-align:center;padding:18px;display:grid;place-items:center;box-shadow:0 0 0 10px rgba(0,117,74,.16),0 0 80px rgba(0,168,98,.38),var(--shadow)}.core b{display:block;font:900 clamp(16px,2.2vw,25px) Georgia,serif}.core span{display:block;font-size:clamp(9px,1.1vw,12px);text-transform:uppercase;letter-spacing:.12em;margin-top:7px}.core small{display:block;font-size:8px;letter-spacing:.07em;color:#e3eee8;margin-top:7px}.core:hover{filter:brightness(1.08)}
.offer{position:absolute;transform:translate(-50%,-50%);width:clamp(118px,15vw,165px);border:0;background:transparent;color:#fff;text-align:center;transition:transform .22s ease,filter .22s ease,opacity .22s ease}.offer:hover,.offer:focus-visible{transform:translate(-50%,-50%) scale(1.08);z-index:10}.offer.back{filter:brightness(.7);opacity:.8}.offer.front{z-index:7}.bubble{width:clamp(94px,12vw,132px);aspect-ratio:1;margin:auto;border-radius:50%;border:3px solid rgba(255,255,255,.93);display:grid;place-items:center;position:relative;overflow:hidden;background:linear-gradient(145deg,#0f694a,#063b2a);box-shadow:0 13px 36px rgba(0,0,0,.48),0 0 0 5px rgba(215,180,106,.15)}.bubble:after{content:"";position:absolute;inset:auto 0 0;height:52%;background:linear-gradient(transparent,rgba(1,13,9,.92))}.icon{font-size:clamp(28px,4vw,42px);transform:translateY(-7px);filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}.offer-name{position:absolute;z-index:2;left:8px;right:8px;bottom:23px;font-weight:950;font-size:clamp(8px,1vw,11px);line-height:1.05;text-shadow:0 2px 5px #000}.tag{position:absolute;z-index:2;left:50%;bottom:6px;transform:translateX(-50%);padding:2px 7px;border-radius:999px;background:var(--cream);color:#063421;font-size:9px;font-weight:950;white-space:nowrap}
.hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:14;white-space:nowrap;border:1px solid var(--line);background:rgba(2,16,11,.78);backdrop-filter:blur(12px);border-radius:999px;padding:10px 16px;color:#dce7e1;font-size:12px}
.drawer{position:fixed;z-index:50;top:0;right:0;width:min(470px,100%);height:100%;overflow:auto;background:rgba(7,33,24,.97);border-left:1px solid var(--line);box-shadow:-24px 0 70px rgba(0,0,0,.5);transform:translateX(104%);transition:.28s ease;padding:18px}.drawer.open{transform:none}.drawer-head{position:sticky;top:-18px;z-index:3;background:#08251b;padding:18px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.drawer h2{margin:0;font:900 28px Georgia,serif}.close{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;font-size:25px}.hero{min-height:190px;border-radius:25px;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#22a06a,#00754a 55%,#043524);border:1px solid var(--line);font-size:74px;box-shadow:inset 0 0 80px rgba(255,255,255,.05)}.promo-badge{display:inline-flex;margin-top:16px;border:1px solid rgba(215,180,106,.45);background:rgba(215,180,106,.12);color:#f5d58d;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.07em}.headline{font-size:26px;font-weight:950;margin:12px 0 5px}.sub{color:#bfd0c7;line-height:1.55;margin:0 0 18px}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.fact{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:15px;padding:12px}.fact b{display:block;color:#f1cf87;font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.fact span{font-size:13px;color:#e7f0eb}.section{margin:22px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:#c3d3ca}.steps{margin:0;padding-left:20px;color:#dce8e2;line-height:1.7}.codebox{display:flex;gap:8px;align-items:center;border:1px dashed rgba(245,210,124,.55);border-radius:16px;padding:12px;background:rgba(245,210,124,.06)}.code{font:900 21px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;flex:1}.copy{min-height:42px;border:0;border-radius:11px;background:var(--cream);color:#063421;padding:0 13px;font-weight:900}.notice{margin-top:18px;padding:12px 13px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:11px;line-height:1.5;color:#b9ccc2}.overlay{position:fixed;z-index:45;inset:0;background:rgba(0,0,0,.52);display:none}.overlay.show{display:block}
@media(max-width:700px){header{height:68px;padding:8px 12px}.logo{width:43px;height:43px}.brand small{display:none}.demo{font-size:9px;padding:7px 9px}.filters{top:0;height:48px;padding-left:10px}.stage{inset:116px 0 64px}.core{width:138px}.offer{width:104px}.bubble{width:86px}.offer-name{font-size:8px}.tag{font-size:8px}.hint{bottom:10px;font-size:10px;padding:8px 12px}.drawer{padding:15px}.drawer h2{font-size:24px}}
@media(max-width:460px){.stage:before{width:92vw;height:92vw}.orbit-line{width:88vw;height:44vw}.core{width:126px}.core b{font-size:15px}.core span{font-size:8px}.offer{width:88px}.bubble{width:75px}.icon{font-size:27px}.offer-name{bottom:20px;font-size:7px}.tag{font-size:7px;padding:2px 5px}.hint{max-width:92vw;overflow:hidden;text-overflow:ellipsis}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}.offer{transition:none}}
</style>
</head>
<body>
<div class="bg"></div>
<header>
  <div class="brand"><div class="logo">S</div><div><strong>Promotional Offers Orbit</strong><small>Starbucks-inspired customer promo showcase</small></div></div>
  <div class="demo">DEMO OFFERS ONLY</div>
</header>
<nav class="filters" aria-label="Promotion filters">
  <button class="chip active" data-filter="All">All Offers</button>
  <button class="chip" data-filter="Limited Time">Limited Time</button>
  <button class="chip" data-filter="Rewards">Rewards</button>
  <button class="chip" data-filter="Bundle">Bundles</button>
  <button class="chip" data-filter="Member">Member</button>
  <button class="chip" data-filter="Seasonal">Seasonal</button>
</nav>
<main class="stage" id="stage">
  <div class="orbit-line"></div>
  <button class="core" id="core" aria-label="Open promotional offers guide"><div><b>STARBUCKS</b><span>Menu Orbit</span><small>UNOFFICIAL PROTOTYPE</small></div></button>
  <div id="offers"></div>
</main>
<div class="hint">Drag left/right to rotate • Tap an offer for promo details</div>
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head"><h2 id="drawerTitle">Promo Details</h2><button class="close" id="closeDrawer" aria-label="Close">×</button></div>
  <div id="drawerBody"></div>
</aside>
<script>
const promos=[
 {id:'happy',name:'Happy Hour BOGO',icon:'🥤',category:'Limited Time',tag:'BUY 1 GET 1',headline:'Buy 1, Get 1 Demo Deal',desc:'A promotional concept for selected handcrafted beverages during a defined happy-hour window.',valid:'Demo schedule',eligibility:'Selected drinks',code:'HAPPY2',steps:['Choose an eligible featured beverage.','Present or enter the demo promo code.','Receive the second eligible drink as the promotional item.']},
 {id:'stars',name:'Double Stars Day',icon:'⭐',category:'Rewards',tag:'2× REWARDS',headline:'Double Rewards Day',desc:'A loyalty-focused concept that awards double promotional points on qualifying purchases.',valid:'Demo schedule',eligibility:'Demo members',code:'2XSTARS',steps:['Sign in to the demo rewards account.','Activate the promotional offer.','Complete a qualifying transaction during the demo period.']},
 {id:'iced',name:'₱50 Off Iced Favorites',icon:'🧊',category:'Limited Time',tag:'₱50 OFF',headline:'Iced Favorites Discount',desc:'A simple discount concept for selected cold beverages, designed for afternoon traffic.',valid:'Demo schedule',eligibility:'Selected iced drinks',code:'ICED50',steps:['Select an eligible iced beverage.','Apply the demo code before checkout.','The prototype displays a ₱50 promotional discount.']},
 {id:'pair',name:'Weekend Pairing',icon:'☕',category:'Bundle',tag:'BUNDLE',headline:'Drink + Pastry Pairing',desc:'A weekend bundle concept pairing one selected beverage with one pastry at a promotional bundle price.',valid:'Weekends • Demo',eligibility:'Selected pairings',code:'PAIRME',steps:['Choose one eligible beverage.','Choose one eligible pastry.','Use the demo bundle code to preview the promotional mechanic.']},
 {id:'member',name:'Member Monday',icon:'💚',category:'Member',tag:'MEMBER',headline:'Member Monday Perk',desc:'A member-only concept that unlocks a rotating weekly perk for signed-in loyalty members.',valid:'Mondays • Demo',eligibility:'Demo members',code:'MONDAY',steps:['Sign in to the promotional prototype.','Open the Member Monday offer.','Use the displayed demo code for the featured perk.']},
 {id:'birthday',name:'Birthday Treat',icon:'🎂',category:'Rewards',tag:'BIRTHDAY',headline:'Birthday Reward Concept',desc:'A celebratory rewards concept showing how an eligible member birthday benefit could be presented.',valid:'Birthday window • Demo',eligibility:'Eligible demo members',code:'BDAYTREAT',steps:['Open the birthday promotional card.','Verify demo member eligibility.','Present the code during the eligible demo birthday window.']},
 {id:'season',name:'Seasonal Sip Pass',icon:'🍂',category:'Seasonal',tag:'SEASONAL',headline:'Seasonal Sip Promotion',desc:'A seasonal campaign concept featuring rotating limited-edition drinks and collectible promo stamps.',valid:'Seasonal • Demo',eligibility:'Featured seasonal drinks',code:'SEASONSIP',steps:['Choose a featured seasonal drink.','Collect a demo stamp after each qualifying purchase.','Unlock the final promotional reward in the prototype.']},
 {id:'share',name:'Share the Moment',icon:'👯',category:'Bundle',tag:'FOR TWO',headline:'Share-the-Moment Bundle',desc:'A social bundle concept designed for two drinks plus one shared pastry or snack.',valid:'Demo schedule',eligibility:'Selected bundle items',code:'SHARE2',steps:['Pick two eligible beverages.','Add one eligible shared pastry.','Apply the demo code to preview the bundle offer.']}
];
let rotation=0,dragging=false,startX=0,startRotation=0,currentFilter='All';
const wrap=document.getElementById('offers'),stage=document.getElementById('stage'),drawer=document.getElementById('drawer'),overlay=document.getElementById('overlay');
function visiblePromos(){return promos.filter(p=>currentFilter==='All'||p.category===currentFilter)}
function render(){
 const list=visiblePromos();wrap.innerHTML='';
 const cx=stage.clientWidth/2,cy=stage.clientHeight*.49;
 const rx=Math.min(stage.clientWidth*.36,360),ry=Math.min(stage.clientHeight*.31,210);
 list.forEach((p,i)=>{
   const a=(i/list.length)*Math.PI*2+rotation;
   const depth=(Math.sin(a)+1)/2;
   const x=cx+Math.cos(a)*rx,y=cy+Math.sin(a)*ry;
   const b=document.createElement('button');b.className='offer '+(depth>.52?'front':'back');
   b.style.left=x+'px';b.style.top=y+'px';b.style.zIndex=Math.round(2+depth*5);b.style.opacity=.68+depth*.32;
   b.innerHTML=`<div class="bubble"><div class="icon">${p.icon}</div><div class="offer-name">${p.name}</div><div class="tag">${p.tag}</div></div>`;
   b.setAttribute('aria-label',p.name);b.addEventListener('click',()=>openPromo(p));wrap.appendChild(b);
 });
}
function openPromo(p){
 document.getElementById('drawerTitle').textContent=p.name;
 document.getElementById('drawerBody').innerHTML=`<div class="hero">${p.icon}</div><div class="promo-badge">${p.category} • Demo concept</div><div class="headline">${p.headline}</div><p class="sub">${p.desc}</p><div class="facts"><div class="fact"><b>Validity</b><span>${p.valid}</span></div><div class="fact"><b>Eligibility</b><span>${p.eligibility}</span></div></div><div class="section">How it works</div><ol class="steps">${p.steps.map(s=>`<li>${s}</li>`).join('')}</ol><div class="section">Demo promo code</div><div class="codebox"><div class="code">${p.code}</div><button class="copy" onclick="copyCode('${p.code}',this)">Copy</button></div><div class="notice"><b>Prototype notice:</b> These are illustrative promotional concepts for this unofficial demo. They are not verified current Starbucks offers and should not be presented to customers as active real-world promotions.</div>`;
 drawer.classList.add('open');overlay.classList.add('show');drawer.setAttribute('aria-hidden','false');
}
function closeDrawer(){drawer.classList.remove('open');overlay.classList.remove('show');drawer.setAttribute('aria-hidden','true')}
window.copyCode=async(code,btn)=>{try{await navigator.clipboard.writeText(code);btn.textContent='Copied!';setTimeout(()=>btn.textContent='Copy',1200)}catch(e){btn.textContent=code}}
document.getElementById('closeDrawer').addEventListener('click',closeDrawer);overlay.addEventListener('click',closeDrawer);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
document.getElementById('core').addEventListener('click',()=>openPromo({name:'Promotional Offers Guide',icon:'🎁',category:'Promo Orbit',headline:'Promotions Only',desc:'This version of Menu Orbit is dedicated exclusively to promotional offers. Product ordering, cart, checkout, store pickup, and inventory browsing are intentionally removed from the customer experience.',valid:'Prototype',eligibility:'Demo viewing',code:'PROMO-ONLY',steps:['Rotate the orbit to browse offers.','Tap any promo bubble to see mechanics and eligibility.','Copy the demo code for presentations or testing only.']}));
document.querySelectorAll('.chip').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));btn.classList.add('active');currentFilter=btn.dataset.filter;rotation=0;render()}));
stage.addEventListener('pointerdown',e=>{dragging=true;startX=e.clientX;startRotation=rotation;stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!dragging)return;rotation=startRotation+(e.clientX-startX)*.008;render()});stage.addEventListener('pointerup',()=>dragging=false);stage.addEventListener('pointercancel',()=>dragging=false);stage.addEventListener('wheel',e=>{rotation+=Math.sign(e.deltaY)*.16;render()},{passive:true});
window.addEventListener('resize',render);render();
</script>
</body>
</html>
