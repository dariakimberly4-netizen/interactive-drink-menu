<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Menu Orbit — Manager Workspace</title><style>:root{--g:#063b2b;--gold:#d4ad62}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 50% 15%,#176348,#03251b 68%);color:#fff;min-height:100vh}header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #ffffff24}header b{color:#f1d38e}.back{background:transparent;color:#fff;border:1px solid #ffffff55;border-radius:10px;padding:9px 12px}.title{text-align:center;margin:26px 0 8px}.title h1{margin:0;font-size:clamp(28px,5vw,44px)}.title p{color:#c8d7d0}.orbit{position:relative;width:min(680px,94vw);height:min(680px,94vw);min-height:390px;margin:10px auto 45px}.orbit:before{content:"";position:absolute;left:14%;top:14%;width:72%;height:72%;border:1px solid #d4ad6280;border-radius:50%}.center,.node{position:absolute;border-radius:50%;color:#fff;font-weight:950;text-align:center}.center{left:50%;top:50%;transform:translate(-50%,-50%);width:170px;height:170px;background:radial-gradient(circle,#187552,#042b20);border:5px solid var(--gold);z-index:3}.center small{display:block;color:#f1d38e;margin-top:7px}.node{transform:translate(-50%,-50%);width:112px;height:112px;background:#0a3527;border:2px solid var(--gold);font-size:9px;z-index:4}.node span{display:block;font-size:22px;margin-bottom:4px}.panel{display:none;width:min(760px,94vw);margin:20px auto 50px;background:#fff;color:#10251d;border-radius:20px;padding:20px}.panel button{border:0;border-radius:10px;padding:10px 13px;font-weight:850}.row{padding:12px 0;border-bottom:1px solid #e4e9e6}.primary{background:var(--g);color:#fff}@media(max-width:650px){.center{width:122px;height:122px;font-size:11px}.node{width:84px;height:84px;font-size:7.3px}.node span{font-size:17px}}</style></head><body><header><div><b>MANAGER</b><br><small>Unified Staff System</small></div><button class="back" onclick="location.href='staff-portal.html'">Staff Portal</button></header><section id="home"><div class="title"><h1>Manager Orbit</h1><p>Shift and operations control</p></div><div class="orbit"><button class="center" id="center">SHIFT CONTROL<small>LIVE OVERVIEW</small></button><div id="nodes"></div></div></section><section class="panel" id="panel"><button onclick="closePanel()">← Back to Manager Orbit</button><div id="content"></div></section><script>if(sessionStorage.getItem('menuorbit_role')!=='manager')location.replace('staff-portal.html');const tools=[['alerts','🔔','ALERTS'],['staff','👤','STAFF & SHIFT'],['orders','!','ORDER ESCALATION'],['refund','✓','REFUND / VOID'],['stock','▣','STOCK ALERTS'],['equipment','⚙','EQUIPMENT'],['handover','⇄','HANDOVER'],['close','◫','SHIFT CLOSE']];const pts=[[50,7],[79,17],[93,50],[79,83],[50,93],[21,83],[7,50],[21,17]];nodes.innerHTML=tools.map((x,i)=>`<button class="node" data-id="${x[0]}" style="left:${pts[i][0]}%;top:${pts[i][1]}%"><span>${x[1]}</span>${x[2]}</button>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openTool(b.dataset.id));center.onclick=()=>openTool('alerts');function openTool(id){home.style.display='none';panel.style.display='block';const map={alerts:['Alert Center','1 delayed order\n2 low-stock items\nNo critical staff alerts'],staff:['Staff & Shift','Barista • Active\nCashier • Active\nInventory • Active'],orders:['Order Escalations','MO-1047 • Delayed\nMO-1048 • Customer assistance'],refund:['Refund / Void','Review protected cashier requests.'],stock:['Stock Alerts','Whole Milk • LOW\nOat Milk • OUT'],equipment:['Equipment Issues','Espresso Station 1 • Check requested'],handover:['Shift Handover','Review unresolved orders, stock alerts, and notes.'],close:['Shift Close','Confirm staff status, cash closeout, incidents, and handover before closing.']};let [t,b]=map[id];content.innerHTML=`<h2>${t}</h2>`+b.split('\n').map(x=>`<div class="row">${x}</div>`).join('')+(['refund','close'].includes(id)?'<p><button class="primary">REVIEW</button></p>':'')}function closePanel(){panel.style.display='none';home.style.display='block'}</script></body></html>
