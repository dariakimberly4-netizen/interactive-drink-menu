<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Menu Orbit — Manager</title><style>html,body{margin:0;width:100%;height:100%;background:#03251b}iframe{width:100%;height:100%;border:0;display:block;visibility:hidden}</style></head><body><iframe id="app" src="manager.html?portal=1"></iframe><script>const f=document.getElementById('app');let tries=0;function bypass(){tries++;try{const d=f.contentDocument;if(!d)return;const b=d.getElementById('oneTap');if(b){b.click();setTimeout(()=>f.style.visibility='visible',220);return}const p=d.getElementById('portal');if(p&&getComputedStyle(p).display!=='none'){f.style.visibility='visible';return}}catch(e){}if(tries<40)setTimeout(bypass,100);else f.style.visibility='visible'}f.onload=()=>setTimeout(bypass,50);</script></body></html>
