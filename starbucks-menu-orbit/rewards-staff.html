<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Rewards Staff</title><style>:root{--g:#00754a;--d:#05291d;--gold:#d4ad62;--cream:#f5f0e8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#176a4b,#03130d 65%);color:#fff;font:16px Inter,system-ui,sans-serif;min-height:100vh}.shell{max-width:880px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font:700 25px Georgia,serif}.brand small{display:block;color:#c6dbd0;font:12px Inter,sans-serif;margin-top:4px}.card{margin-top:16px;padding:20px;border:1px solid rgba(255,255,255,.16);border-radius:22px;background:rgba(6,39,28,.8);backdrop-filter:blur(16px)}input,button{font:inherit}input{width:100%;min-height:52px;border-radius:14px;border:1px solid #789c8c;background:#fff;color:#08261a;padding:0 14px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:160px}button,a.btn{min-height:50px;border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:0 15px;background:rgba(255,255,255,.08);color:#fff;font-weight:800;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(135deg,#00a862,#00754a)}.gold{background:linear-gradient(135deg,#e0bd73,#936b22);color:#182016}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat div{padding:14px;border-radius:16px;background:rgba(255,255,255,.07)}.stat b{display:block;color:#ffe2a0;font-size:25px}.log{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.12);color:#d2e1da}.log small{display:block;color:#a9c1b5;margin-top:4px}.hide{display:none}.notice{color:#b6ccbf;font-size:13px;line-height:1.45}@media(max-width:600px){.shell{padding:15px}.stat{grid-template-columns:1fr}.top{align-items:flex-start}.row>*{min-width:100%}}</style></head><body><main class="shell"><div class="top"><div class="brand">★ STAR REWARDS<small>Staff counter console</small></div><a class="btn" href="index.html">Back to Menu</a></div><section id="pinScreen" class="card"><h2>Staff access</h2><p class="notice">Enter the staff PIN to use the counter tools.</p><input id="pin" type="password" inputmode="numeric" placeholder="Staff PIN"><div class="row" style="margin-top:10px"><button class="primary" id="unlock">Unlock</button></div><p class="notice">Prototype PIN: 2468. Production use requires staff accounts and server-side permissions.</p></section><section id="app" class="hide"><section class="card"><div class="top"><div><h2 style="margin:0">Find a Star Rewards member</h2><p class="notice">Scan the QR code or enter the member code.</p></div></div><div class="row"><input id="code" placeholder="Example: STAR-ABC12345"><button class="primary" id="find">Find member</button></div></section><section id="member"></section><section class="card"><h2>Recent reward activity</h2><div id="log"></div></section></section></main><script>const K='starRewardsMember',A='starRewardsAudit';const $=s=>document.querySelector(s);let r=null;const load=()=>JSON.parse(localStorage.getItem(K)||'null'),save=()=>localStorage.setItem(K,JSON.stringify(r));function audit(action,detail){const x=JSON.parse(localStorage.getItem(A)||'[]');x.unshift({id:'SR-'+Date.now(),at:new Date().toISOString(),action,detail,member:r.code,name:r.name});localStorage.setItem(A,JSON.stringify(x.slice(0,100)))}function logs(){const x=JSON.parse(localStorage.getItem(A)||'[]');$('#log').innerHTML=x.length?x.slice(0,12).map(v=>'<div class="log"><b>'+v.action+'</b><small>'+v.name+' • '+v.member+'<br>'+new Date(v.at).toLocaleString('en-PH')+(v.detail?' • '+v.detail:'')+'</small></div>').join(''):'<p class="notice">No counter actions yet.</p>'}function show(){if(!r)return;$('#member').innerHTML='<section class="card"><div class="stat"><div><b>'+r.stars+'</b>Current Stars</div><div><b>'+r.rewards+'</b>Free Drink Rewards</div><div><b>'+r.code+'</b>Member code</div></div><h2 style="margin-bottom:3px">'+r.name+'</h2><p class="notice">Stars and redemptions are recorded to this prototype wallet immediately.</p><div class="row"><button class="primary" id="add">Add 1 Star</button><button class="gold" id="redeem" '+(!r.rewards?'disabled':'')+'>Redeem Free Drink</button></div><p id="result" class="notice"></p></section>';$('#add').onclick=()=>{r.stars++;if(r.stars>=5){r.stars-=5;r.rewards++;audit('FREE DRINK UNLOCKED','Counter star entry')}audit('STAR ADDED','Staff counter');save();show();logs();$('#result').textContent='★ One Star added.'};$('#redeem').onclick=()=>{if(!r.rewards){$('#result').textContent='No available reward to redeem.';return}r.rewards--;audit('REWARD REDEEMED','Counter redemption');save();show();logs();$('#result').textContent='✓ Free drink reward redeemed. Duplicate redemption prevented because the wallet has been updated.'}}$('#unlock').onclick=()=>{if($('#pin').value!=='2468')return alert('Incorrect staff PIN.');$('#pinScreen').classList.add('hide');$('#app').classList.remove('hide');logs()};$('#find').onclick=()=>{const q=$('#code').value.trim().toUpperCase(),x=load();if(!x||x.code!==q){r=null;$('#member').innerHTML='<section class="card"><b>Member not found.</b><p class="notice">Open the same browser’s Star Rewards wallet first, then enter its member code.</p></section>';return}r=x;show()};</script></body></html>
