<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Starbucks Menu Orbit</title>
<style>html,body{margin:0;min-height:100%;background:#04140e;color:#fff;font-family:system-ui,sans-serif}#boot{position:fixed;inset:0;display:grid;place-items:center;background:#04140e;color:#d9e5df;font-weight:800;letter-spacing:.06em}</style>
</head>
<body>
<div id="boot">LOADING MENU ORBIT…</div>
<script>
(async()=>{
  try{
    const r=await fetch('index.html?source=v83&ts='+Date.now(),{cache:'no-store'});
    let html=await r.text();
    html=html.replace('<script src="config.js"></'+'script>','<script src="config.js?v=83"></'+'script>');
    html=html.replace('<div class="nav-orbit-center" id="navOrbitCenter"><strong>MENU</strong><span>Choose a path</span></div>','<div class="nav-orbit-center" id="navOrbitCenter"><strong>TAP HOME</strong></div>');
    const patch=`<style id="v83NoSStyle">#menuMainBtnV61{display:none!important;visibility:hidden!important;pointer-events:none!important}#navOrbitCenter .smart-brand-s{display:none!important}</style><script id="v83NoSGuard">(()=>{const fix=()=>{document.getElementById('menuMainBtnV61')?.remove();const el=document.getElementById('navOrbitCenter');if(!el||!el.classList.contains('smart-center'))return;const hasS=!!el.querySelector('.smart-brand-s');const home=el.querySelector('.smart-home-label');if(hasS||!home||home.textContent.trim().toUpperCase()!=='TAP HOME'){const badges=[...el.querySelectorAll('.smart-badge')].map(n=>n.outerHTML).join('');el.innerHTML='<span class="smart-home-label">Tap Home</span><i class="hold-progress" aria-hidden="true"></i>'+badges;el.setAttribute('aria-label','Tap Home')}};fix();new MutationObserver(fix).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});setInterval(fix,300)})();<\/script>`;
    html=html.replace('</body>',patch+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('boot').textContent='Unable to load the menu.'}
})();
</script>
</body>
</html>
