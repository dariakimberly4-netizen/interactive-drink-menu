<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Starbucks Menu Orbit</title>
<style>html,body{margin:0;min-height:100%;background:#04140e;color:#fff;font-family:system-ui,sans-serif}#boot{position:fixed;inset:0;display:grid;place-items:center;background:#04140e;color:#d9e5df;font-weight:800;letter-spacing:.06em}</style>
</head>
<body>
<div id="boot">LOADING MENU ORBIT…</div>
<script>
(async()=>{
  try{
    const r=await fetch('index.html?source=v85&ts='+Date.now(),{cache:'no-store'});
    let html=await r.text();
    html=html.replace('<script src="config.js"></'+'script>','<script>history.replaceState(null,"","./index.html?v=85#orbit")</'+'script><script src="config.js?v=85"></'+'script>');
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('boot').textContent='Unable to load the menu.'}
})();
</script>
</body>
</html>
