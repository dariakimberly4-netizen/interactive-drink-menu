<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Menu Orbit — Unified Staff Portal</title><style>:root{--g:#063b2b;--cream:#f7f3ea;--ink:#17352a;--line:#d8dedb}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--ink)}header{background:var(--g);color:#fff;text-align:center;padding:18px}header b{display:block;font-size:18px}main{width:min(520px,100%);margin:auto;padding:28px 16px}.hero{text-align:center}.roles{display:grid;gap:12px;margin-top:22px}.role{min-height:64px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);padding:0 18px;display:flex;align-items:center;justify-content:space-between;font-size:18px;font-weight:850}.role span:first-child{display:flex;gap:12px;align-items:center}.login{display:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-top:20px}.login.show{display:block}.hide{display:none}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input{width:100%;min-height:50px;border:1px solid #cbd4cf;border-radius:10px;padding:0 12px}.actions{display:grid;gap:9px;margin-top:18px}.primary,.back{min-height:50px;border:0;border-radius:10px;font-weight:900}.primary{background:var(--g);color:#fff}.back{background:#e9eeeb;color:var(--ink)}</style></head><body><header><b>MENU ORBIT</b><span>Unified Staff System</span></header><main><section class="hero" id="hero"><h1>Staff Portal</h1><p>Select your role.</p></section><section class="roles" id="roles"><button class="role" data-role="cashier"><span><span>₱</span>Cashier</span><span>›</span></button><button class="role" data-role="barista"><span><span>☕</span>Barista</span><span>›</span></button><button class="role" data-role="inventory"><span><span>▣</span>Inventory</span><span>›</span></button><button class="role" data-role="manager"><span><span>◆</span>Manager</span><span>›</span></button></section><section class="login" id="login"><h2 id="title">Role Sign In</h2><p>Sign in once to open this workspace.</p><div class="field"><label>STAFF EMAIL</label><input id="email" type="email"></div><div class="field"><label>PASSWORD</label><input id="pass" type="password"></div><div class="actions"><button class="primary" id="go">SIGN IN</button><button class="back" id="back">← Back</button></div></section></main><script>const routes={cashier:'cashier-workspace.html?v=1',barista:'barista-workspace.html?v=1',inventory:'inventory-workspace.html?v=1',manager:'manager-workspace.html?v=1'};let selected='';document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{selected=b.dataset.role;title.textContent=selected[0].toUpperCase()+selected.slice(1)+' Sign In';hero.classList.add('hide');roles.classList.add('hide');login.classList.add('show')});go.onclick=()=>{if(!email.value.trim()||!pass.value)return;sessionStorage.setItem('menuorbit_role',selected);location.href=routes[selected]};back.onclick=()=>{selected='';login.classList.remove('show');hero.classList.remove('hide');roles.classList.remove('hide')};</script></body></html>
