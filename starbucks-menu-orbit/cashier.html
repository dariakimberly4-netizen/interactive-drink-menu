<html lang="en">
<head>

<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">

<title>Menu Orbit — Cashier</title>
<style>
:root{--g:#00754a;--g2:#00a862;--bg:#03130d;--panel:#08251b;--cream:#f4efe6;--gold:#d4ad62;--line:rgba(255,255,255,.14);--muted:#aac0b5;--danger:#d66060;--ok:#59cf91;--shadow:0 20px 55px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#145d42,#061a13 42%,#020907);color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f4c86f;outline-offset:3px}.wrap{width:min(1280px,calc(100% - 18px));margin:auto;padding:12px 0 60px}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:9px;padding:10px 0;background:rgba(3,19,13,.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.06)}.brand{display:flex;align-items:center;gap:10px}.logo{width:48px;height:48px;border-radius:50%;border:2px solid #fff;background:var(--g);display:grid;place-items:center;font:900 20px Georgia,serif}.brand h1{margin:0;font-size:clamp(20px,3vw,30px)}.brand p{margin:2px 0 0;color:var(--muted);font-size:11px}.spacer{flex:1}.btn{min-height:52px;border:1px solid var(--line);border-radius:14px;padding:0 15px;background:rgba(255,255,255,.07);color:#fff;font-weight:900}.btn.primary{border:0;background:linear-gradient(135deg,var(--g2),var(--g))}.btn.cream{background:var(--cream);color:#073421}.btn.danger{border-color:rgba(255,120,120,.35);color:#ffd1d1}.card{background:rgba(8,37,27,.95);border:1px solid var(--line);border-radius:22px;padding:17px;margin-top:12px;box-shadow:var(--shadow)}.login{width:min(580px,100%);margin:6vh auto}.login input{width:100%;height:56px;border:1px solid var(--line);border-radius:14px;background:#0d3628;color:#fff;padding:0 14px;margin:7px 0}.demo{margin:13px 0;padding:13px;border:1px solid rgba(244,200,111,.38);border-radius:15px;background:rgba(244,200,111,.09);color:#ffe6a8}.cred{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:8px;padding:10px;border-radius:12px;background:rgba(255,255,255,.06)}.cred code{font-weight:900;overflow-wrap:anywhere}.copy{min-height:42px;border:0;border-radius:10px;background:var(--cream);color:#073421;font-weight:900;padding:0 12px}.login-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.notice{color:#adc5b9;font-size:12px;line-height:1.5}.error{color:#ffb2b2}.staffbar{display:grid;grid-template-columns:1.2fr 1fr .7fr;gap:9px;margin:12px 0}.staffbox{background:rgba(8,37,27,.95);border:1px solid var(--line);border-radius:16px;padding:12px}.staffbox b{display:block;font-size:15px}.staffbox span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}.home-actions{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:12px 0}.big{min-height:92px;border-radius:22px;font-size:22px}.section-title{display:flex;align-items:center;gap:10px;margin:14px 0 8px}.section-title h2{margin:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.search{flex:1;min-width:220px;height:52px;border-radius:14px;border:1px solid var(--line);padding:0 14px;background:var(--cream);color:#123125}.cats{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.cats button{min-height:44px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;padding:0 13px;font-weight:900}.cats button.active{background:var(--cream);color:#073421}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.product{background:rgba(8,37,27,.95);border:1px solid var(--line);border-radius:18px;padding:14px}.product h3{margin:0 0 5px}.price{color:#f2cf8b;font-size:19px;font-weight:950}.product button{width:100%;margin-top:10px}.layout{display:grid;grid-template-columns:1.4fr .8fr;gap:12px}.cart{position:sticky;top:86px;align-self:start}.cart-item{padding:11px 0;border-bottom:1px solid var(--line)}.cart-item:last-child{border-bottom:0}.cart-line{display:flex;justify-content:space-between;gap:10px}.cart-meta{font-size:11px;color:var(--muted);line-height:1.45;margin-top:4px}.cart-actions{display:flex;gap:6px;margin-top:7px}.cart-actions button{min-height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font-weight:850}.total{display:flex;justify-content:space-between;align-items:center;font-size:21px;font-weight:950;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.promo{padding:10px;border-radius:12px;background:rgba(244,200,111,.08);border:1px solid rgba(244,200,111,.22);margin-top:10px;color:#ffe4a7}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice{min-height:54px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.06);color:#fff;font-weight:900}.choice.on{background:var(--cream);color:#073421}.review-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.success{padding:18px;border-radius:18px;background:rgba(89,207,145,.1);border:1px solid rgba(89,207,145,.35);text-align:center}.order-ref{font-size:32px;font-weight:950;color:#f2cf8b}.orders{display:grid;gap:9px}.order-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:13px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.04)}.status{display:inline-block;padding:5px 8px;border-radius:999px;background:rgba(0,168,98,.15);font-size:10px;font-weight:900;text-transform:uppercase}.modal{position:fixed;z-index:100;inset:0;display:none;align-items:center;justify-content:center;padding:15px;background:rgba(0,0,0,.68);backdrop-filter:blur(8px)}.modal.open{display:flex}.modal-card{width:min(590px,100%);max-height:90vh;overflow:auto;background:#08251b;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}.modal-card h2{margin-top:0}.form{display:grid;gap:10px}.form label{font-size:12px;font-weight:900}.form select,.form textarea,.form input{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:12px;background:#0d3628;color:#fff;padding:10px}.form select,.form input{min-height:48px}.form textarea{min-height:80px}.empty{text-align:center;padding:48px;color:var(--muted)}.reduce-motion *{animation:none!important;transition:none!important;scroll-behavior:auto!important}@media(max-width:900px){.layout{grid-template-columns:1fr}.cart{position:static}.products{grid-template-columns:1fr 1fr}.top{flex-wrap:wrap}.top .spacer{display:none}.top .btn{flex:1}}@media(max-width:620px){.wrap{width:min(100% - 12px,1280px)}.staffbar,.home-actions,.products,.choice-grid,.login-actions{grid-template-columns:1fr}.cred{grid-template-columns:1fr}.copy{width:100%}.big{min-height:76px}.order-row{grid-template-columns:1fr}}

/* CASHIER ORBIT V1 */
.cashier-orbit-shell{margin:18px auto 0;max-width:920px;text-align:center}
.cashier-orbit-title{margin:0;font:800 clamp(28px,4vw,46px)/1 Georgia,serif}
.cashier-orbit-sub{margin:7px 0 16px;color:var(--muted);font-size:12px}
.cashier-orbit{
  position:relative;width:min(680px,94vw);height:min(680px,76vh);min-height:520px;
  margin:0 auto;display:block
}
.cashier-orbit-ring{
  position:absolute;left:50%;top:50%;width:420px;height:420px;transform:translate(-50%,-50%);
  border-radius:50%;border:1px solid rgba(244,200,111,.30);
  box-shadow:0 0 0 24px rgba(255,255,255,.015),inset 0 0 70px rgba(0,117,74,.10);
  pointer-events:none
}
.cashier-orbit-center{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:170px;height:170px;border-radius:50%;
  display:grid;place-items:center;align-content:center;gap:5px;
  border:2px solid var(--gold);background:linear-gradient(145deg,#0d402f,#061d15);
  box-shadow:0 18px 50px rgba(0,0,0,.35),0 0 32px rgba(212,173,98,.18);
  z-index:5
}
.cashier-orbit-center b{font:800 22px Georgia,serif}
.cashier-orbit-center span{font-size:10px;color:#c6d7cf;max-width:120px}
.cashier-orbit-node{
  position:absolute;width:132px;height:132px;border-radius:50%;
  display:grid;place-items:center;align-content:center;gap:5px;padding:10px;
  border:1px solid rgba(255,255,255,.16);background:linear-gradient(145deg,#154535,#08261c);
  color:#fff;font-weight:950;text-align:center;box-shadow:0 14px 30px rgba(0,0,0,.28);
  cursor:pointer;transition:.18s transform,.18s border-color,.18s box-shadow
}
.cashier-orbit-node:hover{transform:translate(-50%,-50%) scale(1.06)!important;border-color:var(--gold);box-shadow:0 16px 36px rgba(0,0,0,.34),0 0 22px rgba(212,173,98,.22)}
.cashier-orbit-node .ico{font-size:27px;line-height:1}
.cashier-orbit-node small{font-size:9px;color:#b9cdc3;font-weight:700}
.cashier-orbit-node.new-orbit{
  border:2px solid #ffd86b;box-shadow:0 0 0 4px rgba(255,216,107,.16),0 0 30px rgba(255,216,107,.34)
}
.cashier-orbit-node.new-orbit::after{
  content:'NEW';position:absolute;top:-8px;right:2px;padding:5px 7px;border-radius:999px;
  background:#ffd86b;color:#07331f;font:950 8px/1 system-ui;letter-spacing:.08em
}
.cashier-orbit-back{
  margin-top:-18px;min-height:44px;padding:0 15px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font-weight:900
}
.cashier-quick-status{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:760px;margin:0 auto 12px
}
.cashier-quick-status .staffbox{text-align:left}
@media(max-width:720px){
  .cashier-orbit{height:560px;min-height:560px}
  .cashier-orbit-ring{width:320px;height:320px}
  .cashier-orbit-center{width:138px;height:138px}
  .cashier-orbit-node{width:106px;height:106px;font-size:11px}
  .cashier-orbit-node .ico{font-size:23px}
  .cashier-quick-status{grid-template-columns:1fr 1fr}
}
@media(max-width:430px){
  .cashier-orbit{height:500px;min-height:500px}
  .cashier-orbit-ring{width:270px;height:270px}
  .cashier-orbit-center{width:122px;height:122px}
  .cashier-orbit-center b{font-size:18px}
  .cashier-orbit-node{width:92px;height:92px;padding:7px;font-size:10px}
  .cashier-orbit-node .ico{font-size:20px}
}

/* CASHIER OPERATIONS V2 */
.tool-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tool-card{padding:14px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.045)}
.tool-card b{display:block;font-size:15px}.tool-card small{display:block;color:var(--muted);margin-top:4px;line-height:1.4}
.tool-card .btn{width:100%;margin-top:10px;min-height:44px}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:10px 0}
.kpi{padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.045)}
.kpi b{display:block;font-size:22px;color:#f2cf8b}.kpi span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.approval-row,.receipt-row,.hold-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:13px;margin-top:8px;background:rgba(255,255,255,.035)}
.inventory-ok{color:#9fe5bc}.inventory-low{color:#ffd38d}.inventory-out{color:#ffaaaa}
@media(max-width:620px){.tool-grid,.kpi-grid{grid-template-columns:1fr}.approval-row,.receipt-row,.hold-row{grid-template-columns:1fr}}

/* CASHIER LIVE CENTER V3 */
.cashier-orbit-center{
  cursor:pointer!important;
  user-select:none!important;
  transition:.18s transform,.18s box-shadow,.18s border-color!important;
}
.cashier-orbit-center:hover{
  transform:translate(-50%,-50%) scale(1.04)!important;
  border-color:#ffd86b!important;
  box-shadow:0 20px 56px rgba(0,0,0,.38),0 0 34px rgba(255,216,107,.25)!important;
}
.cashier-orbit-center:active{transform:translate(-50%,-50%) scale(.98)!important}
.cashier-orbit-center .center-action{
  font:950 18px/1.05 system-ui;
  letter-spacing:.02em;
}
.cashier-orbit-center .center-status{
  font-size:9px;
  color:#c8dbd2;
  line-height:1.3;
  max-width:125px;
}
.cashier-orbit-center .center-kicker{
  font-size:8px;
  color:#f4c86f;
  letter-spacing:.12em;
  font-weight:900;
}
.cashier-orbit-center.center-alert{
  border-color:#ffcf70!important;
  box-shadow:0 0 0 4px rgba(255,207,112,.14),0 0 30px rgba(255,207,112,.28)!important;
}

/* CASHIER LIVE OPS V4 */
.order-timer{display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:5px 8px;border-radius:999px;background:rgba(244,200,111,.1);color:#ffe19a;font-size:10px;font-weight:900}
.order-timer.late{background:rgba(214,96,96,.15);color:#ffc2c2}
.soldout{opacity:.5;filter:grayscale(.35)}
.soldout-badge{display:inline-block;margin-top:6px;padding:5px 8px;border-radius:999px;background:rgba(214,96,96,.18);color:#ffc2c2;font-size:9px;font-weight:900}
.ready-alert{
  position:fixed;right:14px;bottom:14px;z-index:200;
  width:min(340px,calc(100% - 28px));padding:14px;border-radius:18px;
  background:#f4efe6;color:#073421;border:2px solid #f4c86f;
  box-shadow:0 20px 50px rgba(0,0,0,.35);display:none
}
.ready-alert.show{display:block}
.ready-alert b{display:block;font-size:16px}.ready-alert small{display:block;margin-top:4px;color:#466657}
.ready-alert button{margin-top:10px;width:100%;min-height:40px;border:0;border-radius:10px;background:#00754a;color:#fff;font-weight:900}
.split-pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cash-change-result{margin-top:10px;padding:14px;border-radius:14px;background:rgba(89,207,145,.1);border:1px solid rgba(89,207,145,.3)}
.cash-change-result b{font-size:24px;color:#9fe5bc}
@media(max-width:620px){.split-pay-grid{grid-template-columns:1fr}}

/* CASHIER BUSINESS V5 */
.business-chart{display:grid;gap:8px;margin-top:12px}
.business-bar{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center}
.business-bar-track{height:12px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
.business-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#00a862,#f4c86f)}
.business-table{width:100%;border-collapse:collapse;margin-top:10px}
.business-table th,.business-table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}
.business-table th{color:#f4c86f;font-size:9px;text-transform:uppercase;letter-spacing:.08em}
.business-note{padding:12px;border-radius:13px;background:rgba(244,200,111,.08);border:1px solid rgba(244,200,111,.22);margin-top:10px}
@media(max-width:620px){.business-bar{grid-template-columns:90px 1fr auto}.business-table{font-size:11px}}

/* CASHIER NEW FEATURE HIGHLIGHTS V6 */
.choice[data-discount]{position:relative}
.choice[data-discount]:not([data-discount="None"]){border:2px solid #ffd86b;box-shadow:0 0 0 3px rgba(255,216,107,.12),0 0 22px rgba(255,216,107,.18)}
.choice[data-discount]:not([data-discount="None"])::after{content:'NEW';position:absolute;top:-9px;right:-5px;padding:4px 6px;border-radius:999px;background:#ffd86b;color:#07331f;font:950 7px/1 system-ui;letter-spacing:.08em}
#customerName{border:2px solid #ffd86b;box-shadow:0 0 0 3px rgba(255,216,107,.10)}

/* FORCE-VISIBLE CASHIER HIGHLIGHTS V7 */
.cashier-orbit-node[data-orbit-id="Payments"],.cashier-orbit-node[data-orbit-id="Promos & Customers"]{border:3px solid #ffd84d!important;background:linear-gradient(145deg,#705300,#173b2d)!important;box-shadow:0 0 0 6px rgba(255,216,77,.22),0 0 38px rgba(255,216,77,.55)!important;animation:newPulse 1.5s ease-in-out infinite}
.cashier-orbit-node[data-orbit-id="Payments"]::after,.cashier-orbit-node[data-orbit-id="Promos & Customers"]::after{content:'NEW';position:absolute;top:-10px;right:-4px;background:#ffd84d;color:#062b1c;padding:6px 9px;border-radius:999px;font:950 9px/1 system-ui;z-index:8}
@keyframes newPulse{50%{box-shadow:0 0 0 10px rgba(255,216,77,.10),0 0 52px rgba(255,216,77,.72)}}

/* DIRECT SENIOR PWD HIGHLIGHT V8 */
.choice[data-discount="Senior Citizen"],.choice[data-discount="PWD"]{background:#ffd84d!important;color:#062b1c!important;border:3px solid #fff2a8!important;box-shadow:0 0 0 5px rgba(255,216,77,.24),0 0 34px rgba(255,216,77,.55)!important;font-weight:950!important;transform:scale(1.03)}
.choice[data-discount="Senior Citizen"]::after,.choice[data-discount="PWD"]::after{content:'NEW';position:absolute;top:-11px;right:-7px;background:#fff;color:#073421;padding:5px 8px;border-radius:999px;font:950 8px/1 system-ui;letter-spacing:.08em}

/* MOBILE MODAL FIT FIX V9 */
@media(max-width:600px){
.modal-card,.modal-panel,.sheet,.panel[role="dialog"]{width:calc(100vw - 24px)!important;max-width:calc(100vw - 24px)!important;margin:12px auto!important;box-sizing:border-box!important;left:auto!important;right:auto!important;overflow-x:hidden!important}
.modal-card h2,.modal-panel h2{font-size:clamp(24px,7vw,34px)!important;line-height:1.05!important;overflow-wrap:anywhere}
.modal-card button,.modal-panel button{max-width:100%!important;box-sizing:border-box!important}
}

/* PENDING PAYMENT TAP FIX V10 */
#cashierToolModal.open{pointer-events:auto!important}
#cashierToolModal .modal-card,#cashierToolModal .modal-panel,#cashierToolModal .sheet,#cashierToolModal .panel{pointer-events:auto!important}
#cashierToolModal [data-markpaid]{position:relative!important;z-index:50!important;pointer-events:auto!important;touch-action:manipulation!important;cursor:pointer!important}

/* SEPARATE SENIOR PWD CARDS V11 */
#cashierToolModal .senior-feature,#cashierToolModal .pwd-feature{border:3px solid #ffd84d!important;box-shadow:0 0 0 4px rgba(255,216,77,.14),0 0 24px rgba(255,216,77,.30)!important}
#cashierToolModal .discount-feature b{font-size:18px!important;display:block!important;margin-bottom:8px!important}
#cashierToolModal .discount-feature .btn{width:100%!important;margin-top:12px!important;min-height:50px!important}

/* PROMOS VOUCHER MAIN ORBIT HIGHLIGHT V12 */
.orbit-node[data-group="promos"],[data-orbit-id="Promos & Customers"],[data-menu="promos"],[data-group="Promos & Customers"]{border:4px solid #ffd84d!important;box-shadow:0 0 0 6px rgba(255,216,77,.22),0 0 42px rgba(255,216,77,.58)!important;background:linear-gradient(145deg,#765900,#124832)!important;position:relative!important;z-index:12!important}
.orbit-node[data-group="promos"]::after,[data-orbit-id="Promos & Customers"]::after,[data-menu="promos"]::after,[data-group="Promos & Customers"]::after{content:'PWD • SENIOR • VOUCHER';position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);white-space:nowrap;background:#ffd84d;color:#073421;border-radius:999px;padding:6px 9px;font:950 8px/1 system-ui;letter-spacing:.03em;z-index:30}

/* CASHIER OPERATIONS UPGRADE V13 */
.ops-upgrade{display:grid;gap:10px}.ops-upgrade .tool-card{border:2px solid rgba(255,216,77,.35)}
.ops-upgrade input,.ops-upgrade select{width:100%;box-sizing:border-box;margin-top:6px}
.ops-total{font-size:26px;font-weight:950;margin:10px 0}.ops-good{color:#ffd84d;font-weight:900}
@media(max-width:600px){.ops-upgrade{grid-template-columns:1fr!important}}

/* NEW CASHIER FEATURES HIGHLIGHT V14 */
#cashierToolModal .senior-feature,
#cashierToolModal .pwd-feature,
#cashierToolModal .tool-card:has([data-disc="Voucher"]),
#cashierToolModal .tool-card:has(#quickSearchOrder),
#cashierToolModal .tool-card:has(#quickShiftSummary){
  position:relative!important;
  border:4px solid #ffd84d!important;
  background:linear-gradient(145deg,#765900,#0d4731)!important;
  box-shadow:0 0 0 6px rgba(255,216,77,.20),0 0 38px rgba(255,216,77,.55)!important;
}
#cashierToolModal .senior-feature::before,
#cashierToolModal .pwd-feature::before,
#cashierToolModal .tool-card:has([data-disc="Voucher"])::before,
#cashierToolModal .tool-card:has(#quickSearchOrder)::before,
#cashierToolModal .tool-card:has(#quickShiftSummary)::before{
  content:'NEW';
  position:absolute;top:-12px;right:-7px;z-index:30;
  padding:6px 9px;border-radius:999px;
  background:#ffd84d;color:#073421;
  font:950 9px/1 system-ui;letter-spacing:.08em;
}
#cashierToolModal .senior-feature,
#cashierToolModal .pwd-feature,
#cashierToolModal .tool-card:has([data-disc="Voucher"]){
 animation:featureGlowV14 1.6s ease-in-out infinite;
}
@keyframes featureGlowV14{50%{box-shadow:0 0 0 9px rgba(255,216,77,.12),0 0 52px rgba(255,216,77,.72)}}

/* ALWAYS VISIBLE NEW FEATURE HIGHLIGHT V15 */
#cashierToolModal .senior-feature,
#cashierToolModal .pwd-feature,
#cashierToolModal .tool-card:has([data-disc="Voucher"]),
#cashierToolModal .tool-card:has(#quickSearchOrder),
#cashierToolModal .tool-card:has(#quickShiftSummary){
 outline:5px solid #ffdf00!important;
 outline-offset:3px!important;
 background:#5f4b00!important;
 box-shadow:0 0 28px #ffdf00!important;
}
#cashierToolModal .senior-feature::after,
#cashierToolModal .pwd-feature::after,

 content:'★ NEW FEATURE';
 display:block!important;
 margin-top:10px!important;

/* CORRECT MAIN ORBIT PROMOS HIGHLIGHT V16 */
.cashier-orbit-node.feature-hub{
 border:5px solid #ffdf00!important;
 background:linear-gradient(145deg,#806000,#0b4b33)!important;
 box-shadow:0 0 0 7px rgba(255,223,0,.25),0 0 48px rgba(255,223,0,.8)!important;
 z-index:25!important;
 animation:featureHubPulse 1.25s ease-in-out infinite!important;
}
.cashier-orbit-node.feature-hub::after{
 content:'PWD • SENIOR • VOUCHER • NEW'!important;
 position:absolute!important;top:-20px!important;left:50%!important;right:auto!important;
 transform:translateX(-50%)!important;white-space:nowrap!important;
 background:#ffdf00!important;color:#073421!important;border:2px solid #fff3a3!important;
 border-radius:999px!important;padding:7px 10px!important;font:1000 8px/1 system-ui!important;z-index:50!important;
}
@keyframes featureHubPulse{50%{box-shadow:0 0 0 12px rgba(255,223,0,.12),0 0 65px rgba(255,223,0,1)}}

/* PROMOS DIRECT ACTIONS V17 */
.cashier-orbit-node[data-orbit-id="Senior Citizen"],
.cashier-orbit-node[data-orbit-id="PWD"],
.cashier-orbit-node[data-orbit-id="Voucher"]{
 border:4px solid #ffdf00!important;background:linear-gradient(145deg,#755800,#0d4933)!important;
 box-shadow:0 0 0 5px rgba(255,223,0,.18),0 0 35px rgba(255,223,0,.55)!important;z-index:20!important;
}
.cashier-orbit-node[data-orbit-id="Senior Citizen"]::after,
.cashier-orbit-node[data-orbit-id="PWD"]::after,

 content:'NEW';position:absolute;top:-10px;right:-5px;background:#ffdf00;color:#073421;

}

/* CASHIER FLOW COMPLETION V18 */
.voucher-total{display:grid;gap:7px;margin-top:12px;padding:14px;border:2px solid #ffdf00;border-radius:14px;background:rgba(255,223,0,.08)}
.voucher-total span{display:flex;justify-content:space-between;color:#d9e7df}.voucher-total strong{font-size:20px;color:#ffdf00}
#vvScan{border:2px dashed #ffdf00!important;color:#ffe77a!important}
.cashier-orbit-node[data-orbit-id="Voucher"]{animation:featureHubPulse 1.25s ease-in-out infinite!important}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">S</div><div><h1>Cashier</h1><p>Menu Orbit Staff Portal • Cashier Orbit</p></div></div><div class="spacer"></div><button class="btn" id="motionBtn">◌ Reduce Motion</button><button class="btn" id="baristaBtn">☕ Barista</button><button class="btn" id="menuBtn">← Customer Menu</button><button class="btn danger" id="signOutBtn" hidden>Sign Out</button></header>
<main id="app"></main>
</div>
<div class="ready-alert" id="readyOrderAlert"><b id="readyAlertTitle">Order Ready</b><small id="readyAlertText"></small><button id="readyAlertClose">DISMISS</button></div>
<div class="modal" id="customModal"><div class="modal-card"><h2 id="customTitle">Customize</h2><div class="form"><label>Size<select id="size"><option>Tall</option><option selected>Grande</option><option>Venti</option></select></label><label>Style<select id="style"><option>Hot</option><option selected>Iced</option><option>Blended</option></select></label><label>Milk<select id="milk"><option>Whole Milk</option><option>Nonfat Milk</option><option>Oat Milk</option><option>Soy Milk</option></select></label><label>Sugar<select id="sugar"><option>Regular</option><option>Less Sugar</option><option>No Sugar</option></select></label><label>Ice<select id="ice"><option>Regular Ice</option><option>Less Ice</option><option>No Ice</option></select></label><label>Add-on<select id="addon"><option>None</option><option>Extra Shot</option><option>Vanilla Syrup</option><option>Caramel Drizzle</option></select></label><label>Special request<textarea id="note" placeholder="Optional"></textarea></label><div class="login-actions"><button class="btn primary" id="addCustom">Add to Cart</button><button class="btn" id="closeCustom">Cancel</button></div></div></div></div>
<div class="modal" id="cashierToolModal"><div class="modal-card"><div class="section-title"><h2 id="cashierToolTitle">Cashier Tool</h2><button class="btn" id="cashierToolClose">×</button></div><div id="cashierToolBody"></div></div></div>
<div class="modal" id="problemModal"><div class="modal-card"><h2>Report Problem</h2><div class="form"><label>Reason<select id="problemReason"><option>Wrong order</option><option>Customer changed order</option><option>Payment issue</option><option>Duplicate order</option><option>Other</option></select></label><label>Details<textarea id="problemNote" placeholder="Add details"></textarea></label><div class="login-actions"><button class="btn danger" id="submitProblem">Send to Branch Manager</button><button class="btn" id="closeProblem">Cancel</button></div></div></div></div>
<script src="config.js"></script>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/+esm';
const cfg=window.MENU_ORBIT_CONFIG||{},app=document.querySelector('#app'),signOut=document.querySelector('#signOutBtn');
const db=cfg.supabaseUrl&&cfg.supabasePublishableKey?createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;
const DEMO_EMAIL='cashier.demo@menuorbit.test',DEMO_PASSWORD='CashierOrbit2026!';
let demo=false,screen='home',cart=[],selectedProduct=null,orderType='Takeout',payment='Pending',promo=null,lastOrder=null,activeOrders=[];
let customerName='',discountType='None',voucherApplied=null,discountAudit=null;
let cashier={name:'Demo Cashier',branch:'Demo Bacoor Branch',role:'CASHIER'};
const products=[{id:'p1',name:'Caffè Latte',cat:'Coffee',price:195},{id:'p2',name:'Caramel Macchiato',cat:'Coffee',price:240},{id:'p3',name:'Cappuccino',cat:'Coffee',price:190},{id:'p4',name:'Cold Brew',cat:'Cold Drinks',price:205},{id:'p5',name:'Matcha Latte',cat:'Tea',price:210},{id:'p6',name:'Ham & Cheese Croffle',cat:'Food',price:170},{id:'p7',name:'Chocolate Cake',cat:'Food',price:185},{id:'p8',name:'Bottled Water',cat:'Other',price:80}];
const promos=[{id:'pr1',title:'Morning Pair',desc:'₱20 off when cart total is ₱400 or more.',min:400,discount:20}];
const money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{maximumFractionDigits:0});
const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
document.querySelector('#menuBtn').onclick=()=>location.href='index.html';document.querySelector('#baristaBtn').onclick=()=>location.href='staff.html';document.querySelector('#motionBtn').onclick=()=>{document.body.classList.toggle('reduce-motion');document.querySelector('#motionBtn').textContent=document.body.classList.contains('reduce-motion')?'● Motion Reduced':'◌ Reduce Motion'};
function copy(v,label){navigator.clipboard?.writeText(v).then(()=>alert(label+' copied')).catch(()=>alert(v))}
function login(){signOut.hidden=true;app.innerHTML=`<section class="card login"><h2>Cashier Sign In</h2><p class="notice">Use an authorized Cashier account, or use the demo credentials below.</p><div class="demo"><b>DEMO LOGIN — CLICK TO COPY</b><div class="cred"><code>${DEMO_EMAIL}</code><button class="copy" id="copyEmail">Copy Email</button></div><div class="cred"><code>${DEMO_PASSWORD}</code><button class="copy" id="copyPass">Copy Password</button></div><button class="btn" id="fillDemo" style="width:100%;margin-top:9px">Fill Demo Login</button></div><form id="loginForm"><input id="email" type="email" required placeholder="Cashier email"><input id="pass" type="password" required placeholder="Password"><div class="login-actions"><button class="btn primary" type="submit">Sign In</button><button class="btn" type="button" id="demoBtn">Enter Demo Dashboard</button></div></form><p class="notice" id="msg"></p></section>`;document.querySelector('#copyEmail').onclick=()=>copy(DEMO_EMAIL,'Email');document.querySelector('#copyPass').onclick=()=>copy(DEMO_PASSWORD,'Password');document.querySelector('#fillDemo').onclick=()=>{document.querySelector('#email').value=DEMO_EMAIL;document.querySelector('#pass').value=DEMO_PASSWORD};document.querySelector('#demoBtn').onclick=enterDemo;document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();const email=document.querySelector('#email').value.trim(),pass=document.querySelector('#pass').value,msg=document.querySelector('#msg');if(email===DEMO_EMAIL&&pass===DEMO_PASSWORD)return enterDemo();if(!db){msg.textContent='Live backend is not connected. Use the demo login.';return}msg.textContent='Signing in…';const {error}=await db.auth.signInWithPassword({email,password:pass});if(error){msg.textContent=error.message;msg.className='notice error'}else await init()}}
function enterDemo(){demo=true;cashier={name:'Jamie Cruz',branch:'Demo Bacoor Branch',role:'CASHIER'};activeOrders=[{order_ref:'MO-1201',status:'new',total_amount:430,_demoCreated:Date.now()-4*60000},{order_ref:'MO-1199',status:'preparing',total_amount:205,_demoCreated:Date.now()-12*60000},{order_ref:'MO-1196',status:'ready',total_amount:390,_demoCreated:Date.now()-18*60000}];signOut.hidden=false;signOut.onclick=()=>{demo=false;login()};screen='home';render()}
async function init(){if(!db)return login();const {data:{session}}=await db.auth.getSession();if(!session)return login();signOut.hidden=false;signOut.onclick=async()=>{await db.auth.signOut();login()};cashier={name:session.user.email?.split('@')[0]||'Cashier',branch:'Assigned Branch',role:'CASHIER'};await loadActive();screen='home';render()}
async function loadActive(){if(!db)return;const {data,error}=await db.from('orders').select('order_ref,status,total_amount,created_at').in('status',['new','preparing','ready']).order('created_at',{ascending:false}).limit(30);if(!error)activeOrders=data||[]}
function header(){return `${demo?'<div class="demo"><b>DEMO MODE</b> — sample orders only; no real payments, customers, inventory, or production records are changed.</div>':''}<section class="staffbar"><div class="staffbox"><b>${esc(cashier.name)}</b><span>Cashier</span></div><div class="staffbox"><b>${esc(cashier.branch)}</b><span>Assigned Branch</span></div><div class="staffbox"><b>${esc(cashier.role)}</b><span>Role</span></div></section>`}
function render(){app.innerHTML=header()+`<div id="view"></div>`;if(screen==='home')home();if(screen==='new')newOrder();if(screen==='checkout')checkout();if(screen==='success')success();if(screen==='orders')ordersView();setTimeout(checkReadyAlertsV4,50)}

const CASHIER_OPS_KEY='cashier_ops_v2',HOLD_KEY='cashier_hold_orders_v2',DRAWER_KEY='cashier_drawer_v2',APPROVAL_KEY='cashier_approvals_v2',RECEIPT_KEY='cashier_receipts_v2';
const readLocal=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch(e){return f}};
const writeLocal=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function openCashierTool(title,html){document.querySelector('#cashierToolTitle').textContent=title;document.querySelector('#cashierToolBody').innerHTML=html;document.querySelector('#cashierToolModal').classList.add('open')}
function logCashierOp(type,detail){const a=readLocal(CASHIER_OPS_KEY,[]);a.unshift({type,detail,at:new Date().toLocaleString('en-PH')});writeLocal(CASHIER_OPS_KEY,a.slice(0,100))}
function demoTransactions(){const saved=readLocal(RECEIPT_KEY,[]);const base=[{ref:'MO-1188',total:420,pay:'Cash',status:'Completed'},{ref:'MO-1182',total:255,pay:'Card',status:'Completed'},{ref:'MO-1179',total:610,pay:'E-Wallet',status:'Completed'}];return saved.length?saved:base}
function toolReceipts(){const rows=demoTransactions();openCashierTool('Receipts',`<div class="toolbar"><input class="search" id="receiptSearch" placeholder="Search receipt number"></div><div id="receiptRows">${rows.map(r=>`<div class="receipt-row"><div><b>${esc(r.ref||r.order_ref)}</b><small>${money(r.total||r.total_amount)} • ${esc(r.pay||r.payment_status||'Paid')}</small></div><div><button class="btn" data-reprint="${esc(r.ref||r.order_ref)}">REPRINT</button></div></div>`).join('')}</div>`);document.querySelectorAll('[data-reprint]').forEach(b=>b.onclick=()=>{logCashierOp('Receipt Reprint',b.dataset.reprint);alert('Demo receipt '+b.dataset.reprint+' sent to printer.')})}
function toolDrawer(){const d=readLocal(DRAWER_KEY,{open:false,opening:0,cashIn:0,cashOut:0});openCashierTool('Cash Drawer',`<div class="kpi-grid"><div class="kpi"><b>${d.open?'OPEN':'CLOSED'}</b><span>Status</span></div><div class="kpi"><b>${money(d.opening)}</b><span>Opening Cash</span></div><div class="kpi"><b>${money(d.opening+d.cashIn-d.cashOut)}</b><span>Expected Cash</span></div></div><div class="form"><label>Amount<input id="drawerAmount" type="number" min="0" value="1000"></label><div class="tool-grid"><button class="btn primary" id="drawerOpen">OPEN DRAWER</button><button class="btn" id="drawerIn">CASH IN</button><button class="btn" id="drawerOut">CASH OUT</button><button class="btn danger" id="drawerClose">CLOSE DRAWER</button></div></div>`);const amount=()=>Math.max(0,Number(document.querySelector('#drawerAmount').value)||0);document.querySelector('#drawerOpen').onclick=()=>{d.open=true;d.opening=amount();writeLocal(DRAWER_KEY,d);logCashierOp('Drawer Open',money(d.opening));toolDrawer()};document.querySelector('#drawerIn').onclick=()=>{d.cashIn+=amount();writeLocal(DRAWER_KEY,d);logCashierOp('Cash In',money(amount()));toolDrawer()};document.querySelector('#drawerOut').onclick=()=>{d.cashOut+=amount();writeLocal(DRAWER_KEY,d);logCashierOp('Cash Out',money(amount()));toolDrawer()};document.querySelector('#drawerClose').onclick=()=>{d.open=false;writeLocal(DRAWER_KEY,d);logCashierOp('Drawer Closed',money(d.opening+d.cashIn-d.cashOut));toolDrawer()}}
function toolEndShift(){const tx=demoTransactions(),sales=tx.reduce((s,x)=>s+Number(x.total||x.total_amount||0),0),cash=tx.filter(x=>(x.pay||x.payment_status)==='Cash').reduce((s,x)=>s+Number(x.total||x.total_amount||0),0);openCashierTool('End Shift',`<div class="kpi-grid"><div class="kpi"><b>${tx.length}</b><span>Transactions</span></div><div class="kpi"><b>${money(sales)}</b><span>Total Sales</span></div><div class="kpi"><b>${money(cash)}</b><span>Cash Sales</span></div></div><div class="form"><label>Actual Cash<input id="actualCash" type="number" min="0" value="${cash}"></label><label>Shift Note<textarea id="shiftNote" placeholder="Optional"></textarea></label><button class="btn primary" id="closeShiftBtn">CLOSE SHIFT</button></div>`);document.querySelector('#closeShiftBtn').onclick=()=>{const actual=Number(document.querySelector('#actualCash').value)||0;logCashierOp('End Shift','Sales '+money(sales)+' • Cash variance '+money(actual-cash));alert('Shift closed in demo mode.');document.querySelector('#cashierToolModal').classList.remove('open')}}
function toolApprovals(){const a=readLocal(APPROVAL_KEY,[]);openCashierTool('Manager Approval',`<div class="tool-grid"><div class="tool-card"><b>Request Void</b><small>Manager approval required.</small><button class="btn" data-request-approval="Void Order">REQUEST</button></div><div class="tool-card"><b>Request Refund</b><small>Full or partial refund approval.</small><button class="btn" data-request-approval="Refund">REQUEST</button></div><div class="tool-card"><b>Price Override</b><small>Approval before manual price change.</small><button class="btn" data-request-approval="Price Override">REQUEST</button></div><div class="tool-card"><b>Large Discount</b><small>Approval for exceptional discount.</small><button class="btn" data-request-approval="Large Discount">REQUEST</button></div></div><h3>Recent Requests</h3><div id="approvalList">${a.length?a.map(x=>`<div class="approval-row"><div><b>${esc(x.type)}</b><small>${esc(x.status)} • ${esc(x.at)}</small></div><span class="status">${esc(x.status)}</span></div>`).join(''):'<div class="empty">No requests yet.</div>'}</div>`);document.querySelectorAll('[data-request-approval]').forEach(b=>b.onclick=()=>{const list=readLocal(APPROVAL_KEY,[]);list.unshift({type:b.dataset.requestApproval,status:'Pending',at:new Date().toLocaleString('en-PH')});writeLocal(APPROVAL_KEY,list);logCashierOp('Approval Request',b.dataset.requestApproval);toolApprovals()})}
function toolVoidRefund(){const tx=demoTransactions();openCashierTool('Void / Refund',`<div class="form"><label>Transaction<select id="voidTxn">${tx.map(x=>`<option value="${esc(x.ref||x.order_ref)}">${esc(x.ref||x.order_ref)} — ${money(x.total||x.total_amount)}</option>`).join('')}</select></label><label>Action<select id="voidAction"><option>Void Order</option><option>Full Refund</option><option>Partial Refund</option></select></label><label>Reason<textarea id="voidReason" placeholder="Required"></textarea></label><button class="btn danger" id="voidRequest">REQUEST MANAGER APPROVAL</button></div>`);document.querySelector('#voidRequest').onclick=()=>{const reason=document.querySelector('#voidReason').value.trim();if(!reason)return alert('Please enter a reason.');const list=readLocal(APPROVAL_KEY,[]);list.unshift({type:document.querySelector('#voidAction').value+' • '+document.querySelector('#voidTxn').value,status:'Pending',at:new Date().toLocaleString('en-PH')});writeLocal(APPROVAL_KEY,list);logCashierOp('Void/Refund Request',reason);alert('Sent for manager approval.');document.querySelector('#cashierToolModal').classList.remove('open')}}
function toolPending(){const list=activeOrders.filter(x=>(x.payment_status||'Pending')==='Pending'||x.status==='new');openCashierTool('Pending Payments',`${list.length?list.map(x=>`<div class="receipt-row"><div><b>${esc(x.order_ref)}</b><small>${money(x.total_amount)} • ${esc(x.status)}</small></div><button type="button" class="btn pending-pay-btn" data-markpaid="${esc(x.order_ref)}">MARK PAID</button></div>`).join(''):'<div class="empty">No pending payments.</div>'}`);document.querySelectorAll('#cashierToolModal [data-markpaid]').forEach(b=>b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();const ref=this.getAttribute('data-markpaid');const order=activeOrders.find(x=>x.order_ref===ref);if(order){order.payment_status='Paid';if(order.status==='new')order.status='preparing'}logCashierOp('Payment Confirmed',ref);this.textContent='PAID ✓';this.disabled=true;setTimeout(()=>toolPending(),350)}))}
function toolHold(){const holds=readLocal(HOLD_KEY,[]);openCashierTool('Hold / Resume Order',`<div class="tool-grid"><button class="btn primary" id="holdCurrent" ${cart.length?'':'disabled'}>HOLD CURRENT CART</button></div><div id="holdRows">${holds.length?holds.map((h,i)=>`<div class="hold-row"><div><b>${esc(h.name)}</b><small>${h.items.length} items • ${esc(h.at)}</small></div><button class="btn" data-resume="${i}">RESUME</button></div>`).join(''):'<div class="empty">No held orders.</div>'}</div>`);document.querySelector('#holdCurrent')?.addEventListener('click',()=>{const a=readLocal(HOLD_KEY,[]);a.unshift({name:'Held '+new Date().toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'}),items:structuredClone(cart),promo,at:new Date().toLocaleString('en-PH')});writeLocal(HOLD_KEY,a);cart=[];promo=null;logCashierOp('Order Held',a[0].name);toolHold()});document.querySelectorAll('[data-resume]').forEach(b=>b.onclick=()=>{const a=readLocal(HOLD_KEY,[]),h=a.splice(+b.dataset.resume,1)[0];writeLocal(HOLD_KEY,a);cart=h.items||[];promo=h.promo||null;document.querySelector('#cashierToolModal').classList.remove('open');screen='new';render()})}
function toolInventory(){const stock=[['Caffè Latte','Available'],['Cold Brew','Low'],['Matcha Latte','Available'],['Ham & Cheese Croffle','Low'],['Chocolate Cake','Sold Out']];openCashierTool('Inventory Alerts',stock.map(([n,s])=>`<div class="receipt-row"><b>${esc(n)}</b><span class="${s==='Available'?'inventory-ok':s==='Low'?'inventory-low':'inventory-out'}">${esc(s)}</span></div>`).join(''))}
function toolCustomer(){openCashierTool('Customer Lookup',`<div class="form"><label>Mobile / Member ID<input id="customerLookup" placeholder="09XX... or member ID"></label><button class="btn primary" id="lookupCustomerBtn">LOOK UP</button><div id="customerResult"></div></div>`);document.querySelector('#lookupCustomerBtn').onclick=()=>{const q=document.querySelector('#customerLookup').value.trim();document.querySelector('#customerResult').innerHTML=q?`<div class="tool-card"><b>Demo Member</b><small>${esc(q)} • 320 points • Gold</small></div>`:'<p class="notice">Enter a mobile number or member ID.</p>'}}

/* CASHIER OPERATIONS UPGRADE V13 */
function toolDiscountVerify(){
 const sub=cart.reduce((s,x)=>s+Number(x.price||0)*Number(x.qty||1),0);
 openCashierTool('Senior / PWD Verification',`<div class="form ops-upgrade">
 <label>Discount Type<select id="dvType"><option>Senior Citizen</option><option>PWD</option></select></label>
 <label>Customer Name<input id="dvName" placeholder="Name on valid ID"></label>
 <label>ID Number<input id="dvId" placeholder="Senior/PWD ID number"></label>
 <label>Eligible Amount<input id="dvEligible" type="number" min="0" value="${sub.toFixed(2)}"></label>
 <div class="tool-card"><small>Demo computation preview only. Final statutory computation/tax treatment must follow the merchant's configured Philippine rules.</small><div class="ops-total" id="dvPreview">${money(sub)}</div></div>
 <button class="btn primary" id="dvVerify">VERIFY & APPLY</button></div>`);
 const preview=()=>{const a=Math.max(0,Number(document.querySelector('#dvEligible').value)||0),d=a*.20;document.querySelector('#dvPreview').innerHTML='Eligible '+money(a)+'<br><span class="ops-good">Preview discount '+money(d)+'</span><br>Preview net '+money(Math.max(0,a-d))};
 preview();document.querySelector('#dvEligible').oninput=preview;
 document.querySelector('#dvVerify').onclick=()=>{const n=document.querySelector('#dvName').value.trim(),id=document.querySelector('#dvId').value.trim(),t=document.querySelector('#dvType').value;if(!n||!id)return alert('Enter customer name and ID number.');discountType=t;discountAudit={type:t,ref:id,name:n,verifiedBy:cashier.name,at:new Date().toLocaleString('en-PH')};logCashierOp(t+' Verified',n+' • '+id);alert(t+' verification recorded.');};
}
function toolVoucherVerify(){
 const subtotal=cart.reduce((s,x)=>s+Number(x.price||0)*Number(x.qty||1),0);
 openCashierTool('Voucher Validation',`<div class="form ops-upgrade">
 <label>Voucher Code<input id="vvCode" placeholder="Enter / scan voucher code"></label>
 <label>Voucher Value<input id="vvValue" type="number" min="0" value="100"></label>
 <div id="vvStatus" class="tool-card">Status: waiting for code</div>
 <button class="btn primary" id="vvCheck">VALIDATE VOUCHER</button>
 <button class="btn" id="vvScan">▣ SCAN / QR DEMO</button></div>`);
 document.querySelector('#vvScan').onclick=()=>{document.querySelector('#vvCode').value='DEMO-VOUCHER-100';document.querySelector('#vvStatus').innerHTML='<b class="ops-good">CODE CAPTURED ✓</b><small>Tap Validate Voucher.</small>'};
 document.querySelector('#vvCheck').onclick=()=>{
  const code=document.querySelector('#vvCode').value.trim(),value=Math.max(0,Number(document.querySelector('#vvValue').value)||0);
  if(!code)return alert('Enter or scan a voucher code.');
  const used=readLocal('cashier_used_vouchers_v13',[]),box=document.querySelector('#vvStatus');
  if(used.includes(code)){box.innerHTML='<b>ALREADY USED</b><small>This voucher cannot be redeemed again.</small>';return;}
  box.innerHTML='<b class="ops-good">VALID ✓</b><small>Voucher value: '+money(value)+'</small><button class="btn primary" id="vvRedeem" style="width:100%;margin-top:10px">REDEEM & APPLY</button>';

        kicker:'ACTION NEEDED',

        status:pending+' pending payment'+(pending===1?'':'s'),
        alert:true,
        run:toolPending
      };
    }
    return {
      kicker:'READY',
      action:'NEW ORDER',
      status:activeOrders.length+' active • '+cashier.branch,
      alert:false,
      run:()=>{screen='new';render()}
    };
  }

  function orbitMarkup(items,centerTitle,centerSub,isMain){
    const n=items.length;
    return `<section class="cashier-orbit-shell">
      <div class="cashier-quick-status">
        <div class="staffbox"><b>${activeOrders.length}</b><span>Active Orders</span></div>
        <div class="staffbox"><b>${cart.reduce((n,x)=>n+x.qty,0)}</b><span>Cart Items</span></div>
        <div class="staffbox"><b>${promo?'YES':'NO'}</b><span>Promo Applied</span></div>
      </div>
      <h2 class="cashier-orbit-title">${esc(centerTitle)}</h2>
      <p class="cashier-orbit-sub">${esc(centerSub)}</p>
      <div class="cashier-orbit" id="cashierOrbit">
        <div class="cashier-orbit-ring"></div>
        <button type="button" class="cashier-orbit-center" id="cashierOrbitCenter">
          <span class="center-kicker" id="cashierCenterKicker">CASHIER</span>
          <span class="center-action" id="cashierCenterAction">${esc(centerTitle)}</span>
          <span class="center-status" id="cashierCenterStatus">${esc(centerSub)}</span>
        </button>
        ${items.map((item,i)=>{
          const a=(Math.PI*2*i/n)-Math.PI/2;
          const rx=window.innerWidth<=430?190:(window.innerWidth<=720?235:285);
          const ry=window.innerWidth<=430?185:(window.innerWidth<=720?220:255);
          const x=50+Math.cos(a)*rx/(Math.min(680,window.innerWidth*.94))*100;
          const y=50+Math.sin(a)*ry/(window.innerWidth<=430?500:(window.innerWidth<=720?560:680))*100;
          return `<button type="button" class="cashier-orbit-node ${isMain&&!seen()?'new-orbit':''} ${isMain&&item.id==='promos'?'feature-hub':''}" data-orbit-id="${esc(item.id||item.label)}" style="left:${x}%;top:${y}%;transform:translate(-50%,-50%)">
            <span class="ico">${item.icon}</span><span>${esc(item.label)}</span><small>${esc(item.sub||'')}</small>
          </button>`;
        }).join('')}
      </div>
      ${isMain?'':'<button class="cashier-orbit-back" id="cashierOrbitBack">‹ Main Cashier Orbit</button>'}
    </section>`;
  }

  function bind(items,isMain){
    document.querySelectorAll('[data-orbit-id]').forEach((b,i)=>b.onclick=()=>{
      if(isMain){markSeen();showOrbit(items[i].id)}
      else items[i].run();
    });
    document.querySelector('#cashierOrbitBack')?.addEventListener('click',()=>showOrbit());

    const center=document.querySelector('#cashierOrbitCenter');
    if(center){
      const cs=centerStateV3();
      document.querySelector('#cashierCenterKicker').textContent=cs.kicker;
      document.querySelector('#cashierCenterAction').textContent=cs.action;
      document.querySelector('#cashierCenterStatus').textContent=cs.status;
      center.classList.toggle('center-alert',!!cs.alert);
      center.onclick=cs.run;
    }
  }

  function showOrbit(group){
    if(!group){
      view.innerHTML=orbitMarkup(mains,'CASHIER','Choose a main menu',true);
      bind(mains,true);
      return;
    }
    const label=mains.find(x=>x.id===group)?.label||'CASHIER';
    const items=menus[group]||[];
    view.innerHTML=orbitMarkup(items,label,'Choose an action',false);
    bind(items,false);
  }
  showOrbit();
}
function newOrder(){let cat='All',q='';const view=document.querySelector('#view');const draw=()=>{const list=products.filter(p=>(cat==='All'||p.cat===cat)&&p.name.toLowerCase().includes(q.toLowerCase()));view.innerHTML=`<div class="layout"><section><div class="section-title"><h2>New Order</h2><button class="btn" id="homeBtn">← Home</button></div><div class="toolbar"><input class="search" id="search" placeholder="Search menu product" value="${esc(q)}"></div><div class="cats">${['All','Coffee','Cold Drinks','Tea','Food','Other'].map(c=>`<button data-cat="${c}" class="${cat===c?'active':''}">${c}</button>`).join('')}</div><div class="products">${list.map(p=>`<article class="product ${isSoldOutV4(p.id)?'soldout':''}"><h3>${esc(p.name)}</h3><div class="price">${money(p.price)}</div>${isSoldOutV4(p.id)?'<span class="soldout-badge">SOLD OUT</span>':''}<button class="btn primary" data-add="${p.id}" ${isSoldOutV4(p.id)?'disabled':''}>${isSoldOutV4(p.id)?'UNAVAILABLE':'ADD'}</button></article>`).join('')}</div></section><aside class="card cart">${cartHtml()}</aside></div>`;document.querySelector('#homeBtn').onclick=()=>{screen='home';render()};document.querySelector('#search').oninput=e=>{q=e.target.value;draw()};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;draw()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openCustom(products.find(p=>p.id===b.dataset.add)));wireCart(draw)};draw()}
function cartHtml(){const subtotal=cart.reduce((s,x)=>s+x.price*x.qty,0),discount=promo&&subtotal>=promo.min?promo.discount:0,total=subtotal-discount;return `<h2 style="margin-top:0">Cart</h2>${cart.length?cart.map((x,i)=>`<div class="cart-item"><div class="cart-line"><b>${x.qty}× ${esc(x.name)}</b><b>${money(x.price*x.qty)}</b></div><div class="cart-meta">${[x.size,x.style,x.milk,x.sugar,x.ice,x.addon!=='None'?x.addon:''].filter(Boolean).map(esc).join(' • ')}${x.note?'<br>Note: '+esc(x.note):''}</div><div class="cart-actions"><button data-minus="${i}">−</button><button data-plus="${i}">+</button><button data-remove="${i}">Remove</button></div></div>`).join(''):'<div class="empty">Cart is empty.</div>'}<div class="promo"><b>${promo?'Promo applied: '+esc(promo.title):'Available promo: '+esc(promos[0].title)}</b><br><small>${esc(promos[0].desc)}</small><br><button class="btn" id="promoBtn" style="margin-top:8px">${promo?'REMOVE PROMO':'APPLY PROMO'}</button></div><div class="total"><span>Total</span><span>${money(total)}</span></div><button class="btn primary" id="checkoutBtn" style="width:100%;margin-top:12px" ${cart.length?'':'disabled'}>REVIEW ORDER</button>`}
function wireCart(redraw){document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{const x=cart[+b.dataset.minus];if(x.qty>1)x.qty--;else cart.splice(+b.dataset.minus,1);redraw()});document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{cart[+b.dataset.plus].qty++;redraw()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.remove,1);redraw()});document.querySelector('#promoBtn').onclick=()=>{const subtotal=cart.reduce((s,x)=>s+x.price*x.qty,0);if(promo){promo=null}else if(subtotal>=promos[0].min){promo=promos[0]}else alert('Cart must reach '+money(promos[0].min)+' for this promo.');redraw()};document.querySelector('#checkoutBtn').onclick=()=>{screen='checkout';render()}}
function openCustom(p){if(isSoldOutV4(p.id))return alert(p.name+' is sold out.');selectedProduct=p;document.querySelector('#customTitle').textContent='Customize '+p.name;document.querySelector('#customModal').classList.add('open')}
document.querySelector('#closeCustom').onclick=()=>document.querySelector('#customModal').classList.remove('open');document.querySelector('#addCustom').onclick=()=>{if(!selectedProduct)return;cart.push({...selectedProduct,qty:1,size:document.querySelector('#size').value,style:document.querySelector('#style').value,milk:document.querySelector('#milk').value,sugar:document.querySelector('#sugar').value,ice:document.querySelector('#ice').value,addon:document.querySelector('#addon').value,note:document.querySelector('#note').value.trim()});document.querySelector('#note').value='';document.querySelector('#customModal').classList.remove('open');newOrder()};
function checkout(){const subtotal=cart.reduce((s,x)=>s+x.price*x.qty,0),discount=promo&&subtotal>=promo.min?promo.discount:0,total=subtotal-discount;document.querySelector('#view').innerHTML=`<section class="card"><div class="section-title"><h2>Review Order</h2><button class="btn" id="backCart">← Cart</button></div>${cart.map(x=>`<div class="review-row"><span>${x.qty}× ${esc(x.name)}</span><b>${money(x.price*x.qty)}</b></div>`).join('')}<div class="review-row"><span>Promo</span><b>${promo?esc(promo.title)+' − '+money(discount):'None'}</b></div><div class="total"><span>Total</span><span>${money(total)}</span></div><div class="form" style="margin-top:14px"><label>Customer Name / Cup Label<input id="customerName" maxlength="40" placeholder="Optional name for cup/order" value="${esc(customerName)}"></label></div>
<h3>Discount</h3><div class="choice-grid">${['None','Senior Citizen','PWD','Voucher'].map(x=>`<button class="choice ${discountType===x?'on':''}" data-discount="${x}">${x}</button>`).join('')}</div>
<h3>Order Type</h3><div class="choice-grid">${['Dine-In','Takeout','Pickup'].map(x=>`<button class="choice ${orderType===x?'on':''}" data-type="${x}">${x}</button>`).join('')}</div><h3>Payment Status</h3><div class="choice-grid">${['Cash','Card','E-Wallet','Split','Pending'].map(x=>`<button class="choice ${payment===x?'on':''}" data-pay="${x}">${x}</button>`).join('')}</div><p class="notice">This records the cashier's payment status only. It does not process a real card or e-wallet payment unless an authorized payment/POS provider is connected.</p><button class="btn primary big" id="confirmBtn" style="width:100%;margin-top:12px">CONFIRM & SEND TO BARISTA</button></section>`;document.querySelector('#backCart').onclick=()=>{screen='new';render()};document.querySelector('#customerName').oninput=e=>customerName=e.target.value;document.querySelectorAll('[data-discount]').forEach(b=>b.onclick=()=>{discountType=b.dataset.discount;checkout()});document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{orderType=b.dataset.type;checkout()});document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{payment=b.dataset.pay;checkout()});document.querySelector('#confirmBtn').onclick=()=>submitOrder(total)}
async function submitOrder(total){const ref='MO-'+String(Date.now()).slice(-6);if(demo){lastOrder={order_ref:ref,status:'new',total_amount:total,order_type:orderType,payment_status:payment,customer_name:customerName,discount_type:discountType,items:structuredClone(cart)};activeOrders.unshift(lastOrder);const rec=readLocal(RECEIPT_KEY,[]);rec.unshift({ref,total,pay:payment,status:'Completed',at:new Date().toLocaleString('en-PH'),items:structuredClone(cart)});writeLocal(RECEIPT_KEY,rec.slice(0,50));logCashierOp('Order Created',ref+' • '+money(total));cart=[];promo=null;customerName='';discountType='None';screen='success';render();return}if(!db){alert('Feature awaiting backend activation.');return}const orderPayload={order_ref:ref,status:'new',total_amount:total,pickup_type:orderType,payment_status:payment,branch:cashier.branch};const {data,error}=await db.from('orders').insert(orderPayload).select('id,order_ref').single();if(error){alert('Order could not be submitted: '+error.message);return}const rows=cart.map(x=>({order_id:data.id,product_name:x.name,quantity:x.qty,unit_price:x.price,size:x.size,style:x.style,milk:x.milk,note:[x.sugar,x.ice,x.addon,x.note].filter(Boolean).join(' • ')}));const itemRes=await db.from('order_items').insert(rows);if(itemRes.error){alert('Order header was created, but item details need backend review: '+itemRes.error.message);return}lastOrder={order_ref:data.order_ref,status:'new',total_amount:total,order_type:orderType,payment_status:payment,items:structuredClone(cart)};cart=[];promo=null;customerName='';discountType='None';await loadActive();screen='success';render()}
function success(){document.querySelector('#view').innerHTML=`<section class="card"><div class="success"><h2>ORDER SENT TO PREPARATION</h2><div class="order-ref">${esc(lastOrder?.order_ref||'')}</div><p>${lastOrder?.items?.map(x=>x.qty+'× '+x.name).join(', ')||''}</p><p><b>${money(lastOrder?.total_amount)}</b> • ${esc(lastOrder?.order_type)} • ${esc(lastOrder?.payment_status)}</p><div class="login-actions"><button class="btn primary" id="another">NEW ORDER</button><button class="btn" id="viewOrder">VIEW ORDER</button></div></div></section>`;document.querySelector('#another').onclick=()=>{screen='new';render()};document.querySelector('#viewOrder').onclick=()=>{screen='orders';render()}}
function ordersView(){document.querySelector('#view').innerHTML=`<section class="card"><div class="section-title"><h2>Active Orders</h2><button class="btn" id="homeBack">← Home</button></div><div class="toolbar"><input class="search" id="orderSearch" placeholder="Search order number"></div><div class="orders" id="orderList"></div></section>`;const draw=q=>{const list=activeOrders.filter(o=>['new','preparing','ready'].includes(o.status)&&o.order_ref.toLowerCase().includes(q.toLowerCase()));document.querySelector('#orderList').innerHTML=list.length?list.map(o=>`<article class="order-row"><div><b>${esc(o.order_ref)}</b><div class="notice">${money(o.total_amount)}</div><span class="order-timer ${elapsedLabelV4(o).mins>=15?'late':''}">⏱ ${elapsedLabelV4(o).label}</span></div><div><span class="status">${esc(o.status)}</span><div style="margin-top:7px">${o.status==='new'?'<button class="btn" data-problem="'+esc(o.order_ref)+'">REPORT PROBLEM</button>':'<button class="btn" data-manager="1">CONTACT BRANCH MANAGER</button>'}</div></div></article>`).join(''):'<div class="empty">No active orders.</div>';document.querySelectorAll('[data-problem]').forEach(b=>b.onclick=()=>document.querySelector('#problemModal').classList.add('open'));document.querySelectorAll('[data-manager]').forEach(b=>b.onclick=()=>alert('This order has already entered preparation. Contact the Branch Manager for corrections.'))};draw('');document.querySelector('#orderSearch').oninput=e=>draw(e.target.value);document.querySelector('#homeBack').onclick=()=>{screen='home';render()}}
document.querySelector('#closeProblem').onclick=()=>document.querySelector('#problemModal').classList.remove('open');document.querySelector('#submitProblem').onclick=()=>{const note=document.querySelector('#problemNote').value.trim();if(document.querySelector('#problemReason').value==='Other'&&!note){alert('Please add details for Other.');return}document.querySelector('#problemModal').classList.remove('open');document.querySelector('#problemNote').value='';alert(demo?'Demo problem recorded for manager review.':'Problem flagged for Branch Manager review.')};
if(!db)login();else init();
