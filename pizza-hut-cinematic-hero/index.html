-events:auto}@keyframes camera{to{transform:scale(1.02)}}@keyframes reveal{from{opacity:1}to{opacity:1}}@keyframes trace{to{clip-path:inset(0 0 0 0)}}@keyframes lift{to{opacity:1;transform:none}}@keyframes rise{0%{opacity:0;transform:translate(var(--x),30px) scale(.5)}15%,80%{opacity:.65}100%{opacity:0;transform:translate(calc(var(--x) + 35px),-70px) scale(1.5)}}@keyframes tableDive{to{transform:scale(2.1) translate(-7%,3%);filter:saturate(1.2) contrast(1.2) brightness(.55)}}@keyframes pulse{0%{opacity:0;transform:scale(.02);border-radius:50%}58%{opacity:.15}100%{opacity:.88;transform:scale(1.8);border-radius:0}}@keyframes arrive{to{opacity:1;transform:none}}@media(max-width:640px){.content{align-self:end;margin:0 1.4rem 6.2rem;width:auto}.headline{font-size:clamp(3.15rem,15vw,5.2rem)}.roof{right:-4rem;bottom:6rem}.enter{width:118px;height:118px;margin-top:1.8rem}.photo{background-position:43% center}.wash{background:linear-gradient(0deg,rgba(6,4,3,.86),rgba(8,5,3,.16) 70%),linear-gradient(90deg,rgba(4,3,2,.3),transparent)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}

<body>
  <main class="experience" id="experience" aria-label="Pizza Hut Philippines cinematic entrance">
    <div class="photo"></div><div class="wash"></div><div class="grain"></div><div class="roof"></div>
    <div class="embers" aria-hidden="true"><i style="left:19%;bottom:24%;--x:0px;--d:8s;--delay:1s"></i><i style="left:38%;bottom:30%;--x:20px;--d:11s;--delay:2s"></i><i style="left:73%;bottom:17%;--x:0px;--d:9s;--delay:3s"></i><i style="left:83%;bottom:43%;--x:10px;--d:12s;--delay:0s"></i><i style="left:57%;bottom:13%;--x:0px;--d:10s;--delay:4s"></i></div>
    <section class="content"><p class="eyebrow">PIZZA HUT PHILIPPINES</p><h1 class="headline">PIZZA, BUT MAKE IT A MOMENT.</h1><div class="accent"></div><p class="sub">Hot. Cheesy. Made for the table.</p><button class="enter" id="enter" type="button">ENTER<br>THE TABLE&nbsp;→</button></section>
    <button class="sound" id="sound" type="button" aria-pressed="false">SOUND OFF</button>
    <div class="cover"></div><section class="arrival" aria-live="polite"><p class="eyebrow">YOUR TABLE IS READY</p><h2>COME<br>HUNGRY.</h2><p>Choose your moment. We’ll bring the heat.</p><button class="again" id="again" type="button">REPLAY ENTRANCE</button></section>
  </main>
  <script>
    const scene=document.getElementById('experience'), enter=document.getElementById('enter'), again=document.getElementById('again'), sound=document.getElementById('sound'); let audio=false;
    enter.addEventListener('click',()=>{scene.classList.add('entered'); if(audio){const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(112,a.currentTime);o.frequency.exponentialRampToValueAtTime(46,a.currentTime+1);g.gain.setValueAtTime(.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+1)}});again.addEventListener('click',()=>{scene.classList.remove('entered')});sound.addEventListener('click',()=>{audio=!audio;sound.textContent=audio?'SOUND ON':'SOUND OFF';sound.setAttribute('aria-pressed',audio)});
  </script>
