<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Wedding Time Capsule</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#120e0c;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{overflow-x:hidden}.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 10%,rgba(199,164,109,.22),transparent 30%),radial-gradient(circle at 80% 85%,rgba(109,52,56,.3),transparent 34%),linear-gradient(145deg,#100c0a,#251914 55%,#0e0b09)}main{min-height:100dvh;display:grid;place-items:center;padding:14px}.app{width:min(760px,100%);text-align:center}.title{font:500 clamp(34px,10vw,64px)/.95 Georgia,serif;margin:0 0 8px}.sub{margin:0 auto 16px;color:#d9cbbf;font-size:13px;line-height:1.45;max-width:560px}.scene{perspective:1300px;width:100%;margin:auto}.capsule{position:relative;width:100%;aspect-ratio:1.06/1;transform-style:preserve-3d}.lid{position:absolute;left:3%;right:3%;top:4%;height:28%;z-index:5;transform-origin:50% 100%;transform:rotateX(-12deg);transition:transform 1s cubic-bezier(.2,.8,.2,1);background:linear-gradient(145deg,#744a31,#4a2d20);border-radius:20px 20px 10px 10px;border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 35px rgba(0,0,0,.35)}.lid:before{content:'Wedding Time Capsule';position:absolute;inset:0;display:grid;place-items:center;font:500 clamp(21px,6vw,34px) Georgia,serif;color:#f3dfc1}.capsule.open .lid{transform:rotateX(-72deg) translateY(-7px)}.box{position:absolute;left:0;right:0;bottom:0;top:24%;border-radius:14px 14px 24px 24px;background:linear-gradient(155deg,#8a6042,#583624 65%,#3b241a);box-shadow:0 28px 60px rgba(0,0,0,.55),inset 0 7px 20px rgba(0,0,0,.2)}.lining{position:absolute;inset:10px;border-radius:11px 11px 19px 19px;background:linear-gradient(180deg,#cbb694,#ad9574)}.grid{position:absolute;inset:18px;display:grid;grid-template-columns:1.08fr .92fr;grid-template-rows:1fr 1fr;gap:8px}.slot{position:relative;border:0;border-radius:12px;background:rgba(49,31,23,.63);color:#fff;overflow:hidden;text-align:left;padding:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);cursor:pointer}.slot:active{transform:scale(.985)}.photos{grid-row:1/3;background:#261d18}.stack{position:absolute;inset:8px 8px 48px;display:grid;grid-template-columns:1fr 1fr;gap:4px}.mini{border-radius:6px;background-image:url('../wedding-mosaic/assets/memories.webp');background-size:600% 500%;background-repeat:no-repeat;background-position:var(--x) var(--y)}.label{position:absolute;left:9px;right:9px;bottom:8px}.label strong,.slot>strong{font:500 16px Georgia,serif}.label span,.slot>span{display:block;color:#decbb3;font-size:10px;line-height:1.3;margin-top:2px}.icon{font-size:22px;margin-bottom:6px}.slot:not(.photos){display:flex;flex-direction:column;justify-content:center}.actions{display:flex;gap:7px;justify-content:center;margin-top:11px}.btn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:10px 14px;font-weight:700;font-size:12px}.btn.primary{background:#f5ede1;color:#2a201a;border-color:#f5ede1}.overlay,.final{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:16px;background:rgba(10,7,6,.88);backdrop-filter:blur(10px)}.overlay.show,.final.show{display:grid}.panel{position:relative;width:min(700px,96vw);max-height:88dvh;overflow:auto;border-radius:20px;padding:18px;background:#fff8ee;color:#281e19}.close{position:sticky;float:right;top:0;width:40px;height:40px;border-radius:50%;border:0;background:#2a211c;color:#fff;font-size:22px}.panel h2{font:500 30px Georgia,serif;margin:3px 50px 6px 0}.panel p{color:#6f5e51;line-height:1.5;margin-top:0}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.memory{aspect-ratio:4/3;border-radius:9px;background-image:url('../wedding-mosaic/assets/memories.webp');background-size:600% 500%;background-repeat:no-repeat;background-position:var(--x) var(--y)}.paper{min-height:150px;border:1px solid #d7c5aa;background:#fffdf9;border-radius:12px;padding:16px;display:grid;place-items:center;text-align:center;color:#816e5d;font:17px/1.45 Georgia,serif}.video{aspect-ratio:16/9;border-radius:12px;background:linear-gradient(135deg,#2d241f,#171210);display:grid;place-items:center;color:#fff;font-size:34px}.final{text-align:center;background:radial-gradient(circle at center,rgba(109,52,56,.36),transparent 36%),linear-gradient(150deg,#120e0c,#241915 62%,#0d0a09)}.seal{width:88px;height:88px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(145deg,#8c3d44,#5b2429);font:42px Georgia,serif}.final h2{font:500 clamp(40px,11vw,68px)/.98 Georgia,serif;margin:0 0 12px}.final p{max-width:520px;margin:0 auto 18px;color:#dccdc0;line-height:1.55}@media(min-width:700px){.capsule{aspect-ratio:1.35/1}.grid{inset:24px}.title{margin-bottom:10px}}
</style>
</head>
<body>
<div class="bg"></div>
<main><section class="app">
<h1 class="title">Wedding Time Capsule</h1>
<p class="sub">A virtual keepsake box for selected photos, letters, vows, and wedding videos.</p>
<div class="scene"><div class="capsule" id="capsule"><div class="lid"></div><div class="box"><div class="lining"></div><div class="grid">
<button class="slot photos" data-open="photos"><div class="stack"><div class="mini" style="--x:0%;--y:0%"></div><div class="mini" style="--x:40%;--y:0%"></div><div class="mini" style="--x:80%;--y:25%"></div><div class="mini" style="--x:20%;--y:50%"></div><div class="mini" style="--x:60%;--y:75%"></div><div class="mini" style="--x:20%;--y:100%"></div></div><div class="label"><strong>Selected Photos</strong><span>Tap to revisit the day</span></div></button>
<button class="slot" data-open="letters"><div class="icon">✉</div><strong>Letters</strong><span>Words for your future selves</span></button>
<button class="slot" data-open="vows"><div class="icon">♡</div><strong>Vows</strong><span>Keep your promises close</span></button>
<button class="slot" data-open="videos"><div class="icon">▶</div><strong>Videos</strong><span>Wedding clips live here</span></button>
</div></div></div></div>
<div class="actions"><button class="btn primary" id="openBox">Open the Capsule</button><button class="btn" id="sealBox">Seal for Anniversary</button></div>
</section></main>
<div class="overlay" id="overlay"><div class="panel"><button class="close" id="close">×</button><div id="content"></div></div></div>
<div class="final" id="final"><div><div class="seal">♡</div><h2>Open again on our first anniversary.</h2><p>The photos are tucked away, with spaces ready for your real letters, vows, and videos.</p><button class="btn primary" id="reopen">Reopen Capsule</button></div></div>
<script>
const capsule=document.getElementById('capsule'),overlay=document.getElementById('overlay'),content=document.getElementById('content'),final=document.getElementById('final');document.getElementById('openBox').onclick=()=>capsule.classList.add('open');setTimeout(()=>capsule.classList.add('open'),450);const pos=[[0,0],[20,0],[40,0],[60,0],[80,0],[100,0],[0,25],[20,25],[40,25],[60,25],[80,25],[100,25]];function photos(){return `<h2>Selected Photos</h2><p>Wedding memories already placed inside the capsule.</p><div class="gallery">${pos.map(([x,y])=>`<div class="memory" style="--x:${x}%;--y:${y}%"></div>`).join('')}</div>`}function letters(){return `<h2>Letters</h2><p>This compartment is waiting for the couple’s real letters.</p><div class="paper">Your letters can be placed here when you are ready.</div>`}function vows(){return `<h2>Vows</h2><p>Keep the exact words spoken on the wedding day.</p><div class="paper">Your original wedding vows can be added here.</div>`}function videos(){return `<h2>Videos</h2><p>Add wedding clips or a private message for your future selves.</p><div class="video">▶</div>`}document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{capsule.classList.add('open');content.innerHTML=({photos,letters,vows,videos}[b.dataset.open])();overlay.classList.add('show')});document.getElementById('close').onclick=()=>overlay.classList.remove('show');overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('show')};document.getElementById('sealBox').onclick=()=>final.classList.add('show');document.getElementById('reopen').onclick=()=>final.classList.remove('show');
</script>
</body></html>
