<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061a13">
<title>Starbucks Philippines — Espresso in Motion</title>
<style>
:root{--green:#00754a;--cream:#f4ead9;--gold:#e4c98d;--ink:#07130f;--ease:cubic-bezier(.18,.8,.18,1)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b14;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}
body{touch-action:manipulation}
.top{position:fixed;z-index:50;inset:0 0 auto 0;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 max(14px,env(safe-area-inset-left)) 0 max(14px,env(safe-area-inset-left));background:linear-gradient(180deg,rgba(3,14,10,.92),rgba(3,14,10,.36),transparent);backdrop-filter:blur(10px)}
.brand{font-size:10px;font-weight:900;letter-spacing:.14em;white-space:nowrap}.nav{display:flex;gap:7px}.nav a{font-size:10px;font-weight:850;letter-spacing:.08em;padding:9px 11px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(4,28,20,.45)}
.stage{position:fixed;inset:0;overflow:hidden;cursor:pointer;background:radial-gradient(circle at 50% 42%,var(--glow,#1e8d65) 0,transparent 27%),linear-gradient(155deg,var(--bg1,#08291f),var(--bg2,#03120d) 70%);transition:background 1s var(--ease)}
.stage:before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 20deg,transparent 0 20%,rgba(255,255,255,.045) 27%,transparent 35% 68%,rgba(228,201,141,.05) 75%,transparent 83%);animation:ambient 18s linear infinite;pointer-events:none}.stage:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,transparent 0 28%,rgba(0,0,0,.16) 55%,rgba(0,0,0,.5) 100%);pointer-events:none}
@keyframes ambient{to{transform:rotate(360deg)}}
.marquee{position:absolute;z-index:1;top:17%;left:-7vw;right:-7vw;white-space:nowrap;font-size:clamp(92px,27vw,290px);font-weight:950;letter-spacing:-.085em;line-height:.78;color:rgba(255,255,255,.06);text-transform:uppercase;transform:translateX(0);transition:transform .95s var(--ease),opacity .5s}.marquee.fly{transform:translateX(-18vw);opacity:0}
.halo{position:absolute;z-index:2;left:50%;top:47%;width:min(76vw,540px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.14);box-shadow:0 0 70px rgba(0,0,0,.08),inset 0 0 80px rgba(255,255,255,.025);animation:halo 7s ease-in-out infinite}.halo:before,.halo:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(228,201,141,.22)}.halo:before{inset:12%}.halo:after{inset:28%;animation:spin 12s linear infinite}.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 22px var(--gold);top:5%;left:47%}
@keyframes halo{50%{transform:translate(-50%,-50%) scale(1.045)}}@keyframes spin{to{transform:rotate(360deg)}}
.productWrap{position:absolute;z-index:5;left:50%;top:44%;width:min(76vw,520px);height:min(55vh,620px);transform:translate(-50%,-50%);display:grid;place-items:center;perspective:1200px}.product{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 40px 35px rgba(0,0,0,.5));transform:translateY(16px) scale(.78) rotate(-5deg);opacity:0;transition:transform .9s var(--ease),opacity .55s var(--ease)}.product.in{opacity:1;transform:translateY(0) scale(1) rotate(0)}.product.out{opacity:0;transform:translate(-35vw,-3vh) scale(1.3) rotate(-10deg)}
.copy{position:absolute;z-index:8;left:max(20px,env(safe-area-inset-left));right:max(20px,env(safe-area-inset-right));bottom:108px}.eyebrow{font-size:10px;letter-spacing:.24em;font-weight:900;color:var(--gold);margin-bottom:7px}.title{margin:0;max-width:820px;font-size:clamp(42px,10.5vw,88px);line-height:.88;letter-spacing:-.055em;text-wrap:balance}.desc{margin:12px 0 0;max-width:560px;color:#d8e5df;font-size:14px;line-height:1.5}.tap{position:absolute;z-index:9;right:max(18px,env(safe-area-inset-right));bottom:114px;font-size:9px;letter-spacing:.18em;font-weight:900;color:var(--gold);writing-mode:vertical-rl;transform:rotate(180deg);opacity:.9;animation:tapPulse 1.6s ease-in-out infinite}@keyframes tapPulse{50%{opacity:.4;transform:rotate(180deg) translateY(5px)}}
.footer{position:absolute;z-index:12;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px}.arrow{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.23);background:rgba(3,20,14,.56);backdrop-filter:blur(10px);font-size:22px;cursor:pointer}.progress{display:flex;align-items:center;gap:7px;padding:0 3px}.dot{width:7px;height:7px;border-radius:50%;border:0;background:rgba(255,255,255,.34);padding:0;transition:.35s;cursor:pointer}.dot.on{width:31px;border-radius:999px;background:var(--gold)}.count{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:24px;font-size:10px;font-weight:900;letter-spacing:.16em;color:#e8d9b7}
.flash{position:absolute;z-index:4;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.go{animation:flash .48s ease-out}@keyframes flash{0%{opacity:0}.18%{opacity:.18}100%{opacity:0}}
@media(max-width:720px){.top{height:64px}.brand{font-size:9.2px}.nav a{font-size:9.7px;padding:8px 10px}.marquee{top:21%;font-size:27vw}.halo{top:39%;width:82vw}.productWrap{top:39%;width:82vw;height:43vh}.copy{bottom:112px;right:36px}.title{font-size:clamp(38px,10.6vw,52px);max-width:90vw}.desc{font-size:13.5px;max-width:82vw;margin-top:9px}.tap{bottom:126px;right:12px}.count{display:none}.footer{bottom:max(14px,env(safe-area-inset-bottom))}}
@media(max-width:390px){.brand{font-size:8.4px}.nav a{font-size:9px;padding:8px 8px}.productWrap{top:38%;height:40vh}.halo{top:38%}.copy{bottom:105px}.title{font-size:10vw}.desc{font-size:13px}.tap{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">STARBUCKS® PHILIPPINES</div>
  <nav class="nav" aria-label="Primary">
    <a href="../starbucks-menu-orbit/v89.html?refresh=94#orbit">MENU</a>
    <a href="../starbucks-menu-orbit/about-motion.html">OUR STORY</a>
  </nav>
</header>
<main class="stage" id="stage" aria-label="Five iced espresso drinks. Tap anywhere for the next drink.">
  <div class="marquee" id="marquee">CARAMEL</div>
  <div class="halo"><span class="spark"></span></div>
  <div class="flash" id="flash"></div>
  <div class="productWrap"><img class="product in" id="product" src="../assets/drink-01.jpg" alt="Iced Caramel Macchiato"></div>
  <section class="copy">
    <div class="eyebrow" id="eyebrow">01 / 05 · ICED ESPRESSO</div>
    <h1 class="title" id="title">Iced Caramel Macchiato</h1>
    <p class="desc" id="desc">Layered espresso, chilled milk and caramel character in a clean iced classic.</p>
  </section>
  <div class="tap">TAP ANYWHERE · NEXT</div>
  <div class="footer">
    <button class="arrow" id="prev" aria-label="Previous drink">‹</button>
    <div class="progress" id="progress" aria-label="Drink navigation"></div>
    <button class="arrow" id="next" aria-label="Next drink">›</button>
  </div>
  <div class="count" id="count">01 / 05</div>
</main>
<script>
const drinks=[
 {name:'Iced Caramel Macchiato',word:'CARAMEL',img:'../assets/drink-01.jpg',desc:'Layered espresso, chilled milk and caramel character in a clean iced classic.',bg1:'#104734',bg2:'#04120d',glow:'#13734f'},
 {name:'Iced Caffè Latte',word:'LATTE',img:'../assets/drink-02.jpg',desc:'Espresso and chilled milk meet in a smooth, bright and refreshing iced cup.',bg1:'#405846',bg2:'#071a12',glow:'#9b8c66'},
 {name:'Iced Caffè Mocha',word:'MOCHA',img:'../assets/drink-04.jpg',desc:'Espresso, milk and chocolate character move together over ice.',bg1:'#4a2b21',bg2:'#100b08',glow:'#7d4b35'},
 {name:'Iced Americano',word:'AMERICANO',img:'../assets/drink-05.jpg',desc:'Bold espresso lengthened with cold water and ice for a crisp finish.',bg1:'#14382f',bg2:'#03100c',glow:'#1f6f5a'},
 {name:'Iced White Chocolate Mocha',word:'WHITE MOCHA',img:'../assets/drink-06.jpg',desc:'Iced espresso and milk with a smooth white chocolate profile.',bg1:'#5c574a',bg2:'#15120d',glow:'#a39273'}
];
const stage=document.getElementById('stage'),product=document.getElementById('product'),marquee=document.getElementById('marquee'),title=document.getElementById('title'),desc=document.getElementById('desc'),eyebrow=document.getElementById('eyebrow'),count=document.getElementById('count'),flash=document.getElementById('flash'),progress=document.getElementById('progress');
let i=0,startX=0,down=false,busy=false;
drinks.forEach((d,n)=>{const b=document.createElement('button');b.className='dot'+(n===0?' on':'');b.type='button';b.setAttribute('aria-label',`Show ${d.name}`);b.onclick=e=>{e.stopPropagation();show(n,n>i?1:-1)};progress.appendChild(b)});
function paint(d){stage.style.setProperty('--bg1',d.bg1);stage.style.setProperty('--bg2',d.bg2);stage.style.setProperty('--glow',d.glow)}paint(drinks[0]);
function show(n,dir=1){if(busy||n===i)return;busy=true;const d=drinks[n];product.classList.remove('in');product.classList.add('out');marquee.classList.add('fly');flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');setTimeout(()=>{i=n;product.src=d.img;product.alt=d.name;marquee.textContent=d.word;title.textContent=d.name;desc.textContent=d.desc;eyebrow.textContent=`0${i+1} / 05 · ICED ESPRESSO`;count.textContent=`0${i+1} / 05`;paint(d);[...progress.children].forEach((el,x)=>el.classList.toggle('on',x===i));product.classList.remove('out');marquee.classList.remove('fly');void product.offsetWidth;product.classList.add('in');setTimeout(()=>busy=false,540)},330)}
function next(){show((i+1)%drinks.length,1)}function prev(){show((i-1+drinks.length)%drinks.length,-1)}
document.getElementById('next').onclick=e=>{e.stopPropagation();next()};document.getElementById('prev').onclick=e=>{e.stopPropagation();prev()};
stage.addEventListener('pointerdown',e=>{startX=e.clientX;down=true});stage.addEventListener('pointerup',e=>{if(!down)return;down=false;if(e.target.closest('a,button'))return;const dx=e.clientX-startX;if(Math.abs(dx)>45){dx<0?next():prev()}else next()});stage.addEventListener('pointercancel',()=>down=false);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});
</script>
</body>
</html>
