<style>
:root{--bg:#160905;--bg2:#3b1c10;--cream:#f7efe4;--gold:#d5a463;--ease:cubic-bezier(.2,.82,.2,1)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#120703;color:var(--cream);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,a{font:inherit;color:inherit}.top{position:fixed;z-index:60;top:0;left:0;right:0;height:76px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(18,7,3,.96),rgba(18,7,3,.45),transparent)}.brand{font-size:9px;font-weight:900;letter-spacing:.18em}.nav{display:flex;gap:7px}.nav a{text-decoration:none;border:1px solid rgba(255,255,255,.24);border-radius:999px;padding:9px 12px;font-size:9px;font-weight:900;letter-spacing:.08em;background:rgba(255,255,255,.03)}
.intro{position:fixed;z-index:100;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,rgba(214,147,80,.28),transparent 24%),linear-gradient(155deg,#4b2616,#160905 67%);transition:.7s var(--ease)}.intro.hide{opacity:0;visibility:hidden;pointer-events:none}.intro button{position:absolute;inset:0;border:0;background:transparent}.introInner{text-align:center;position:relative;z-index:2}.intro .k{font-size:9px;letter-spacing:.25em;font-weight:900;color:var(--gold)}.intro h1{margin:8px 0 0;font:500 clamp(58px,18vw,102px)/.8 Georgia,serif;letter-spacing:-.07em}.intro h1 span{display:block;margin-top:17px;font:900 .18em/1.1 Inter,sans-serif;letter-spacing:.2em}.intro p{max-width:310px;margin:22px auto 0;font-size:13px;line-height:1.55;color:#e8d9cb}.hint{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);font-size:9px;font-weight:900;letter-spacing:.18em;color:var(--gold);white-space:nowrap}
.stage{position:relative;width:100%;height:100dvh;min-height:680px;overflow:hidden;touch-action:pan-y;background:radial-gradient(circle at 50% 44%,rgba(213,149,82,.2),transparent 26%),linear-gradient(160deg,#4a2616 0,#251109 52%,#0e0502 100%)}.stage:before{content:"";position:absolute;inset:-20%;background:conic-gradient(from 0deg at 50% 50%,transparent,rgba(255,190,112,.09),transparent 20%,rgba(255,255,255,.025),transparent 45%);animation:spin 16s linear infinite;pointer-events:none}.stage:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,transparent 0 45%,rgba(0,0,0,.26) 78%);pointer-events:none}@keyframes spin{to{transform:rotate(360deg)}}
.eyebrow{position:absolute;z-index:10;left:22px;top:105px;color:var(--gold);font-size:9px;font-weight:900;letter-spacing:.22em}.tapCue{position:absolute;z-index:10;right:20px;top:105px;color:#c58d5c;font-size:8px;font-weight:900;letter-spacing:.17em}.word{position:absolute;z-index:1;left:-3vw;top:19%;font:500 clamp(100px,31vw,230px)/.75 Georgia,serif;letter-spacing:-.08em;color:rgba(255,255,255,.055);white-space:nowrap;transition:.55s var(--ease)}
.orbit{position:absolute;z-index:4;left:50%;top:42%;width:min(90vw,520px);height:min(90vw,520px);transform:translate(-50%,-50%);perspective:1200px}.ring{position:absolute;inset:5%;border:1px solid rgba(223,166,102,.18);border-radius:50%;box-shadow:0 0 60px rgba(220,146,76,.08),inset 0 0 60px rgba(255,255,255,.02);animation:ringPulse 3.8s ease-in-out infinite}@keyframes ringPulse{50%{transform:scale(1.035);opacity:.65}}.ring.r2{inset:16%;animation-delay:-1.3s}.ring.r3{inset:28%;animation-delay:-2.1s}.beam{position:absolute;left:50%;top:50%;width:6px;height:54%;transform-origin:50% 0;background:linear-gradient(180deg,rgba(224,165,98,.34),transparent);filter:blur(4px);animation:beam 5.5s linear infinite}@keyframes beam{to{transform:rotate(360deg)}}
.heroWrap{position:absolute;left:50%;top:50%;width:68%;height:68%;transform:translate(-50%,-50%);transform-style:preserve-3d;transition:.7s var(--ease)}.heroWrap.exit{opacity:0;transform:translate(-50%,18%) rotateX(18deg) rotateZ(-8deg) scale(.6)}.heroWrap.enter{animation:enter .75s var(--ease)}@keyframes enter{0%{opacity:0;transform:translate(65%,-65%) rotateY(-35deg) rotateZ(12deg) scale(.45)}100%{opacity:1;transform:translate(-50%,-50%) rotateY(0) rotateZ(0) scale(1)}}.halo{position:absolute;left:50%;top:52%;width:72%;height:72%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(233,175,108,.22),rgba(233,175,108,.07) 42%,transparent 66%);filter:blur(8px)}.hero{position:absolute;inset:0;display:grid;place-items:center;animation:float 3.4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px) rotateZ(-1deg)}}.hero img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 34px 28px rgba(0,0,0,.42));-webkit-mask-image:radial-gradient(ellipse 48% 52% at 50% 50%,#000 0 62%,rgba(0,0,0,.93) 70%,transparent 88%);mask-image:radial-gradient(ellipse 48% 52% at 50% 50%,#000 0 62%,rgba(0,0,0,.93) 70%,transparent 88%)}
.satellite{position:absolute;width:66px;height:66px;border-radius:50%;overflow:hidden;background:#32190f;border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 22px rgba(0,0,0,.3);transition:.6s var(--ease)}.satellite img{width:100%;height:100%;object-fit:cover}.s1{right:-4%;top:18%;animation:sat1 7s ease-in-out infinite}.s2{left:-1%;bottom:5%;animation:sat2 8s ease-in-out infinite}@keyframes sat1{50%{transform:translate(-14px,18px) scale(.9)}}@keyframes sat2{50%{transform:translate(18px,-12px) scale(1.08)}}
.particles{position:absolute;inset:0;pointer-events:none}.bean{position:absolute;width:9px;height:13px;border-radius:50% 45%;background:#6d3a1e;box-shadow:inset -2px -2px 0 rgba(0,0,0,.2);animation:drift linear infinite}.bean:nth-child(1){left:12%;top:30%;animation-duration:8s}.bean:nth-child(2){left:82%;top:27%;animation-duration:10s;animation-delay:-3s}.bean:nth-child(3){left:20%;top:57%;animation-duration:9s;animation-delay:-5s}.bean:nth-child(4){left:72%;top:62%;animation-duration:11s;animation-delay:-7s}@keyframes drift{0%{transform:translateY(30px) rotate(0);opacity:0}20%{opacity:.55}80%{opacity:.45}100%{transform:translateY(-100px) rotate(420deg);opacity:0}}
.copy{position:absolute;z-index:12;left:22px;right:22px;bottom:118px;pointer-events:none}.copy .line{width:44px;height:2px;background:var(--gold);margin-bottom:12px}.title{margin:0;font:500 clamp(48px,14vw,82px)/.88 Georgia,serif;letter-spacing:-.055em}.cal{margin-top:7px;font-size:17px;color:#d8c6b8}.desc{margin:14px 0 0;max-width:560px;font-size:13px;line-height:1.5;color:#eadfd5}.footer{position:absolute;z-index:20;left:0;right:0;bottom:0;height:94px;display:flex;align-items:center;justify-content:space-between;padding:0 20px 10px;background:linear-gradient(180deg,transparent,rgba(11,4,2,.94) 42%,#0b0402)}.arrow{width:50px;height:50px;border-radius:50%;border:1px solid rgba(213,164,99,.8);background:rgba(75,37,22,.7);font-size:24px}.dots{display:flex;gap:8px;align-items:center}.dot{width:7px;height:7px;border:0;border-radius:50%;background:#584238;padding:0}.dot.on{width:26px;border-radius:999px;background:var(--gold);box-shadow:0 0 18px rgba(213,164,99,.45)}
.flash{position:absolute;z-index:30;inset:0;pointer-events:none;background:radial-gradient(circle at center,rgba(255,226,186,.65),rgba(255,196,118,.18) 28%,transparent 62%);opacity:0}.flash.go{animation:flash .6s ease}@keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
@media(max-height:760px){.orbit{top:40%;width:min(80vw,430px);height:min(80vw,430px)}.copy{bottom:104px}.desc{font-size:12px}.title{font-size:44px}}@media(min-width:760px){.eyebrow{left:7vw}.tapCue{right:7vw}.copy{left:7vw;right:7vw}.orbit{top:45%;width:560px;height:560px}.title{font-size:80px}.desc{font-size:15px;max-width:620px}.footer{padding-left:7vw;padding-right:7vw}}
</style>

<body>
<header class="top"><div class="brand">STARBUCKS® PHILIPPINES</div><nav class="nav"><a href="../starbucks-menu-orbit/v89.html?refresh=94#orbit">MENU</a><a href="../starbucks-menu-orbit/about-motion.html">OUR STORY</a></nav></header>
<section class="intro" id="intro"><button id="enter" aria-label="Begin"></button><div class="introInner"><div class="k">STARBUCKS® PHILIPPINES</div><h1>ESPRESSO<br>ORBIT<span>5 COFFEES → OUR STORY</span></h1><p>A kinetic espresso experience where each coffee arrives through light, depth and orbiting motion.</p></div><div class="hint">TAP ANYWHERE TO ENTER ↓</div></section>
<main class="stage" id="stage"><div class="eyebrow" id="eyebrow"></div><div class="tapCue" id="tapCue">TAP / SWIPE · NEXT</div><div class="word" id="word"></div><div class="particles"><i class="bean"></i><i class="bean"></i><i class="bean"></i><i class="bean"></i></div><div class="orbit"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div class="beam"></div><div class="heroWrap" id="heroWrap"><div class="halo"></div><div class="hero"><img id="heroImg" alt=""></div><div class="satellite s1"><img id="sat1" alt=""></div><div class="satellite s2"><img id="sat2" alt=""></div></div></div><section class="copy"><div class="line"></div><h1 class="title" id="title"></h1><div class="cal" id="cal"></div><p class="desc" id="desc"></p></section><div class="footer"><button class="arrow" id="prev" aria-label="Previous">‹</button><div class="dots" id="dots"></div><button class="arrow" id="next" aria-label="Next">›</button></div><div class="flash" id="flash"></div></main>
<script>
const STORY_URL='../starbucks-menu-orbit/about-motion.html';
const drinks=[
{name:'Caffè Misto',word:'MISTO',cal:'94 calories',img:'https://starbucks.ph/seed_data/HESP_CaffeMisto.jpg',desc:'A one-to-one combination of fresh-brewed coffee and steamed milk add up to one distinctly delicious coffee drink remarkably mixed.'},
{name:'Flat White',word:'FLAT WHITE',cal:'145 calories',img:'https://starbucks.ph/seed_data/HESP_FlatWhite.jpg',desc:'Bold ristretto shots of espresso get the perfect amount of steamed whole milk to create a not too strong, not too creamy, just right flavor, finished with a beautiful dot.'},
{name:'Espresso',word:'ESPRESSO',cal:'5 calories',img:'https://starbucks.ph/seed_data/HESP_Espresso.jpg',desc:'Our smooth signature Espresso Roast with rich flavor and caramelly sweetness is at the very heart of everything we do.'},
{name:'Espresso Macchiato',word:'MACCHIATO',cal:'10 calories',img:'https://starbucks.ph/seed_data/HESP_EspressoMacchiato.jpg',desc:'Our rich espresso marked with dollop of steamed milk and foam. A European-style classic.'},
{name:'Espresso Con Panna',word:'CON PANNA',cal:'30 calories',img:'https://starbucks.ph/seed_data/HESP_EspressoConPanna.jpg',desc:'Espresso meets a dollop of whipped cream to enhance the rich and caramelly flavors of a straight-up shot.'}
];
const intro=document.getElementById('intro'),stage=document.getElementById('stage'),heroWrap=document.getElementById('heroWrap'),heroImg=document.getElementById('heroImg'),sat1=document.getElementById('sat1'),sat2=document.getElementById('sat2'),title=document.getElementById('title'),cal=document.getElementById('cal'),desc=document.getElementById('desc'),eyebrow=document.getElementById('eyebrow'),word=document.getElementById('word'),tapCue=document.getElementById('tapCue'),dots=document.getElementById('dots'),flash=document.getElementById('flash');let i=0,busy=false,startX=0,startY=0,down=false;
function sync(){const d=drinks[i];heroImg.src=d.img;heroImg.alt=d.name;title.textContent=d.name;cal.textContent=d.cal;desc.textContent=d.desc;word.textContent=d.word;eyebrow.textContent=`HOT ESPRESSO · 0${i+1} / 05`;tapCue.textContent=i===4?'ENTER OUR STORY →':'TAP / SWIPE · NEXT';const n1=drinks[(i+1)%drinks.length],n2=drinks[(i+2)%drinks.length];sat1.src=n1.img;sat2.src=n2.img;[...dots.children].forEach((el,n)=>el.classList.toggle('on',n===i))}
drinks.forEach((d,n)=>{const b=document.createElement('button');b.className='dot'+(n===0?' on':'');b.setAttribute('aria-label',d.name);b.onclick=e=>{e.stopPropagation();jump(n)};dots.appendChild(b)});
function go(n){if(busy||n<0||n>=drinks.length)return;busy=true;heroWrap.classList.add('exit');flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');word.style.transform='translateX(-18px) scale(.96)';word.style.opacity='.01';setTimeout(()=>{i=n;sync();heroWrap.classList.remove('exit');heroWrap.classList.add('enter');word.style.transform='';word.style.opacity='';setTimeout(()=>{heroWrap.classList.remove('enter');busy=false},760)},380)}function next(){if(i===4){location.href=STORY_URL;return}go(i+1)}function prev(){if(i>0)go(i-1)}function jump(n){if(n!==i)go(n)}
document.getElementById('enter').onclick=()=>intro.classList.add('hide');document.getElementById('next').onclick=e=>{e.stopPropagation();next()};document.getElementById('prev').onclick=e=>{e.stopPropagation();prev()};stage.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY;down=true});stage.addEventListener('pointerup',e=>{if(!down)return;down=false;if(e.target.closest('button,a'))return;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.abs(dx)>42&&Math.abs(dx)>Math.abs(dy))dx<0?next():prev();else if(Math.abs(dx)<14&&Math.abs(dy)<14)next()});stage.addEventListener('pointercancel',()=>down=false);sync();
</script>
