<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Department Accountability Ring</title><style>body{margin:0;font-family:Segoe UI,Arial;background:#07111f;color:#fff}*{box-sizing:border-box}.top{padding:18px 20px;border-bottom:1px solid #20384f;background:#091522}.wrap{max-width:1100px;margin:auto;padding:18px}.title h1{margin:0;font-size:28px}.title p{color:#9eb2c7}.stage{position:relative;width:min(92vw,700px);aspect-ratio:1/1;margin:20px auto}.ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid #294a66;border-radius:50%;pointer-events:none}.r1{width:48%;height:48%}.r2{width:70%;height:70%}.r3{width:92%;height:92%}.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34%;height:34%;border-radius:50%;border:2px solid #f1c76d;background:radial-gradient(circle at 35% 30%,#1a3c59,#0d1f33 70%);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:14px}.core small{color:#f1c76d;letter-spacing:.1em}.core h2{font-size:clamp(16px,4vw,26px);margin:6px 0}.core b{font-size:34px}.dept{position:absolute;width:26%;min-width:100px;max-width:170px;border:1px solid #36546f;background:linear-gradient(#122a43,#0b1a2b);color:#fff;border-radius:16px;padding:10px;text-align:left;box-shadow:0 10px 25px rgba(0,0,0,.25)}.dept h3{font-size:13px;margin:0 0 6px}.dept p{font-size:10px;line-height:1.4;color:#a8b8c8;margin:0}.red{border-color:#8b4550}.orange{border-color:#946c35}.yellow{border-color:#9d8732}.green{border-color:#3c765f}.d1{left:50%;top:1%;transform:translateX(-50%)}.d2{right:1%;top:21%}.d3{right:1%;bottom:20%}.d4{left:50%;bottom:1%;transform:translateX(-50%)}.d5{left:1%;bottom:20%}.d6{left:1%;top:21%}.panel{display:none;max-width:800px;margin:10px auto;background:#0b1929;border:1px solid #294966;border-radius:16px;padding:16px}.panel.show{display:block}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0e2237;border:1px solid #28465f;border-radius:12px;padding:12px}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:#9fb0c1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{padding:11px 14px;border-radius:10px;border:1px solid #355571;background:#11283f;color:#fff;font-weight:700}.back{position:fixed;left:12px;bottom:12px;z-index:20}.legend{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:999px;border:1px solid #294966;background:#0d1d31;font-size:11px}@media(max-width:600px){.wrap{padding:10px}.title h1{font-size:23px}.dept{width:27%;min-width:0;padding:7px}.dept h3{font-size:10px;line-height:1.1;overflow-wrap:anywhere}.dept p{font-size:7.5px}.core{min-width:116px;min-height:116px}.core small{font-size:6px}.core h2{font-size:14px}.core b{font-size:26px}.stats{grid-template-columns:1fr 1fr}.stage{width:96vw}}</style></head><body><div class="top"><div class="wrap"><div class="title"><h1>Department Accountability Ring</h1><p>Tap a department to see backlog, overdue cases, response time, and items waiting on the department or Mayor.</p></div></div></div><div class="wrap"><div class="legend"><span class="pill">🔴 Critical attention</span><span class="pill">🟠 SLA risk</span><span class="pill">🟡 Watch</span><span class="pill">🟢 Normal</span></div><div class="stage"><div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div><button class="dept red d1" onclick="openDept(0)"><h3>City Engineering</h3><p>Active 24 · Backlog 8<br>Overdue 3 · Avg 2.4d</p></button><button class="dept green d2" onclick="openDept(1)"><h3>OSCA</h3><p>Active 16 · Backlog 3<br>Overdue 0 · Avg 1.3d</p></button><button class="dept orange d3" onclick="openDept(2)"><h3>CDRRMO</h3><p>Active 11 · Backlog 4<br>Overdue 1 · Avg 1.1d</p></button><button class="dept red d4" onclick="openDept(3)"><h3>General Services</h3><p>Active 19 · Backlog 7<br>Overdue 2 · Avg 3.1d</p></button><button class="dept yellow d5" onclick="openDept(4)"><h3>Public Safety</h3><p>Active 13 · Backlog 4<br>Overdue 1 · Avg 2.0d</p></button><button class="dept green d6" onclick="openDept(5)"><h3>Traffic Management</h3><p>Active 9 · Backlog 2<br>Overdue 0 · Avg 1.5d</p></button><div class="core"><small>OFFICE OF THE MAYOR</small><h2>Department Accountability</h2><b>4</b><span style="font-size:9px;color:#9fb0c1">NEED ATTENTION</span></div></div><div id="panel" class="panel"></div></div><a class="btn back" href="../">← BACK MENU</a><script>const D=[['City Engineering Office',24,8,3,'2.4 days',6,4,['3 requests are overdue','2 awaiting technical inspection','1 has no action for 4 days']],['OSCA',16,3,0,'1.3 days',2,5,['No critical overdue cases','5 requests waiting on Mayor']],['CDRRMO',11,4,1,'1.1 days',3,2,['1 emergency request overdue','3 awaiting department documentation']],['General Services Office',19,7,2,'3.1 days',5,1,['2 procurement requests overdue','Budget/technical documents incomplete']],['Public Safety Office',13,4,1,'2.0 days',4,2,['1 request overdue','4 remain in department processing']],['Traffic Management Office',9,2,0,'1.5 days',1,3,['No overdue requests','3 already at Mayor-review stage']]];function openDept(i){const d=D[i],p=document.getElementById('panel');p.className='panel show';p.innerHTML=`<h2>${d[0]}</h2><div class="stats"><div class="stat"><b>${d[1]}</b><span>Active Requests</span></div><div class="stat"><b>${d[2]}</b><span>Backlog</span></div><div class="stat"><b>${d[3]}</b><span>Overdue</span></div><div class="stat"><b>${d[4]}</b><span>Average Response</span></div><div class="stat"><b>${d[5]}</b><span>Waiting on Department</span></div><div class="stat"><b>${d[6]}</b><span>Waiting on Mayor</span></div></div><h3>Why is this department flagged?</h3><p>${d[7].map(x=>'• '+x).join('<br>')}</p><div class="actions"><button class="btn" onclick="alert('Demo: overdue cases opened')">VIEW OVERDUE CASES</button><button class="btn" onclick="alert('Demo: update request sent')">REQUEST DEPARTMENT UPDATE</button><button class="btn" onclick="alert('Demo: all requests opened')">VIEW ALL REQUESTS</button></div>`;p.scrollIntoView({behavior:'smooth'})}</script></body></html>
