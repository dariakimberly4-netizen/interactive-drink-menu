<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mayor Decision Room - Staff Portal</title>
<style>
:root{--bg:#07111f;--panel:#0d1d31;--panel2:#112741;--line:#294966;--text:#f7fbff;--muted:#9bb0c6;--gold:#f1c76d;--green:#3ddc97;--red:#ff6b6b;--yellow:#ffd166}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#05101b,#081624);color:var(--text);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.btn{min-height:44px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#102238;color:#fff}.btn.primary{background:linear-gradient(135deg,#1f6f5b,#2b8d72);border-color:#3b9f84;font-weight:800}.btn.gold{background:#3a301a;border-color:#745d2c;color:#ffe6a2}.wrap{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0 18px}.brand{display:flex;gap:12px;align-items:center}.seal{width:48px;height:48px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-weight:900}.brand h1{margin:0;font-size:21px}.brand small{color:var(--muted)}.login{max-width:760px;margin:8vh auto 0;background:#0b1929;border:1px solid var(--line);border-radius:22px;padding:24px}.login h2{margin-top:0}.roles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.role{padding:14px;border:1px solid #294966;background:#0a1725;border-radius:14px;text-align:left;color:#fff}.role b{display:block}.role small{display:block;color:var(--muted);margin-top:4px}.dashboard{display:none}.dashboard.show{display:block}.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}.hero h2{margin:0 0 6px;font-size:28px}.hero p{margin:0;color:var(--muted)}.metrics{display:flex;gap:8px;flex-wrap:wrap}.metric{min-width:110px;padding:11px 13px;background:#0e1d30;border:1px solid var(--line);border-radius:12px}.metric b{display:block;font-size:20px}.metric span{font-size:11px;color:var(--muted)}.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}.menu button{min-height:70px;text-align:left;font-weight:800}.panel{background:#0b1929;border:1px solid #213c57;border-radius:18px;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.card{background:#0a1725;border:1px solid #294966;border-radius:15px;padding:14px}.card h4{margin:6px 0}.track{font-size:11px;color:#88a5bf}.meta{font-size:12px;color:var(--muted);line-height:1.7}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900}.urgent{background:#5c3a1f;color:#ffd3a2}.high{background:#4a421c;color:#ffe99c}.normal{background:#173e5f;color:#c3e1ff}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{background:#081523;border:1px solid #294764;color:#fff;border-radius:11px;padding:11px}.toolbar input{flex:1;min-width:220px}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:12px;color:#abc0d3}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:10px;border-bottom:1px solid #1c344a;text-align:left;font-size:12px}.table th{color:#8ea7bd}.toast{position:fixed;right:18px;bottom:18px;background:#10243a;border:1px solid #3c5a74;border-radius:12px;padding:12px 15px;display:none}.toast.show{display:block}@media(max-width:720px){.roles{grid-template-columns:1fr}.hero{flex-direction:column}.metrics{display:grid;grid-template-columns:1fr 1fr;width:100%}.brand small{display:none}.wrap{padding:10px}.hero h2{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="brand"><div class="seal">M</div><div><h1>Mayor Decision Room</h1><small>Staff Portal</small></div></div><button id="logoutBtn" class="btn hidden" onclick="logout()">Logout</button></div>
<section id="login" class="login"><h2>Staff Sign In</h2><p style="color:var(--muted)">Choose your demo staff role.</p><div class="roles">
<button class="role" onclick="login('Records / Receiving Office','Records Officer')"><b>Records / Receiving Office</b><small>Receive, encode, assign tracking number, route documents</small></button>
<button class="role" onclick="login('Department Head','Department Head')"><b>Department Head</b><small>Review, respond, certify, resubmit</small></button>
<button class="role" onclick="login('Department Staff / Encoder','Department Staff')"><b>Department Staff / Encoder</b><small>Upload requirements, add remarks, prepare submissions</small></button>
<button class="role" onclick="login('Releasing Officer','Releasing Officer')"><b>Releasing Officer</b><small>Release approved documents and mark completed</small></button>
<button class="role" onclick="login('Legal Reviewer','Legal Reviewer')"><b>Legal Reviewer</b><small>Legal comments and review completion</small></button>
<button class="role" onclick="login('Budget / Finance Reviewer','Finance Reviewer')"><b>Budget / Finance Reviewer</b><small>Funding verification and budget certification</small></button>
</div></section>
<section id="dashboard" class="dashboard">
<div class="hero"><div><h2 id="greeting">Staff Workspace</h2><p id="roleText"></p></div><div class="metrics"><div class="metric"><b>14</b><span>My Active Tasks</span></div><div class="metric"><b>4</b><span>Due Today</span></div><div class="metric"><b>2</b><span>Overdue</span></div><div class="metric"><b>6</b><span>Completed Today</span></div></div></div>
<div class="menu" id="menu"></div><div id="content"></div>
</section>
</div>
<div id="toast" class="toast"></div>
<script>
let currentRole='';
const records=[
{id:'MDR-2026-009182',title:'Emergency Drainage Repair',dept:'City Engineering Office',status:'Pending Mayor Approval',priority:'URGENT',holder:'Office of the Mayor',next:'Final decision'},
{id:'MDR-2026-009176',title:'Senior Citizen Medical Assistance Batch',dept:'OSCA',status:'For Review',priority:'HIGH',holder:'Office of the Mayor',next:'Executive review'},
{id:'MDR-2026-009131',title:'Barangay Multi-Purpose Hall Repair',dept:'City Engineering Office',status:'Returned',priority:'HIGH',holder:'City Engineering Office',next:'Submit revised cost estimate'},
{id:'MDR-2026-009122',title:'Rescue Equipment Procurement',dept:'General Services Office',status:'Need More Information',priority:'URGENT',holder:'General Services Office',next:'Upload budget certification'},
{id:'MDR-2026-009106',title:'Traffic Management Plan',dept:'Traffic Management Office',status:'Approved',priority:'NORMAL',holder:'Releasing Office',next:'Release approved plan'}];
function login(role,name){currentRole=role;document.getElementById('login').classList.add('hidden');document.getElementById('dashboard').classList.add('show');document.getElementById('logoutBtn').classList.remove('hidden');document.getElementById('greeting').textContent='Good day, '+name+'.';document.getElementById('roleText').textContent=role;renderMenu();showTasks()}
function logout(){currentRole='';document.getElementById('dashboard').classList.remove('show');document.getElementById('login').classList.remove('hidden');document.getElementById('logoutBtn').classList.add('hidden')}
function renderMenu(){let items=[['My Tasks','showTasks()'],['All Records','showRecords()']];if(currentRole.includes('Records'))items.unshift(['New Document Intake','showIntake()']);if(currentRole.includes('Department'))items.unshift(['Returned / Needs Info','showReturned()']);if(currentRole==='Releasing Officer')items.unshift(['Ready for Release','showRelease()']);if(currentRole==='Legal Reviewer')items.unshift(['Legal Review Queue','showLegal()']);if(currentRole.includes('Budget'))items.unshift(['Finance Review Queue','showFinance()']);document.getElementById('menu').innerHTML=items.map(i=>`<button class="btn" onclick="${i[1]}">${i[0]}</button>`).join('')}
function card(r){return `<div class="card"><div class="track">${r.id}</div><h4>${r.title}</h4><span class="badge ${r.priority.toLowerCase()}">${r.priority}</span><div class="meta" style="margin-top:8px"><b>Department:</b> ${r.dept}<br><b>Status:</b> ${r.status}<br><b>Who has it now:</b> ${r.holder}<br><b>Next:</b> ${r.next}</div><button class="btn" style="margin-top:10px;width:100%" onclick="showToast('Record opened in demo mode.')">OPEN RECORD</button></div>`}
function showTasks(){document.getElementById('content').innerHTML=`<div class="panel"><h3>My Tasks</h3><div class="grid">${records.slice(0,4).map(card).join('')}</div></div>`}
function showRecords(){document.getElementById('content').innerHTML=`<div class="panel"><div class="toolbar"><input placeholder="Search tracking number, subject, department..."><select><option>All Statuses</option><option>Pending</option><option>Returned</option><option>Approved</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>Tracking</th><th>Subject</th><th>Department</th><th>Status</th><th>Holder</th></tr></thead><tbody>${records.map(r=>`<tr><td>${r.id}</td><td>${r.title}</td><td>${r.dept}</td><td>${r.status}</td><td>${r.holder}</td></tr>`).join('')}</tbody></table></div></div>`}
function showIntake(){document.getElementById('content').innerHTML=`<div class="panel"><h3>New Document Intake</h3><div class="field"><label>Requester</label><input></div><div class="field"><label>Subject</label><input></div><div class="field"><label>Department Concerned</label><select><option>City Engineering Office</option><option>OSCA</option><option>CDRRMO</option><option>General Services Office</option></select></div><div class="field"><label>Priority</label><select><option>NORMAL</option><option>HIGH</option><option>URGENT</option></select></div><div class="field"><label>Description</label><textarea></textarea></div><button class="btn primary" onclick="showToast('Demo document created and routed.')">CREATE & ROUTE</button></div>`}
function showReturned(){const list=records.filter(r=>r.status==='Returned'||r.status==='Need More Information');document.getElementById('content').innerHTML=`<div class="panel"><h3>Returned / Needs Information</h3><div class="grid">${list.map(card).join('')}</div></div>`}
function showRelease(){const list=records.filter(r=>r.status==='Approved');document.getElementById('content').innerHTML=`<div class="panel"><h3>Ready for Release</h3><div class="grid">${list.map(card).join('')}</div></div>`}
function showLegal(){document.getElementById('content').innerHTML=`<div class="panel"><h3>Legal Review Queue</h3><div class="grid">${records.slice(1,3).map(card).join('')}</div></div>`}
function showFinance(){document.getElementById('content').innerHTML=`<div class="panel"><h3>Finance Review Queue</h3><div class="grid">${records.filter(r=>r.id==='MDR-2026-009122').map(card).join('')}</div></div>`}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2500)}
</script>
</body>
</html>
