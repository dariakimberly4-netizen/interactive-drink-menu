<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mayor Decision Room — Department Orbit</title><style>
:root{--bg:#06111e;--panel:#0b1a2b;--panel2:#10243a;--line:#2b4964;--text:#f7fbff;--muted:#9eb2c7;--gold:#f1c76d;--green:#49d79d;--red:#ff6f79;--yellow:#ffd166;--blue:#64b5ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top,#0b2036 0,#06111e 45%,#040b13 100%);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}.hidden{display:none!important}
.top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(5,15,26,.94);position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:10px}.seal{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-weight:900}
.brand h1{font-size:17px;margin:0}.brand small{color:var(--muted)}.wrap{max-width:1180px;margin:auto;padding:14px}
.btn{min-height:48px;padding:11px 14px;border-radius:13px;border:1px solid var(--line);background:#102238;color:#fff;font-weight:800}
.btn.primary{background:linear-gradient(135deg,#1f6f5b,#2b8d72);border-color:#3b9f84}.btn.gold{background:#3b311b;border-color:#7d6531;color:#ffe9a8}.btn.danger{background:#421f28;border-color:#79404c}
.login{min-height:100vh;display:grid;place-items:center;padding:18px}.login-card{width:min(680px,96vw);background:rgba(10,25,42,.97);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.login-card h1{margin:10px 0 6px}.login-card p{color:var(--muted)}.roles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.role{min-height:92px;text-align:left;border:1px solid var(--line);background:#0a1725;color:#fff;border-radius:15px;padding:14px}.role b{display:block}.role small{display:block;color:var(--muted);margin-top:5px}
.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:12px;color:#b5c8da}.field input,.field select,.field textarea{min-height:46px;background:#071522;border:1px solid var(--line);color:#fff;border-radius:12px;padding:11px}.field textarea{min-height:110px}.help{font-size:11px;color:var(--muted)}
.orbit-page{min-height:calc(100vh - 68px);display:flex;flex-direction:column}.orbit-head{text-align:center;padding:12px 8px 2px}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:.18em;font-weight:900}.orbit-head h2{margin:6px 0 3px;font-size:25px}.orbit-head p{margin:0;color:var(--muted);font-size:12px}
.orbit-stage{position:relative;width:min(96vw,760px);aspect-ratio:1/1;margin:4px auto 18px;flex:0 0 auto}
.ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid #294966;border-radius:50%;pointer-events:none}.r1{width:46%;height:46%}.r2{width:68%;height:68%}.r3{width:90%;height:90%}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34%;height:34%;min-width:132px;min-height:132px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 35% 30%,#1a405f,#0b1b2c 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;z-index:3;box-shadow:0 0 0 8px rgba(241,199,109,.03),0 0 40px rgba(241,199,109,.1)}
.core small{color:var(--gold);font-size:8px;letter-spacing:.12em}.core strong{font-size:clamp(15px,2.8vw,24px);line-height:1.05;margin:5px 0}.core span{font-size:9px;color:var(--muted);line-height:1.35}
.node{position:absolute;width:25%;max-width:170px;min-height:82px;border:1px solid #385b78;border-radius:16px;background:linear-gradient(180deg,#12304d,#0a1a2b);color:#fff;padding:10px;text-align:left;font-weight:900;z-index:5;box-shadow:0 12px 26px rgba(0,0,0,.25)}
.node small{display:block;color:var(--muted);font-size:8px;font-weight:600;margin-top:5px}.n1{left:50%;top:0;transform:translateX(-50%)}.n2{right:2%;top:17%}.n3{right:0;top:50%;transform:translateY(-50%)}.n4{right:10%;bottom:7%}.n5{left:50%;bottom:0;transform:translateX(-50%)}.n6{left:10%;bottom:7%}.n7{left:0;top:50%;transform:translateY(-50%)}.n8{left:2%;top:17%}
.workspace{min-height:calc(100vh - 68px);padding:14px}.workspace-inner{max-width:1180px;margin:auto}.workspace-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;position:sticky;top:78px;z-index:20;background:linear-gradient(180deg,#06111e 75%,transparent);padding-bottom:10px}.workspace-head h2{margin:0;font-size:24px}.back{border-color:var(--gold);color:#ffe9a8;white-space:nowrap}
.panel{background:rgba(10,25,42,.96);border:1px solid var(--line);border-radius:18px;padding:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{background:#081726;border:1px solid #27445e;border-radius:15px;padding:14px}.card h3,.card h4{margin:5px 0 8px}.meta{font-size:12px;line-height:1.7;color:var(--muted)}.track{font-size:10px;color:#8eb0cf;letter-spacing:.04em}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900}.urgent{background:#5c3424;color:#ffd4ae}.high{background:#50471e;color:#ffef9e}.normal{background:#173d5e;color:#c8e5ff}.ok{background:#173e34;color:#baf4d9}.over{background:#4d2028;color:#ffc0c6}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions .btn{flex:1;min-width:150px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{min-height:46px;background:#071522;border:1px solid var(--line);color:#fff;border-radius:12px;padding:10px}.toolbar input{flex:1;min-width:220px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:10px;border-bottom:1px solid #1d344a;text-align:left;font-size:12px}.table th{color:#91a9be}.section-title{margin:0 0 12px}
.record-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.kv{background:#0b1a2b;border:1px solid #213b54;border-radius:12px;padding:11px}.kv b{display:block;font-size:10px;color:#91a9be;margin-bottom:4px}.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px}.doc{background:#0a1725;border:1px solid #284761;border-radius:12px;padding:12px}.doc b{display:block;margin-bottom:5px}.timeline{display:flex;flex-direction:column;gap:9px}.event{border-left:3px solid var(--gold);padding:10px 12px;background:#091725;border-radius:0 12px 12px 0}.event small{color:var(--muted)}
.toast{position:fixed;right:14px;bottom:14px;background:#10243a;border:1px solid #3a5974;border-radius:12px;padding:12px 15px;display:none;z-index:99}.toast.show{display:block}
@media(max-width:760px){.roles{grid-template-columns:1fr}.brand small{display:none}.wrap,.workspace{padding:9px}.orbit-stage{width:98vw}.node{width:27%;min-height:72px;padding:7px;font-size:9px}.node small{font-size:7px}.core{min-width:116px;min-height:116px;padding:9px}.core strong{font-size:14px}.record-grid{grid-template-columns:1fr 1fr}.workspace-head{top:73px;align-items:flex-start;flex-direction:column}.back{width:100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style></head><body>
<section id="login" class="login"><div class="login-card"><div class="seal">D</div><h1>Department Portal</h1><p>Department Head / Department Staff</p><div class="field"><label>Department</label><select id="dept"><option>City Engineering Office</option><option>OSCA</option><option>CDRRMO</option><option>General Services Office</option><option>Public Safety Office</option><option>Traffic Management Office</option></select></div><div class="field"><label>Role</label><select id="role"><option>Department Head</option><option>Department Staff / Encoder</option></select></div><div class="field"><label>Demo PIN</label><input id="pin" value="2026"></div><button class="btn primary" style="width:100%" onclick="enterDept()">ENTER DEPARTMENT ORBIT</button><div class="help" style="margin-top:8px">Demo PIN: 2026</div></div></section>
<div id="app" class="hidden"><header class="top"><div class="brand"><div class="seal">D</div><div><h1 id="deptLabel">Department Orbit</h1><small id="roleLabel"></small></div></div><button class="btn" onclick="logout()">Logout</button></header><main id="orbitPage" class="orbit-page"><div class="orbit-head"><div class="eyebrow">DEPARTMENT ORBIT</div><h2>Department Command Center</h2><p>Tap a module. No dashboard is shown underneath.</p></div><div id="orbit"></div></main><main id="workspace" class="workspace hidden"><div class="workspace-inner"><div class="workspace-head"><h2 id="workspaceTitle"></h2><button class="btn back" onclick="showOrbit()">← BACK TO DEPARTMENT ORBIT</button></div><div id="workspaceBody"></div></div></main></div><div id="toast" class="toast"></div>
<script>

const records=[
{id:'MDR-2026-009182',requester:'Barangay Molino III',subject:'Emergency Drainage Repair',type:'Infrastructure',dept:'City Engineering Office',priority:'URGENT',received:'Received by Mayor Office',approval:'Pending Approval',office:'Office of the Mayor',user:'Mayor EA',role:'Executive Assistant',action:'Final decision',assigned:'Sep 18, 2026',deadline:'Sep 18, 2026',days:1,updated:'Today 10:32 AM'},
{id:'MDR-2026-009176',requester:'OSCA Bacoor',subject:'Senior Citizen Medical Assistance Batch',type:'Assistance',dept:'OSCA',priority:'HIGH',received:'Forwarded to Mayor Office',approval:'For Review',office:'Office of the Mayor',user:'Chief of Staff',role:'Chief of Staff',action:'Executive review',assigned:'Sep 17, 2026',deadline:'Sep 19, 2026',days:2,updated:'Today 9:10 AM'},
{id:'MDR-2026-009131',requester:'Barangay Bayanan',subject:'Multi-Purpose Hall Repair',type:'Infrastructure',dept:'City Engineering Office',priority:'HIGH',received:'Department Processing',approval:'Returned',office:'City Engineering Office',user:'Engr. Santos',role:'Department Head',action:'Submit revised cost estimate',assigned:'Sep 14, 2026',deadline:'Sep 18, 2026',days:4,updated:'Yesterday 4:40 PM'},
{id:'MDR-2026-009122',requester:'CDRRMO',subject:'Rescue Equipment Procurement',type:'Procurement',dept:'General Services Office',priority:'URGENT',received:'Department Processing',approval:'Need More Information',office:'General Services Office',user:'Maria Cruz',role:'Department Staff',action:'Upload budget certification',assigned:'Sep 12, 2026',deadline:'Sep 16, 2026',days:6,updated:'2 days ago'},
{id:'MDR-2026-009106',requester:'Traffic Office',subject:'Traffic Management Plan',type:'Operations',dept:'Traffic Management Office',priority:'NORMAL',received:'Acknowledged',approval:'Approved',office:'Releasing Office',user:'Release Desk 1',role:'Releasing Officer',action:'Release approved plan',assigned:'Sep 16, 2026',deadline:'Sep 20, 2026',days:2,updated:'Today 8:05 AM'}
];
function priorityBadge(p){return '<span class="badge '+p.toLowerCase()+'">'+p+'</span>'}
function recordCard(r){return '<div class="card"><div class="track">'+r.id+'</div><h3>'+r.subject+'</h3>'+priorityBadge(r.priority)+'<div class="meta" style="margin-top:8px"><b>Requester:</b> '+r.requester+'<br><b>Received:</b> '+r.received+'<br><b>Mayor Status:</b> '+r.approval+'<br><b>Current Office:</b> '+r.office+'<br><b>Next:</b> '+r.action+'</div><div class="actions"><button class="btn" onclick="openRecord(\''+r.id+'\')">OPEN RECORD</button></div></div>'}
function openRecord(id){const r=records.find(x=>x.id===id)||records[0];openWorkspace('Request Record',recordDetail(r))}
function recordDetail(r){return '<div class="panel"><h3 class="section-title">'+r.subject+'</h3><div class="record-grid">'+
['Tracking Number|'+r.id,'Requester|'+r.requester,'Department|'+r.dept,'Priority|'+r.priority,'Received Status|'+r.received,'Mayor Approval Status|'+r.approval,'Current Office|'+r.office,'Assigned User|'+r.user,'Assigned Role|'+r.role,'Required Action|'+r.action,'Date Assigned|'+r.assigned,'Deadline|'+r.deadline,'Days Pending|'+r.days,'Last Updated|'+r.updated].map(x=>{const p=x.split('|');return '<div class="kv"><b>'+p[0]+'</b>'+p[1]+'</div>'}).join('')+
'</div><h3>Documents</h3><div class="docs">'+['Original Request','Supporting Files','Department Response','Revisions','Legal Review','Budget Review','Mayor-approved Document','Release Proof'].map((x,i)=>'<div class="doc"><b>'+x+'</b><span class="meta">'+(i===0?'Attached PDF • View soft copy':'No file / latest version')+'</span><div class="actions"><button class="btn" onclick="toast(\'Demo document opened.\')">VIEW</button></div></div>').join('')+'</div><h3>Activity History</h3><div class="timeline"><div class="event"><b>Routed to '+r.office+'</b><br><small>'+r.updated+' • Records Officer • Status updated</small></div><div class="event"><b>Assigned to '+r.user+'</b><br><small>'+r.assigned+' • '+r.role+'</small></div></div></div>'}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),2300)}

let currentDept='',currentRole='';
const modules=[['MY TASKS','Assigned + due','tasks'],['NEW / INCOMING','Acknowledge routed','incoming'],['RETURNED / NEEDS INFO','Fix + resubmit','returned'],['SUBMIT RESPONSE','Soft copy required','submit'],['FOR CERTIFICATION','Head review','cert'],['DEPARTMENT RECORDS','All department requests','records'],['OVERDUE / SLA','Due + escalated','sla'],['SEARCH & DOCUMENTS','Find files','search']];
function enterDept(){if(document.getElementById('pin').value!=='2026')return toast('Invalid demo PIN.');currentDept=document.getElementById('dept').value;currentRole=document.getElementById('role').value;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('deptLabel').textContent=currentDept;document.getElementById('roleLabel').textContent=currentRole;showOrbit()}
function logout(){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
function showOrbit(){document.getElementById('workspace').classList.add('hidden');document.getElementById('orbitPage').classList.remove('hidden');document.getElementById('orbit').innerHTML='<div class="orbit-stage"><div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div>'+modules.map((m,i)=>'<button class="node n'+(i+1)+'" onclick="openModule(\''+m[2]+'\',\''+m[0]+'\')">'+m[0]+'<small>'+m[1]+'</small></button>').join('')+'<div class="core"><small>DEPARTMENT COMMAND CENTER</small><strong>'+currentDept+'</strong><span>'+currentRole+'<br>Active 12 • Overdue 1<br>TAP A MODULE</span></div></div>'}
function openWorkspace(title,html){document.getElementById('orbitPage').classList.add('hidden');document.getElementById('workspace').classList.remove('hidden');document.getElementById('workspaceTitle').textContent=title;document.getElementById('workspaceBody').innerHTML=html;window.scrollTo(0,0)}
function deptRecords(){return records.filter(r=>r.dept===currentDept||currentDept==='City Engineering Office'&&r.dept==='City Engineering Office')}
function openModule(k,title){
 const list=deptRecords().length?deptRecords():records.slice(0,4);
 if(k==='tasks')return openWorkspace(title,'<div class="grid">'+list.map(recordCard).join('')+'</div>');
 if(k==='incoming')return openWorkspace(title,'<div class="grid">'+list.slice(0,3).map(r=>'<div class="card"><div class="track">'+r.id+'</div><h3>'+r.subject+'</h3>'+priorityBadge(r.priority)+'<div class="meta" style="margin-top:8px">Date received: '+r.assigned+'<br>Requester: '+r.requester+'<br>Subject: '+r.subject+'</div><div class="actions"><button class="btn primary" onclick="toast(\'Request acknowledged. Audit entry recorded.\')">ACCEPT / ACKNOWLEDGE</button></div></div>').join('')+'</div>');
 if(k==='returned')return openWorkspace(title,'<div class="grid">'+records.filter(r=>['Returned','Need More Information'].includes(r.approval)).map(r=>'<div class="card"><div class="track">'+r.id+'</div><h3>'+r.subject+'</h3><div class="meta">Return reason: Incomplete / revision required<br>Missing: '+r.action+'<br>Deadline: '+r.deadline+'</div><div class="actions"><button class="btn" onclick="openModule(\'submit\',\'SUBMIT RESPONSE\')">RESUBMIT</button></div></div>').join('')+'</div>');
 if(k==='submit')return openWorkspace(title,submitForm());
 if(k==='cert')return openWorkspace(title,certificationView());
 if(k==='records')return openWorkspace(title,recordsView(list));
 if(k==='sla')return openWorkspace(title,slaView(list));
 if(k==='search')return openWorkspace(title,searchView());
}
function submitForm(){return '<div class="panel"><div class="field"><label>Tracking Number</label><input value="MDR-2026-009131"></div><div class="field"><label>Department Response</label><textarea></textarea></div><div class="field"><label>Recommendation</label><textarea></textarea></div><div class="field"><label>Remarks</label><textarea></textarea></div><div class="field"><label>SOFT COPY OF ORIGINAL REQUEST <b style="color:#ffb0b0">*</b></label><input id="deptSoftCopy" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" required><div class="help">Required: PDF, DOC/DOCX, JPG/JPEG, PNG.</div></div><div class="field"><label>Supporting Files</label><input type="file" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"></div><button class="btn primary" onclick="submitResponse()">SUBMIT RESPONSE</button></div>'}
function submitResponse(){const f=document.getElementById('deptSoftCopy');if(!f||!f.files||!f.files.length)return toast('Soft copy of original request is REQUIRED before submission.');toast('Response submitted. Soft copy attached. Audit entry recorded.')}
function certificationView(){if(currentRole!=='Department Head')return '<div class="panel"><h3>For Certification</h3><p class="meta">Only the Department Head can certify. Staff can prepare and submit for head review.</p></div>';return '<div class="grid">'+records.slice(2,4).map(r=>'<div class="card"><div class="track">'+r.id+'</div><h3>'+r.subject+'</h3><div class="meta">Prepared by Department Staff<br>Soft copy attached<br>Response ready for certification</div><div class="actions"><button class="btn primary" onclick="toast(\'Certified and forwarded to Mayor Office.\')">CERTIFY & FORWARD</button><button class="btn" onclick="toast(\'Returned to staff with remarks.\')">RETURN TO STAFF</button></div></div>').join('')+'</div>'}
function recordsView(list){return '<div class="panel"><div class="toolbar"><input placeholder="Search department records"><select><option>All statuses</option><option>Department Processing</option><option>Returned</option><option>Approved</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>Tracking</th><th>Subject</th><th>Status</th><th>Holder</th><th>Date Received</th><th>Last Action</th><th></th></tr></thead><tbody>'+list.map(r=>'<tr><td>'+r.id+'</td><td>'+r.subject+'</td><td>'+r.received+' / '+r.approval+'</td><td>'+r.office+'</td><td>'+r.assigned+'</td><td>'+r.updated+'</td><td><button class="btn" onclick="openRecord(\''+r.id+'\')">OPEN</button></td></tr>').join('')+'</tbody></table></div></div>'}
function slaView(list){return '<div class="grid">'+list.map(r=>'<div class="card"><div class="track">'+r.id+'</div><h3>'+r.subject+'</h3><span class="badge '+(r.days>4?'over':'high')+'">'+(r.days>4?'OVERDUE':'DUE / WATCH')+'</span><div class="meta" style="margin-top:8px">Due today/tomorrow: '+r.deadline+'<br>Days overdue/pending: '+r.days+'<br>No activity: '+(r.days>4?'YES':'NO')+'<br>Escalated: '+(r.days>4?'YES':'NO')+'<br>Priority: '+r.priority+'</div></div>').join('')+'</div>'}
function searchView(){return '<div class="panel"><div class="toolbar"><input placeholder="Tracking number / requester / subject / date"><button class="btn primary" onclick="toast(\'Search complete.\')">SEARCH</button></div><div class="docs">'+['Original Soft Copy','Supporting Documents','Revisions','Released Documents'].map(x=>'<div class="doc"><b>'+x+'</b><span class="meta">Latest available version</span><div class="actions"><button class="btn" onclick="toast(\'Document opened.\')">VIEW</button></div></div>').join('')+'</div></div>'}
</script></body></html>
