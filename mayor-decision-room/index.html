<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mayor Decision Room</title>
<style>
:root{--bg:#06111e;--panel:#0d2035;--line:#294b69;--text:#f7fbff;--muted:#9eb1c5;--gold:#efc66f;--red:#ff6969;--orange:#ffad5a;--green:#43d49a;--yellow:#ffd166}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 18%,#15314a 0,#071521 36%,#05101b 100%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;overflow-x:hidden}button{font:inherit;color:inherit;cursor:pointer}.hidden{display:none!important}
.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #183148;background:#06111ed9;position:sticky;top:0;z-index:50}.brand{display:flex;gap:10px;align-items:center}.seal{width:44px;height:44px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-weight:900}.brand b{font-size:18px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#10253b;border-radius:12px;padding:10px 13px;min-height:44px;font-weight:700}.btn.gold{border-color:#876d38;background:#3a2f19;color:#ffe8a4}.btn.red{border-color:#7f3e48;background:#3c1d23}.btn.green{border-color:#33765f;background:#15382f}.wrap{max-width:1120px;margin:auto;padding:18px}.hero{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:14px}.hero h1{margin:0;font-size:30px}.hero p{margin:6px 0;color:var(--muted)}.metrics{display:flex;gap:8px;flex-wrap:wrap}.metric{min-width:110px;padding:11px;border:1px solid var(--line);background:#0b1c2f;border-radius:12px}.metric b{font-size:20px;display:block}.metric span{font-size:11px;color:var(--muted)}
.workspace{border:1px solid #19344e;background:linear-gradient(#0c1d30cc,#071421cc);border-radius:22px;padding:14px;min-height:650px;overflow:hidden}.titlebar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.titlebar h2{margin:0;font-size:23px}.titlebar p{margin:4px 0;color:var(--muted);font-size:13px}.orbitwrap{width:100%;overflow:hidden;display:flex;justify-content:center}.stage{position:relative;width:min(650px,100%);aspect-ratio:1/1}.ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid #2a4761;border-radius:50%;pointer-events:none}.r1{width:50%;height:50%}.r2{width:76%;height:76%}.r3{width:96%;height:96%}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:35%;height:35%;min-width:150px;min-height:150px;border:2px solid var(--gold);border-radius:50%;background:radial-gradient(circle at 35% 30%,#1c4565,#0c2135 65%,#071420);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;z-index:15;pointer-events:none}.center small{color:var(--gold);letter-spacing:.12em;font-size:9px}.center h3{margin:6px 0;font-size:23px}.center strong{font-size:36px}.center em{font-style:normal;font-size:9px;color:var(--muted)}.hit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:35%;height:35%;min-width:150px;min-height:150px;border-radius:50%;border:0;background:transparent;z-index:25;touch-action:manipulation}.node,.dept{position:absolute;width:23%;max-width:145px;aspect-ratio:1;border:1px solid #315474;border-radius:50%;background:radial-gradient(circle at 35% 28%,#1c4565,#0b1b2c 70%);padding:12px;z-index:8;touch-action:manipulation}.node{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}.node b{font-size:28px;line-height:1;display:block}.node span,.dept h4{font-size:13px;font-weight:800;line-height:1.12}.node small{display:none}.dept{min-height:0;text-align:center}.dept small{font-size:9px;color:var(--muted);line-height:1.3}.n1{left:50%;top:1%;transform:translateX(-50%)}.n2{right:1%;top:21%}.n3{right:1%;bottom:20%}.n4{left:50%;bottom:1%;transform:translateX(-50%)}.n5{left:1%;bottom:20%}.n6{left:1%;top:21%}.red{border-color:#87444b}.orange{border-color:#8c6738}.green{border-color:#39755f}.yellow{border-color:#8a7938}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}.card{border:1px solid #294966;background:#0a1929;border-radius:14px;padding:14px}.card h3,.card h4{margin:0 0 8px}.meta{font-size:12px;line-height:1.65;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.stat{padding:12px;border:1px solid #294966;border-radius:12px;background:#091725}.stat b{font-size:22px;display:block}.stat span{font-size:10px;color:var(--muted)}.back{position:fixed;left:12px;bottom:12px;z-index:80;border:1px solid var(--gold);background:#0b1a2a;color:#ffe6a0;border-radius:999px;padding:12px 15px;font-weight:900;display:none}.back.show{display:block}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(520px,96vw);border:1px solid #294966;border-radius:22px;padding:24px;background:#0b1c2f}.loginbox h1{margin:0 0 8px}.loginbox p{color:var(--muted)}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:11px;color:#a9bfd3}.field input{min-height:48px;border:1px solid #294966;border-radius:12px;background:#071523;color:white;padding:0 12px}.demo{font-size:12px;color:#ffe6a0;margin-top:10px}.row{display:flex;gap:8px;flex-wrap:wrap}.record{border:1px solid #294966;border-radius:12px;padding:11px;margin-top:8px;background:#081725}.record b{font-size:13px}.record small{display:block;color:var(--muted);margin-top:4px}.toast{position:fixed;right:16px;bottom:16px;background:#10253b;border:1px solid #3a5f7d;border-radius:12px;padding:11px 14px;display:none;z-index:100}.toast.show{display:block}
@media(max-width:640px){.top{padding:0 10px}.brand b{font-size:16px}.actions .btn:first-child{display:none}.wrap{padding:10px}.hero{flex-direction:column}.hero h1{font-size:25px}.metrics{display:grid;grid-template-columns:1fr 1fr;width:100%}.metric{min-width:0}.workspace{padding:7px;min-height:0}.stage{width:100%;max-width:420px}.node,.dept{width:25%;max-width:102px;padding:7px;border-radius:50%}.node b{font-size:22px}.node span,.dept h4{font-size:9px;line-height:1.08}.node small,.dept small{font-size:7px}.center,.hit{width:34%;height:34%;min-width:112px;min-height:112px;max-width:138px;max-height:138px}.center small{font-size:6px}.center h3{font-size:15px}.center strong{font-size:27px}.center em{font-size:6px}.titlebar{align-items:flex-start;flex-direction:column}.back{font-size:12px;padding:10px 13px}.cardgrid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<section id="login" class="login">
  <div class="loginbox">
    <div class="brand"><div class="seal">M</div><div><b>Mayor Decision Room</b><div style="color:var(--muted);font-size:11px">Demo System</div></div></div>
    <h1 style="margin-top:22px">Secure Sign In</h1>
    <p>Use the demo Mayor account to enter the Decision Room.</p>
    <div class="field"><label>Username</label><input id="u" value="mayor"></div>
    <div class="field"><label>Password</label><input id="p" type="password" value="Mayor2026!"></div>
    <button class="btn green" style="width:100%" onclick="login()">SIGN IN</button>
    <div class="demo">Demo: mayor / Mayor2026!</div>
  </div>
</section>
<div id="app" class="hidden">
<header class="top"><div class="brand"><div class="seal">M</div><b>Mayor Decision Room</b></div><div class="actions"><button class="btn" onclick="toast('3 new demo notifications')">🔔 3</button><button class="btn" onclick="logout()">Logout</button></div></header>
<main class="wrap"><section class="hero"><div><h1>Good afternoon, Mayor.</h1><p>These are the decisions requiring attention today.</p></div><div class="metrics"><div class="metric"><b>62</b><span>Active Items</span></div><div class="metric"><b>18</b><span>Pending</span></div><div class="metric"><b>5</b><span>Urgent</span></div><div class="metric"><b>3</b><span>Overdue</span></div></div></section><section id="workspace" class="workspace"></section></main>
<button id="back" class="back" onclick="showDecisionOrbit()">← BACK MENU</button>
</div>
<div id="toast" class="toast"></div>
<script>
const departments=[
{name:'City Engineering Office',active:24,backlog:8,overdue:3,avg:'2.4 days',waitDept:6,waitMayor:4,health:'red',why:['3 requests are overdue','2 await technical inspection','1 has no action for 4 days']},
{name:'OSCA',active:16,backlog:3,overdue:0,avg:'1.3 days',waitDept:2,waitMayor:5,health:'green',why:['No critical overdue cases','5 are waiting for Mayor action']},
{name:'CDRRMO',active:11,backlog:4,overdue:1,avg:'1.1 days',waitDept:3,waitMayor:2,health:'orange',why:['1 emergency request is overdue','3 await department documents']},
{name:'General Services Office',active:19,backlog:7,overdue:2,avg:'3.1 days',waitDept:5,waitMayor:1,health:'red',why:['2 procurement requests are overdue','Budget or technical documents are incomplete']},
{name:'Public Safety Office',active:13,backlog:4,overdue:1,avg:'2.0 days',waitDept:4,waitMayor:2,health:'yellow',why:['1 request is overdue','4 remain in department processing']},
{name:'Traffic Management Office',active:9,backlog:2,overdue:0,avg:'1.5 days',waitDept:1,waitMayor:3,health:'green',why:['No overdue requests','3 are already for Mayor review']}
];
const demoRecords={
'City Engineering Office':['MDR-2026-009182 — Emergency Drainage Repair','MDR-2026-009161 — Road Lighting Restoration'],
'OSCA':['MDR-2026-009176 — Senior Citizen Medical Assistance Batch'],
'CDRRMO':['MDR-2026-009083 — Flood Response Supply Request'],
'General Services Office':['MDR-2026-009122 — Rescue Equipment Procurement'],
'Public Safety Office':['MDR-2026-009149 — Public Market Safety Inspection'],
'Traffic Management Office':['MDR-2026-009106 — Traffic Management Plan']};
function login(){if(u.value.trim()==='mayor'&&p.value==='Mayor2026!'){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');showDecisionOrbit()}else toast('Invalid demo login')}
function logout(){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
function showDecisionOrbit(){document.getElementById('back').classList.remove('show');workspace.innerHTML=`<div class="orbitwrap"><div class="stage"><div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div><button class="node n1 red" onclick="queue('Pending Approval')"><b>18</b><span>Pending<br>Approval</span></button><button class="node n2" onclick="queue('For Review')"><b>9</b><span>For<br>Review</span></button><button class="node n3 green" onclick="queue('Approved')"><b>21</b><span>Approved</span></button><button class="node n4 red" onclick="queue('Rejected')"><b>4</b><span>Rejected</span></button><button class="node n5 yellow" onclick="queue('Return to Department')"><b>6</b><span>Return to<br>Department</span></button><button class="node n6" onclick="queue('Need More Information')"><b>4</b><span>Need More<br>Information</span></button><div class="center"><small>OFFICE OF THE MAYOR</small><h3>Decision Room</h3><strong>28</strong><em>ITEMS NEED ACTION</em><em style="color:var(--gold);margin-top:5px">TAP CENTER FOR DEPARTMENTS</em></div><button class="hit" aria-label="Open Department Accountability Ring" onclick="showDepartments()"></button></div></div>`}
function queue(name){document.getElementById('back').classList.add('show');workspace.innerHTML=`<div class="titlebar"><div><h2>${name}</h2><p>Demo workflow queue.</p></div><button class="btn" onclick="showDecisionOrbit()">← BACK MENU</button></div><div class="cardgrid"><div class="card"><h3>${name}</h3><div class="meta">Open a record to see its current holder, status, deadline and next action.</div><div class="record"><b>MDR-2026-009182</b><small>City Engineering Office • URGENT • Current holder: Office of the Mayor</small></div><div class="record"><b>MDR-2026-009176</b><small>OSCA • HIGH • Current holder: Office of the Mayor</small></div></div></div>`}
function showDepartments(){document.getElementById('back').classList.add('show');workspace.innerHTML=`<div class="titlebar"><div><h2>Department Accountability Ring</h2><p>Tap a department to see backlog, overdue cases, response time and who is holding the work.</p></div><button class="btn" onclick="showDecisionOrbit()">← BACK MENU</button></div><div class="orbitwrap"><div class="stage"><div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div>${departments.map((d,i)=>`<button class="dept ${d.health} n${i+1}" onclick="openDept(${i})"><h4>${d.name}</h4><small>Active ${d.active} • Backlog ${d.backlog}<br>Overdue ${d.overdue} • Avg ${d.avg}</small></button>`).join('')}<div class="center"><small>OFFICE OF THE MAYOR</small><h3>Department Accountability</h3><strong>${departments.filter(d=>d.health!=='green').length}</strong><em>DEPARTMENTS NEED ATTENTION</em></div></div></div>`}
function openDept(i){const d=departments[i],recs=demoRecords[d.name]||[];document.getElementById('back').classList.add('show');workspace.innerHTML=`<div class="titlebar"><div><h2>${d.name}</h2><p>Department Command Card</p></div><div class="row"><button class="btn" onclick="showDepartments()">← ACCOUNTABILITY RING</button><button class="btn" onclick="showDecisionOrbit()">BACK MENU</button></div></div><div class="stats"><div class="stat"><b>${d.active}</b><span>Active Requests</span></div><div class="stat"><b>${d.backlog}</b><span>Backlog</span></div><div class="stat"><b>${d.overdue}</b><span>Overdue</span></div><div class="stat"><b>${d.avg}</b><span>Average Response Time</span></div><div class="stat"><b>${d.waitDept}</b><span>Waiting on Department</span></div><div class="stat"><b>${d.waitMayor}</b><span>Waiting on Mayor</span></div></div><div class="cardgrid"><div class="card"><h3>Why is this department flagged?</h3><div class="meta">${d.why.map(x=>'• '+x).join('<br>')}</div></div><div class="card"><h3>Related Records</h3>${recs.map(x=>`<div class="record"><b>${x}</b><small>Open workflow record in demo mode</small></div>`).join('')}</div></div><div class="card" style="margin-top:10px"><h3>Mayor Quick Actions</h3><div class="row"><button class="btn red" onclick="toast('Showing overdue cases in demo mode')">VIEW OVERDUE CASES</button><button class="btn gold" onclick="toast('Department update request created')">REQUEST DEPARTMENT UPDATE</button><button class="btn" onclick="toast('Showing all department requests')">VIEW ALL REQUESTS</button></div></div>`}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2400)}
</script>
</body>
</html>
