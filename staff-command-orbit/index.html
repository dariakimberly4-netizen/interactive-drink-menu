<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Independent Staff Command Orbit</title>
<style>
:root{
  --g:#006241;--g2:#00a862;--dark:#04140e;--cream:#f4efe6;
  --gold:#d4ad62;--line:rgba(255,255,255,.16);--muted:#b9c9c1
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{
  min-height:100vh;color:#fff;overflow:hidden;
  background:
    radial-gradient(circle at 50% 40%,rgba(0,168,98,.24),transparent 26%),
    radial-gradient(circle at 50% 52%,#0c4633 0,#08281e 34%,#04140e 72%,#020907 100%);
}
button,input{font:inherit}
.topbar{
  height:70px;padding:0 18px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--line);background:rgba(2,12,9,.72);backdrop-filter:blur(16px);z-index:20;position:relative
}
.logo{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--g);border:2px solid #fff;font-weight:900}
.brand{margin-right:auto}.brand b{display:block}.brand small{color:var(--muted)}
.badge{padding:8px 12px;border-radius:999px;background:rgba(0,168,98,.18);border:1px solid rgba(111,224,172,.4);font-size:12px}
.stage{
  position:absolute;left:0;right:0;top:70px;bottom:0;
  display:grid;place-items:center;overflow:hidden
}
.orbit-wrap{
  position:relative;width:min(820px,94vw);height:min(820px,calc(100vh - 90px));
  min-height:560px;display:grid;place-items:center
}
.orbit-ring{
  position:absolute;width:min(650px,76vw);aspect-ratio:1;border-radius:50%;
  border:1px dashed rgba(255,255,255,.24);
  box-shadow:0 0 90px rgba(0,168,98,.12),inset 0 0 100px rgba(255,255,255,.03)
}
.orbit-ring::after{
  content:"";position:absolute;inset:11%;border-radius:50%;
  border:1px solid rgba(212,173,98,.14)
}
.core{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:220px;height:220px;border-radius:50%;border:2px solid rgba(255,255,255,.92);
  background:radial-gradient(circle at 35% 25%,#23a36c,#00754a 58%,#00442d);
  color:#fff;z-index:5;box-shadow:0 0 0 10px rgba(0,117,74,.14),0 0 72px rgba(0,168,98,.35);
  padding:20px;text-align:center;cursor:pointer
}
.core small{display:block;letter-spacing:.14em;font-weight:800;opacity:.8}
.core h1{font-size:24px;margin:8px 0 12px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mini div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.13);border-radius:11px;padding:7px}
.mini b{display:block;font-size:15px}.mini span{font-size:9px;opacity:.8}
.node{
  position:absolute;left:50%;top:50%;width:128px;height:128px;
  transform:translate(-50%,-50%);
  border:1px solid rgba(255,255,255,.22);border-radius:50%;
  background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.16),rgba(255,255,255,.07) 58%,rgba(0,117,74,.18));
  backdrop-filter:blur(16px);color:#fff;box-shadow:0 16px 38px rgba(0,0,0,.25),0 0 0 6px rgba(0,168,98,.05);
  z-index:6;cursor:pointer;padding:14px;text-align:center;transition:.2s;
  display:flex;flex-direction:column;align-items:center;justify-content:center
}
.node:hover{transform:translate(-50%,-50%) scale(1.06);border-color:#f1cf87}
.node b{display:block;font-size:15px;line-height:1.05}.node span{display:block;color:#c9d8d1;font-size:9px;line-height:1.18;margin-top:5px;max-width:92px}
.n1{margin-top:-300px}
.n2{margin-left:250px;margin-top:-145px}
.n3{margin-left:250px;margin-top:145px}
.n4{margin-top:300px}
.n5{margin-left:-250px;margin-top:145px}
.n6{margin-left:-250px;margin-top:-145px}
.hint{
  position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
  font-size:11px;color:#c7d5ce;background:rgba(3,18,13,.72);
  border:1px solid var(--line);border-radius:999px;padding:9px 14px;white-space:nowrap
}
.panel{
  position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.58);backdrop-filter:blur(8px);z-index:50
}
.panel.open{display:flex}
.sheet{
  width:min(900px,100%);max-height:82vh;overflow:auto;background:#f8fbf9;color:#16302a;
  border-radius:28px 28px 0 0;padding:24px
}
.sheet-head{display:flex;align-items:flex-start;gap:12px}.sheet-head>div{margin-right:auto}
.sheet h2{margin:0 0 4px;font-size:30px}.sheet p{margin:0;color:#6d7b76}
.close{width:42px;height:42px;border:0;border-radius:12px;background:#e9f0ec;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.card{min-height:110px;border:1px solid #dfe7e2;border-radius:18px;background:white;padding:15px;text-align:left;cursor:pointer}
.card b{display:block;font-size:16px;margin-bottom:5px}.card span{font-size:12px;color:#718079}
.gate{
  position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px;
  background:linear-gradient(150deg,#04140e,#0b3c2c)
}
.login{
  width:min(420px,100%);background:#fff;color:#16302a;border-radius:28px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.4)
}
.login .mark{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--g);color:white;font-weight:900;font-size:22px}
.login h2{font-size:30px;margin:14px 0 5px}.login p{margin:0 0 20px;color:#6d7b76}
.login label{display:block;font-size:12px;font-weight:800;margin:10px 0 6px}
.login input{width:100%;height:48px;border:1px solid #d7e1db;border-radius:13px;padding:0 13px}
.enter{margin-top:16px;width:100%;height:52px;border:0;border-radius:14px;background:var(--g);color:#fff;font-weight:900}
.demo{display:block;text-align:center;color:#87948e;font-size:11px;margin-top:10px}

@media(max-width:760px){
  .topbar{height:64px;padding:0 12px}.stage{top:64px}
  .orbit-wrap{width:100vw;height:calc(100vh - 64px);min-height:500px}
  .orbit-ring{width:330px}
  .core{width:156px;height:156px;padding:13px}
  .core h1{font-size:17px;margin:4px 0 7px}.core small{font-size:8px}
  .mini{gap:4px}.mini div{padding:4px;border-radius:8px}.mini b{font-size:11px}.mini span{font-size:7px}
  .node{width:88px;height:88px;min-height:0;border-radius:50%;padding:8px}
  .node b{font-size:10.5px}.node span{font-size:7.5px;max-width:68px}
  .n1{margin-top:-192px}
  .n2{margin-left:145px;margin-top:-96px}
  .n3{margin-left:145px;margin-top:96px}
  .n4{margin-top:192px}
  .n5{margin-left:-145px;margin-top:96px}
  .n6{margin-left:-145px;margin-top:-96px}
  .hint{bottom:10px;font-size:9px;padding:7px 10px}
  .grid{grid-template-columns:1fr 1fr}
}
@media(max-width:390px){
  .orbit-ring{width:300px}
  .core{width:142px;height:142px}
  .node{width:80px;height:80px;min-height:0}
  .n1{margin-top:-176px}
  .n2{margin-left:132px;margin-top:-88px}
  .n3{margin-left:132px;margin-top:88px}
  .n4{margin-top:176px}
  .n5{margin-left:-132px;margin-top:88px}
  .n6{margin-left:-132px;margin-top:-88px}
}
</style>

<style id="forceCircularModulesV2">
.node{
  width:120px!important;
  height:120px!important;
  min-width:120px!important;
  min-height:120px!important;
  max-width:120px!important;
  max-height:120px!important;
  border-radius:9999px!important;
  aspect-ratio:1/1!important;
  padding:12px!important;
  display:flex!important;
  flex-direction:column!important;
  align-items:center!important;
  justify-content:center!important;
  text-align:center!important;
  overflow:hidden!important;
}
.node b{font-size:14px!important;line-height:1.05!important}
.node span{font-size:8.5px!important;line-height:1.1!important;max-width:86px!important}
@media(max-width:760px){
  .node{
    width:84px!important;
    height:84px!important;
    min-width:84px!important;
    min-height:84px!important;
    max-width:84px!important;
    max-height:84px!important;
    border-radius:9999px!important;
  }
  .node b{font-size:10px!important}
  .node span{font-size:7px!important;max-width:62px!important}
}
@media(max-width:390px){
  .node{
    width:76px!important;
    height:76px!important;
    min-width:76px!important;
    min-height:76px!important;
    max-width:76px!important;
    max-height:76px!important;
  }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">S</div>
  <div class="brand"><b>Staff Command Orbit</b><small>Independent Operations Portal</small></div>
  <div class="badge" id="staffBadge">Donna • On Duty</div>
</header>

<main class="stage">
  <section class="orbit-wrap">
    <div class="orbit-ring"></div>
    <button class="core" data-key="today">
      <small>LIVE STORE</small>
      <h1>Today’s Store</h1>
      <div class="mini">
        <div><b>₱18.4K</b><span>Sales</span></div>
        <div><b>12</b><span>New</span></div>
        <div><b>5</b><span>Preparing</span></div>
        <div><b>4</b><span>Low Stock</span></div>
      </div>
    </button>

    <button class="node n1" data-key="orders"><b>Orders</b><span>Queue & fulfillment</span></button>
    <button class="node n2" data-key="menu"><b>Menu</b><span>Drinks, food & availability</span></button>
    <button class="node n3" data-key="inventory"><b>Inventory</b><span>Stock & suppliers</span></button>
    <button class="node n4" data-key="promotions"><b>Promotions</b><span>Offers & campaigns</span></button>
    <button class="node n5" data-key="customers"><b>Customers</b><span>Loyalty & feedback</span></button>
    <button class="node n6" data-key="business"><b>Business</b><span>Sales & reports</span></button>

    <div class="hint">Tap any orbit node to open its workspace</div>
  </section>
</main>

<div class="panel" id="panel">
  <section class="sheet">
    <div class="sheet-head">
      <div><h2 id="title"></h2><p id="desc"></p></div>
      <button class="close" id="close">×</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<div class="gate" id="gate">
  <div class="login">
    <div class="mark">S</div>
    <h2>Staff Login</h2>
    <p>Independent staff access. This is separate from the customer menu.</p>
    <label>Staff Name</label>
    <input id="name" value="Donna">
    <label>Demo PIN</label>
    <input id="pin" type="password" value="1234">
    <button class="enter" id="enter">Enter Staff Orbit</button>
    <span class="demo">Demo PIN: 1234</span>
  </div>
</div>

<script>
const data={
today:{title:"Today's Store",desc:"Live shift command center.",items:[
["Sales Today","Real-time store sales and transactions."],["Orders Waiting","Orders waiting to be accepted."],["Preparing","Orders currently being prepared."],["Ready","Orders ready for handoff."],["Low Stock","Items requiring attention."],["Staff On Duty","Active team members and assignments."]]},
orders:{title:"Orders",desc:"Manage the order flow.",items:[
["New Orders","Accept incoming orders."],["Preparing","Track active preparation."],["Ready for Pickup","Completed orders for handoff."],["Completed","Fulfilled transactions."],["Cancelled / Refunded","Handle exceptions."],["Order History","Search past orders."]]},
menu:{title:"Menu",desc:"Manage sellable products.",items:[
["Drinks","Coffee, tea and blended drinks."],["Food","Pastries, sandwiches and snacks."],["Add-ons","Shots, syrups, milk and toppings."],["Sizes","Manage serving sizes."],["Availability","Turn items on or off."],["Sold Out","Mark unavailable products."],["Quick Add / Edit","Create or update an item."]]},
inventory:{title:"Inventory",desc:"Control stock and supplies.",items:[
["Ingredients","Beans, milk, syrups and food."],["Packaging","Cups, lids, bags and tissue."],["Low Stock","Below reorder level."],["Stock In","Record incoming stock."],["Stock Out","Record usage and transfers."],["Waste / Spoilage","Log losses."],["Supplier Deliveries","Receive deliveries."]]},
promotions:{title:"Promotions",desc:"Manage store offers.",items:[
["Discounts","Store discounts."],["Vouchers","Voucher codes."],["Bundles","Drink and food bundles."],["Happy Hour","Time-based offers."],["Featured Drinks","Highlight selected items."],["Campaigns","Seasonal campaigns."]]},
customers:{title:"Customers",desc:"Customer and loyalty tools.",items:[
["Customer Directory","Search customer profiles."],["Order History","Repeat purchase history."],["Favorites","Favorite menu items."],["Loyalty / Stars","Rewards activity."],["Feedback","Ratings and service comments."],["Frequent Customers","Recurring customer view."]]},
business:{title:"Business",desc:"Management performance view.",items:[
["Sales Dashboard","Revenue and order trends."],["Payments","Cash, card and digital totals."],["Expenses","Operating expenses."],["Best Sellers","Top menu items."],["Product Performance","Performance by category."],["Reports","Daily, weekly and monthly."],["Staff Performance","Shift metrics."]]}
};
const panel=document.getElementById("panel"),title=document.getElementById("title"),desc=document.getElementById("desc"),grid=document.getElementById("grid");
function openModule(k){
 const m=data[k]; title.textContent=m.title; desc.textContent=m.desc; grid.innerHTML="";
 m.items.forEach(([a,b])=>{const btn=document.createElement("button");btn.className="card";btn.innerHTML="<b>"+a+"</b><span>"+b+"</span>";grid.appendChild(btn)});
 panel.classList.add("open");
}
document.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>openModule(b.dataset.key));
document.getElementById("close").onclick=()=>panel.classList.remove("open");
panel.onclick=e=>{if(e.target===panel)panel.classList.remove("open")};
document.getElementById("enter").onclick=()=>{
 const pin=document.getElementById("pin").value;
 if(pin!=="1234"){alert("Incorrect demo PIN");return}
 const name=(document.getElementById("name").value||"Staff").trim();
 document.getElementById("staffBadge").textContent=name+" • On Duty";
 document.getElementById("gate").style.display="none";
};
</script>
</body>
</html>
