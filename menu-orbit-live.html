<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06271d"><title>Starbucks Menu Orbit</title><style>:root{--c:#f7f2e8;--gold:#d8b66a;--deep:#06271d}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 50% 34%,#0b5b40 0,#06271d 36%,#020d09 100%);color:#fff}button{font:inherit}.top{height:72px;display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid rgba(216,182,106,.24);background:rgba(2,20,14,.86);backdrop-filter:blur(16px);position:relative;z-index:20}.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}.logo{width:48px;height:48px;flex:0 0 48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#00a862,#006241);border:2px solid #fff;box-shadow:0 0 0 4px rgba(216,182,106,.13);font:900 24px Georgia}.title{font-weight:900;font-size:18px;line-height:1}.sub{font-size:8px;color:#b9ccc2;letter-spacing:.11em;margin-top:5px;white-space:nowrap}.actions{margin-left:auto;display:flex;gap:7px;align-items:center}.pill{height:40px;padding:0 11px;border-radius:999px;border:1px solid rgba(216,182,106,.34);background:rgba(255,255,255,.055);color:#fff;font-weight:850;font-size:11px;line-height:1.05;white-space:nowrap}.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;border-radius:99px;background:var(--gold);color:#18281f;margin-left:4px;font-size:10px}.stage{position:absolute;inset:72px 0 0;touch-action:pan-y;overflow:hidden}.ring{position:absolute;left:50%;top:48%;width:min(84vw,680px);height:min(84vw,680px);border-radius:50%;transform:translate(-50%,-50%);border:1px solid rgba(216,182,106,.55);box-shadow:0 0 60px rgba(0,168,98,.14),inset 0 0 80px rgba(255,255,255,.025)}.ring:before,.ring:after{content:"";position:absolute;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.ring:before{width:72%;height:72%;border:1px dashed rgba(216,182,106,.25)}.ring:after{width:49%;height:49%;border:1px solid rgba(216,182,106,.15)}.hero{--s:clamp(190px,39vw,280px);position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:var(--s);height:var(--s);border-radius:50%;border:2px solid #fff;background:radial-gradient(circle at 35% 25%,#12a66b,#00754a 48%,#05452f 72%,#06271d);box-shadow:0 0 0 8px rgba(216,182,106,.10),0 0 55px rgba(0,168,98,.30),0 24px 60px rgba(0,0,0,.44);z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px 20px}.hero:after{content:"";position:absolute;inset:8%;border-radius:50%;border:1px dashed rgba(216,182,106,.40)}.emoji{font-size:clamp(42px,7vw,68px);line-height:1;position:relative;z-index:2}.hero h1{font:700 clamp(16px,2.6vw,24px) Georgia;margin:7px 0 3px;position:relative;z-index:2;max-width:90%;line-height:1.05}.hero p{margin:0;max-width:185px;font-size:10.5px;line-height:1.3;color:#e2eee8;position:relative;z-index:2}.price{margin-top:6px;color:#f0d18a;font-weight:900;font-size:13px;position:relative;z-index:2}.add{margin-top:9px;border:1px solid #fff3d5;border-radius:999px;background:var(--c);color:#073a28;min-height:38px;padding:0 15px;font-weight:900;font-size:12px;position:relative;z-index:2}.node{--n:clamp(78px,18vw,112px);position:absolute;left:50%;top:48%;width:var(--n);height:var(--n);border-radius:50%;transform:translate(-50%,-50%);border:2px solid rgba(216,182,106,.78);background:linear-gradient(160deg,#0d4935,#062a20);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 12px 28px rgba(0,0,0,.38);z-index:4;padding:7px;transition:transform .2s ease,background .2s ease,box-shadow .2s ease}.node span{font-size:clamp(25px,4.8vw,38px)}.node b{font-size:clamp(8px,1.9vw,11px);text-align:center;line-height:1.05}.node.active{background:linear-gradient(160deg,#0f6949,#07523a);box-shadow:0 0 24px rgba(216,182,106,.20),0 12px 28px rgba(0,0,0,.40)}.n0{transform:translate(-50%,-50%) translateY(-35vw)}.n1{transform:translate(-50%,-50%) translate(30vw,-18vw)}.n2{transform:translate(-50%,-50%) translate(30vw,18vw)}.n3{transform:translate(-50%,-50%) translateY(35vw)}.n4{transform:translate(-50%,-50%) translate(-30vw,18vw)}.n5{transform:translate(-50%,-50%) translate(-30vw,-18vw)}.hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;color:#c8d8d0;background:rgba(3,22,16,.72);border:1px solid rgba(216,182,106,.25);border-radius:999px;padding:8px 12px;z-index:8}.panel{position:fixed;inset:0;display:none;align-items:flex-end;background:rgba(0,0,0,.66);backdrop-filter:blur(8px);z-index:50}.panel.open{display:flex}.sheet{width:100%;height:88vh;background:#06271d;border-radius:25px 25px 0 0;overflow:hidden;border-top:1px solid rgba(216,182,106,.35)}.sheethead{height:58px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid rgba(216,182,106,.22);font-weight:900}.close{margin-left:auto;width:40px;height:40px;border-radius:50%;border:1px solid rgba(216,182,106,.3);background:rgba(255,255,255,.06);color:#fff;font-size:20px}.frame{width:100%;height:calc(88vh - 58px);border:0;background:#04140e}@media(max-width:520px){.top{height:66px;padding:7px 9px;gap:7px}.stage{inset:66px 0 0}.logo{width:42px;height:42px;flex-basis:42px;font-size:22px}.title{font-size:16px}.sub{display:none}.actions{gap:5px}.pill{height:36px;padding:0 9px;font-size:10px}.ring{top:47%;width:86vw;height:86vw}.hero{--s:clamp(178px,50vw,214px);top:47%;padding:18px 16px}.emoji{font-size:42px}.hero h1{font-size:19px;max-width:88%}.hero p{font-size:10px;max-width:160px}.price{font-size:13px}.add{min-height:36px;font-size:11px;padding:0 14px}.node{--n:clamp(74px,21vw,92px);top:47%}.node span{font-size:28px}.node b{font-size:8.5px}.n0{transform:translate(-50%,-50%) translateY(-38vw)}.n1{transform:translate(-50%,-50%) translate(33vw,-20vw)}.n2{transform:translate(-50%,-50%) translate(33vw,20vw)}.n3{transform:translate(-50%,-50%) translateY(38vw)}.n4{transform:translate(-50%,-50%) translate(-33vw,20vw)}.n5{transform:translate(-50%,-50%) translate(-33vw,-20vw)}.hint{bottom:10px;font-size:9px;padding:7px 10px;max-width:94vw;overflow:hidden;text-overflow:ellipsis}}@media(min-width:700px){.n0{transform:translate(-50%,-50%) translateY(-260px)}.n1{transform:translate(-50%,-50%) translate(225px,-132px)}.n2{transform:translate(-50%,-50%) translate(225px,132px)}.n3{transform:translate(-50%,-50%) translateY(260px)}.n4{transform:translate(-50%,-50%) translate(-225px,132px)}.n5{transform:translate(-50%,-50%) translate(-225px,-132px)}}@media(max-height:690px){.stage{transform:scale(.92);transform-origin:50% 44%}.hint{display:none}}</style></head><body><header class="top"><div class="brand"><div class="logo">S</div><div><div class="title">Menu Orbit</div><div class="sub">STARBUCKS PHILIPPINES • PROTOTYPE</div></div></div><div class="actions"><button class="pill" id="hub">Customer Hub</button><button class="pill">My Order <span class="badge" id="count">0</span></button></div></header><main class="stage" id="orbit"><div class="ring"></div><button class="node n0 active" data-k="espresso"><span>☕</span><b>ESPRESSO</b></button><button class="node n1" data-k="frappuccino"><span>🥤</span><b>FRAPPUCCINO®</b></button><button class="node n2" data-k="refreshers"><span>🍓</span><b>REFRESHERS®</b></button><button class="node n3" data-k="teavana"><span>🍵</span><b>TEAVANA™</b></button><button class="node n4" data-k="food"><span>🥐</span><b>FOOD</b></button><button class="node n5" data-k="featured"><span>★</span><b>FEATURED</b></button><section class="hero"><div class="emoji" id="e">☕</div><h1 id="t">Caramel Macchiato</h1><p id="d">Espresso, vanilla and steamed milk with caramel drizzle.</p><div class="price" id="p">₱180 – ₱205</div><button class="add" id="add">Add to Order +</button></section></main><div class="hint">Tap a category • Swipe left/right • Customer Hub keeps your previous orbit</div><div class="panel" id="panel"><div class="sheet"><div class="sheethead">Previous Orbit — Customer Hub<button class="close" id="x">×</button></div><iframe class="frame" id="f" title="Previous Menu Orbit"></iframe></div></div><script>const C={espresso:['☕','Caramel Macchiato','Espresso, vanilla and steamed milk with caramel drizzle.','₱180 – ₱205'],frappuccino:['🥤','Caramel Frappuccino®','Blended coffee, milk, ice and caramel with whipped cream.','₱185 – ₱215'],refreshers:['🍓','Strawberry Refresher','Bright fruit flavor served chilled over ice.','₱160 – ₱190'],teavana:['🍵','Green Tea Latte','Smooth green tea with milk, served hot or iced.','₱170 – ₱200'],food:['🥐','Butter Croissant','Flaky, buttery pastry for pairing with your favorite drink.','₱125'],featured:['★','Featured Seasonal Drink','A rotating seasonal highlight.','₱190 – ₱220']};let key='espresso',cart=0;const nodes=[...document.querySelectorAll('.node')];function select(k){key=k;nodes.forEach(n=>n.classList.toggle('active',n.dataset.k===k));const v=C[k];e.textContent=v[0];t.textContent=v[1];d.textContent=v[2];p.textContent=v[3]}nodes.forEach(n=>n.onclick=()=>select(n.dataset.k));add.onclick=()=>{cart++;count.textContent=cart;add.textContent='Added ✓';setTimeout(()=>add.textContent='Add to Order +',800)};hub.onclick=()=>{if(!f.src)f.src='./starbucks-menu-orbit/v89.html?legacy=1#orbit';panel.classList.add('open')};x.onclick=()=>panel.classList.remove('open');panel.onclick=a=>{if(a.target===panel)panel.classList.remove('open')};let sx=0;orbit.addEventListener('touchstart',a=>sx=a.touches[0].clientX,{passive:true});orbit.addEventListener('touchend',a=>{let dx=a.changedTouches[0].clientX-sx;if(Math.abs(dx)<45)return;let i=nodes.findIndex(n=>n.dataset.k===key);i=(i+(dx<0?1:-1)+nodes.length)%nodes.length;select(nodes[i].dataset.k)},{passive:true});</script></body></html>
