=d.getElementById('infoMeta');if(meta)meta.insertAdjacentElement('afterend',desc);let old='';function update(){const screen=d.querySelector('.screen.open'),visible=!!screen,home=d.querySelector('.home'),header=d.querySelector('header');if(home)home.style.visibility=visible?'hidden':'';if(header)header.style.visibility=visible?'hidden':'';if(screen&&screen.id==='info'){const name=d.getElementById('infoName')?.textContent||'',cat=d.getElementById('infoMeta')?.textContent||'',key=name+'|'+cat;if(key!==old){old=key;desc.textContent='Explore '+name+'. View the product photograph, category, availability, size options and demo price. Ingredients and actual offerings vary by store.'}}}new MutationObserver(update).observe(d.body,{attributes:true,attributeFilter:['class'],subtree:true});update();const add=d.getElementById('addCart'),cart=d.getElementById('cartBtn');if(add&&cart){add.addEventListener('click',()=>{if(!add.disabled){setTimeout(()=>{cart.click();},80)}})} }catch(e){console.error('Cart fix:',e)}});</script></body></html>
