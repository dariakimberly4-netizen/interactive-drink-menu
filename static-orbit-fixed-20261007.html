<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu Orbit — Photos and Product Details</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#021f18}iframe{display:block;border:0;width:100%;height:100%}</style></head><body><iframe id="app" title="Menu Orbit" src="./static-orbit-no-motion.html?photos=20261007c"></iframe><script>const frame=document.getElementById('app');frame.addEventListener('load',()=>{try{const d=frame.contentDocument;if(!d)return;const style=d.createElement('style');style.textContent=`.screen{background:#021f18!important;opacity:1!important;z-index:9999!important}.screen.open{display:block!important}#categories .panel{background:#063b2e!important;opacity:1!important;z-index:10!important}#categories .cat{background:#07503d!important;opacity:1!important}#categories .close{z-index:10001!important;top:18px!important;right:18px!important}body:has(.screen.open)>.home,body:has(.screen.open)>header{visibility:hidden!important}.node{background:#f6f2e8!important;isolation:isolate!important;border:3px solid #e0bd77!important;overflow:hidden!important}.node img{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;z-index:1!important}.node .fallback{color:#07503d!important;font-size:18px!important}.node .label,.node .soldTag{z-index:3!important}.node .label{font-size:9px!important;border-radius:9px!important;padding:5px 3px!important}.node:focus-visible{outline:3px solid white!important;outline-offset:3px!important}.productDescription{margin:14px 0;color:#e6f1eb;line-height:1.65;font-size:14px}.productDescription strong{color:#f0cf91}@media(max-width:760px){#categories{padding:78px 12px 20px!important}#categories .panel{padding:18px!important;width:100%!important}#categories .categoryGrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.node .label{font-size:7px!important}}@media(max-width:460px){#categories .categoryGrid{grid-template-columns:1fr!important}}`;d.head.append(style);function description(name,category){const n=name.toLowerCase(),c=(category||'').toLowerCase();if(n.includes('frappuccino'))return 'A blended Starbucks beverage from the '+category+' collection. Select a size and quantity to explore this demo item.';if(n.includes('espresso')||n.includes('latte')||n.includes('macchiato')||n.includes('cappuccino')||n.includes('mocha')||n.includes('flat white')||n.includes('americano'))return 'A Starbucks coffee selection in the '+category+' range. Open the product to view its photograph, size options, availability, and demo price.';if(n.includes('tea')||n.includes('matcha'))return 'A Starbucks tea selection from '+category+'. Review its photograph and available demo ordering options.';if(c.includes('bakery')||c.includes('sandwich')||c.includes('food')||c.includes('dessert'))return 'A Starbucks food selection from '+category+'. Explore this product’s photograph and demo ordering information.';return 'Explore '+name+' from the Starbucks '+category+' collection. Product photograph, availability, and demo ordering details are shown here.'}let desc=d.createElement('p');desc.className='productDescription';desc.id='orbitProductDescription';const meta=d.getElementById('infoMeta');if(meta)meta.insertAdjacentElement('afterend',desc);const observer=new MutationObserver(()=>{const open=d.querySelector('.screen.open');const overlay=!!open;const home=d.querySelector('.home'),header=d.querySelector('header');if(home)home.style.visibility=overlay?'hidden':'';if(header)header.style.visibility=overlay?'hidden':'';if(open&&open.id==='info'&&desc){const name=d.getElementById('infoName')?.textContent||'Product',category=d.getElementById('infoMeta')?.textContent?.split(' • ').pop()||'Menu';const key=name+'|'+category;if(desc.dataset.key!==key){desc.dataset.key=key;desc.textContent=description(name,category)}}});observer.observe(d.body,{attributes:true,attributeFilter:['class'],subtree:true});d.querySelectorAll('.group').forEach(b=>b.addEventListener('click',()=>{setTimeout(()=>{const x=d.getElementById('categoryGrid');if(x)x.setAttribute('aria-label','Select a menu category to see product photographs in the orbit')},20)}));}catch(e){console.warn('Menu orbit enhancement unavailable',e)}});</script></body></html>
