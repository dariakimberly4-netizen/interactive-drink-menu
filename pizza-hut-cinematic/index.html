<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pizza Interactive Experience</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}.nav{display:flex;justify-content:space-between;align-items:center;padding:16px 5vw;position:sticky;top:0;z-index:20;background:#090909e8;backdrop-filter:blur(10px)}.brand{font-size:20px;font-weight:900}.brand b{color:#e31837}.bag{background:#fff;color:#111;border:0;border-radius:999px;padding:12px 17px;font-weight:800}.hero{min-height:calc(100vh - 70px);display:grid;grid-template-columns:.8fr 1.2fr;align-items:center;padding:5vw;gap:2vw;background:radial-gradient(circle at 70% 50%,#451110,#160807 35%,#090909 70%)}.copy small{color:#ff536b;font-weight:900;letter-spacing:.18em}.copy h1{font-size:clamp(48px,7vw,105px);line-height:.88;letter-spacing:-.065em;margin:14px 0}.copy p{color:#ccc;font-size:18px;line-height:1.5;max-width:420px}.price{font-size:28px;font-weight:900;margin:20px 0}.viewer{min-width:0;text-align:center;touch-action:pan-y;user-select:none}.pizza-shell{position:relative;max-width:760px;margin:auto;display:grid;place-items:center;min-height:500px}.pizza{width:100%;max-height:680px;object-fit:contain;border-radius:24px;filter:drop-shadow(0 35px 35px #000b);transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .25s}.arrow{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border:1px solid #ffffff45;border-radius:50%;background:#111c;color:#fff;font-size:30px;z-index:5}.prev{left:5px}.next{right:5px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.actions button{min-height:50px;border:0;border-radius:999px;padding:14px 22px;font-weight:900;font-size:16px}.primary{background:#e31837;color:#fff}.secondary{background:#fff;color:#111}.hint{color:#aaa;font-size:12px;letter-spacing:.12em;margin-top:16px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,120px);background:#fff;color:#111;border-radius:999px;padding:14px 20px;font-weight:900;transition:.3s;z-index:50}.toast.show{transform:translate(-50%,0)}@media(max-width:760px){.hero{grid-template-columns:1fr;padding:20px 16px 42px}.viewer{order:-1}.pizza-shell{min-height:300px;width:100%}.pizza{width:100%;border-radius:18px}.copy{text-align:center}.copy h1{font-size:50px}.copy p{margin-inline:auto}.actions{justify-content:center}.actions button{flex:1;min-width:140px}.arrow{width:46px;height:46px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><nav class="nav"><div class="brand"><b>●</b> PIZZA • INTERACTIVE</div><button class="bag" id="bag">Bag · <span id="bagCount">0</span></button></nav><main class="hero"><section class="copy"><small>REAL PIZZA • INTERACTIVE HERO</small><h1>HOT.<br>FRESH.<br>READY.</h1><p>Your uploaded pizza artwork is now part of the website itself. Swipe or drag the hero, rotate it, and add your pizza to the bag.</p><div class="price">₱499</div><div class="actions"><button class="secondary" id="spin">Rotate Hero</button><button class="primary" id="add">Add to Bag</button></div><div class="hint">← SWIPE / DRAG →</div></section><section class="viewer" id="viewer" tabindex="0"><div class="pizza-shell"><button class="arrow prev" id="prev">‹</button><img class="pizza" id="pizza" src="../assets/005da217-0bff-40de-b567-f2445acdaabe.png" alt="Real pizza menu artwork"><button class="arrow next" id="next">›</button></div></section></main><div class="toast" id="toast">Added to bag 🍕</div><script>let bag=0,start=null,rot=0;const img=document.querySelector('#pizza'),viewer=document.querySelector('#viewer'),toast=document.querySelector('#toast');function nudge(dir){rot+=dir*8;img.style.opacity='.35';img.style.transform=`scale(.88) translateX(${dir*35}px) rotate(${rot}deg)`;setTimeout(()=>{img.style.opacity='1';img.style.transform=`scale(1) translateX(0) rotate(${rot}deg)`},180)}document.querySelector('#next').onclick=()=>nudge(1);document.querySelector('#prev').onclick=()=>nudge(-1);document.querySelector('#spin').onclick=()=>{rot+=360;img.style.transform=`scale(1.03) rotate(${rot}deg)`;setTimeout(()=>img.style.transform=`scale(1) rotate(${rot}deg)`,550)};document.querySelector('#add').onclick=()=>{bag++;document.querySelector('#bagCount').textContent=bag;toast.textContent='Pizza added 🍕';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400)};document.querySelector('#bag').onclick=()=>{toast.textContent=bag?`${bag} pizza${bag>1?'s':''} in your bag`:'Your bag is empty';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400)};viewer.addEventListener('pointerdown',e=>{start=e.clientX;viewer.setPointerCapture?.(e.pointerId)});viewer.addEventListener('pointerup',e=>{if(start===null)return;const dx=e.clientX-start;start=null;if(Math.abs(dx)>40)nudge(dx<0?1:-1)});viewer.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nudge(1);if(e.key==='ArrowLeft')nudge(-1)});</script></body></html>
