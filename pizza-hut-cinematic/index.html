<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pizza Hut Interactive Pizza</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}.nav{display:flex;justify-content:space-between;align-items:center;padding:16px 5vw;position:sticky;top:0;z-index:20;background:#090909e8;backdrop-filter:blur(10px)}.brand{font-size:20px;font-weight:900}.brand b{color:#e31837}.bag{background:#fff;color:#111;border:0;border-radius:999px;padding:12px 17px;font-weight:800}.hero{min-height:calc(100vh - 70px);display:grid;grid-template-columns:.8fr 1.2fr;align-items:center;padding:5vw;gap:2vw;background:radial-gradient(circle at 70% 50%,#451110,#160807 35%,#090909 70%)}.copy small{color:#ff536b;font-weight:900;letter-spacing:.18em}.copy h1{font-size:clamp(48px,7vw,105px);line-height:.88;letter-spacing:-.065em;margin:14px 0}.copy p{color:#ccc;font-size:18px;line-height:1.5;max-width:420px}.price{font-size:28px;font-weight:900;margin:20px 0}.viewer{min-width:0;text-align:center;touch-action:pan-y;user-select:none}.pizza-shell{position:relative;max-width:680px;margin:auto;aspect-ratio:1;display:grid;place-items:center}.pizza{width:88%;height:88%;object-fit:cover;border-radius:50%;filter:drop-shadow(0 40px 35px #000b);transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .25s}.arrow{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border:1px solid #ffffff45;border-radius:50%;background:#111c;color:#fff;font-size:30px;z-index:5}.prev{left:0}.next{right:0}.dots{display:flex;justify-content:center;gap:9px}.dot{width:9px;height:9px;border-radius:50%;background:#ffffff45}.dot.on{background:#e31837}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.actions button{min-height:50px;border:0;border-radius:999px;padding:14px 22px;font-weight:900;font-size:16px}.primary{background:#e31837;color:#fff}.secondary{background:#fff;color:#111}.hint{color:#aaa;font-size:12px;letter-spacing:.12em;margin-top:16px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,120px);background:#fff;color:#111;border-radius:999px;padding:14px 20px;font-weight:900;transition:.3s;z-index:50}.toast.show{transform:translate(-50%,0)}@media(max-width:760px){.hero{grid-template-columns:1fr;padding:25px 18px 45px}.copy{text-align:center}.copy h1{font-size:52px}.copy p{margin-inline:auto}.price{text-align:center}.viewer{order:-1}.pizza-shell{width:100%;max-width:430px}.pizza{width:82%;height:82%}.actions{justify-content:center}.actions button{flex:1;min-width:145px}.arrow{width:48px;height:48px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><nav class="nav"><div class="brand"><b>●</b> PIZZA HUT • INTERACTIVE</div><button class="bag" id="bag">Bag · <span id="bagCount">0</span></button></nav><main class="hero"><section class="copy"><small>REAL PIZZA • SWIPE TO EXPLORE</small><h1 id="name">PEPPERONI<br>FEAST.</h1><p id="desc">A hot, cheesy pepperoni pizza with a golden baked crust. Drag or swipe to discover the next pizza.</p><div class="price" id="price">₱499</div><div class="actions"><button class="secondary" id="spin">Rotate Pizza</button><button class="primary" id="add">Add to Bag</button></div><div class="hint">← SWIPE / DRAG PIZZA →</div></section><section class="viewer" id="viewer" tabindex="0" aria-label="Swipe or use arrow keys to browse pizzas"><div class="pizza-shell"><button class="arrow prev" id="prev" aria-label="Previous pizza">‹</button><img class="pizza" id="pizza" alt="Real pepperoni pizza" src="https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=1000&q=88"><button class="arrow next" id="next" aria-label="Next pizza">›</button></div><div class="dots" id="dots"></div></section></main><div class="toast" id="toast">Added to bag 🍕</div><script>const pizzas=[{n:'PEPPERONI<br>FEAST.',d:'A hot, cheesy pepperoni pizza with a golden baked crust. Drag or swipe to discover the next pizza.',p:'₱499',img:'https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=1000&q=88'},{n:'CHEESE<br>SUPREME.',d:'Golden crust covered in rich tomato sauce and bubbling melted cheese.',p:'₱459',img:'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=1000&q=88'},{n:'VEGGIE<br>SUPREME.',d:'A colorful pizza layered with vegetables, cheese and a crisp baked crust.',p:'₱469',img:'https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=1000&q=88'},{n:'MEAT<br>LOVERS.',d:'A hearty, oven-baked pizza piled with savory meat toppings and melted cheese.',p:'₱529',img:'https://images.unsplash.com/photo-1593560708920-61dd98c46a4e?auto=format&fit=crop&w=1000&q=88'},{n:'HAWAIIAN<br>SUPREME.',d:'Sweet and savory toppings over melted cheese and a golden crust.',p:'₱479',img:'https://images.unsplash.com/photo-1594007654729-407eedc4be65?auto=format&fit=crop&w=1000&q=88'}];let i=0,bag=0,start=null,rot=0;const img=document.querySelector('#pizza'),nameEl=document.querySelector('#name'),desc=document.querySelector('#desc'),price=document.querySelector('#price'),dots=document.querySelector('#dots'),viewer=document.querySelector('#viewer'),toast=document.querySelector('#toast');pizzas.forEach((_,x)=>{let d=document.createElement('i');d.className='dot'+(x===0?' on':'');dots.appendChild(d)});function render(dir=1){const p=pizzas[i];img.style.opacity=.15;img.style.transform=`scale(.72) rotate(${rot+dir*35}deg)`;setTimeout(()=>{img.src=p.img;img.alt='Real pizza: '+p.n.replace('<br>',' ');nameEl.innerHTML=p.n;desc.textContent=p.d;price.textContent=p.p;rot+=dir*28;img.style.opacity=1;img.style.transform=`scale(1) rotate(${rot}deg)`;[...dots.children].forEach((d,x)=>d.classList.toggle('on',x===i))},180)}function move(n){i=(i+n+pizzas.length)%pizzas.length;render(n)}document.querySelector('#next').onclick=()=>move(1);document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#spin').onclick=()=>{rot+=360;img.style.transform=`scale(1.04) rotate(${rot}deg)`;setTimeout(()=>img.style.transform=`scale(1) rotate(${rot}deg)`,500)};document.querySelector('#add').onclick=()=>{bag++;document.querySelector('#bagCount').textContent=bag;toast.textContent=pizzas[i].n.replace('<br>',' ')+' added 🍕';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400)};document.querySelector('#bag').onclick=()=>{toast.textContent=bag?`${bag} pizza${bag>1?'s':''} in your bag`:'Your bag is empty';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400)};viewer.addEventListener('pointerdown',e=>{start=e.clientX;viewer.setPointerCapture?.(e.pointerId)});viewer.addEventListener('pointerup',e=>{if(start===null)return;let dx=e.clientX-start;start=null;if(Math.abs(dx)>45)move(dx<0?1:-1)});viewer.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});</script></body></html>
