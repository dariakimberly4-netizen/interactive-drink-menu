<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Moving Pizza Cinematic</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}body{overflow-x:hidden}.nav{position:fixed;z-index:50;top:0;left:0;right:0;padding:16px 5vw;display:flex;justify-content:space-between;background:linear-gradient(#050505e8,transparent)}.brand{font-weight:900;letter-spacing:.08em}.brand b{color:#ed1c2e}.bag{border:1px solid #ffffff44;background:#111c;color:white;border-radius:999px;padding:11px 16px;font-weight:900}.story{height:430vh}.scene{height:100vh;position:sticky;top:0;overflow:hidden;perspective:1100px;background:radial-gradient(circle at 67% 54%,#671610 0,#260908 29%,#080505 61%,#020202 85%)}.copy{position:absolute;z-index:15;left:5vw;top:18vh;width:min(450px,88vw)}.eyebrow{color:#ff5267;font-size:12px;font-weight:900;letter-spacing:.2em}.copy h1{font-size:clamp(55px,8vw,115px);line-height:.82;letter-spacing:-.07em;margin:14px 0}.copy p{color:#ccc;font-size:18px;line-height:1.5}.pizzaStage{position:absolute;z-index:5;left:63%;top:54%;width:min(72vw,900px);height:78vh;transform:translate(-50%,-50%);transform-style:preserve-3d;will-change:transform}.pizzaMover{width:100%;height:100%;display:grid;place-items:center;transform-style:preserve-3d;animation:obviousMove 4.2s ease-in-out infinite alternate;will-change:transform}.pizza{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 50px 45px #000e) saturate(1.18);animation:pizzaPulse 2.1s ease-in-out infinite alternate;will-change:transform}.shadow{position:absolute;z-index:2;left:64%;top:82%;width:42vw;height:8vh;background:#000c;border-radius:50%;filter:blur(22px);animation:shadowMove 4.2s ease-in-out infinite alternate}.ring{position:absolute;z-index:1;left:63%;top:54%;width:48vw;height:48vw;max-width:680px;max-height:680px;border:1px solid #ff49352d;border-radius:50%;transform:translate(-50%,-50%);animation:ringPulse 2.6s ease-in-out infinite alternate}.actions{position:absolute;z-index:20;right:5vw;bottom:7vh;display:flex;gap:12px}.actions button{min-height:52px;border:0;border-radius:999px;padding:15px 23px;font-size:16px;font-weight:900}.custom{background:white}.add{background:#ed1c2e;color:white}.hint{position:absolute;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);font-size:11px;color:#aaa;letter-spacing:.14em;white-space:nowrap}.toast{position:fixed;z-index:80;left:50%;bottom:24px;transform:translate(-50%,100px);background:white;color:#111;padding:14px 20px;border-radius:999px;font-weight:900;transition:.3s}.toast.show{transform:translate(-50%,0)}@keyframes obviousMove{0%{transform:translate3d(-42px,-26px,0) rotateZ(-7deg) rotateX(5deg) rotateY(-9deg)}50%{transform:translate3d(18px,30px,50px) rotateZ(5deg) rotateX(-5deg) rotateY(8deg)}100%{transform:translate3d(55px,-18px,0) rotateZ(12deg) rotateX(8deg) rotateY(-4deg)}}@keyframes pizzaPulse{0%{transform:scale(.9)}100%{transform:scale(1.08)}}@keyframes shadowMove{0%{transform:translateX(-50%) scale(.75);opacity:.45}100%{transform:translateX(-50%) scale(1.12);opacity:.8}}@keyframes ringPulse{0%{transform:translate(-50%,-50%) scale(.82);opacity:.3}100%{transform:translate(-50%,-50%) scale(1.15);opacity:1}}@media(max-width:760px){.nav{padding:14px 16px}.brand{font-size:12px}.story{height:380vh}.copy{left:18px;top:10vh}.copy h1{font-size:53px}.copy p{font-size:15px;width:78vw}.pizzaStage{left:52%;top:64%;width:138vw;height:56vh}.shadow{left:52%;top:86%;width:70vw}.ring{left:52%;top:65%;width:92vw;height:92vw}.actions{left:15px;right:15px;bottom:6vh}.actions button{flex:1}.hint{bottom:10px;font-size:9px}} </style></head><body><nav class="nav"><div class="brand"><b>●</b> MOVING PIZZA</div><button class="bag" id="bag">BAG · <span id="count">0</span></button></nav><main class="story" id="story"><section class="scene"><div class="ring"></div><div class="shadow"></div><div class="copy"><div class="eyebrow" id="eye">LIVE CINEMATIC PRODUCT</div><h1 id="title">WATCH<br>IT MOVE.</h1><p id="desc">No scrolling needed. The pizza continuously floats, turns, tilts and moves toward the camera.</p></div><div class="pizzaStage" id="stage"><div class="pizzaMover"><img class="pizza" src="../assets/005da217-0bff-40de-b567-f2445acdaabe.png" alt="Continuously moving pizza"></div></div><div class="actions"><button class="custom" id="custom">CUSTOMIZE</button><button class="add" id="add">ADD TO BAG</button></div><div class="hint">PIZZA MOVES AUTOMATICALLY • SCROLL FOR CAMERA MOTION</div></section></main><div class="toast" id="toast">Added 🍕</div><script>const story=document.querySelector('#story'),stage=document.querySelector('#stage'),title=document.querySelector('#title'),desc=document.querySelector('#desc');let bag=0;function camera(){const r=story.getBoundingClientRect(),max=story.offsetHeight-innerHeight,p=Math.max(0,Math.min(1,-r.top/max));let s=1+p*.5,x=Math.sin(p*Math.PI*2)*10,y=-p*5,rz=p*115,rx=Math.sin(p*Math.PI)*24,ry=Math.sin(p*Math.PI*2)*18;stage.style.transform=`translate(-50%,-50%) translate(${x}vw,${y}vh) scale(${s}) rotateZ(${rz}deg) rotateX(${rx}deg) rotateY(${ry}deg)`;if(p>.68){title.innerHTML='YOUR<br>PIZZA.';desc.textContent='Customize it or add it to your bag while the pizza keeps moving.'}else if(p>.34){title.innerHTML='TURN<br>UP THE<br>HEAT.';desc.textContent='Scroll controls the camera. Automatic motion continues inside the shot.'}else{title.innerHTML='WATCH<br>IT MOVE.';desc.textContent='No scrolling needed. The pizza continuously floats, turns, tilts and moves toward the camera.'}}addEventListener('scroll',camera,{passive:true});camera();const toast=document.querySelector('#toast');document.querySelector('#add').onclick=()=>{bag++;document.querySelector('#count').textContent=bag;toast.textContent='Pizza added 🍕';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)};document.querySelector('#bag').onclick=()=>{toast.textContent=bag?bag+' pizza in your bag':'Your bag is empty';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)};document.querySelector('#custom').onclick=()=>{toast.textContent='Customize: size • crust • toppings';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)};</script></body></html>
