<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mayor Decision Room — Public Request Portal</title>
<style>
:root{--bg:#06111e;--panel:#0b1a2b;--panel2:#10243a;--line:#2b4964;--text:#f7fbff;--muted:#9eb2c7;--gold:#f1c76d;--green:#49d79d;--red:#ff6f79;--yellow:#ffd166;--blue:#64b5ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top,#0b2036 0,#06111e 44%,#040b13 100%);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}.hidden{display:none!important}
.top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(5,15,26,.96);position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:10px}.seal{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-weight:900}.brand h1{font-size:17px;margin:0}.brand small{color:var(--muted)}
.btn{min-height:50px;padding:11px 15px;border-radius:13px;border:1px solid var(--line);background:#102238;color:#fff;font-weight:850}.btn.primary{background:linear-gradient(135deg,#1f6f5b,#2b8d72);border-color:#3b9f84}.btn.gold{background:#3b311b;border-color:#7d6531;color:#ffe9a8}.btn.danger{background:#421f28;border-color:#79404c}.btn:disabled{opacity:.42;cursor:not-allowed}
.orbit-page{min-height:calc(100vh - 68px);display:flex;flex-direction:column}.orbit-head{text-align:center;padding:13px 8px 1px}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:.18em;font-weight:900}.orbit-head h2{margin:6px 0 3px;font-size:25px}.orbit-head p{margin:0;color:var(--muted);font-size:12px}
.orbit-stage{position:relative;width:min(96vw,730px);aspect-ratio:1/1;margin:4px auto 18px}.ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid #294966;border-radius:50%;pointer-events:none}.r1{width:46%;height:46%}.r2{width:68%;height:68%}.r3{width:90%;height:90%}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:35%;height:35%;min-width:134px;min-height:134px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 35% 30%,#1a405f,#0b1b2c 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;z-index:3;box-shadow:0 0 0 8px rgba(241,199,109,.03),0 0 40px rgba(241,199,109,.1)}
.core small{color:var(--gold);font-size:8px;letter-spacing:.12em}.core strong{font-size:clamp(15px,2.8vw,23px);line-height:1.05;margin:5px 0}.core span{font-size:9px;color:var(--muted);line-height:1.35}
.node{position:absolute;width:27%;max-width:178px;min-height:88px;border:1px solid #385b78;border-radius:16px;background:linear-gradient(180deg,#12304d,#0a1a2b);color:#fff;padding:10px;text-align:left;font-weight:900;z-index:5;box-shadow:0 12px 26px rgba(0,0,0,.25)}.node small{display:block;color:var(--muted);font-size:8px;font-weight:600;margin-top:5px}
.n1{left:50%;top:0;transform:translateX(-50%)}.n2{right:3%;top:24%}.n3{right:6%;bottom:18%}.n4{left:50%;bottom:0;transform:translateX(-50%)}.n5{left:6%;bottom:18%}.n6{left:3%;top:24%}
.workspace{min-height:calc(100vh - 68px);padding:12px}.workspace-inner{max-width:1040px;margin:auto}.workspace-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;position:sticky;top:76px;z-index:20;background:linear-gradient(180deg,#06111e 76%,transparent);padding-bottom:10px}.workspace-head h2{margin:0;font-size:24px}.back{border-color:var(--gold);color:#ffe9a8;white-space:nowrap}
.panel{background:rgba(10,25,42,.97);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px}.panel h3{margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px;margin:9px 0}.field label{font-size:12px;color:#b5c8da}.field input,.field select,.field textarea{min-height:48px;background:#071522;border:1px solid var(--line);color:#fff;border-radius:12px;padding:11px}.field textarea{min-height:120px}.full{grid-column:1/-1}.help{font-size:11px;color:var(--muted);line-height:1.5}
.upload{border:2px dashed #4c6b85;border-radius:16px;padding:18px;background:#071725}.upload.attached{border-color:var(--green);background:#09251f}.upload h3{margin:0 0 6px}.filemeta{margin-top:10px;padding:10px;border-radius:12px;background:#0b2034;font-size:12px;line-height:1.6}.success{color:#baf4d9}
.stepbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.step{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:11px}.step.active{border-color:var(--gold);color:#ffe9a8;background:#302818}
.review{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.kv{background:#0a1725;border:1px solid #27445e;border-radius:12px;padding:11px}.kv b{display:block;font-size:10px;color:#91a9be;margin-bottom:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions .btn{flex:1;min-width:160px}
.receipt{max-width:720px;margin:auto}.big-track{font-size:clamp(24px,7vw,40px);font-weight:950;color:var(--gold);letter-spacing:.03em;overflow-wrap:anywhere}.pin{font-size:22px;font-weight:900;color:#baf4d9}
.card{background:#081726;border:1px solid #27445e;border-radius:15px;padding:14px}.card h3{margin:5px 0}.meta{font-size:12px;line-height:1.7;color:var(--muted)}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#173d5e;color:#c8e5ff}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px}.doc{background:#0a1725;border:1px solid #284761;border-radius:12px;padding:12px}.doc b{display:block;margin-bottom:5px}
.notice{border-left:3px solid var(--gold);padding:11px 12px;background:#091725;border-radius:0 12px 12px 0;margin-bottom:9px}.notice.red{border-left-color:var(--red)}.notice.green{border-left-color:var(--green)}
.checkbox{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:#081725}.checkbox input{width:22px;height:22px;flex:0 0 auto}
.toast{position:fixed;right:14px;bottom:14px;background:#10243a;border:1px solid #3a5974;border-radius:12px;padding:12px 15px;display:none;z-index:99;max-width:88vw}.toast.show{display:block}
@media(max-width:760px){.brand small{display:none}.workspace{padding:8px}.workspace-head{top:72px;align-items:flex-start;flex-direction:column}.back{width:100%}.grid,.review{grid-template-columns:1fr}.full{grid-column:auto}.orbit-stage{width:98vw}.node{width:29%;min-height:76px;padding:7px;font-size:9px}.node small{font-size:7px}.core{min-width:116px;min-height:116px;padding:9px}.core strong{font-size:14px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
@media print{.top,.workspace-head,.actions,.btn,.stepbar{display:none!important}body{background:#fff;color:#000}.panel{border:1px solid #aaa;background:#fff;color:#000}.meta,.help{color:#333}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="seal">M</div><div><h1>Mayor Decision Room</h1><small>Public Request Portal</small></div></div><button class="btn" onclick="showOrbit()">Public Orbit</button></header>

<main id="orbitPage" class="orbit-page">
  <div class="orbit-head"><div class="eyebrow">PUBLIC REQUEST ORBIT</div><h2>Public Request Command Center</h2><p>Tap a module to continue.</p></div>
  <div class="orbit-stage">
    <div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div>
    <button class="node n1" onclick="openModule('submit','SUBMIT A REQUEST')">SUBMIT A REQUEST<small>Form → soft copy → review</small></button>
    <button class="node n2" onclick="openModule('track','TRACK MY REQUEST')">TRACK MY REQUEST<small>Tracking + PIN verification</small></button>
    <button class="node n3" onclick="openModule('upload','UPLOAD DOCUMENTS')">UPLOAD DOCUMENTS<small>Add requirements only</small></button>
    <button class="node n4" onclick="openModule('my','MY REQUESTS')">MY REQUESTS<small>Requests on this device</small></button>
    <button class="node n5" onclick="openModule('help','REQUIREMENTS / HELP')">REQUIREMENTS / HELP<small>Files, statuses, process</small></button>
    <button class="node n6" onclick="openModule('receipt','REQUEST RECEIPT')">REQUEST RECEIPT<small>View / print latest receipt</small></button>
    <div class="core"><small>MAYOR DECISION ROOM</small><strong>PUBLIC REQUEST COMMAND CENTER</strong><span>Public Request Portal<br>TAP A MODULE</span></div>
  </div>
</main>

<main id="workspace" class="workspace hidden"><div class="workspace-inner">
  <div class="workspace-head"><h2 id="workspaceTitle"></h2><button class="btn back" onclick="showOrbit()">← BACK TO PUBLIC ORBIT</button></div>
  <div id="workspaceBody"></div>
</div></main>

<div id="toast" class="toast"></div>

<script>
const KEY='mdr_public_requests_v1', LAST='mdr_last_request_v1';
let draft={}, originalFile=null, supportingFiles=[];
function qs(id){return document.getElementById(id)}
function toast(m){const t=qs('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),2600)}
function showOrbit(){qs('workspace').classList.add('hidden');qs('orbitPage').classList.remove('hidden');window.scrollTo(0,0)}
function openWorkspace(title,html){qs('orbitPage').classList.add('hidden');qs('workspace').classList.remove('hidden');qs('workspaceTitle').textContent=title;qs('workspaceBody').innerHTML=html;window.scrollTo(0,0)}
function openModule(k,title){if(k==='submit')return renderForm();if(k==='track')return renderTrack();if(k==='upload')return renderUploadDocs();if(k==='my')return renderMyRequests();if(k==='help')return renderHelp();if(k==='receipt')return renderReceipt();}
function getRequests(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function saveRequests(a){localStorage.setItem(KEY,JSON.stringify(a))}
function todayISO(){return new Date().toISOString().slice(0,10)}
function nowLabel(){return new Date().toLocaleString()}
function makeTracking(){const y=new Date().getFullYear();const n=Math.floor(100000+Math.random()*899999);return 'MDR-'+y+'-'+String(n)}
function makePin(){return String(Math.floor(100000+Math.random()*900000))}
function formatSize(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB'}
function extOK(file){return /\.(pdf|doc|docx|jpg|jpeg|png)$/i.test(file.name)}
function renderForm(){
 originalFile=null;supportingFiles=[];draft={date:todayISO()};
 openWorkspace('SUBMIT A REQUEST',`
 <div class="stepbar"><span class="step active">1 Request Details</span><span class="step">2 Upload Soft Copy</span><span class="step">3 Review</span><span class="step">4 Submit</span></div>
 <div class="panel"><h3>Request Details</h3><div class="grid">
 <div class="field"><label>Full Name / Requester Name *</label><input id="f_name"></div>
 <div class="field"><label>Organization / Barangay / Office</label><input id="f_org"></div>
 <div class="field"><label>Contact Number *</label><input id="f_contact" inputmode="tel"></div>
 <div class="field"><label>Email Address *</label><input id="f_email" type="email"></div>
 <div class="field full"><label>Address *</label><input id="f_address"></div>
 <div class="field"><label>Request Type *</label><select id="f_type"><option value="">Select</option><option>Assistance</option><option>Infrastructure</option><option>Permit / Approval</option><option>Procurement</option><option>Complaint / Concern</option><option>Endorsement</option><option>Event Request</option><option>Senior Citizen Concern</option><option>Emergency / Urgent Concern</option><option>Other</option></select></div>
 <div class="field"><label>Department Concerned *</label><select id="f_dept"><option value="">Select</option><option>City Engineering Office</option><option>OSCA</option><option>CDRRMO</option><option>General Services Office</option><option>Public Safety Office</option><option>Traffic Management Office</option><option>Other / To Be Routed</option></select></div>
 <div class="field full"><label>Subject *</label><input id="f_subject"></div>
 <div class="field full"><label>Description / Purpose *</label><textarea id="f_desc"></textarea></div>
 <div class="field"><label>Date Submitted</label><input id="f_date" type="date" value="${todayISO()}" disabled></div>
 <div class="field"><label>Preferred Contact Method *</label><select id="f_pref"><option value="">Select</option><option>SMS</option><option>Email</option><option>Phone Call</option></select></div>
 <div class="field full"><label>Additional Notes</label><textarea id="f_notes"></textarea></div>
 </div></div>
 <div id="origBox" class="panel upload"><h3>UPLOAD SOFT COPY OF REQUEST — REQUIRED</h3><div class="help">Official original request letter/document. Accepted: PDF, DOC, DOCX, JPG, JPEG, PNG.</div><div class="actions"><label class="btn gold" for="origFile">CHOOSE SOFT COPY</label><input id="origFile" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" class="hidden" onchange="pickOriginal(this)"></div><div id="origMeta"></div></div>
 <div class="panel upload"><h3>ADDITIONAL SUPPORTING DOCUMENTS — OPTIONAL</h3><div class="help">Photos, certifications, IDs, cost estimates, endorsements, supporting letters, previous correspondence, technical documents.</div><div class="actions"><label class="btn" for="supportFiles">ADD SUPPORTING FILES</label><input id="supportFiles" type="file" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" class="hidden" onchange="pickSupporting(this)"></div><div id="supportMeta"></div></div>
 <div class="actions"><button class="btn primary" onclick="reviewRequest()">REVIEW REQUEST</button></div>`);
}
function collectDraft(){draft={name:qs('f_name').value.trim(),org:qs('f_org').value.trim(),contact:qs('f_contact').value.trim(),email:qs('f_email').value.trim(),address:qs('f_address').value.trim(),type:qs('f_type').value,dept:qs('f_dept').value,subject:qs('f_subject').value.trim(),desc:qs('f_desc').value.trim(),date:todayISO(),pref:qs('f_pref').value,notes:qs('f_notes').value.trim()}}
function pickOriginal(inp){const f=inp.files&&inp.files[0];if(!f)return;if(!extOK(f)){inp.value='';originalFile=null;return toast('Unsupported file type. Use PDF, DOC/DOCX, JPG/JPEG, or PNG.')}originalFile=f;qs('origBox').classList.add('attached');qs('origMeta').innerHTML='<div class="filemeta success">✓ SOFT COPY ATTACHED<br><b>'+escapeHtml(f.name)+'</b><br>Type: '+escapeHtml(f.type||'Unknown')+'<br>Size: '+formatSize(f.size)+'<div class="actions"><label class="btn" for="origFile">REPLACE FILE</label><button class="btn danger" onclick="removeOriginal()">REMOVE FILE</button></div></div>'}
function removeOriginal(){originalFile=null;const i=qs('origFile');if(i)i.value='';qs('origBox').classList.remove('attached');qs('origMeta').innerHTML=''}
function pickSupporting(inp){const a=[...(inp.files||[])].filter(extOK);supportingFiles=a;qs('supportMeta').innerHTML=a.length?'<div class="filemeta">'+a.map(f=>'• '+escapeHtml(f.name)+' — '+formatSize(f.size)).join('<br>')+'</div>':''}
function requiredOK(){return draft.name&&draft.contact&&draft.email&&draft.address&&draft.type&&draft.dept&&draft.subject&&draft.desc&&draft.pref}
function reviewRequest(){collectDraft();if(!requiredOK())return toast('Please complete all required fields.');if(!originalFile)return toast('Soft copy of request is required before submission.');openWorkspace('REVIEW REQUEST',`
<div class="stepbar"><span class="step">1 Request Details</span><span class="step">2 Upload Soft Copy</span><span class="step active">3 Review</span><span class="step">4 Submit</span></div>
<div class="panel"><div class="review">
${[['Requester',draft.name],['Contact Details',draft.contact+' / '+draft.email],['Request Type',draft.type],['Department Concerned',draft.dept],['Subject',draft.subject],['Description',draft.desc],['Original Soft Copy',originalFile.name],['Supporting Documents',supportingFiles.length?supportingFiles.map(f=>f.name).join(', '):'None']].map(x=>'<div class="kv"><b>'+x[0]+'</b>'+escapeHtml(x[1])+'</div>').join('')}
</div></div>
<div class="panel"><label class="checkbox"><input id="confirmBox" type="checkbox" onchange="qs('finalSubmit').disabled=!this.checked"><span>I confirm that the information and documents I submitted are correct.</span></label>
<div class="actions"><button class="btn" onclick="editDraft()">EDIT REQUEST</button><button id="finalSubmit" class="btn primary" disabled onclick="submitRequest()">SUBMIT REQUEST</button></div></div>`)}
function editDraft(){renderForm();setTimeout(()=>{const m={f_name:'name',f_org:'org',f_contact:'contact',f_email:'email',f_address:'address',f_type:'type',f_dept:'dept',f_subject:'subject',f_desc:'desc',f_pref:'pref',f_notes:'notes'};Object.entries(m).forEach(([id,k])=>{if(qs(id))qs(id).value=draft[k]||''});if(originalFile){qs('origBox').classList.add('attached');qs('origMeta').innerHTML='<div class="filemeta success">✓ SOFT COPY ATTACHED<br><b>'+escapeHtml(originalFile.name)+'</b><br>Type: '+escapeHtml(originalFile.type||'Unknown')+'<br>Size: '+formatSize(originalFile.size)+'</div>'}},0)}
async function submitRequest(){if(!originalFile)return toast('Soft copy of request is required before submission.');const tracking=makeTracking(),pin=makePin(),created=nowLabel();const rec={tracking,pin,requester:draft.name,org:draft.org,contact:draft.contact,email:draft.email,address:draft.address,type:draft.type,dept:draft.dept,subject:draft.subject,description:draft.desc,preferred:draft.pref,notes:draft.notes,dateSubmitted:created,receivedStatus:'Newly Received',mayorStatus:'Not Yet Submitted',currentOffice:'Records / Receiving Office',requiredAction:'Completeness Review',publicStatus:'Request Submitted',lastUpdated:created,nextStep:'Records Office Completeness Review',targetDate:'To be assigned',additionalRequirement:'None',source:'Online Public Portal',original:{name:originalFile.name,type:originalFile.type,size:originalFile.size},supporting:supportingFiles.map(f=>({name:f.name,type:f.type,size:f.size})),audit:[{when:created,action:'Request submitted through Public Request Portal'}],extraDocs:[]};const a=getRequests();a.unshift(rec);saveRequests(a);localStorage.setItem(LAST,tracking);await saveFileBlob(tracking,'original',originalFile);for(let i=0;i<supportingFiles.length;i++)await saveFileBlob(tracking,'support-'+i,supportingFiles[i]);renderSuccess(rec)}
function renderSuccess(r){openWorkspace('REQUEST SUCCESSFULLY SUBMITTED',`<div class="receipt"><div class="panel"><div class="eyebrow">REQUEST SUCCESSFULLY SUBMITTED</div><div class="big-track">${r.tracking}</div><p class="meta">Keep your tracking number and Client PIN private.</p><div class="notice green"><b>Client PIN</b><div class="pin">${r.pin}</div><span class="help">Required together with your tracking number.</span></div><div class="review">${[['Date Submitted',r.dateSubmitted],['Request Type',r.type],['Department Concerned',r.dept],['Current Status','Newly Received'],['Mayor Approval Status','Not Yet Submitted'],['Next Step','Records Office Completeness Review']].map(x=>'<div class="kv"><b>'+x[0]+'</b>'+escapeHtml(x[1])+'</div>').join('')}</div><div class="actions"><button class="btn primary" onclick="renderTrack(\''+r.tracking+'\',\''+r.pin+'\')">TRACK THIS REQUEST</button><button class="btn gold" onclick="window.print()">SAVE / PRINT RECEIPT</button></div></div></div>`)}
function renderTrack(prefTrack='',prefPin=''){openWorkspace('TRACK MY REQUEST',`<div class="panel"><div class="notice"><b>Verification required</b><div class="help">Tracking number alone is not enough. Enter the Client PIN issued when the request was submitted.</div></div><div class="field"><label>Tracking Number</label><input id="t_track" value="${escapeHtml(prefTrack)}" placeholder="MDR-2026-001245"></div><div class="field"><label>Client PIN / OTP</label><input id="t_pin" value="${escapeHtml(prefPin)}" inputmode="numeric"></div><button class="btn primary" onclick="doTrack()">VERIFY & TRACK</button><div id="trackResult" style="margin-top:12px"></div></div>`)}
function doTrack(){const t=qs('t_track').value.trim(),p=qs('t_pin').value.trim();const r=getRequests().find(x=>x.tracking===t&&x.pin===p);if(!r)return qs('trackResult').innerHTML='<div class="notice red"><b>Unable to verify request.</b><div class="help">Check the tracking number and Client PIN.</div></div>';qs('trackResult').innerHTML='<div class="panel"><div class="big-track" style="font-size:24px">'+escapeHtml(r.tracking)+'</div><div class="review">'+[['Subject',r.subject],['Department',r.dept],['Date Submitted',r.dateSubmitted],['Current Public Status',r.publicStatus],['Last Updated',r.lastUpdated],['Next Step',r.nextStep],['Target Date',r.targetDate],['Additional Requirement Needed',r.additionalRequirement]].map(x=>'<div class="kv"><b>'+x[0]+'</b>'+escapeHtml(x[1])+'</div>').join('')+'</div></div>'}
function renderUploadDocs(){openWorkspace('UPLOAD DOCUMENTS',`<div class="panel"><div class="notice"><b>Original request is preserved.</b><div class="help">This module only adds missing requirements, corrections, or supporting documents. It never replaces the Original Request.</div></div><div class="field"><label>Tracking Number *</label><input id="u_track"></div><div class="field"><label>Client PIN / OTP *</label><input id="u_pin" inputmode="numeric"></div><div class="field"><label>Document Type *</label><select id="u_type"><option value="">Select</option><option>Missing Requirement</option><option>Supporting Document</option><option>Requested Correction</option><option>Replacement Supporting Document</option></select></div><div class="field"><label>File Upload *</label><input id="u_file" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"></div><div class="field"><label>Remarks</label><textarea id="u_remarks"></textarea></div><button class="btn primary" onclick="addDocument()">UPLOAD DOCUMENT</button></div>`)}
async function addDocument(){const t=qs('u_track').value.trim(),p=qs('u_pin').value.trim(),type=qs('u_type').value,f=qs('u_file').files&&qs('u_file').files[0],remarks=qs('u_remarks').value.trim();let a=getRequests(),i=a.findIndex(x=>x.tracking===t&&x.pin===p);if(i<0)return toast('Tracking number / PIN could not be verified.');if(!type||!f)return toast('Document type and file are required.');if(!extOK(f))return toast('Unsupported file type.');const id='extra-'+Date.now();a[i].extraDocs.push({id,type,name:f.name,size:f.size,remarks,uploaded:nowLabel()});a[i].lastUpdated=nowLabel();a[i].audit.push({when:a[i].lastUpdated,action:'Client uploaded additional document: '+type});saveRequests(a);await saveFileBlob(t,id,f);toast('Document uploaded. Original request was not replaced.');qs('u_file').value=''}
function renderMyRequests(){const a=getRequests();openWorkspace('MY REQUESTS',a.length?'<div class="grid">'+a.map(r=>'<div class="card"><div class="badge">'+escapeHtml(r.publicStatus)+'</div><h3>'+escapeHtml(r.subject)+'</h3><div class="meta"><b>'+escapeHtml(r.tracking)+'</b><br>Department: '+escapeHtml(r.dept)+'<br>Last Updated: '+escapeHtml(r.lastUpdated)+'</div><div class="actions"><button class="btn" onclick="renderTrack(\''+r.tracking+'\',\''+r.pin+'\')">OPEN REQUEST</button></div></div>').join('')+'</div>':'<div class="panel"><div class="notice">No requests saved on this device yet.</div></div>')}
function renderHelp(){openWorkspace('REQUIREMENTS / HELP',`<div class="panel"><h3>Before You Submit</h3><div class="notice"><b>Required:</b> Complete request information + one Original Request soft copy.</div><div class="docs"><div class="doc"><b>Accepted file types</b><span class="meta">PDF, DOC, DOCX, JPG, JPEG, PNG</span></div><div class="doc"><b>Supporting documents</b><span class="meta">Photos, IDs, certifications, cost estimates, endorsements, letters, technical documents</span></div><div class="doc"><b>Tracking</b><span class="meta">Use both Tracking Number and Client PIN / OTP.</span></div><div class="doc"><b>Additional requirements</b><span class="meta">Use Upload Documents. Your Original Request remains unchanged.</span></div></div></div><div class="panel"><h3>What Happens After Submission</h3><div class="meta">Request Submitted → Received → Under Initial Review → Routed to Department → Department Processing → For Mayor Review → Pending Decision → Additional Requirements Needed / Approved / Not Approved → Ready for Release → Released → Completed</div></div><div class="panel"><h3>Privacy</h3><div class="meta">The public portal never shows Mayor private remarks, Chief of Staff notes, employee notes, privileged legal notes, internal discussions, risk flags, audit/security metadata, other clients' information, or confidential attachments.</div></div>`)}
function renderReceipt(){const t=localStorage.getItem(LAST),r=getRequests().find(x=>x.tracking===t);if(!r)return openWorkspace('REQUEST RECEIPT','<div class="panel"><div class="notice">No recent receipt is available on this device.</div></div>');openWorkspace('REQUEST RECEIPT',receiptHtml(r))}
function receiptHtml(r){return '<div class="receipt"><div class="panel"><div class="eyebrow">PUBLIC REQUEST RECEIPT</div><div class="big-track">'+escapeHtml(r.tracking)+'</div><div class="review">'+[['Requester',r.requester],['Date Submitted',r.dateSubmitted],['Subject',r.subject],['Request Type',r.type],['Department',r.dept],['Current Status',r.publicStatus],['Next Step',r.nextStep]].map(x=>'<div class="kv"><b>'+x[0]+'</b>'+escapeHtml(x[1])+'</div>').join('')+'</div><div class="actions"><button class="btn primary" onclick="renderTrack(\''+r.tracking+'\',\''+r.pin+'\')">TRACK REQUEST</button><button class="btn gold" onclick="window.print()">PRINT RECEIPT</button><button class="btn" onclick="window.print()">SAVE RECEIPT</button></div></div></div>'}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function openDb(){return new Promise((res,rej)=>{const q=indexedDB.open('MDRPublicFiles',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('files'))q.result.createObjectStore('files')};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function saveFileBlob(track,key,file){try{const db=await openDb();await new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(file,track+'|'+key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}catch(e){}}
</script>
</body></html>
