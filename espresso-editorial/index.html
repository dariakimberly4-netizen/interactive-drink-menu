<style>
:root{--brown:#2b180f;--brown2:#5e3827;--cream:#f6f0e4;--cream2:#fffaf2;--gold:#b88b54;--ink:#24140d;--muted:#6f625a;--ease:cubic-bezier(.2,.82,.2,1)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--brown);color:#fff}button,a{font:inherit;color:inherit}button{border:0}.top{position:fixed;z-index:50;top:0;left:0;right:0;height:72px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(43,24,15,.94),rgba(43,24,15,.58),transparent)}.brand{font-size:9.5px;font-weight:900;letter-spacing:.14em;white-space:nowrap}.nav{display:flex;gap:7px}.nav a{text-decoration:none;padding:9px 12px;border:1px solid rgba(255,255,255,.22);border-radius:999px;font-size:9px;font-weight:900;letter-spacing:.08em;background:rgba(255,255,255,.03)}
.intro{position:fixed;z-index:80;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 44%,#8a5a3d 0,#593421 34%,#28150d 72%,#120805 100%);transition:.75s var(--ease)}.intro.hide{opacity:0;visibility:hidden;pointer-events:none}.intro:before{content:"";position:absolute;width:min(80vw,420px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(246,240,228,.38);box-shadow:0 0 0 28px rgba(255,255,255,.02),0 0 100px rgba(184,139,84,.12)}.intro button{position:absolute;inset:0;background:transparent}.introInner{position:relative;z-index:2;text-align:center;width:88vw}.kicker{font-size:9px;letter-spacing:.26em;font-weight:900;color:#d6b078}.intro h1{margin:10px 0 0;font:500 clamp(56px,17vw,94px)/.82 Georgia,serif;letter-spacing:-.06em}.intro h1 span{display:block;margin-top:15px;font:900 .24em/1 Inter,sans-serif;letter-spacing:.18em}.intro p{max-width:320px;margin:22px auto 0;font-size:13px;line-height:1.55;color:#efe5db}.introHint{position:absolute;left:50%;bottom:max(28px,calc(env(safe-area-inset-bottom) + 18px));transform:translateX(-50%);font-size:9px;font-weight:900;letter-spacing:.2em;color:#d6b078;white-space:nowrap}
.stage{position:relative;width:100%;height:100dvh;min-height:680px;overflow:hidden;background:radial-gradient(circle at 78% 38%,rgba(187,133,88,.24),transparent 30%),linear-gradient(145deg,#6a402c 0,#402217 50%,#1e0f09 100%);touch-action:pan-y}.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.035),transparent 36%,rgba(0,0,0,.2));pointer-events:none}.card{position:absolute;z-index:5;left:16px;right:16px;top:98px;bottom:112px;border-radius:28px;background:linear-gradient(180deg,var(--cream2),var(--cream));color:var(--ink);overflow:hidden;box-shadow:0 28px 60px rgba(0,0,0,.26);transition:.42s var(--ease)}.card.swap{opacity:.35;transform:translateX(-14px) scale(.985)}.art{height:43%;position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 45%,#fff 0,#f5eee2 52%,#e8dccb 100%)}.art:after{content:"";position:absolute;left:18%;right:18%;bottom:7%;height:24px;border-radius:50%;background:rgba(60,35,22,.14);filter:blur(12px)}.art img{position:relative;z-index:2;width:86%;height:96%;object-fit:contain;filter:grayscale(1) sepia(.62) saturate(.62) contrast(.92) brightness(1.12);mix-blend-mode:multiply;-webkit-mask-image:radial-gradient(ellipse 58% 62% at 50% 48%,#000 0 56%,rgba(0,0,0,.88) 65%,transparent 82%);mask-image:radial-gradient(ellipse 58% 62% at 50% 48%,#000 0 56%,rgba(0,0,0,.88) 65%,transparent 82%)}.info{height:57%;padding:20px 22px 18px;display:flex;flex-direction:column}.meta{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:9px;letter-spacing:.2em;font-weight:900;color:#9f7449}.count{font:italic 14px Georgia,serif;color:#9c8d82}.title{margin:8px 0 2px;font:600 clamp(42px,11vw,68px)/.9 Georgia,serif;letter-spacing:-.055em}.cal{font-size:19px;color:#6f625a;margin-top:6px}.desc{margin:18px 0 0;font-size:13.5px;line-height:1.55;color:#594c44;max-width:560px}.rule{width:54px;height:2px;background:#d9c5ab;margin-top:18px}.storyCue{margin-top:auto;padding-top:14px;font-size:9px;letter-spacing:.16em;font-weight:900;color:#a57a51}.preview{position:absolute;z-index:3;right:-66px;top:31%;width:120px;height:210px;border-radius:24px;background:#efe2cf;box-shadow:0 18px 40px rgba(0,0,0,.22);overflow:hidden;opacity:.7;transform:rotate(2deg) scale(.92);transition:.42s var(--ease)}.preview img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) sepia(.65) saturate(.5) brightness(1.08)}.footer{position:absolute;z-index:10;left:0;right:0;bottom:0;height:102px;background:var(--cream);color:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 16px 10px 20px;border-radius:50% 50% 0 0/22% 22% 0 0}.footerText strong{display:block;font-size:10px;letter-spacing:.15em}.footerText span{display:block;margin-top:4px;font-size:9px;color:#756960}.controls{display:flex;align-items:center;gap:9px}.arrow{width:48px;height:48px;border-radius:50%;background:#6a402c;color:#fff;border:1px solid rgba(255,255,255,.25);font-size:22px}.dots{display:flex;gap:6px;align-items:center}.dot{width:6px;height:6px;border-radius:50%;background:#c7baa7;padding:0}.dot.on{width:27px;border-radius:999px;background:#8e633f}.tapCue{position:absolute;z-index:11;right:17px;top:79px;font-size:8px;letter-spacing:.17em;font-weight:900;color:#d8ba8b}
@media(min-width:760px){.card{left:7vw;right:7vw;top:112px;bottom:120px;display:grid;grid-template-columns:48% 52%}.art,.info{height:100%}.info{padding:7vh 5vw}.preview{right:3vw;top:34%;width:180px;height:300px}.footer{padding-left:7vw;padding-right:7vw}.title{font-size:64px}.desc{font-size:15px}}
</style>
</head>
<body>
<header class="top"><div class="brand">STARBUCKS® PHILIPPINES</div><nav class="nav"><a href="../starbucks-menu-orbit/v89.html?refresh=94#orbit">MENU</a><a href="../starbucks-menu-orbit/about-motion.html">OUR STORY</a></nav></header>
<section class="intro" id="intro"><button id="enter" aria-label="Begin espresso journey"></button><div class="introInner"><div class="kicker">STARBUCKS® PHILIPPINES</div><h1>ESPRESSO<span>5 COFFEES → OUR STORY</span></h1><p>Five hot espresso drinks. One clean editorial journey. Tap anywhere to begin.</p></div><div class="introHint">OPENING · TAP ANYWHERE TO BEGIN ↓</div></section>
<main class="stage" id="stage">
<div class="tapCue" id="tapCue">TAP / SWIPE · NEXT</div>
<article class="card" id="card"><div class="art"><img id="heroImg" alt=""></div><div class="info"><div class="meta"><div class="eyebrow" id="eyebrow"></div><div class="count" id="count"></div></div><h1 class="title" id="title"></h1><div class="cal" id="cal"></div><div class="rule"></div><p class="desc" id="desc"></p><div class="storyCue" id="storyCue">COFFEE 01 OF 05</div></div></article>
<div class="preview" id="preview"><img id="previewImg" alt=""></div>
<div class="footer"><div class="footerText"><strong>5 HOT ESPRESSO DRINKS</strong><span>tap, swipe, or use arrows</span></div><div class="controls"><button class="arrow" id="prev" aria-label="Previous">‹</button><div class="dots" id="dots"></div><button class="arrow" id="next" aria-label="Next">›</button></div></div>
</main>
<script>
const STORY_URL='../starbucks-menu-orbit/about-motion.html';
const drinks=[
{name:'Caffe Misto',cal:'94 calories',img:'https://starbucks.ph/seed_data/HESP_CaffeMisto.jpg',desc:'A one-to-one combination of fresh-brewed coffee and steamed milk add up to one distinctly delicious coffee drink remarkably mixed.'},
{name:'Flat White',cal:'145 calories',img:'https://starbucks.ph/seed_data/HESP_FlatWhite.jpg',desc:'Bold ristretto shots of espresso get the perfect amount of steamed whole milk to create a not too strong, not too creamy, just right flavor, finished with a beautiful dot.'},
{name:'Espresso',cal:'5 calories',img:'https://starbucks.ph/seed_data/HESP_Espresso.jpg',desc:'Our smooth signature Espresso Roast with rich flavor and caramelly sweetness is at the very heart of everything we do.'},
{name:'Espresso Macchiato',cal:'10 calories',img:'https://starbucks.ph/seed_data/HESP_EspressoMacchiato.jpg',desc:'Our rich espresso marked with dollop of steamed milk and foam. A European-style classic.'},
{name:'Espresso Con Panna',cal:'30 calories',img:'https://starbucks.ph/seed_data/HESP_EspressoConPanna.jpg',desc:'Espresso meets a dollop of whipped cream to enhance the rich and caramelly flavors of a straight-up shot.'}
];
const intro=document.getElementById('intro'),card=document.getElementById('card'),heroImg=document.getElementById('heroImg'),preview=document.getElementById('preview'),previewImg=document.getElementById('previewImg'),eyebrow=document.getElementById('eyebrow'),count=document.getElementById('count'),title=document.getElementById('title'),cal=document.getElementById('cal'),desc=document.getElementById('desc'),storyCue=document.getElementById('storyCue'),tapCue=document.getElementById('tapCue'),dots=document.getElementById('dots'),stage=document.getElementById('stage');
let i=0,busy=false,startX=0,startY=0,down=false;
function sync(){const d=drinks[i];heroImg.src=d.img;heroImg.alt=d.name;eyebrow.textContent=`HOT ESPRESSO · 0${i+1} / 05`;count.textContent=`0${i+1}`;title.textContent=d.name;cal.textContent=d.cal;desc.textContent=d.desc;storyCue.textContent=i===4?'NEXT → OUR STORY':`COFFEE 0${i+1} OF 05`;tapCue.textContent=i===4?'ENTER OUR STORY →':'TAP / SWIPE · NEXT';const n=drinks[i+1];if(n){preview.style.display='block';previewImg.src=n.img;previewImg.alt=n.name}else preview.style.display='none';[...dots.children].forEach((el,n)=>el.classList.toggle('on',n===i))}
drinks.forEach((d,n)=>{const b=document.createElement('button');b.className='dot'+(n===0?' on':'');b.setAttribute('aria-label',d.name);b.onclick=e=>{e.stopPropagation();jump(n)};dots.appendChild(b)});
function go(target){if(busy||target<0||target>=drinks.length)return;busy=true;card.classList.add('swap');setTimeout(()=>{i=target;sync();card.classList.remove('swap');busy=false},260)}
function next(){if(i===4){location.href=STORY_URL;return}go(i+1)}function prev(){if(i>0)go(i-1)}function jump(n){if(n!==i)go(n)}
document.getElementById('enter').onclick=()=>intro.classList.add('hide');document.getElementById('next').onclick=e=>{e.stopPropagation();next()};document.getElementById('prev').onclick=e=>{e.stopPropagation();prev()};stage.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY;down=true});stage.addEventListener('pointerup',e=>{if(!down)return;down=false;if(e.target.closest('button,a'))return;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.abs(dx)>42&&Math.abs(dx)>Math.abs(dy)){dx<0?next():prev()}else if(Math.abs(dx)<14&&Math.abs(dy)<14){next()}});stage.addEventListener('pointercancel',()=>down=false);sync();
</script>
</body>
