<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b100b">
<title>Starbucks Philippines — Espresso Editorial</title>
<style>
:root{--deep:#100906;--cream:#f4eedf;--gold:#d8bd77;--ink:#2d1b12;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--deep);color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}button,a{font:inherit;color:inherit}a{text-decoration:none}button{border:0}body.lock{overflow:hidden}
.top{position:fixed;z-index:40;left:0;right:0;top:0;height:72px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(24,13,9,.97),rgba(24,13,9,.58),transparent);backdrop-filter:blur(10px)}
.brand{font-size:10px;font-weight:900;letter-spacing:.13em;white-space:nowrap}.nav{display:flex;gap:8px}.nav a{padding:10px 13px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(42,23,15,.58);font-size:10px;font-weight:900;letter-spacing:.07em}
.intro{position:fixed;z-index:60;inset:0;background:radial-gradient(circle at 50% 44%,#8c5936 0,#5e3824 24%,#2c190f 53%,#0b0604 100%);display:grid;place-items:center;transition:.8s var(--ease)}.intro.hide{opacity:0;visibility:hidden;pointer-events:none}.intro:before{content:"";position:absolute;width:min(86vw,430px);aspect-ratio:1;border:1px solid rgba(245,233,202,.42);border-radius:50%;box-shadow:0 0 0 22px rgba(255,255,255,.015),0 0 100px rgba(216,189,119,.2);animation:pulse 4s ease-in-out infinite}.introInner{position:relative;z-index:2;text-align:center;width:90vw}.introKicker{font-size:10px;letter-spacing:.25em;font-weight:900;color:var(--gold)}.intro h1{margin:12px 0 0;font-family:Georgia,serif;font-size:clamp(58px,17vw,88px);line-height:.78;letter-spacing:-.07em;font-weight:500}.intro h1 span{display:block;font-family:Inter,system-ui;font-style:normal;font-weight:950;font-size:.58em;letter-spacing:-.04em;margin-top:12px}.intro p{max-width:320px;margin:22px auto 0;color:#efe7db;line-height:1.55;font-size:14px}.introHint{position:absolute;left:50%;bottom:max(28px,calc(env(safe-area-inset-bottom) + 18px));transform:translateX(-50%);font-size:9px;letter-spacing:.22em;font-weight:900;color:var(--gold);white-space:nowrap;animation:hint 1.6s ease-in-out infinite}.introBtn{position:absolute;inset:0;background:transparent}
.stage{position:relative;height:100dvh;min-height:690px;overflow:hidden;touch-action:pan-y;background:linear-gradient(160deg,#5b3422,#120a07 72%)}.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 33%,rgba(216,189,119,.17),transparent 31%),linear-gradient(180deg,transparent 48%,rgba(0,0,0,.25) 72%,rgba(0,0,0,.62));pointer-events:none}.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(180deg,rgba(0,0,0,.55),transparent 74%)}
.bigWord{position:absolute;z-index:1;left:-2vw;top:17%;font-weight:950;font-size:clamp(88px,26vw,220px);letter-spacing:-.09em;line-height:.75;color:rgba(255,255,255,.055);white-space:nowrap;transition:.6s var(--ease)}.counter{position:absolute;z-index:4;right:19px;top:96px;font-family:Georgia,serif;font-style:italic;font-size:54px;color:rgba(255,255,255,.28);letter-spacing:-.07em}.counter small{font:900 10px/1 Inter,system-ui;color:var(--gold);letter-spacing:.16em;margin-left:4px}
.cardShell{position:absolute;z-index:5;left:50%;top:39%;width:min(82vw,420px);height:45vh;max-height:470px;transform:translate(-50%,-50%) rotate(-2deg);transition:.75s var(--ease);perspective:1000px}.cardShell.flip{transform:translate(-50%,-50%) rotate(2deg) scale(.96)}
.photoCard{position:absolute;inset:0;border-radius:30px;overflow:visible;background:transparent;border:0;box-shadow:none}.photoCard:after{display:none}.photoCard img{width:100%;height:100%;object-fit:contain;display:block;transition:.65s var(--ease);transform:scale(1.18);-webkit-mask-image:radial-gradient(ellipse 34% 50% at 50% 50%,#000 48%,rgba(0,0,0,.98) 64%,rgba(0,0,0,.55) 76%,transparent 94%);mask-image:radial-gradient(ellipse 34% 50% at 50% 50%,#000 48%,rgba(0,0,0,.98) 64%,rgba(0,0,0,.55) 76%,transparent 94%)}
.ticket{position:absolute;z-index:7;left:18px;right:18px;bottom:102px;background:var(--cream);color:var(--ink);border-radius:26px;padding:18px 18px 16px;box-shadow:0 20px 40px rgba(0,0,0,.3);transform:rotate(.4deg)}.ticketTop{display:flex;align-items:center;justify-content:space-between;gap:10px}.eyebrow{font-size:9px;letter-spacing:.19em;font-weight:950;color:#8c7134}.indexBadge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--cream);font-size:10px;font-weight:900}.title{margin:8px 0 6px;font-size:clamp(34px,9.7vw,56px);line-height:.88;letter-spacing:-.055em}.desc{margin:0;color:#5a453b;font-size:13px;line-height:1.5;max-width:95%}
.sideRail{position:absolute;z-index:10;left:15px;top:50%;transform:translateY(-50%);display:grid;gap:8px}.sideRail button{width:34px;height:34px;border-radius:50%;background:rgba(35,19,12,.58);border:1px solid rgba(255,255,255,.15);font-size:9px;font-weight:900;color:rgba(255,255,255,.45)}.sideRail button.on{background:var(--gold);color:#1d1712;border-color:var(--gold)}
.controls{position:absolute;z-index:12;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;gap:13px}.arrow{width:52px;height:52px;border-radius:50%;background:#29180f;border:1px solid rgba(255,255,255,.24);font-size:23px}.dots{display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.3);padding:0}.dot.on{width:32px;background:var(--gold)}.storyCue{position:absolute;z-index:6;right:18px;top:160px;font-size:8px;letter-spacing:.18em;font-weight:900;color:rgba(255,255,255,.5);writing-mode:vertical-rl}
@keyframes pulse{50%{transform:scale(1.035)}}@keyframes hint{50%{opacity:.45;transform:translateX(-50%) translateY(5px)}}
@media(min-width:760px){.top{height:82px;padding:0 4vw}.cardShell{left:68%;top:48%;width:min(38vw,500px);height:62vh;max-height:650px}.ticket{left:6vw;right:auto;bottom:14vh;width:min(49vw,650px);padding:26px;border-radius:32px}.bigWord{left:4vw;top:18%;font-size:14vw}.counter{left:6vw;right:auto;top:120px}.sideRail{left:auto;right:3vw}.title{font-size:clamp(54px,6vw,90px)}.desc{font-size:15px}.storyCue{display:none}}
@media(max-width:390px){.brand{font-size:8.3px}.nav a{font-size:9px;padding:8px 9px}.counter{top:90px}.cardShell{top:38%;height:42vh}.ticket{bottom:96px}.title{font-size:9.2vw}.desc{font-size:12.7px}.sideRail{left:11px}}
</style>
</head>
<body class="lock">
<header class="top"><div class="brand">STARBUCKS® PHILIPPINES</div><nav class="nav"><a href="../starbucks-menu-orbit/v89.html?refresh=94#orbit">MENU</a><a href="../starbucks-menu-orbit/about-motion.html">OUR STORY</a></nav></header>
<section class="intro" id="intro"><button class="introBtn" id="enter" aria-label="Enter espresso editorial"></button><div class="introInner"><div class="introKicker">STARBUCKS® PHILIPPINES</div><h1>ESPRESSO<span>FIVE MOMENTS</span></h1><p>A new editorial journey through five iced espresso drinks.</p></div><div class="introHint">TAP ANYWHERE TO BEGIN ↓</div></section>
<main class="stage" id="stage"><div class="grid"></div><div class="bigWord" id="bigWord">CARAMEL</div><div class="counter"><span id="sceneNo">01</span><small>/05</small></div><div class="storyCue" id="storyCue">TAP / SWIPE · NEXT</div><div class="cardShell" id="cardShell"><div class="photoCard"><img id="product" alt=""></div></div><div class="sideRail" id="sideRail"></div><section class="ticket"><div class="ticketTop"><div class="eyebrow" id="eyebrow">ICED ESPRESSO · 01</div><div class="indexBadge" id="badge">01</div></div><h1 class="title" id="title"></h1><p class="desc" id="desc"></p></section><div class="controls"><button class="arrow" id="prev" aria-label="Previous">‹</button><div class="dots" id="dots"></div><button class="arrow" id="next" aria-label="Next">›</button></div></main>
<script>
const STORY_URL='../starbucks-menu-orbit/about-motion.html';
const drinks=[
{name:'Iced Caramel Macchiato',word:'CARAMEL',img:'../assets/drink-01.jpg',desc:'Layered espresso, chilled milk and caramel character in a clean iced classic.'},
{name:'Iced Caffè Latte',word:'LATTE',img:'../assets/drink-02.jpg',desc:'Espresso and chilled milk meet in a smooth, bright and refreshing iced cup.'},
{name:'Iced Caffè Mocha',word:'MOCHA',img:'../assets/drink-03.jpg',desc:'Espresso, milk and chocolate character move together over ice.'},
{name:'Iced Americano',word:'AMERICANO',img:'../assets/drink-04.jpg',desc:'Bold espresso lengthened with cold water and ice for a crisp finish.'},
{name:'Iced Horchata Shaken Espresso',word:'HORCHATA',img:'../assets/drink-05.jpg',desc:'A chilled espresso moment with a creamy, spiced finish.'}
];
const intro=document.getElementById('intro'),stage=document.getElementById('stage'),product=document.getElementById('product'),bigWord=document.getElementById('bigWord'),sceneNo=document.getElementById('sceneNo'),title=document.getElementById('title'),desc=document.getElementById('desc'),eyebrow=document.getElementById('eyebrow'),badge=document.getElementById('badge'),dots=document.getElementById('dots'),sideRail=document.getElementById('sideRail'),cardShell=document.getElementById('cardShell'),storyCue=document.getElementById('storyCue');let i=0,busy=false,startX=0,startY=0,down=false;
function paint(){const d=drinks[i];product.src=d.img;product.alt=d.name;bigWord.textContent=d.word;sceneNo.textContent=`0${i+1}`;badge.textContent=`0${i+1}`;eyebrow.textContent=`ICED ESPRESSO · 0${i+1}`;title.textContent=d.name;desc.textContent=d.desc;storyCue.textContent=i===4?'ENTER OUR STORY →':'TAP / SWIPE · NEXT';[...dots.children].forEach((el,n)=>el.classList.toggle('on',n===i));[...sideRail.children].forEach((el,n)=>el.classList.toggle('on',n===i))}
drinks.forEach((d,n)=>{const dot=document.createElement('button');dot.className='dot'+(n===0?' on':'');dot.setAttribute('aria-label',d.name);dot.onclick=e=>{e.stopPropagation();show(n)};dots.appendChild(dot);const rail=document.createElement('button');rail.textContent=`0${n+1}`;rail.className=n===0?'on':'';rail.onclick=e=>{e.stopPropagation();show(n)};sideRail.appendChild(rail)});
function show(n){if(busy||n===i||n<0||n>4)return;busy=true;cardShell.classList.add('flip');product.style.opacity='.12';setTimeout(()=>{i=n;paint();cardShell.classList.remove('flip');product.style.opacity='1';setTimeout(()=>busy=false,350)},280)}function goStory(){location.href=STORY_URL}function next(){if(i<4)show(i+1);else goStory()}function prev(){if(i>0)show(i-1)}
document.getElementById('enter').onclick=()=>{intro.classList.add('hide');document.body.classList.remove('lock')};document.getElementById('next').onclick=e=>{e.stopPropagation();next()};document.getElementById('prev').onclick=e=>{e.stopPropagation();prev()};stage.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY;down=true});stage.addEventListener('pointerup',e=>{if(!down)return;down=false;if(e.target.closest('button,a'))return;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)){dx<0?next():prev()}else if(Math.abs(dx)<14&&Math.abs(dy)<14){next()}});stage.addEventListener('pointercancel',()=>down=false);paint();
</script>
</body>
