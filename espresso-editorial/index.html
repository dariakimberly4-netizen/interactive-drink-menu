<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24130c">
<title>Starbucks Philippines — Hot Espresso Motion</title>
<style>
:root{--cream:#f4eedf;--gold:#d8bd77;--ink:#2b180f;--ease:cubic-bezier(.2,.82,.2,1);--c1:#6c4029;--c2:#24130c;--glow:#a66e48}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#6c4029;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,a{font:inherit;color:inherit}a{text-decoration:none}button{border:0}.lock{overflow:hidden}
.top{position:fixed;z-index:50;left:0;right:0;top:0;height:70px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(92,52,32,.92),rgba(92,52,32,.42),transparent);backdrop-filter:blur(8px)}
.brand{font-size:9.5px;font-weight:900;letter-spacing:.13em;white-space:nowrap}.nav{display:flex;gap:7px}.nav a{padding:9px 11px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(108,64,41,.55);font-size:9.5px;font-weight:900;letter-spacing:.07em}
.intro{position:fixed;z-index:70;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 44%,#a87552 0,#7a4c32 38%,#5b3423 72%,#432519 100%);transition:.75s var(--ease)}.intro.hide{opacity:0;visibility:hidden;pointer-events:none}.intro:before{content:"";position:absolute;width:min(84vw,420px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(244,238,223,.42);box-shadow:0 0 0 20px rgba(255,255,255,.018),0 0 100px rgba(216,189,119,.18);animation:breathe 3.4s ease-in-out infinite}.introBtn{position:absolute;inset:0;background:transparent}.introInner{position:relative;z-index:2;text-align:center;width:90vw}.introKicker{font-size:9px;letter-spacing:.24em;font-weight:900;color:var(--gold)}.intro h1{margin:11px 0 0;font-size:clamp(58px,17vw,88px);line-height:.78;letter-spacing:-.07em;font-family:Georgia,serif;font-weight:500}.intro h1 span{display:block;margin-top:12px;font:950 .52em/1 Inter,system-ui;letter-spacing:-.03em}.intro p{max-width:330px;margin:21px auto 0;color:#eee4da;font-size:14px;line-height:1.5}.introHint{position:absolute;left:50%;bottom:max(27px,calc(env(safe-area-inset-bottom) + 16px));transform:translateX(-50%);font-size:9px;letter-spacing:.2em;font-weight:900;color:var(--gold);white-space:nowrap;animation:hint 1.5s ease-in-out infinite}
.stage{position:relative;width:100%;height:100dvh;min-height:680px;overflow:hidden;touch-action:pan-y;background:radial-gradient(circle at 68% 38%,var(--glow) 0,transparent 30%),linear-gradient(145deg,var(--c1),var(--c2) 74%);transition:background .72s var(--ease)}.stage:after{content:"";position:absolute;z-index:0;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.08) 48%,rgba(0,0,0,.3) 76%,rgba(0,0,0,.54));pointer-events:none}
.bigWord{position:absolute;z-index:1;left:-5vw;top:25%;font-size:clamp(82px,26vw,210px);font-weight:950;letter-spacing:-.09em;line-height:.75;color:rgba(255,255,255,.055);white-space:nowrap;transition:opacity .3s var(--ease),transform .55s var(--ease)}
.copy{position:absolute;z-index:8;left:20px;top:118px;width:min(58vw,390px);transition:.28s var(--ease)}.copy.swap{opacity:0;transform:translateY(-12px)}.eyebrow{font-size:9px;letter-spacing:.19em;font-weight:950;color:var(--gold)}.title{margin:8px 0 7px;font-size:clamp(34px,10vw,62px);line-height:.88;letter-spacing:-.055em}.desc{margin:0;max-width:330px;color:#f0e8df;font-size:12.7px;line-height:1.48}.sceneNo{margin-top:13px;font:500 italic 16px/1 Georgia,serif;color:rgba(255,255,255,.62)}
.products{position:absolute;z-index:6;inset:0;pointer-events:none}.slot{position:absolute;width:min(62vw,360px);height:46vh;left:52%;top:43%;transform:translate(-50%,-50%) scale(1);transform-origin:50% 58%;will-change:left,top,transform,opacity}.slot img{width:100%;height:100%;object-fit:contain;display:block;background:transparent;filter:drop-shadow(0 30px 24px rgba(0,0,0,.38));mix-blend-mode:multiply}.slot.hero{z-index:3}.slot.next{z-index:2;left:82%;top:40%;transform:translate(-50%,-50%) scale(.56);opacity:.92}.slot.peek{z-index:1;left:103%;top:40%;transform:translate(-50%,-50%) scale(.34);opacity:.65}.slot.is-empty{visibility:hidden;opacity:0!important}
.stage.forward .slot.hero{animation:heroDrop .72s var(--ease) forwards}.stage.forward .slot.next{animation:nextPromote .72s var(--ease) forwards}.stage.forward .slot.peek{animation:peekPromote .72s var(--ease) forwards}.stage.forward .bigWord{opacity:.02;transform:translateX(-4vw)}.stage.backward .slot.hero{animation:heroRight .66s var(--ease) forwards}.stage.backward .slot.next{animation:nextFade .66s var(--ease) forwards}
.wave{position:absolute;z-index:4;left:-8%;right:-8%;bottom:-3%;height:24%;background:var(--cream);border-radius:50% 45% 0 0/28% 22% 0 0;transform:rotate(-1deg);box-shadow:0 -1px 0 rgba(255,255,255,.35)}.wave:before{content:"";position:absolute;left:28%;top:-18%;width:36%;height:44%;background:var(--cream);border-radius:50%}.wave:after{content:"";position:absolute;right:5%;top:-10%;width:29%;height:34%;background:var(--cream);border-radius:50%}
.footerInfo{position:absolute;z-index:10;left:18px;bottom:72px;color:var(--ink)}.footerInfo strong{display:block;font-size:11px;letter-spacing:.14em}.footerInfo span{display:block;margin-top:3px;font-size:9px;opacity:.66}.controls{position:absolute;z-index:12;right:16px;bottom:max(25px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px}.arrow{width:46px;height:46px;border-radius:50%;background:#70452f;border:1px solid rgba(255,255,255,.2);font-size:22px}.dots{display:flex;align-items:center;gap:6px}.dot{width:6px;height:6px;border-radius:99px;background:rgba(43,24,15,.28);padding:0}.dot.on{width:28px;background:#7e5938}.tapCue{position:absolute;z-index:10;right:17px;top:88px;font-size:8px;letter-spacing:.16em;font-weight:900;color:rgba(255,255,255,.5)}
@keyframes heroDrop{0%{left:52%;top:43%;transform:translate(-50%,-50%) scale(1);opacity:1}100%{left:47%;top:105%;transform:translate(-50%,-50%) scale(1.14) rotate(-2deg);opacity:.08}}@keyframes nextPromote{0%{left:82%;top:40%;transform:translate(-50%,-50%) scale(.56);opacity:.92}100%{left:52%;top:43%;transform:translate(-50%,-50%) scale(1);opacity:1}}@keyframes peekPromote{0%{left:103%;top:40%;transform:translate(-50%,-50%) scale(.34);opacity:.65}100%{left:82%;top:40%;transform:translate(-50%,-50%) scale(.56);opacity:.92}}@keyframes heroRight{to{left:91%;top:40%;transform:translate(-50%,-50%) scale(.5);opacity:.3}}@keyframes nextFade{to{opacity:.25;transform:translate(-50%,-50%) scale(.38)}}@keyframes breathe{50%{transform:scale(1.035)}}@keyframes hint{50%{opacity:.45;transform:translateX(-50%) translateY(5px)}}
@media(min-width:760px){.top{height:80px;padding:0 4vw}.copy{left:7vw;top:26%;width:34vw}.title{font-size:clamp(46px,5.2vw,78px)}.desc{font-size:14px}.slot{width:min(35vw,520px);height:68vh;left:57%;top:49%}.slot.next{left:81%;top:45%;transform:translate(-50%,-50%) scale(.58)}.slot.peek{left:96%;top:45%;transform:translate(-50%,-50%) scale(.34)}.bigWord{top:22%;font-size:14vw}.wave{height:19%}.footerInfo{left:6vw;bottom:58px}.controls{right:5vw;bottom:34px}@keyframes heroDrop{100%{left:52%;top:112%;transform:translate(-50%,-50%) scale(1.14);opacity:.08}}@keyframes nextPromote{100%{left:57%;top:49%;transform:translate(-50%,-50%) scale(1);opacity:1}}@keyframes peekPromote{100%{left:81%;top:45%;transform:translate(-50%,-50%) scale(.58);opacity:.92}}}
@media(max-width:390px){.brand{font-size:8.2px}.nav a{font-size:8.8px;padding:8px 9px}.copy{top:104px}.title{font-size:9.2vw}.desc{font-size:12px}.slot{top:44%;height:43vh}.slot.next{left:83%}.wave{height:23%}.footerInfo{bottom:68px}.controls{right:12px}.arrow{width:43px;height:43px}}
</style>
</head>
<body class="lock">
<header class="top"><div class="brand">STARBUCKS® PHILIPPINES</div><nav class="nav"><a href="../starbucks-menu-orbit/v89.html?refresh=94#orbit">MENU</a><a href="../starbucks-menu-orbit/about-motion.html">OUR STORY</a></nav></header>
<section class="intro" id="intro"><button class="introBtn" id="enter" aria-label="Enter hot espresso motion"></button><div class="introInner"><div class="introKicker">STARBUCKS® PHILIPPINES</div><h1>ESPRESSO<span>HOT ESPRESSO · 5</span></h1><p>The five Hot Espresso drinks from the Starbucks Philippines Espresso category.</p></div><div class="introHint">TAP ANYWHERE TO BEGIN ↓</div></section>
<main class="stage" id="stage">
<div class="bigWord" id="bigWord">MISTO</div>
<section class="copy" id="copy"><div class="eyebrow" id="eyebrow">HOT ESPRESSO · 01 / 05</div><h1 class="title" id="title"></h1><p class="desc" id="desc"></p><div class="sceneNo" id="sceneNo">01</div></section>
<div class="tapCue" id="tapCue">TAP / SWIPE · NEXT</div>
<div class="products"><div class="slot hero"><img id="heroImg" alt=""></div><div class="slot next" id="nextSlot"><img id="nextImg" alt=""></div><div class="slot peek" id="peekSlot"><img id="peekImg" alt=""></div></div>
<div class="wave"></div><div class="footerInfo"><strong>5 HOT ESPRESSO DRINKS</strong><span>tap, swipe, or use the arrows</span></div>
<div class="controls"><button class="arrow" id="prev" aria-label="Previous">‹</button><div class="dots" id="dots"></div><button class="arrow" id="next" aria-label="Next">›</button></div>
</main>
<script>
const STORY_URL='../starbucks-menu-orbit/about-motion.html';
const drinks=[
{name:'Caffe Misto',word:'MISTO',img:'https://starbucks.ph/seed_data/HESP_CaffeMisto.jpg',desc:'Fresh-brewed coffee and steamed milk in a smooth one-to-one balance.',c1:'#735039',c2:'#2b180f',glow:'#aa7955'},
{name:'Flat White',word:'FLAT WHITE',img:'https://starbucks.ph/seed_data/HESP_FlatWhite.jpg',desc:'Ristretto espresso shots finished with steamed whole milk for a velvety cup.',c1:'#7d604d',c2:'#2b1b13',glow:'#b18a6c'},
{name:'Espresso',word:'ESPRESSO',img:'https://starbucks.ph/seed_data/HESP_Espresso.jpg',desc:'Rich, concentrated Starbucks espresso served straight.',c1:'#5a3220',c2:'#180b07',glow:'#865139'},
{name:'Espresso Macchiato',word:'MACCHIATO',img:'https://starbucks.ph/seed_data/HESP_EspressoMacchiato.jpg',desc:'Espresso marked with a dollop of steamed milk and foam.',c1:'#6b412b',c2:'#211009',glow:'#9b6545'},
{name:'Espresso Con Panna',word:'CON PANNA',img:'https://starbucks.ph/seed_data/HESP_EspressoConPanna.jpg',desc:'Espresso finished with a dollop of whipped cream.',c1:'#835b3c',c2:'#2b180f',glow:'#b7835a'}
];
const intro=document.getElementById('intro'),stage=document.getElementById('stage'),heroImg=document.getElementById('heroImg'),nextImg=document.getElementById('nextImg'),peekImg=document.getElementById('peekImg'),nextSlot=document.getElementById('nextSlot'),peekSlot=document.getElementById('peekSlot'),copy=document.getElementById('copy'),title=document.getElementById('title'),desc=document.getElementById('desc'),eyebrow=document.getElementById('eyebrow'),sceneNo=document.getElementById('sceneNo'),bigWord=document.getElementById('bigWord'),dots=document.getElementById('dots'),tapCue=document.getElementById('tapCue');
let i=0,busy=false,startX=0,startY=0,down=false;
function applyPalette(d){stage.style.setProperty('--c1',d.c1);stage.style.setProperty('--c2',d.c2);stage.style.setProperty('--glow',d.glow)}
function setCopy(d){title.textContent=d.name;desc.textContent=d.desc;eyebrow.textContent=`HOT ESPRESSO · 0${i+1} / 05`;sceneNo.textContent=`0${i+1}`;bigWord.textContent=d.word;tapCue.textContent=i===4?'ENTER OUR STORY →':'TAP / SWIPE · NEXT'}
function fillSlot(img,slot,d){if(d){img.src=d.img;img.alt=d.name;slot.classList.remove('is-empty')}else{img.removeAttribute('src');img.alt='';slot.classList.add('is-empty')}}
function setImages(){fillSlot(heroImg,heroImg.parentElement,drinks[i]);fillSlot(nextImg,nextSlot,drinks[i+1]);fillSlot(peekImg,peekSlot,drinks[i+2])}
function sync(){const d=drinks[i];applyPalette(d);setCopy(d);setImages();[...dots.children].forEach((el,n)=>el.classList.toggle('on',n===i))}
drinks.forEach((d,n)=>{const b=document.createElement('button');b.className='dot'+(n===0?' on':'');b.setAttribute('aria-label',d.name);b.onclick=e=>{e.stopPropagation();jump(n)};dots.appendChild(b)});
function animateForward(target){if(busy||target<0||target>=drinks.length)return;busy=true;copy.classList.add('swap');stage.classList.remove('backward');stage.classList.add('forward');applyPalette(drinks[target]);setTimeout(()=>{i=target;setCopy(drinks[i]);copy.classList.remove('swap')},230);setTimeout(()=>{stage.classList.remove('forward');setImages();[...dots.children].forEach((el,n)=>el.classList.toggle('on',n===i));busy=false},730)}
function animateBackward(target){if(busy||target<0||target>=drinks.length)return;busy=true;copy.classList.add('swap');stage.classList.remove('forward');stage.classList.add('backward');applyPalette(drinks[target]);setTimeout(()=>{i=target;setCopy(drinks[i]);copy.classList.remove('swap')},210);setTimeout(()=>{stage.classList.remove('backward');setImages();[...dots.children].forEach((el,n)=>el.classList.toggle('on',n===i));busy=false},670)}
function next(){if(i===4){location.href=STORY_URL;return}animateForward(i+1)}function prev(){if(i>0)animateBackward(i-1)}function jump(n){if(n===i||busy)return;n>i?animateForward(n):animateBackward(n)}
document.getElementById('enter').onclick=()=>{intro.classList.add('hide');document.body.classList.remove('lock')};document.getElementById('next').onclick=e=>{e.stopPropagation();next()};document.getElementById('prev').onclick=e=>{e.stopPropagation();prev()};stage.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY;down=true});stage.addEventListener('pointerup',e=>{if(!down)return;down=false;if(e.target.closest('button,a'))return;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.abs(dx)>44&&Math.abs(dx)>Math.abs(dy)){dx<0?next():prev()}else if(Math.abs(dx)<14&&Math.abs(dy)<14){next()}});stage.addEventListener('pointercancel',()=>down=false);sync();
</script>
</body>
</html>
