<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu Orbit Staff Dashboard</title>
<style>
html,body{margin:0;height:100%;background:#061f17;font-family:system-ui,sans-serif;color:#fff}
#app{width:100%;height:100%;border:0;display:block}
.notice{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:10;background:#0d3327;border:1px solid #2b795d;padding:8px 12px;border-radius:999px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div class="notice" id="notice">Opening Staff / Owner Dashboard…</div>
<iframe id="app" src="./" title="Menu Orbit Staff Dashboard"></iframe>
<script>
const frame=document.getElementById('app');
const notice=document.getElementById('notice');
function openDashboard(){
  try{
    const d=frame.contentWindow.document;
    const btn=d.querySelector('#adminBtn');
    if(btn){btn.click();notice.style.display='none';return true;}
  }catch(e){}
  return false;
}
frame.addEventListener('load',()=>{
  let tries=0;
  const timer=setInterval(()=>{
    tries++;
    if(openDashboard()||tries>50){
      clearInterval(timer);
      if(tries>50) notice.textContent='Tap Owner to open the staff dashboard.';
    }
  },300);
});
</script>
</body>
</html>
