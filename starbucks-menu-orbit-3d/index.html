<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starbucks Menu Orbit 3D</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#061f17;color:#f5fff9;font-family:system-ui,sans-serif}.loading{text-align:center;padding:24px}.dot{width:42px;height:42px;border:4px solid rgba(255,255,255,.18);border-top-color:#d4e9e2;border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="loading"><div class="dot"></div><strong>Loading Menu Orbit…</strong></div>
<script>
(async()=>{
  try{
    const files=['part1.txt','part2.txt','part3.txt','part4.txt','part5.txt','part6.txt','part7.txt','part8.txt','part9.txt','part10.txt','part11.txt','part12.txt'];
    const parts=await Promise.all(files.map(async f=>{
      const r=await fetch(f+'?v=3',{cache:'no-store'});
      if(!r.ok) throw new Error('Could not load '+f);
      return r.text();
    }));
    const app=parts.join('');
    document.open();
    document.write(app);
    document.close();
  }catch(err){
    document.body.innerHTML='<div class="loading"><strong>Menu Orbit could not load.</strong><p>Please refresh the page.</p></div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
